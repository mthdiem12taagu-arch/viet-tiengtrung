}]},{"text":"跑步是一种非常好的运动。首先，它可以让我们的身体更健康；其次，它不需要特别的场地和设备，随时都可以开始。需要注意的是，跑步前一定要做好准备活动，以免受伤。","tpl":"……是一种非常好的……。首先，……；其次，……。需要注意的是，……。","ph":[["列举",["首先……，其次……","第一……，第二……","首先……，然后……，最后……"]],["提醒",["需要注意的是……","值得注意的是……","千万不要忘了……"]]],"models":[{"img":{"t":"scene","i":["person","drop"],"c":"一位女士在喝水","v":"Một người phụ nữ đang uống nước"},"t":"多喝水是一种非常好的生活习惯。首先，它可以帮助身体排出垃圾；其次，它能让皮肤保持水分，看起来更有精神。需要注意的是，不要等到口渴了才喝水，最好每天分几次慢慢地喝。"}]}],"pracImg":{"t":"scene","i":["person","book"],"c":"一个人在安静的图书馆里看书","v":"Một người đang đọc sách trong thư viện yên tĩnh"},"refs":["一个月前，我在写毕业论文，因为找不到需要的资料，所以非常着急。后来，老师建议我去学校图书馆试试。于是，我每天都去那里查资料。现在，我的论文已经快写完了，我也爱上了在图书馆学习的感觉。","在图书馆学习是一种非常好的习惯。首先，那里很安静，可以让人集中精力；其次，那里有很多书和资料，查起来很方便。需要注意的是，一定要爱护借来的书，按时还书。"]},"day":8},{"grammar":[{"title":"“有”字句","base":"主语 + 有 + （定语）+ 宾语","baseEx":["我们部门有十二个人。","他有很多工作经验。","这个城市有很多公园。"],"notes":[{"p":"“的”字短语 + 有 + 数量","ex":["报名参加比赛的有五十多人。"]},{"p":"主语 + 有了/有过 + 宾语（表示变化或经历）","ex":["这几年家乡有了很大的变化。","我有过一次去国外工作的机会。"]},{"p":"有 + 名词 + 动词（表示“有……可以做”）","ex":["我今天有很多事要做。"]}],"real":[]},{"title":"“是……的”句","base":"主语 + 是 + 时间/地点/方式 + 动词 + 的（强调已经发生的事）","baseEx":["我是去年来越南的。","这些零件是在工厂里检查的。","他是坐飞机来的。"],"notes":[{"p":"“的”字短语 + 是 + 宾语","ex":["最重要的是安全。","我最喜欢的是周末。"]},{"p":"主语 + 是 + 动词短语 + 的（说明情况）","ex":["这个价格是很合理的。"]},{"p":"否定：不是……的","ex":["这个决定不是我做的。"]}],"real":[{"a":"他的这个想法是很有道理的。","c":["他的","这个","想法","是","很","有","道理的"]},{"a":"每个人都有自己的梦想。","c":["每个人","都","有","自己的","梦想"]}]}],"ex":[{"a":"我们公司有两个仓库。","c":["我们","公司","有","两个","仓库"]},{"a":"这家超市有很多进口水果。","c":["这家","超市","有","很多","进口","水果"]},{"a":"他有一个很好的建议。","c":["他","有","一个","很","好的","建议"]},{"a":"我的手机是在网上买的。","c":["我的","手机","是","在","网上","买的"]},{"a":"这份报告是昨天写完的。","c":["这份","报告","是","昨天","写完的"]},{"a":"那次会议是在上海开的。","c":["那次","会议","是","在","上海","开的"]},{"a":"参加培训的有三十个新员工。","c":["参加","培训的","有","三十个","新员工"]},{"a":"我是坐高铁来的。","c":["我","是","坐","高铁","来的"]},{"a":"最让我担心的是交货时间。","c":["最","让","我","担心的","是","交货","时间"]},{"a":"学校附近有一家很有名的书店。","c":["学校","附近","有","一家","很","有名的","书店"]}],"e1":{"title":"短文1：课余生活","real":"比赛 参加 可惜 总结 争取","feat":["词语常和各种活动有关（比赛、旅游、社团）。","可以描述一次活动。","也可以评论这类活动的好处。"],"try":"活动 参观 了解 文化 机会","ex":[{"text":"每个学期学校都会组织我们参加各种各样的活动。比如，上个月学校带我们参观了博物馆，我们不仅看到了很多古代的文物，而且对当地的历史文化有了更多的了解。非常感谢学校给我们提供这样难得的机会。","tpl":"每个学期学校都会组织我们参加各种各样的活动。比如，……，我们不仅……，而且……。非常感谢学校给我们提供这样难得的机会。","ph":[["递进",["不仅……，而且……","不但……，还……","……，甚至……"]],["旅游参观",["名胜古迹","风景优美","历史悠久","增长知识","参观、游览、欣赏"]]],"models":[{"w":"比赛 参加 可惜 总结 争取","t":"每个学期学校都会组织我们参加各种各样的活动。比如，上周我们班参加了学校的篮球比赛，虽然很可惜只得了第二名，但是我们不仅锻炼了身体，而且学会了一起总结经验，大家决定明年争取拿第一。非常感谢学校给我们提供这样难得的机会。"}]},{"text":"我最喜欢的课余活动之一是参观博物馆。这是因为：一方面，它能让我了解一个地方的历史和文化；另一方面，它也是放松心情的好方法。希望学校以后能多组织这样的活动。","tpl":"我最喜欢的……之一是……。这是因为：一方面，……；另一方面，……。希望……。","ph":[["并列",["一方面……，另一方面……","一来……，二来……","既……，又……"]],["因果",["因为……，所以……","之所以……，是因为……","由于……，因此……"]]],"models":[{"w":"比赛 参加 可惜 总结 争取","t":"我最喜欢的课余活动之一是参加演讲比赛。这是因为：一方面，它能锻炼我的口语和胆量；另一方面，每次比赛后总结经验，都让我进步很多。去年很可惜没有进入决赛，今年我一定要争取更好的成绩。"}]}],"prac":"爬山 风景 锻炼 放松 坚持","refs":["每个学期学校都会组织我们参加各种各样的活动。比如，上个周末学校组织我们去爬山，我们不仅欣赏了美丽的风景，而且锻炼了身体，最累的时候大家互相鼓励，终于坚持爬到了山顶。非常感谢学校给我们提供这样放松的机会。","我最喜欢的课余活动之一是爬山。这是因为：一方面，爬山可以锻炼身体，让人坚持下去的能力越来越强；另一方面，站在山顶看风景，所有的压力都能放松下来。希望学校能多安排这样的活动。"]},"e2":{"title":"短文2：情景类Ⅱ","feat":["图片多是几个人在一起的场景，如聚会、开会、运动。","可以写自己和朋友、同事的经历。","也可以写人们对这类场景的不同看法。"],"tryImg":{"t":"scene","i":["person","coffee","person"],"c":"几个朋友坐在咖啡店里聊天","v":"Mấy người bạn ngồi trò chuyện trong quán cà phê"},"ex":[{"text":"我来越南工作已经两年多了，在这里我认识了很多好朋友。周末的时候，我们常常聚在一起。有时候去咖啡店聊天，有时候一起去吃越南菜，还有的时候，我们会一起去海边玩儿。有他们在，我一点儿也不觉得孤单。","tpl":"我……已经……了，在这里我……。……的时候，我们常常……。有时候……，有时候……，还有的时候，……。有……，我……。","ph":[["时间经历",["我来中国已经一年多了","我们认识差不多五年了","我们在一起工作三年了"]],["集体活动",["一起逛街","一起聚餐","一起去旅游","一起打球、唱歌"]],["收获",["在这里我认识了很多朋友","在他们的帮助下，……","有他们在，我……"]]],"models":[{"img":{"t":"scene","i":["person","person","person"],"c":"几个同事举杯庆祝","v":"Mấy đồng nghiệp nâng ly chúc mừng"},"t":"我在这家公司工作已经三年了，在这里我认识了一群很好的同事。忙完一个项目的时候，我们常常一起庆祝。有时候去餐厅吃饭，有时候去唱卡拉OK，还有的时候，大家一起去郊外烧烤。有这样的同事，我工作起来特别开心。"}]},{"text":"有人说，朋友之间最重要的是经常见面、一起玩儿；但是也有人说，真正的朋友不需要天天在一起。我觉得，不管见面多少，只要在对方需要的时候能出现，就是好朋友。","tpl":"有人说……；但是也有人说……。我觉得，……。","ph":[["观点",["有人说……","有人认为……","众所周知，……","听说……"]],["递进",["不仅……还……","不但……而且……","除了……还……"]]],"models":[{"img":{"t":"scene","i":["person","person"],"c":"两个人在办公室握手","v":"Hai người bắt tay nhau trong văn phòng"},"t":"有人说，在工作中，能力最重要；但是也有人说，人际关系比能力更重要。我觉得，两者都很重要，一个人除了要有过硬的能力，还要善于和别人合作，这样才能把工作做好。"}]}],"pracImg":{"t":"scene","i":["person","ball","person"],"c":"几个年轻人在打篮球","v":"Mấy bạn trẻ đang chơi bóng rổ"},"refs":["我来中国留学已经一年多了，在这里我认识了很多爱运动的朋友。下课的时候，我们常常一起打篮球。有时候在学校的球场，有时候在体育馆，还有的时候，我们会参加学校的比赛。有他们陪着，我的留学生活特别快乐。","有人说，篮球是男孩子的运动；但是也有人说，女孩子也应该多打篮球。我觉得，运动没有男女之分，打篮球不仅能锻炼身体，还能培养团队合作精神，每个人都可以试一试。"]},"day":9},{"grammar":[{"title":"存现句","base":"处所/时间 + 动词 + 着/了/趋向补语 + 数量 + 名词（表示存在、出现、消失）","baseEx":["墙上挂着一张地图。","前面开过来一辆车。","我们班走了两个同学。"],"notes":[{"p":"(1) 表示存在：处所 + 动词 + 着 + 名词","ex":["桌子上放着几份合同。","门口站着一位保安。","常用动词：放、挂、贴、站、坐、躺、停、写、摆。"]},{"p":"(2) 表示出现：处所 + 动词 + 了/过来/进来 + 名词","ex":["办公室来了一位新同事。","会议室里走进来几个客户。"]},{"p":"(3) 表示消失：处所 + 动词 + 了 + 名词","ex":["仓库里少了三箱货。","树上飞走了一只鸟。"]}],"real":[{"a":"门口贴着一张通知。","c":["门口","贴着","一张","通知"]}]}],"ex":[{"a":"桌子上放着一台笔记本电脑。","c":["桌子上","放着","一台","笔记本电脑"]},{"a":"教室里坐着很多学生。","c":["教室里","坐着","很多","学生"]},{"a":"墙上挂着一幅山水画。","c":["墙上","挂着","一幅","山水画"]},{"a":"楼下停着一辆白色的汽车。","c":["楼下","停着","一辆","白色的","汽车"]},{"a":"前面走过来一位老人。","c":["前面","走过来","一位","老人"]},{"a":"我们公司来了一位新经理。","c":["我们","公司","来了","一位","新经理"]},{"a":"天上飞过一群鸟。","c":["天上","飞过","一群","鸟"]},{"a":"河边种着很多柳树。","c":["河边","种着","很多","柳树"]},{"a":"昨天小区里搬走了两户人家。","c":["昨天","小区里","搬走了","两户","人家"]},{"a":"黑板上写着今天的作业。","c":["黑板上","写着","今天的","作业"]}],"e1":{"title":"短文1：学习与方法","real":"方法 进步 明显 坚持 辅导","feat":["词语常是抽象的名词、动词、副词。","大部分和学习有关。","可以写自己的学习经历、方法或经验。"],"try":"困难 语伴 练习 提高 成绩","ex":[{"text":"我学习汉语已经两年了。刚开始的时候，我遇到了很多困难，特别是声调总是说不准。后来，我找到了一个中国语伴，我们每周一起练习口语。在她的帮助下，现在我的汉语水平有了很大的提高，考试成绩也越来越好。","tpl":"我学习……已经……了。刚开始的时候，……。后来，……。在……的帮助下，现在……。","ph":[["学习经历",["我学习汉语已经……了","我考过两次HSK","我上过口语课和听力课"]],["学习相关",["课前预习，课后复习","老师耐心地讲解","我的口语/听力/写作水平提高了很多","取得了理想的成绩"]]],"models":[{"w":"方法 进步 明显 坚持 辅导","t":"我 工作压力大，每天的生活都差不多。到一个新的地方，看看不一样的风景，吃吃当地的美食，能让人忘掉烦恼，回来以后工作也更有精神。\n此外，旅游还能锻炼人的能力。一个人出门在外，要自己安排行程、处理各种突发情况，比如航班延误、找不到酒店等。这些经历能让人变得更独立、更勇敢。\n当然，旅游也要量力而行，不要为了“打卡”拍照而花太多钱，更不要只是走马观花。用心去了解一个地方的文化和人，旅游才更有意义。\n总之，旅游不只是玩，更是一种学习和成长的方式。如果有条件，我们应该多出去走走，看看更大的世界。":"xiànzài yuèláiyuè duō de rén xǐhuān zài jiàqī chūqù lǚyóu yǒurén rènwéi lǚyóu zhǐshì huāqián wányīwán méiyǒu shénme yìyì wǒ rènwéi lǚyóu duì yígè rén de chéngzhǎng yǒu hěn zhòngyào de yìyì shǒuxiān lǚyóu néng kāikuòyǎnjiè shūběnshàng de zhīshí zài duō yě bùrú qīnyǎn kànyīkàn dìyīcì qù zhōngguó xīān de shíhòu zhàn zài bīngmǎyǒng miànqián wǒ cái zhēnzhèng gǎnshòu dào le zhōngguó lìshǐ de yōujiǔ zhèzhǒng zhènhàn shì kàn túpiàn wúfǎ tǐhuì de qícì lǚyóu néng ràng rén fàngsōng shēnxīn píngshí gōngzuò yālì dà měitiān de shēnghuó dōu chàbuduō dào yígè xīn de dìfāng kànkàn bù yīyàng de fēngjǐng chī chī dāngdì de měishí néng ràng rén wàngdiào fánnǎo huílái yǐhòu gōngzuò yě gèng yǒu jīngshén cǐwài lǚyóu hái néng duànliàn rén de nénglì yígè rén chūménzàiwài yào zìjǐ ānpái xíngchéng chǔlǐ gèzhǒng tūfā qíngkuàng bǐrú hángbān yánwù zhǎo búdào jiǔdiàn děng zhèxiē jīnglì néng ràng rén biàndé gèng dúlì gèng yǒnggǎn dāngrán lǚyóu yě yào liànglìérxíng búyào wèile dǎkǎ pāizhào érhuā tàiduō qián gèng búyào zhǐshì zǒumǎguānhuā yòngxīn qù liǎojiě yígè dìfāng de wénhuà hé rén lǚyóu cái gèngyǒuyìyì zǒngzhī lǚyóu bù zhǐshì wán gèngshì yīzhǒng xuéxí hé chéngzhǎng de fāngshì rúguǒ yǒu tiáojiàn wǒmen yīnggāi duō chūqù zǒuzǒu kànkàn gèngdà de shìjiè","工资不高":"gōngzī bùgāo","Lẫn phạm vi: “老师” đã thuộc “教育工作者”, không thể liệt kê ngang hàng.":"L ẫ n ph ạ m vi : lǎoshī đ ã thu ộ c jiàoyùgōngzuòzhě kh ô ng th ể li ệ t k ê ngang h à ng","要是有问题，就给我打电话。":"yàoshì yǒu wèntí jiù gěi wǒ dǎdiànhuà","原来他昨天加班到半夜，难怪今天这么累。":"yuánlái tā zuótiān jiābān dào bànyè nánguài jīntiān zhème lèi","他已经把报告写完了。":"tā yǐjīng bǎ bàogào xiě wán le","谈到……":"tándào … …","广泛 减轻 递":"guǎngfàn jiǎnqīng dì","除非身体不舒服，他才会请假。":"chúfēi shēntǐ bù shūfú tā cái huì qǐngjià","雨越下越大，我们只好回家了。":"yǔyuè xià 为一个人生活也可以很幸福，没有必要为了结婚而结婚。\n三是工作太忙，社交圈子小。很多人每天加班，周末只想在家休息，几乎没有机会认识新朋友，自然也很难找到合适的另一半。\n我认为，结婚与否是个人的选择，应该得到尊重。但是，如果很多年轻人是因为经济压力而不敢结婚，那么社会就应该想办法帮助他们，比如提供更多的公共住房、减轻育儿负担。只有这样，年轻人才能真正自由地做出选择。无论选择结婚还是单身，都应该是出于自己的意愿，而不是被压力所迫。":"jìnniánlái yuèláiyuè duō de niánqīngrén tuīchí jiéhūn shènzhì bùxiǎng jiéhūn zhèzhǒng xiànxiàng de chūxiàn zhǔyào yǒu yǐxià jǐgè yuányīn yīshì jīngjì yālì dà zài dàchéngshì fángjià gāo yǎng háizi de fèiyòng yě yuèláiyuè gāo hěnduō niánqīngrén juéde zìjǐ de shōurù zhǐ gòu yǎnghuó zìjǐ bùgǎn qīngyì zǔjiàn jiātíng èrshì guānniàn fāshēng le biànhuà guòqù rénmen rènwéi dào le yídìng niánlíng jiù yīnggāi jiéhūn xiànzài niánqīngrén gèng zhòngshì gèrén de zìyóu hé gǎnshòu rènwéi yígè rén shēnghuó yě kěyǐ hěn xìngfú méiyǒu bìyào wèile jiéhūn ér jiéhūn sānshì gōngzuò tàimáng shèjiāoquānzi xiǎo hěnduō rén měitiān jiābān zhōumò zhǐxiǎng zàijiā xiūxī jīhū méiyǒu jīhuì rènshí xīn péngyǒu zìrán yě hěn nán zhǎodào héshì de lìngyíbàn wǒ rènwéi jiéhūn yǔfǒu shì gèrén de xuǎnzé yīnggāi dédào zūnzhòng dànshì rúguǒ hěnduō niánqīngrén shìyīnwèi jīngjì yālì ér bùgǎn jiéhūn nàme shèhuì jiù yīnggāi xiǎng bànfǎ bāngzhù tāmen bǐrú tígōng gèng duō de gōnggòng zhùfáng jiǎnqīng yùér fùdān zhǐyǒu zhèyàng niánqīngrén cáinéng zhēnzhèng zìyóu dì zuòchū xuǎnzé wúlùn xuǎnzé jiéhūn háishì dānshēn dōu yīnggāi shì chūyú zìjǐ de yìyuàn ér búshì bèi yālì suǒpò","省钱买了便宜货，反而多花了钱。":"shěngqián mǎi le piányíhuò fǎnér duōhuā le qián","即使":"jíshǐ","可以写地点、人物外貌、动作和心情。":"kěyǐ xiě dìdiǎn rénwù wàimào dòngzuò hé xīnqíng","大部分和学习有关。":"dàbùfèn hé xuéxí yǒuguān","现在，河水又变得清清的，小鱼也回来了。":"xiànzài héshuǐ yòu biàndé qīngqīngde xiǎoyú yě huílái le","从……上：从数据上看，今年的销售情况不错。":"cóng … … shàng cóng shùjù shàng kàn jīnnián de xiāoshòu qíngkuàng bùcuò","而":"ér","无论":"wúlùn","去年秋天":"qùnián qiūtiān","特征":"tèzhēng","睡前多喝水":"shuìqián duōhēshuǐ","练习":"liànxí","没有什么比健康更重要的了。":"méiyǒu shénme bǐ jiànkāng gèng zhòngyào de le","参考":"cānkǎo","疾病/灾害":"jíbìng zāihài","温馨":"wēnxīn","语气诚恳、客观，建议要可行。":"yǔqì chéngkěn kèguān jiànyì yào kěx 是几个月就能学好的，需要每天积累。我学中文的第一年，进步很快；第二年却觉得遇到了“瓶颈”，好像怎么学都没有进步，差点儿就放弃了。后来在老师的鼓励下坚持下来，第三年突然发现自己能看懂中文新闻了。\n其次，学外语一定要多用。很多人背了几千个单词，却不敢开口说。其实，语言是交流的工具，只有在使用中才能真正掌握。我在公司里每天都主动和中国同事用中文聊天，说错了就请他们纠正，口语进步得比在课堂上快多了。\n当然，好的方法和老师也很重要，可以让我们少走弯路。但再好的方法，如果不坚持、不使用，也不会有效果。\n总之，学外语没有捷径。只要每天坚持学一点儿，大胆地用起来，就一定能把外语学好。":"suízhe guójìjiāoliú yuèláiyuè duō hěnduō rén dōu zài xuéxíwàiyǔ nàme xuéxíwàiyǔ zuì zhòngyào de shì shénme wǒ rènwéi zuì zhòngyào de shì jiānchí hé duōyòng shǒuxiān xuéxíwàiyǔ xūyào zhǎngshíjiān de jiānchí yǔyán búshì jǐgè yuè jiù néng xuéhǎo de xūyào měitiān jīlěi wǒxué zhōngwén de dìyīnián jìnbù hěnkuài dìèrnián què juéde yùdào le píngjǐng hǎoxiàng zěnme xuédōu méiyǒu jìnbù chàdiǎnér jiù fàngqì le hòulái zài lǎoshī de gǔlì xià jiānchí xiàlái dìsānnián tūrán fāxiànzìjǐ néngkàndǒng zhōngwén xīnwén le qícì xué wàiyǔ yídìng yào duōyòng hěnduō rén bèi le jǐqiāngè dāncí què bùgǎn kāikǒu shuō qíshí yǔyán shì jiāoliú de gōngjù zhǐyǒu zài shǐyòng zhōng cáinéng zhēnzhèng zhǎngwò wǒ zài gōngsī lǐ měitiān dōu zhǔdòng hé zhōngguó tóngshì yòng zhōngwén liáotiān shuōcuò le jiù qǐng tāmen jiūzhèng kǒuyǔ jìnbù dé bǐ zài kètáng shàng kuài duō le dāngrán hǎo de fāngfǎ hé lǎoshī yě hěn zhòngyào kěyǐ ràng wǒmen shǎozǒuwānlù dàn zài hǎo de fāngfǎ rúguǒ bù jiānchí bù shǐyòng yě búhuì yǒu xiàoguǒ zǒngzhī xué wàiyǔ méiyǒu jiéjìng zhǐyào měitiān jiānchí xué yìdiǎnér dàdǎn dìyòng qǐlái jiù yídìng néng bǎ wàiyǔ xuéhǎo","因此，越来越多的公司选择了“混合办公”的方式：每周有几天在办公室，几天在家里。这样既能保持工作的灵活性，又能保证团队之间的沟通。专家认为，未来的办公方式不会只有一种，关键是找到适合公司和员工的平衡点。":"yīncǐ yuèláiyuè duō de gōngsī xuǎnzé le hùnhé bàngōng de fāngshì měizhōu yǒu jǐtiān zài bàngōngshì jǐtiān zài jiālǐ zhèyàng jì néng bǎochí gōngzuò de línghuóxìng yòu néng bǎozhèng tuánduì zhījiān de gōutōng zhuānjiā rènwéi wèilái de bàngōng fāngshì búhuì zhǐyǒu yīzhǒng guānjiàn shì zhǎodào shìhé gōngsī hé yuángōng de pínghéngdiǎn","精神/精力":"jīngshén jīnglì","举行":"jǔxíng","这样才能保证会议的决定真正落实":"zhèyàng cáinéng bǎozhèng huìyì de juédìng zhēnzhèng luòshí","尽管 + 事实，但/却 + 相反的结果　—— mặc dù … nhưng … ，关键在于合理安排时间，并且分清主次。\n首先，要提高工作效率，尽量不把工作带回家。很多加班其实是因为白天的时间没有安排好。如果上班时集中精力，把重要的事情先做完，就能按时下班，把晚上的时间留给家人。\n其次，要重视和家人在一起的质量，而不只是时间。即使每天只有一个小时陪孩子，只要放下手机，认真地听他说话，陪他读一本书，孩子也能感受到父母的爱。\n此外，家庭成员之间要互相理解和分担。夫妻两个人都工作，家务就应该一起做；工作特别忙的时候，要提前和家人沟通，请他们理解。\n当然，有时候工作和家庭难免会冲突，比如项目紧急的时候必须加班。这时候，可以在忙完以后多抽些时间补偿家人。\n总之，工作是为了让家人生活得更好，不能因为工作而失去家庭。只要用心安排，工作和家庭是可以兼顾的。":"zài xiàndài shèhuì hěnduō rén měitiān mángyú gōngzuò huídào jiā yǐjīng hěnwǎn le péibàn jiārén de shíjiān yuèláiyuèshǎo zěnyàng pínghéng gōngzuò hé jiātíng chéng le hěnduō rén guānxīn de wèntí wǒ rènwéi guānjiànzàiyú hélǐānpái shíjiān bìngqiě fēnqīngzhǔcì shǒuxiān yào tígāo gōngzuòxiàolǜ jǐnliàng bù bǎ gōngzuò dàihuíjiā hěnduō jiābān qíshí shìyīnwèi báitiān de shíjiān méiyǒu ānpái hǎo rúguǒ shàngbān shí jízhōngjīnglì bǎ zhòngyào de shìqíng xiān zuò wán jiù néng ànshí xiàbān bǎ wǎnshàng de shíjiān liúgěi jiārén qícì yào zhòngshì hé jiārén zài yìqǐ de zhìliàng ér bù zhǐshì shíjiān jíshǐ měitiān zhǐyǒu yígè xiǎoshí péi háizi zhǐyào fàngxià shǒujī rènzhēn dì tīng tā shuōhuà péi tā dú yī běnshū háizi yě néng gǎnshòu dào fùmǔ de ài cǐwài jiātíngchéngyuán zhījiān yào hùxiānglǐjiě hé fēndān fūqī liǎnggè rén dōu gōngzuò jiāwù jiù yīnggāi yìqǐ zuò gōngzuò tèbié máng de shíhòu yào tíqián hé jiārén gōutōng qǐng tāmen lǐjiě dāngrán yǒushíhòu gōngzuò hé jiātíng nánmiǎnhuì chōngtū bǐrú xiàngmù jǐnjí de shíhòu bìxū jiābān zhèshíhòu kěyǐ zài máng wán yǐhòu duō chōuxiē shíjiān bǔcháng jiārén zǒngzhī gōngzuò shì wèile ràng jiārén shēnghuó dé gènghǎo bùnéng yīnwèi gōngzuò ér shīqù jiātíng zhǐyào yòngxīn ānpái gōngzuò hé jiātíng shì kěyǐ jiāngù de","能看小说":"néng kàn xiǎoshuō","听说":"tīngshuō","整理":"zhěnglǐ","近几年，公共场所吸烟的问题越来越受到人们的关注。这个问题之所以严重，是因为二手烟对周围的人伤害很大。我们要想解决这个问题，就要加强管理，同时让吸烟的人了解危害。这样做不仅能保护大家的健康，还能让城市变得更文明。":"jìnjǐnián gōnggòngchǎngsuǒ xīyān de wèntí yuèláiyuè shòudào rénmen de guānzhù zhège wèntí zhīsuǒyǐ yánzhòng shìyīnwèi èrshǒuyān duì zhōuwéi de rén shānghài hěndà wǒmen yào xiǎng jiějué zhège wèntí jiùyào jiāqiáng guǎnlǐ tóngshí ràng xīyān de r 是为了生活，也有人认为生活是为了工作。我认为，工作是为了更好地生活，二者不应该对立起来。\n首先，工作给生活提供了物质基础。我们需要通过工作获得收入，才能租房、吃饭、照顾家人。没有稳定的工作，生活就很难有保障。\n其次，工作也能让生活更有意义。比如，一位老师看到学生进步，一位医生治好了病人，他们会从工作中得到成就感。这种满足感是金钱买不到的。\n但是，如果把全部时间都给了工作，就会失去生活本身。我身边有一些同事，每天加班到深夜，周末也在回复邮件，结果身体越来越差，和家人的关系也变得紧张。这样的工作，反而让生活变得更糟。\n总之，工作和生活应该保持平衡。我们应该认真工作，但也要留出时间休息、陪伴家人、发展爱好，这样才能真正享受生活。毕竟，我们努力工作，最终是为了让自己和家人过得更好。":"guānyú gōngzuò hé shēnghuó de guānxì yǒurén rènwéi gōngzuò shì wèile shēnghuó yě yǒurén rènwéi shēnghuó shì wèile gōngzuò wǒ rènwéi gōngzuò shì wèile gènghǎo dì shēnghuó èrzhě bù yīnggāi duìlì qǐlái shǒuxiān gōngzuò gěi shēnghuó tígōng le wùzhìjīchǔ wǒmen xūyào tōngguò gōngzuò huòdé shōurù cáinéng zūfáng chīfàn zhàogù jiārén méiyǒu wěndìng de gōngzuò shēnghuó jiù hěn nán yǒu bǎozhàng qícì gōngzuò yě néng ràng shēnghuó gèngyǒuyìyì bǐrú yīwèi lǎoshī kàndào xuéshēng jìnbù yīwèi yīshēng zhìhǎo le bìngrén tāmen huì cóng gōngzuò zhōng dédào chéngjiùgǎn zhèzhǒng mǎnzúgǎn shì jīnqián mǎibúdào de dànshì rúguǒ bǎ quánbù shíjiān dōu gěi le gōngzuò jiù huì shīqù shēnghuó běnshēn wǒ shēnbiān yǒu yīxiē tóngshì měitiān jiābān dào shēnyè zhōumò yě zài huífù yóujiàn jiéguǒ shēntǐ yuèláiyuè chà hé jiārén de guānxì yě biàndé jǐnzhāng zhèyàng de gōngzuò fǎnér ràng shēnghuó biàndé gèngzāo zǒngzhī gōngzuò hé shēnghuó yīnggāi bǎochípínghéng wǒmen yīnggāi rènzhēn gōngzuò dàn yě yào liúchū shíjiān xiūxī péibàn jiārén fāzhǎn àihào zhèyàng cáinéng zhēnzhèng xiǎngshòu shēnghuó bìjìng wǒmen nǔlì gōngzuò zuìzhōng shì wèile ràng zìjǐ hé jiārén guòdé gènghǎo","改变 建造 符合":"gǎibiàn jiànzào fúhé","政策/消息/规定":"zhèngcè xiāoxī guīdìng","新词层出不穷":"xīncí céngchūbùqióng","短文1：叙述事情Ⅰ":"duǎnwén 1 xùshù shìqíng Ⅰ","首先……，然后……，最后……":"shǒuxiān … … ránhòu … … zuìhòu … …","脚踏实地":"jiǎotàshídì","越…越 · 活动通知":"yuè … yuè · huódòng tōngzhī","结尾：同事请她核对报表，部门养成核对两遍的习惯":"jiéwěi tóngshì qǐng tā héduì bàobiǎo bùmén yǎngchéng héduì liǎngbiàn de xíguàn","爱好":"àihào","络绎不绝":"luòyìbùjué","我买了一台很好用的洗衣机。":"wǒ mǎi le yītái hěn hǎo yòng de xǐyījī","有的人认为……，有的人认为……":"yǒu de rén rènwéi … … yǒu de r ","希望贵公司能够……":"xīwàng guì gōngsī nénggòu … …","优势":"yōushì","关于压力，有人说“压力就是动力”，也有人说“压力会把人压垮”。我认为，压力本身没有好坏，关键在于压力的大小和我们面对压力的态度。\n首先，适当的压力能让人进步。如果没有考试的压力，很多学生可能不会认真复习；如果没有业绩的压力，很多员工可能每天都得过且过。我准备HSK考试的时候，正是因为离考试只剩两个月，才每天逼着自己多做一套题，最后取得了不错的成绩。\n但是，压力太大就会适得其反。长期处在巨大的压力下，人会失眠、焦虑，身体也会出问题。我的一位同事因为连续几个月加班，最后病倒住院，工作反而耽误了更多。\n更重要的是，面对压力的态度会影响结果。同样的压力，有的人把它当作挑战，积极想办法解决；有的人只会抱怨和担心，结果越来越焦虑。\n因此，我们应该学会管理压力：给自己定合理的目标，把大任务分成小任务；压力太大时，要学会休息，找家人朋友聊一聊。这样，压力才能真正变成前进的动力。":"guānyú yālì yǒurén shuō yālì jiùshì dònglì yě yǒurén shuō yālì huì bǎ rén yākuǎ wǒ rènwéi yālì běnshēn méiyǒu hǎohuài guānjiànzàiyú yālì de dàxiǎo hé wǒmen miànduì yālì de tàidù shǒuxiān shìdàng de yālì néng ràng rén jìnbù rúguǒ méiyǒu kǎoshì de yālì hěnduō xuéshēng kěnéng búhuì rènzhēn fùxí rúguǒ méiyǒu yèjì de yālì hěnduō yuángōng kěnéng měitiān dōu déguòqiěguò wǒ zhǔnbèi HSK kǎoshì de shíhòu zhèngshì yīnwèi lí kǎoshì zhǐ shèng liǎnggè yuè cái měitiān bī zhe zìjǐ duō zuòyītào tí zuìhòu qǔdé le bùcuò de chéngjì dànshì yālì tàidà jiù huì shìdéqífǎn chángqī chùzài jùdà de yālì xià rénhuì shīmián jiāolǜ shēntǐ yě huì chū wèntí wǒ de yīwèi tóngshì yīnwèi liánxù jǐgè yuè jiābān zuìhòu bìngdào zhùyuàn gōngzuò fǎnér dānwù le gèng duō gèng zhòngyào de shì miànduì yālì de tàidù huì yǐngxiǎng jiéguǒ tóngyàng de yālì yǒu de rén bǎ tā dàngzuò tiǎozhàn jījí xiǎng bànfǎ jiějué yǒu de rén zhǐhuì bàoyuàn hé dānxīn jiéguǒ yuèláiyuè jiāolǜ yīncǐ wǒmen yīnggāi xuéhuì guǎnlǐ yālì gěi zìjǐ dìng hélǐ de mùbiāo bǎ dà rènwù fēnchéng xiǎo rènwù yālì tàidàshí yào xuéhuì xiūxī zhǎo jiārén péngyǒu liáoyīliáo zhèyàng yālì cáinéng zhēnzhèng biànchéng qiánjìn de dònglì","你认为现代人应该怎样平衡工作和家庭？不少于300字。":"nǐ rènwéi xiàndàirén yīnggāi zěnyàng pínghéng gōngzuò hé jiātíng bùshǎo yú 300 zì","根据第一段，“舍”指的是：":"gēnjù dìyīduàn shě zhǐ de shì","我不习惯……":"wǒ bù xíguàn … …","关系":"guānxì","热情":"rèqíng","专家认为，“慢就业”本身不是问题，关键在于这段时间是否有计划、有目标。如果能利用这段时间提升能力、积累经验，那么“慢”下来反而能让以后的路走得更快。":"zhuānjiā rènwéi màn jiùyè běnshēn búshì wèntí guānjiànzàiyú zhè duànshíjiān shìfǒu yǒu jìhuà 。我非常赞同这个观点，尤其是在今天这个变化很快的时代。\n首先，社会发展越来越快，新的知识和技术不断出现。十年前，很少有人想到用手机付款、在网上开会；今天，如果不会这些，生活和工作都会很不方便。只有不断学习，才能跟上时代。\n其次，学习能让人保持年轻的心态。我的外婆六十五岁才开始学用智能手机，现在不但能和我们视频聊天，还学会了在网上看新闻、学做菜。她说，每学会一样新东西，就觉得自己又年轻了一点儿。\n最后，学习也是实现自我价值的重要途径。很多人工作以后继续学习外语、考证书，不仅提高了能力，也获得了更好的发展机会。\n正如那句话所说，活到老，学到老。不管年龄多大，我们都应该保持好奇心，把学习当作生活的一部分。":"súhuàshuō huódàolǎo xuédàolǎo zhèjù huà de yìsi shì xuéxí shì yībèizi de shìqíng bù yīnggāi zài líkāi xuéxiào yǐhòu jiù tíngzhǐ wǒ fēicháng zàntóng zhège guāndiǎn yóuqí shì zài jīntiān zhège biànhuà hěnkuài de shídài shǒuxiān shèhuì fāzhǎn yuèláiyuèkuài xīn de zhīshí hé jìshù bùduàn chūxiàn shínián qián hěnshǎo yǒurén xiǎngdào yòng shǒujī fùkuǎn zài wǎngshàng kāihuì jīntiān rúguǒ búhuì zhèxiē shēnghuó hé gōngzuò dōu huì hěn bù fāngbiàn zhǐyǒu bùduàn xuéxí cáinéng gēnshàng shídài qícì xuéxí néng ràng rén bǎochí niánqīng de xīntài wǒ de wàipó liùshíwǔsuì cái kāishǐ xué yòng zhìnéngshǒujī xiànzài bùdàn néng hé wǒmen shìpín liáotiān hái xuéhuì le zài wǎngshàng kàn xīnwén xué zuòcài tā shuō měi xuéhuì yīyàng xīn dōngxī jiù juéde zìjǐ yòu niánqīng le yìdiǎnér zuìhòu xuéxí yě shì shíxiàn zìwǒ jiàzhí de zhòngyàotújìng hěnduō rén gōngzuò yǐhòu jìxù xuéxíwàiyǔ kǎozhèng shū bùjǐn tígāo le nénglì yě huòdé le gènghǎo de fāzhǎn jīhuì zhèngrú nàjùhuà suǒshuō huódàolǎo xuédàolǎo bùguǎn niánlíng duōdà wǒmen dōu yīnggāi bǎochí hàoqíxīn bǎ xuéxí dàngzuò shēnghuó de yībùfèn","希望……能够……":"xīwàng … … nénggòu … …","……固然重要，但……":"… … gùrán zhòngyào dàn … …","随着经济的发展，人们的生活水平不断提高。":"suízhe jīngjì de fāzhǎn rénmen de shēnghuó shuǐpíng bùduàn tígāo","一开始没有人重视":"yī kāishǐ méiyǒu rén zhòngshì","这个月的三次会议都在上海开。":"zhège yuè de sāncì huìyì dōu zài shànghǎi kāi","短文1：家庭生活":"duǎnwén 1 jiātíng shēnghuó","另外几个人听了，都不好意思地低下了头。":"lìngwài jǐgè rén tīng le dōu bùhǎoyìsī dì dīxià le tóu","我是一个容易满足的人，因为从小父母就告诉我：幸福不在于拥有多少金钱，而在于有没有一颗知足的心。也正是因为如此，我从来不羡慕别人，而是努力追求自己想要的生活。":"wǒ shì yígè róngyì mǎnzú de rén yīnwèi cóngxiǎo fùmǔ jiù gàosù wǒ xìngfú bù zàiyú yōngyǒu duōshǎo jīnqián ér zàiyú yǒuméiyǒu yīkē zhīzú de xī jī bǐ kànshū fāngbiàn duō le","不可否认，……":"bùkěfǒurèn … …","劝":"quàn","座位":"zuòwèi","✗ 是否坚持锻炼，是身体健康的重要条件。":"✗ shìfǒu jiānchí duànliàn shì shēntǐjiànkāng de zhòngyào tiáojiàn","……固然……，但（是）……":"… … gùrán … … dàn shì … …","有一次我问他成功的秘密，他笑着说：“一家小店的发展离不开诚实的服务。":"yǒu yīcì wǒ wèn tā chénggōng de mìmì tā xiào zhe shuō yījiā xiǎodiàn de fāzhǎn líbùkāi chéngshí de fúwù","选择工作时，很多人都会在兴趣和收入之间犹豫。我认为，从长远来看，兴趣比收入更重要，但在刚工作时，也要考虑现实的经济条件。\n首先，兴趣是做好工作的最好动力。如果一个人对工作感兴趣，他就会主动学习、不怕困难，也更容易取得成绩。我的朋友大学学的是财务，可是她更喜欢设计，后来她转行做了平面设计师，虽然一开始收入不高，但是三年后，她已经成了公司最受欢迎的设计师，收入也超过了以前。\n其次，只为了收入而工作，很容易感到疲惫和空虚。我身边有些人工资很高，但每天上班都很痛苦，几年后不得不换工作。\n当然，对于刚毕业、经济压力大的年轻人来说，收入也不能完全不考虑。在这种情况下，可以先找一份收入稳定的工作，同时利用业余时间发展自己的兴趣，等条件成熟了再转向自己喜欢的方向。\n因此，选择工作时，我们既要看眼前，也要看长远，最好能找到兴趣和收入之间的平衡点。":"xuǎnzé gōngzuò shí hěnduō rén dōu huì zài xìngqù hé shōurù zhījiān yóuyù wǒ rènwéi cóng chángyuǎn láikàn xìngqù bǐ shōurù gèng zhòngyào dàn zài gāng gōngzuò shí yě yào kǎolǜ xiànshí de jīngjì tiáojiàn shǒuxiān xìngqù shì zuòhǎo gōngzuò de zuìhǎo dònglì rúguǒ yígè rén duì gōngzuò gǎnxìngqù tā jiù huì zhǔdòng xuéxí bùpàkùnnán yě gèng róngyì qǔdé chéngjì wǒ de péngyǒu dàxué xué de shì cáiwù kěshì tā gèng xǐhuān shèjì hòulái tā zhuǎnháng zuò le píngmiàn shèjìshī suīrán yī kāishǐ shōurù bùgāo dànshì sānnián hòu tā yǐjīng chéng le gōngsī zuì shòuhuānyíng de shèjìshī shōurù yě chāoguò le yǐqián qícì zhǐ wèile shōurù ér gōngzuò hěn róngyì gǎndào píbèi hé kōngxū wǒ shēnbiān yǒuxiē rén gōngzī hěn gāo dàn měitiān shàngbān dōu hěn tòngkǔ jǐnián hòu bùdébù huàn gōngzuò dāngrán duìyú gāng bìyè jīngjì yālì dà de niánqīngrén láishuō shōurù yě bùnéng wánquán bù kǎolǜ zài zhèzhǒng qíngkuàng xià kěyǐ xiānzhǎo yīfèn shōurù wěndìng de gōngzuò tóngshí lìyòng yèyúshíjiān fāzhǎn zìjǐ de xìngqù děng tiáojiànchéngshú le zài zhuǎnxiàng zìjǐ xǐhuān de fāngxiàng yīncǐ xuǎnzé gōngzuò shí wǒmen jìyào kàn yǎnqián yě yào kàn chángyuǎn zuìhǎo néng zhǎodào xìngqù hé shōurù zhījiān de pínghéngdiǎn","创业 困难 坚持 经验 成功":"chuàngyè kùnnán jiānchí jīngyàn chénggōng","舒适":"shūshì","毕业以后，很多年轻人都面临一个选择：留在大城市，还是回到家乡？我认为，年轻的时候去大城市闯一闯，更有利于个人的成长。\n选择留在家乡的人，生活压力比较小。他们可以住在父母家，不用担心房租，下班后还能陪伴家人。这样的生活稳定、安心，但是发展机会相对少一些，有的专业在小城市甚至找不到对口的工作。\n相比之下，大城市的工作机会多，收入也比较高。在大公司工作，能接触到先进的管理方法，认识各行各业的人。当然，大城市生活成本高，竞争也很激烈，很多人每天要花两三个小时在路上。\n两相比较，我认为年轻人更应该去大城市，因为年轻时最宝贵的是学习和积累经验的机会，而压力和困难本身也是一种锻炼。等积累了足够的经验和能力，再回到家乡发展，也能为家乡带去新的想法。\n所以，年轻人不妨趁年轻多出去看看，把大城市当作锻炼自己的地方。":"bìyè yǐhòu hěnduō niánqīngrén dōu miànlín yígè xuǎnzé liúzài dàchéngshì háishì huídào jiāxiāng wǒ rènwéi niánqīng de shíhòu qù dàchéngshì chuǎngyī chuǎng gèng yǒulìyú gèrén de chéngzhǎng xuǎnzé liúzài jiāxiāng de rén shēnghuó yālì bǐjiào xiǎo tāmen kěyǐ zhù zài fùmǔ jiā bùyòng dānxīn fángzū xiàbān hòu hái néng péibàn jiārén zhèyàng de shēnghuó wěndìng ānxīn dànshì fāzhǎn jīhuì xiāngduì shǎo yīxiē yǒu de zhuānyè zài xiǎo chéngshì shènzhì zhǎo búdào duìkǒu de gōngzuò xiāngbǐzhīxià dàchéngshì de gōngzuò jīhuì duō shōurù yě bǐjiào gāo zài dà gōngsī gōngzuò néng jiēchù dào xiānjìn de guǎnlǐ fāngfǎ rènshí gèhánggèyè de rén dāngrán dàchéngshì shēnghuó chéngběn gāo jìngzhēng yě hěn jīliè hěnduō rén měitiān yàohuā liǎngsāngè xiǎoshí zài lùshàng liǎngxiāng bǐjiào wǒ rènwéi niánqīngrén gèng yīnggāi qù dàchéngshì yīnwèi niánqīng shí zuì bǎoguì de shì xuéxí hé jīlěi jīngyàn de jīhuì ér yālì hé kùnnán běnshēn yě shì yīzhǒng duànliàn děng jīlěi le zúgòu de jīngyàn hé nénglì zài huídào jiāxiāng fāzhǎn yě néng wèi jiāxiāng dàiqù xīn de xiǎngfǎ suǒyǐ niánqīngrén bùfáng chèn niánqīng duō chūqù kànkàn bǎ dàchéngshì dàngzuò duànliàn zìjǐ de dìfāng","✗ 大约有三百人左右参加了活动。":"✗ dàyuē yǒu sānbǎi rén zuǒyòu cānjiā le huódòng","具备":"jùbèi","结尾不要只重复开头，要在总结观点的基础上提出建议或希望。":"jiéwěi búyào zhǐ chóngfù kāitóu yào zài zǒngjié guāndiǎn de jīchǔ shàng tíchū jiànyì huò xīwàng","特殊":"tèshū","他之所以成功，是因为一直没有放弃。":"tā zhīsuǒyǐ chénggōng shìyīnwèi yìzhí méiyǒu fàngqì","更加":"gèngjiā","需要的窗口更少":"xūyào de chuāngkǒu gèng shǎo","我至今还记得……":"wǒ zhìjīn hái jìde … …","准备":"zhǔnbèi","A 比 B + 形容词 + 具体数量":"A bǐ B + xíngróngcí + jùtǐ shùliàng","要求/邀请":"yāoqiú yāoqǐng"},"app":{"ad const cyTab=(n,cys)=>`<h2>成语 hôm nay</h2><p class="lead">Chạm vào thẻ để nghe. Học xong làm câu đố bên dưới.</p><div class="cyl">${cys.map(cyCard).join('')}</div>
   <h3>Đố nhanh</h3>${cys.map((ci,k)=>{const L=H().cy;const [w,m,ex]=L[ci];const opts=[ci];let r=(ci*7+3)%L.length;while(opts.length<4){if(!opts.includes(r))opts.push(r);r=(r+11)%L.length}const ord=[...opts].sort((x,y)=>((x*13)%7)-((y*13)%7));return `<div class="card"><div class="qt zh" style="font-size:19px">${esc(ex.replace(w,'＿＿＿＿'))}</div><div class="note">${esc(m)}</div>${mcq('cyd'+n+'-'+k,null,ord.map(x=>L[x][0]),ord.indexOf(ci),null)}</div>`}).join('')}`;
const h6mock=n=>{const k=n-16;const m=H().mk[k];
  return `<div class="note"><a href="#h6">← Lộ trình HSK6</a></div><h1>第${n}天 · 模拟试题${CN[k]}</h1>
  <p class="lead">Đề thi thử phần viết HSK6 (3.0): 2 bài trong <b>45 phút</b>. Bấm giờ ở bài 1, viết xong cả hai bài rồi mới mở bài tham khảo.</p>
  <h2>写作 · 第一部分</h2><p class="zh" style="font-size:18px">${esc(m.ap)}</p>${writeBox('h6m'+n+'a','',[m.apr],150)}
  <h2>写作 · 第二部分</h2><p class="zh" style="font-size:18px">${esc(m.es)}</p>${writeBox('h6m'+n+'b','',[m.esr],300)}
  <h3>Học thuộc bài tham khảo</h3>${memBox(m.apr)}${memBox(m.esr)}
  ${cyTab(n,[30+2*k,31+2*k])}${dayFoot(n,null)}`};
let cyQ=null;
const newCyQ=()=>{const L=H().cy;const i=Math.floor(Math.random()*L.length);const opts=[i];while(opts.length<4){const r=Math.floor(Math.random()*L.length);if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);cyQ={i,opts}};
const h6cy=()=>{const L=H().cy;if(!cyQ)newCyQ();const it=L[cyQ.i];const now=Date.now();const due=L.filter(([w])=>ST.srs['cy'+w]&&ST.srs['cy'+w].due<=now).length;const nw=L.filter(([w])=>!ST.srs['cy'+w]).length;
  return `<div class="card row" style="justify-content:space-between"><span><b>${L.length} thành ngữ</b> hay gặp trong HSK6 · ${due} thẻ đến hạn · ${nw} thẻ mới</span><button class="btn pri" data-cysrs>Ôn bằng thẻ</button></div>
  <h2>Đố nhanh</h2><div class="card"><div class="qt zh" style="font-size:19px">${esc(it[2].replace(it[0],'＿＿＿＿'))}</div><div class="note">${esc(it[1])}</div>${mcq('cy',null,cyQ.opts.map(k=>L[k][0]),cyQ.opts.indexOf(cyQ.i),null)}<div class="row"><button class="btn sm" data-cynext>Câu khác →</button></div></div>
  <h2>Danh sách</h2><div class="cyl">${L.map(([w,m,ex])=>`<button class="cyi" data-say="${reg(w+'。'+ex)}"><span class="cn">${esc(w)}</span> <span class="p">${esc(P(w))}</span><div class="v">${esc(m)}</div><div class="ex">${esc(ex)}</div></button>`).join('')}</div>`};
view.h6=()=>{if(h6Tab==='plan')return h6home();
  const tabs=[['sx','缩写 · Viết'],['rd','阅读 · Đọc'],['ls','听力 · Nghe'],['cy','成语']];
  const body=h6Tab==='sx'?h6sx():h6Tab==='rd'?h6rd():h6Tab==='ls'?h6ls():h6cy();
  return `<div class="note"><button class="btn sm" data-h6t="plan">← Lộ trình HSK6</button></div><h1>Kho bài HSK6</h1><p class="lead">Toàn bộ bài theo từng dạng, luyện tự do ngoài lộ trình 30 ngày.</p><div class="seg">${tabs.map(([k,l])=>`<button class="${k===h6Tab?'on':''}" data-h6t="${k}">${l}</button>`).join('')}</div>${body}`};
setInterval(()=>{const c=document.getElementById('sxclock');if(c&&SXP){const el=Math.floor((Date.now()-SXP.t0)/1000);const lim=SXP.ph==='read'?600:2100;c.textContent=fmt(lim-el);c.style.color=lim-el<0?'var(--warn)':''}},1000);
let apTab='a1';
view.appendix=()=>{
  const A=D.app;let body='';
  if(apTab==='a1')body=`<h2 class="zh">新HSK5级大纲常用副词、介词表</h2><h3>Phó từ (${A.adv.length})</h3><div class="adv">${A.adv.map(w=>`<button data-say="${reg(w)}"><span class="cn">${esc(w)}</span><small>${esc(P(w))}</small></button>`).join('')}</div><h3>Giới từ (${A.prep.length})</h3><div class="adv">${A.prep.map(w=>`<button data-say="${reg(w)}"><span class="cn">${esc(w)}</span><small>${esc(P(w))}</small></button>`).join('')}</div>`;
  if(apTab==='a2')body=`<h2 class="zh">常用固定搭配</h2>`+A.a2.map(([c,l])=>`<h3 class="zh">${esc(c)}</h3>${l.map(sent).join('')}`).join('');
  if(apTab==='a3')body=`<h2 class="zh">汉语常用复句及关联词语</h2>`+A.a3.map(([c,l])=>`<h3 class="zh">${esc(c)}</h3>${l.map(([p,e])=>`<div class="s"><span class="zh"><b>${esc(p)}</b><br>${esc(e)}</span>${sayB(e)}<div class="py">${esc(P(e))}</div></div>`).join('')}`).join('');
  if(apTab==='a4')body=`<h2 class="zh">重点动宾搭配表</h2><p class="lead">Động từ + tân ngữ hay đi cùng nhau. Có trong bộ thẻ “Phụ lục 3–4”.</p><table class="t">${A.a4.map(([v,o],i)=>`<tr><td class="note">${i+1}</td><td class="cn"><button class="ph" data-say="${reg(v)}">${esc(v)}<small>${esc(P(v))}</small></button></td><td class="cn" style="white-space:normal">${esc(o)}</td></tr>`).join('')}</table>`;
  return `<h1>Phụ lục</h1><div class="seg">${[['a1','1 · Phó từ, giới từ'],['a2','2 · Cụm cố định'],['a3','3 · Câu phức, liên từ'],['a4','4 · Động – tân']].map(([k,l])=>`<button class="${k===apTab?'on':''}" data-ap="${k}">${l}</button>`).join('')}</div>${body}`;
};
view.setup=()=>`<h1>Cài đặt</h1>
<div class="card"><label>Tốc độ đọc: <b id="rv">${ST.rate}</b><br><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${ST.rate}" style="width:100%"></label><div class="row" style="margin-top:8px"><button class="btn sm" data-say="${reg('每个人对生活的追求都不一样。')}">Nghe thử</button><span class="note">${zhVoice?'Giọng: '+esc(zhVoice.name):'Nếu không nghe được: cài giọng Tiếng Trung trong Cài đặt máy (iPad: Trợ năng → Nội dung được đọc → Giọng nói).'}</span></div></div>
<div class="card"><b>Sao lưu tiến độ</b><p class="note">Tiến độ lưu trong trình duyệt này. Để chuyển sang máy khác: chép mã bên dưới, dán vào ô ở máy kia rồi bấm Khôi phục.</p><textarea id="bk" style="font:13px monospace;min-height:90px">${esc(JSON.stringify(ST))}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-copy>Chép mã</button><button class="btn sm pri" data-restore>Khôi phục từ mã đã dán</button><button class="btn sm" data-reset>Xoá toàn bộ tiến độ</button></div></div>
<p class="note">Toàn bộ câu ví dụ, bài tập, bài mẫu, đề thi thử, bài đọc và nội dung HSK6 được soạn riêng cho web này; khung ngữ pháp và dạng đề theo cấu trúc chung của kỳ thi HSK. Pinyin tạo tự động nên đôi chỗ đa âm có thể lệch.</p>`;
/* ---------- render & router ---------- */
let route='home';
const render=()=>{TX.length=0;for(const k in ORD)delete ORD[k];ordN=0;
  const h=location.hash.slice(1)||'home';route=h;let html='';
  const m=h.match(/^d(\d+)$/);
  const rm=h.match(/^r(\d+)$/);const h6m=h.match(/^h6d(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=25)html=view.day(+m[1]);else if(rm&&RD(+rm[1]))html=view.readOne(+rm[1]);else if(h6m&&+h6m[1]>=1&&+h6m[1]<=30)html=view.h6day(+h6m[1]);else if(view[h])html=view[h]();else html=view.home();
  $('#app').innerHTML=html;
  for(const id in ORD)drawOrd(id);
  document.querySelectorAll('.wbox').forEach(drawWB);
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===(m?'home':rm?'read':h6m?'h6':h)));
};
const go=()=>{render();window.scrollTo(0,0)};
window.addEventListener('hashchange',go);
document.body.classList.toggle('showpy',ST.py);$('#tPy').setAttribute('aria-pressed',ST.py);
$('#tPy').onclick=()=>{ST.py=!ST.py;save();document.body.classList.toggle('showpy',ST.py);$('#tPy').setAttribute('aria-pressed',ST.py)};
$('#tSet').onclick=()=>{location.hash='setup'};
/* timers */
const TM={};
setInterval(()=>{for(const k in TM){const el=document.querySelector(`.wbox[data-key="${k}"] .timer`);if(el){const s=Math.floor((Date.now()-TM[k])/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}},1000);
document.addEventListener('input',e=>{const wb=e.target.closest('.wbox');if(wb&&e.target.tagName==='TEXTAREA'){ST.drafts[wb.dataset.key]=e.target.value;save();drawWB(wb)}
  if(e.target.id==='rate'){ST.rate=+e.target.value;$('#rv').textContent=ST.rate;save()}});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-say],.hole');if(!t)return;const ds=t.dataset;
  if(t.classList.contains('hole')){t.classList.toggle('rev');return}
  if(ds.say!=null){if(t.classList.contains('sen')){document.querySelectorAll('.sen.on').forEach(x=>x.classList.remove('on'));t.classList.add('on')}speak(TX[+ds.say]);return}
  if(ds.tab){dayTab[+location.hash.slice(2)]=ds.tab;render();document.querySelector('.seg')?.scrollIntoView({block:'start'});window.scrollBy(0,-70);return}
  if(ds.done){const n=+ds.done;if(ST.done[n])delete ST.done[n];else{ST.done[n]=today();toast('Đã đóng dấu 完 cho ngày '+n)}save();render();return}
  if(ds.o){const o=ORD[ds.o];if(ds.p!=null)o.ans.push(+ds.p);else o.ans.splice(+ds.a,1);document.getElementById(ds.o).className='ord';drawOrd(ds.o);return}
  if(ds.ck||ds.hint||ds.show||ds.rs){const id=ds.ck||ds.hint||ds.show||ds.rs;const o=ORD[id];const el=document.getElementById(id);
    if(ds.rs){o.ans=[];el.className='ord';drawOrd(id);return}
    if(ds.hint){const order=correctOrder(o);const k=order.find((x,i)=>o.ans[i]!==x);o.ans=order.slice(0,order.indexOf(k)+1);if(o.ans.length===0)o.ans=[order[0]];el.className='ord';drawOrd(id);return}
    if(ds.show){o.ans=correctOrder(o);el.className='ord good';drawOrd(id);document.getElementById(id+'f').innerHTML=`<span class="zh" style="font-size:18px">${esc(o.item.a)}</span>`;return}
    const got=o.ans.map(k=>o.item.c[k]).join('');const good=core(got)===core(o.item.a);
    el.className='ord '+(good?'good':'bad');drawOrd(id);el.className='ord '+(good?'good':'bad');
    document.getElementById(id+'f').className='fb '+(good?'good':'bad');document.getElementById(id+'f').innerHTML=good?`Đúng! <span class="zh">${esc(o.item.a)}</span>`:(o.ans.length<o.item.c.length?'Chưa dùng hết các cụm từ.':'Chưa đúng — thử lại hoặc bấm Gợi ý.');
    if(good&&o.srs&&!ST.srs[o.srs]){ST.srs[o.srs]={b:1,due:Date.now()+DAY-36e5};save()}
    if(route==='drill'){DR.streak=good?DR.streak+1:0}
    return}
  if(t.closest('.memb')){const box=t.closest('.mem');const k=+box.dataset.k;const tx=TX[k];
    if(ds.sayk!=null){speak(tx);return}
    if(ds.wr!=null){const w=box.querySelector('.wr');w.hidden=!w.hidden;if(!w.hidden)w.querySelector('textarea').focus();return}
    const lv=+ds.lv;box.querySelectorAll('.memb button[data-lv]').forEach(b=>b.classList.toggle('on',b===t));
    const tp=box.dataset.tpl;box.querySelector('.body').innerHTML=lv===0&&tp!==''?markTpl(tx,TX[+tp]):cloze(tx,lv);return}
  if(ds.cmp!=null){const box=t.closest('.mem');box.querySelector('.diff').innerHTML=diffHTML(TX[+box.dataset.k],box.querySelector('textarea').value);return}
  if(ds.ref){const wb=t.closest('.wbox');wb.querySelector('.refout').innerHTML=memBox(TX[+ds.ref]);return}
  if(ds.tm!=null){const k=t.closest('.wbox').dataset.key;if(TM[k]){delete TM[k];t.textContent='Bấm giờ'}else{TM[k]=Date.now();t.textContent='Dừng'}return}
  if(ds.flip!=null){const ta=document.querySelector('.fc textarea');const typed=ta?ta.value:'';RV.show=true;render();if(typed.trim()){const c=RV.q[RV.i];document.querySelector('.cmpout').innerHTML=diffHTML(c.a,typed)}return}
  if(ds.rate){rate(+ds.rate);return}
  if(ds.rvnew!=null){ST.newLog[today()]=0;save();RV=null;render();return}
  if(ds.rvre!=null){ST.decks=[...document.querySelectorAll('[data-deck]')].filter(x=>x.checked).map(x=>x.dataset.deck);ST.scope=document.querySelector('input[name=sc]:checked').value;ST.newPerDay=Math.max(0,+$('#npd').value||0);save();RV=null;render();return}
  if(ds.drm){DR.mode=ds.drm;render();return}
  if(ds.drnext!=null){DR.item=null;render();return}
  if(ds.drnew!=null){DR.prompt=null;ST.drafts.drill='';save();render();return}
  if(ds.rsay){const r=RD(+ds.rsay);speak(r.p.map(x=>x.join('')).join(''));return}
  if(ds.rmk!=null){rdMark=!rdMark;render();return}
  if(ds.rvi!=null){rdVi=!rdVi;render();return}
  if(ds.rtm){const n=+ds.rtm;if(RT[n]){const sec=(Date.now()-RT[n])/1000;delete RT[n];const ch=han(RD(n).p.flat().join(''));const cpm=Math.round(ch/sec*60);ST.read=ST.read||{};ST.read[n]=Object.assign(ST.read[n]||{},{cpm});save();t.textContent='Bấm giờ đọc';$('#rtv').textContent=`${Math.round(sec)} giây · ${cpm} chữ/phút`+(cpm<150?' (mục tiêu thi HSK5: khoảng 150–200 chữ/phút)':' — tốt!')}else{RT[n]=Date.now();t.textContent='Dừng · đã đọc xong';$('#rtv').textContent='Đang tính giờ…'}return}
  if(ds.op){const q=t.closest('.qz');if(q.dataset.done)return;q.dataset.done=1;const a=+q.dataset.ans,o=+ds.op;q.querySelectorAll('.opt').forEach((b,i)=>{if(i===a)b.classList.add('ok');else if(i===o)b.classList.add('no')});const fb=q.querySelector('.fb');fb.className='fb '+(a===o?'good':'bad');fb.textContent=a===o?'Đúng!':'Chưa đúng — đáp án là '+'ABCD'[a]+'.';
    const all=[...document.querySelectorAll('.qz')];if(all.every(x=>x.dataset.done)){const sc=all.filter(x=>x.querySelector('.opt.ok')&&!x.querySelector('.opt.no')).length;const n=+q.dataset.rq.split('-')[0];ST.read=ST.read||{};const r=ST.read[n]||{};r.best=Math.max(r.best||0,sc);ST.read[n]=r;save();$('#rsc').textContent=`· lần này ${sc}/4 · cao nhất ${r.best}/4`}return}
  if(ds.rreset){render();return}
  if(ds.mo!=null){const q=t.closest('.mcq');if(q.dataset.done)return;q.dataset.done=1;const a=+q.dataset.ans,o=+ds.mo;q.querySelectorAll('.opt').forEach((b,i)=>{if(i===a)b.classList.add('ok');else if(i===o)b.classList.add('no')});const fb=q.querySelector('.fb');fb.className='fb '+(a===o?'good':'bad');fb.innerHTML=(a===o?'Đúng!':'Chưa đúng — đáp án là '+'ABCDE'[a]+'.')+(q.dataset.ex!==''?' <span class="note" style="color:var(--ink)">'+esc(TX[+q.dataset.ex])+'</span>':'');
    const id=q.dataset.mcid;if(id.startsWith('cz')){const [i,k]=id.slice(2).split('-').map(Number);const bl=document.querySelector(`#cz${i} .blank[data-b="${k+1}"]`);if(bl){bl.textContent=H().cz[i].bl[k].o[a];bl.classList.add(a===o?'ok':'no')}}
    if(id[0]==='f'){const i=+id.slice(1);const w=H().fill[i].o[a].split(' ');document.getElementById('ft'+i).innerHTML=blanks(H().fill[i].t,w)}
    if(id==='cy'){const w=H().cy[cyQ.i][0];if(!ST.srs['cy'+w]&&a===o){ST.srs['cy'+w]={b:1,due:Date.now()+DAY-36e5};save()}}return}
  if(ds.done6){const n=+ds.done6;ST.done6=ST.done6||{};if(ST.done6[n])delete ST.done6[n];else{ST.done6[n]=today();toast('Đã đóng dấu 完 cho ngày '+n)}save();render();return}
  if(ds.h6t){h6Tab=ds.h6t;SXP=null;render();window.scrollTo(0,0);return}
  if(ds.t6){h6DayTab[+location.hash.slice(4)]=ds.t6;render();document.querySelector('.seg')?.scrollIntoView({block:'start'});window.scrollBy(0,-70);return}
  if(ds.rds){rdSub=ds.rds;render();return}
  if(ds.sx!=null){SXP={i:+ds.sx,ph:'read',t0:Date.now()};render();const hh=[...document.querySelectorAll('h2')].find(x=>x.textContent.startsWith('缩写 '));if(hh)hh.scrollIntoView();else window.scrollTo(0,0);return}
  if(ds.sxph){SXP.ph=ds.sxph;if(ds.sxph==='write'&&!SXP.w0){SXP.w0=1;SXP.t0=Date.now()}render();window.scrollTo(0,0);return}
  if(ds.sxback!=null){SXP=null;render();return}
  if(ds.sxagain!=null){SXP={i:SXP.i,ph:'read',t0:Date.now()};render();window.scrollTo(0,0);return}
  if(ds.sck){const i=+ds.sck;const q=H().sen[i];let ok=0;const fill=[];q.a.forEach((ans,k)=>{const v=document.querySelector(`[data-ss="${i}-${k}"]`).value;if(+v===ans&&v!=='')ok++;fill.push(q.o[ans])});document.getElementById('st'+i).innerHTML=blanks(q.t,fill);document.querySelectorAll(`#st${i} .blank`).forEach((b,k)=>{const v=document.querySelector(`[data-ss="${i}-${k}"]`).value;b.classList.add(+v===q.a[k]&&v!==''?'ok':'no')});document.getElementById('sf'+i).className='fb '+(ok===5?'good':'bad');document.getElementById('sf'+i).textContent=`Đúng ${ok}/5. Đáp án: `+q.a.map((x,k)=>`(${k+1}) ${'ABCDE'[x]}`).join('  ');return}
  if(ds.s6ck){const i=+ds.s6ck;const q=H().sen6[i];let ok=0;const fill=[];q.a.forEach((ans,k)=>{const v=document.querySelector(`[data-s6="${i}-${k}"]`).value;if(v!==''&&+v===ans)ok++;fill.push(q.o[ans])});document.getElementById('s6t'+i).innerHTML=blanks(q.t,fill);document.querySelectorAll(`#s6t${i} .blank`).forEach((b,k)=>{const v=document.querySelector(`[data-s6="${i}-${k}"]`).value;b.classList.add(v!==''&&+v===q.a[k]?'ok':'no')});const f=document.getElementById('s6f'+i);f.className='fb '+(ok===5?'good':'bad');f.textContent=`Đúng ${ok}/5. Đáp án: `+q.a.map((x,k)=>`(${k+1}) ${'ABCDEF'[x]}`).join('  ')+` · câu thừa: ${'ABCDEF'[[0,1,2,3,4,5].find(x=>!q.a.includes(x))]}`;return}
  if(ds.lsh){lsShow[ds.lsh]=!lsShow[ds.lsh];render();return}
  if(ds.cynext!=null){newCyQ();render();return}
  if(ds.cysrs!=null){RVONLY='h6cy';RV=null;location.hash='review';return}
  if(ds.rvall!=null){RVONLY=null;RV=null;render();return}
  if(ds.ap){apTab=ds.ap;render();return}
  if(ds.copy!=null){const v=$('#bk').value;navigator.clipboard.writeText(v).then(()=>toast('Đã chép mã sao lưu'),()=>{$('#bk').select();toast('Hãy chọn và chép thủ công')});return}
  if(ds.restore!=null){try{const s=JSON.parse($('#bk').value);ST=Object.assign(ST,s);save();RV=null;toast('Đã khôi phục tiến độ');render()}catch(err){toast('Mã không hợp lệ')}return}
  if(ds.reset!=null){if(t.dataset.arm){ST={py:ST.py,rate:ST.rate,done:{},seen:{},srs:{},drafts:{},newPerDay:20,newLog:{},decks:null,scope:'seen'};save();RV=null;toast('Đã xoá tiến độ');render()}else{t.dataset.arm=1;t.textContent='Bấm lần nữa để xoá hẳn'}return}
});
document.addEventListener('keydown',e=>{if(e.target.classList?.contains('hole')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.classList.toggle('rev')}});
const correctOrder=o=>{const c=o.item.c;return c.map((_,i)=>i)};
render();
}
