不方便。只有不断学习，才能跟上时代。\n其次，学习能让人保持年轻的心态。我的外婆六十五岁才开始学用智能手机，现在不但能和我们视频聊天，还学会了在网上看新闻、学做菜。她说，每学会一样新东西，就觉得自己又年轻了一点儿。\n最后，学习也是实现自我价值的重要途径。很多人工作以后继续学习外语、考证书，不仅提高了能力，也获得了更好的发展机会。\n正如那句话所说，活到老，学到老。不管年龄多大，我们都应该保持好奇心，把学习当作生活的一部分。"},"prac":"俗话说“三人行，必有我师”。请结合自己的经历谈谈你的理解。不少于300字。","ref":"孔子说过：“三人行，必有我师焉。”这句话的意思是，几个人在一起，其中一定有值得我学习的人。我认为，这句话告诉我们要谦虚，要善于发现别人的优点。\n首先，每个人都有自己的长处。在公司里，我的经理很会安排工作，同事小玲特别细心，仓库的阿明虽然学历不高，但对每一种零件都了如指掌。和他们一起工作，我从每个人身上都学到了不同的东西。\n其次，向别人学习需要谦虚的态度。刚工作的时候，我觉得自己是大学毕业生，懂得比别人多，常常不听老员工的建议，结果在一次盘点中出了大错。从那以后，我才明白，真正的知识不只在书本里，也在别人的经验里。\n最后，学习的对象不分年龄和身份。有时候，我的孩子提出的问题，也会让我重新思考很多事情。\n总之，“三人行，必有我师”提醒我们，要放下架子，虚心向身边的人学习。这样，我们才能不断进步。"},"read":{"cz":6,"long":3},"ls":{"l1":[6],"l3":[1]},"cy":[12,13]},{"title":"既然…就 · 投诉信","grammar":[{"title":"既然……，就……","base":"既然 + 已成事实，就 + 推论/建议　—— đã … thì …","ex":["既然已经决定了，就别再犹豫了。","既然客户提出了要求，我们就应该认真考虑。"]},{"title":"难怪","base":"难怪 + 结果（因为明白了原因）　—— thảo nào, hèn chi","ex":["原来他昨天加班到半夜，难怪今天这么累。","难怪这家店人这么多，菜真的很好吃。"]}],"ex":[{"a":"既然你身体不舒服，就早点儿回家休息吧。","c":["既然","你","身体","不","舒服，","就","早点儿","回家","休息吧"]},{"a":"外面下雪了，难怪这么冷。","c":["外面","下雪了，","难怪","这么","冷"]},{"a":"既然大家都同意，我们就这么办。","c":["既然","大家","都","同意，","我们","就","这么","办"]},{"a":"难怪她汉语说得这么好，原来在中国住过五年。","c":["难怪","她","汉语","说得","这么","好，","原来","在","中国","住过","五年"]},{"a":"既然答应了别人，就一定要做到。","c":["既然","答应了","别人，","就","一定","要","做到"]},{"a":"既然来了，就多待几天吧。","c":["既然","来了，","就","多","待","几天吧"]},{"a":"原来今天是周末，难怪路上没什么车。","c":["原来","今天","是","周末，","难怪","路上","没","什么","车"]},{"a":"既然知道错了，就应该马上改正。","c":["既然","知道","错了，","就","应该","马上","改正"]}],"app":{"type":"投诉信","feat":["写清楚投诉的对象、时间、事情经过和造成的影响。","语气可以严肃，但要客观、礼貌，不用骂人的话。","提出明确的要求，并留下联系方式。"],"tpl":"投诉信\n尊敬的……负责人：\n您好！我是……。×月×日，我……，却遇到了……的问题。\n……（具体经过）\n这件事给我带来了……。为此，我希望贵公司能够：一、……；二、……。\n希望尽快得到您的答复。我的联系方式：……\n投诉人：……\n××年×月×日","ph":[["说明问题",["遇到了以下问题","与贵公司承诺的不符","严重影响了……"]],["提出要求",["希望贵公司能够……","请尽快给予答复","要求退货/退款/赔偿"]]],"model":"投诉信\n尊敬的“快达”快递公司客服负责人：\n您好！我是平阳省土龙木市的客户陈明。12月10日，我通过贵公司从河内寄出一个包裹，里面是一台笔记本电脑，运单号为KD20261210588，贵公司承诺三天内送达。\n可是，直到12月18日我才收到包裹，而且外包装严重破损，电脑屏幕也摔坏了。我多次拨打客服电话，每次都要等半个多小时，问题至今没有解决。\n这件事不仅让我耽误了工作，还造成了很大的经济损失。为此，我希望贵公司能够：一、按照保价金额赔偿电脑的维修费用；二、对相关工作人员的服务进行检查和改进。\n希望在一周内得到您的答复。我的联系电话：0912-345-678。\n投诉人：陈明\n2026年12月19日","prac":"你在网上买了一台洗衣机，送来以后发现不能用，客服一直不处理。请写一封投诉信。不少于150字。","ref":"投诉信\n尊敬的“优品”网上商城负责人：\n您好！我是贵商城的会员黄氏梅。12月5日，我在贵商城购买了一台“清风”牌全自动洗衣机，订单号YP1205066，价格九百万越南盾。\n12月8日洗衣机送到以后，安装工人刚走，我就发现洗衣机无法排水，衣服泡在水里，根本不能使用。我当天就联系了在线客服，客服说会安排维修人员上门，可是一个多星期过去了，一直没有人来，再联系客服也只是让我“耐心等待”。\n这件事严重影响了我家的日常生活。为此，我要求：一、在三天内为我更换一台新的洗衣机，或者全额退款；二、对客服的处理态度做出解释。\n请尽快给予答复。我的联系电话：0903-111-222。\n投诉人：黄氏梅\n2026年12月17日"},"essay":{"title":"结尾方法：总结 + 呼吁","feat":["结尾不要只重复开头，要在总结观点的基础上提出建议或希望。","常见结尾：总结观点 → 提出建议 → 表达希望。","结尾两三句即可，不要再提出新的论点。"],"tpl":"【开头】……\n【理由】……\n【结尾】总之，……。我们每个人都应该……；（政府/学校/企业）也应该……。相信……，……一定会……。","ph":[["总结",["总之，……","总而言之，……","综上所述，……"]],["呼吁",["我们每个人都应该……","让我们从现在做起，……","希望……能够……"]],["展望",["相信……一定会……","只有这样，……才能……"]]],"model":{"topic":"一次性用品给生活带来了方便，也带来了问题。你怎么看？","text":"一次性筷子、塑料杯、外卖餐盒……一次性用品已经成为我们生活中不可缺少的一部分。我认为，一次性用品虽然方便，但我们应该尽量少用。\n首先，一次性用品确实给生活带来了很多方便。外出吃饭不用担心餐具是否干净，开会时随手就能拿到一杯水，用完直接扔掉，省去了清洗的麻烦。\n但是，一次性用品带来的环境问题越来越严重。大部分塑料制品很难自然分解，会在土地和海洋里存在几百年。我曾经在海边看到，沙滩上到处是塑料瓶和塑料袋，让人非常难过。此外，生产一次性筷子要砍伐大量树木，浪费了宝贵的资源。\n其实，减少使用一次性用品并不难。出门带一个水杯，买东西时带上购物袋，点外卖时选择“不需要餐具”，这些都是举手之劳。\n总之，方便不能以牺牲环境为代价。我们每个人都应该从小事做起，少用一次性用品；企业也应该多开发可以重复使用的环保产品。相信只要大家共同努力，我们的地球一定会更干净、更美丽。"},"prac":"很多城市都有交通拥堵的问题。请谈谈你的看法和建议。不少于300字。","ref":"随着经济的发展，越来越多的家庭买了汽车，城市里的交通拥堵问题也越来越严重。我认为，解决这个问题需要政府和每个市民共同努力。\n首先，拥堵浪费了大量的时间。在胡志明市，很多上班族每天要在路上花两三个小时，本来可以用来休息、学习或者陪伴家人的时间，都浪费在了路上。\n其次，拥堵还加重了空气污染。车辆在路上走走停停，排放的尾气比正常行驶时更多，对市民的健康造成了很大的伤害。\n要解决拥堵问题，政府应该大力发展地铁、公交等公共交通，让大家出行更方便；同时合理规划城市，让人们在离家不远的地方就能工作、上学和购物。对于每个市民来说，能坐公共交通就不开私家车，短距离出行可以骑自行车或者步行。\n总之，交通拥堵不是一个人造成的，也不是一天就能解决的。我们每个人都应该从自己做起，选择绿色出行。相信在大家的共同努力下，城市的交通一定会越来越顺畅。"},"read":{"cz":7,"sen":3},"ls":{"l1":[7],"l3":[2]},"cy":[14,15]},{"title":"除非…否则 · 建议书","grammar":[{"title":"除非……，否则……","base":"除非 + 唯一条件，否则 + 结果　—— trừ khi …, nếu không thì …","ex":["除非你亲自去说，否则他不会同意的。","除非原材料明天到，否则这批货不能按时交。"]},{"title":"除非……，才……","base":"除非 + 唯一条件，才 + 结果　—— chỉ khi … mới …","ex":["除非经理签字，才能付款。","除非你认真复习，才能考好。"]}],"ex":[{"a":"除非下大雨，否则比赛照常进行。","c":["除非","下","大雨，","否则","比赛","照常","进行"]},{"a":"除非你道歉，否则她不会原谅你。","c":["除非","你","道歉，","否则","她","不会","原谅","你"]},{"a":"除非有特殊情况，否则员工不能迟到。","c":["除非","有","特殊","情况，","否则","员工","不能","迟到"]},{"a":"除非提前预订，才能订到房间。","c":["除非","提前","预订，","才","能","订到","房间"]},{"a":"除非价格再低一点儿，否则客户不会下单。","c":["除非","价格","再","低","一点儿，","否则","客户","不会","下单"]},{"a":"除非大家一起努力，否则很难完成。","c":["除非","大家","一起","努力，","否则","很难","完成"]},{"a":"除非身体不舒服，他才会请假。","c":["除非","身体","不舒服，","他","才","会","请假"]},{"a":"除非老板同意，否则这个方案不能执行。","c":["除非","老板","同意，","否则","这个","方案","不能","执行"]}],"app":{"type":"建议书","feat":["写给领导或有关部门，针对一个具体问题提出建议。","结构：发现的问题 → 原因 → 具体建议（分条）→ 预期效果。","语气诚恳、客观，建议要可行。"],"tpl":"关于……的建议\n尊敬的……：\n您好！我是……。最近我发现……，这个问题……。\n为此，我提出以下几点建议：\n一、……\n二、……\n三、……\n如果这些建议能够得到采纳，相信……。\n以上建议，仅供参考。\n建议人：……\n××年×月×日","ph":[["提出问题",["最近我发现……","……的问题比较突出","这不仅……，而且……"]],["建议",["我提出以下几点建议","建议……","可以考虑……"]],["结尾",["以上建议，仅供参考","相信……会……","希望领导考虑"]]],"model":"关于改善员工午餐的建议\n尊敬的总经理：\n您好！我是生产部的员工阮文强。最近，我发现很多同事中午不在公司食堂吃饭，而是点外卖或者去外面吃。和同事们聊了以后才知道，大家觉得食堂的菜品种类太少，而且菜常常是凉的。这不仅增加了员工的花费，而且因为外出吃饭，下午上班时常常有人迟到。\n为此，我提出以下几点建议：\n一、每周公布菜单，每天至少提供四种不同的菜，并增加一些越南和中国的家常菜。\n二、增加保温设备，保证员工吃到热的饭菜。\n三、每个月做一次满意度调查，根据大家的意见进行调整。\n如果这些建议能够得到采纳，相信员工的满意度会大大提高，工作效率也会更高。\n以上建议，仅供参考。\n建议人：阮文强\n2026年12月20日","prac":"你所在的小区停车很乱，经常堵住消防通道。请给物业管理处写一封建议书。不少于150字。","ref":"关于改善小区停车秩序的建议\n尊敬的阳光花园物业管理处：\n您好！我是住在8栋的业主黄先生。最近，我发现小区里乱停车的现象越来越严重，很多车停在路边，甚至堵住了消防通道。上周有一位老人突然生病，救护车在门口等了十几分钟才开进来，让大家非常担心。\n为此，我提出以下几点建议：\n一、在消防通道两边画上明显的标志，并安装提醒牌，禁止停车。\n二、重新规划地下停车场，增加车位，并为业主提供固定车位。\n三、安排保安晚上巡查，对乱停车的车辆及时提醒，多次不改的进行登记。\n相信只要物业和业主共同配合，小区的停车秩序一定会越来越好，大家的生活也会更加安全。\n以上建议，仅供参考。\n建议人：8栋1203室　黄先生\n2026年12月21日"},"essay":{"title":"写作技巧：段落中心句","feat":["每个中间段落的第一句话就是这一段的“中心句”，读者一看就知道这一段说什么。","中心句后面再用例子、数据或解释来支持它。","检查方法：只读每段第一句，能看懂整篇文章的观点。"],"tpl":"【开头】……。我认为……。\n【第二段】首先，……（中心句）。……（解释/例子）。\n【第三段】其次，……（中心句）。……\n【第四段】最后，……（中心句）。……\n【结尾】总之，……。","ph":[["中心句开头",["首先，……对……有很大的帮助","其次，……还能……","最后，也是最重要的，……"]],["支持",["比如，……","据调查，……","我身边就有这样的例子"]]],"model":{"topic":"你认为运动对现代人重要吗？","text":"现代人工作忙、压力大，很多人一天中大部分时间都坐在电脑前。我认为，坚持运动对现代人来说非常重要。\n首先，运动能让身体更健康。长时间坐着工作，容易导致颈椎病、肥胖等问题。每天运动半个小时，比如快走、跑步或者游泳，可以增强体质，减少生病的机会。我的同事以前常常感冒，坚持打羽毛球一年以后，身体好多了。\n其次，运动能帮助人们减轻压力。运动的时候，人会暂时忘掉工作中的烦恼，运动之后心情也会变得轻松愉快。很多人发现，晚上跑完步以后，睡觉也睡得更香了。\n最后，运动还能让人认识新朋友。参加跑步团、篮球队等集体活动，可以认识志同道合的人，丰富自己的业余生活。\n总之，运动是一种投入少、收获大的生活方式。不管工作多忙，我们都应该每天抽出一点儿时间，让身体动起来。健康的身体，才是我们工作和生活最大的本钱。"},"prac":"你认为养成阅读习惯对成年人有什么好处？不少于300字。","ref":"现在很多成年人工作以后就很少读书了，有空的时候更愿意刷手机、看视频。我认为，成年人养成阅读的习惯有很多好处。\n首先，阅读能帮助我们不断学习新知识。工作以后，学校里学到的知识很快就不够用了。通过阅读专业书籍，我们可以了解行业的新变化，提高自己的工作能力。我的一位朋友是会计，每个月都会读一两本财务管理方面的书，后来很快就升为了财务主管。\n其次，阅读能让我们的内心更平静。手机上的信息又多又杂，看久了让人觉得疲惫；而读一本好书，可以让人慢下来，安静地思考。\n最后，阅读能开阔我们的眼界。我们不可能去过世界上所有的地方，也不可能经历所有的人生，但是通过书本，我们可以了解不同的文化，体会不同人的生活。\n总之，阅读是一种成本很低、收获很大的投资。即使工作再忙，我们每天也可以读二十分钟书，日积月累，一定会有很大的收获。"},"read":{"cz":8,"long":4},"ls":{"l1":[8],"l3":[3]},"cy":[16,17]},{"title":"随着 · 推荐信","grammar":[{"title":"随着……","base":"随着 + 变化的事物，（主语）+ 也/越来越……　—— cùng với …","ex":["随着经济的发展，人们的生活水平不断提高。","随着年龄的增长，他越来越理解父母了。"]},{"title":"伴随着……","base":"伴随着 + 名词，……　—— đi kèm với, cùng với (văn viết)","ex":["伴随着城市化的进程，很多农民来到城市工作。","伴随着音乐声，晚会开始了。"]}],"ex":[{"a":"随着网络的普及，网上购物越来越方便。","c":["随着","网络的","普及，","网上","购物","越来越","方便"]},{"a":"随着订单的增加，工厂需要招聘更多工人。","c":["随着","订单的","增加，","工厂","需要","招聘","更多","工人"]},{"a":"伴随着掌声，新娘走进了大厅。","c":["伴随着","掌声，","新娘","走进了","大厅"]},{"a":"随着时间的推移，他慢慢适应了新环境。","c":["随着","时间的","推移，","他","慢慢","适应了","新","环境"]},{"a":"随着天气变冷，感冒的人越来越多。","c":["随着","天气","变冷，","感冒的","人","越来越","多"]},{"a":"伴随着科技的进步，很多新职业出现了。","c":["伴随着","科技的","进步，","很多","新职业","出现了"]},{"a":"随着孩子长大，父母也慢慢变老了。","c":["随着","孩子","长大，","父母","也","慢慢","变老了"]},{"a":"随着中文水平的提高，她找到了更好的工作。","c":["随着","中文","水平的","提高，","她","找到了","更好的","工作"]}],"app":{"type":"推荐信","feat":["写给招聘单位或学校，推荐一个你了解的人。","说明你和被推荐人的关系、认识多久。","具体写出被推荐人的能力、品质和成绩，最后正式推荐。"],"tpl":"推荐信\n尊敬的……：\n您好！我是……，很荣幸推荐……申请贵公司/学校的……。\n我和……认识……年，……（关系）。\n……（能力和成绩，举例）\n……（品质）\n我相信……一定能够胜任……。因此，我郑重地向您推荐……。\n如需了解更多情况，请联系……。\n推荐人：……\n××年×月×日","ph":[["关系",["我是他的直接上级","我们共事了三年","她是我教过的学生"]],["评价",["工作认真负责，善于沟通","具有很强的学习能力","深受同事和客户的信任"]],["推荐",["我郑重地向您推荐……","相信他一定能胜任……","如需了解更多情况，请联系我"]]],"model":"推荐信\n尊敬的人力资源部负责人：\n您好！我是康达科技（越南）有限公司采购部经理王海，很荣幸推荐阮氏芳女士申请贵公司的采购主管一职。\n我和阮氏芳共事了四年，我是她的直接上级。在这四年里，她负责公司三十多家供应商的管理工作，每一份合同、每一张发票都核对得清清楚楚。去年，她通过和供应商谈判，帮公司节省了将近百分之十的采购成本。\n她工作认真负责，中文流利，善于和中越双方沟通，深受同事和供应商的信任。遇到紧急订单时，她总是主动加班，从来没有耽误过生产。\n我相信，阮氏芳一定能够胜任贵公司的采购主管工作。因此，我郑重地向您推荐她。\n如需了解更多情况，请联系我：0909-123-456。\n推荐人：王海\n2026年12月22日","prac":"你的一位学生/同事想申请去中国读硕士，请你为他/她写一封推荐信。不少于150字。","ref":"推荐信\n尊敬的北京语言大学研究生招生办公室：\n您好！我是胡志明市师范大学中文系的教师陈美玲，很荣幸推荐我的学生黎文安申请贵校汉语国际教育专业的硕士研究生。\n我教了黎文安三年的汉语写作课，对他非常了解。他学习非常努力，每次的作业都完成得很认真，HSK六级考了二百六十分。去年，他在全国大学生汉语演讲比赛中获得了一等奖。\n除了学习成绩优秀以外，他还热心帮助同学，课余时间常常在学校的汉语角当志愿者，组织中越学生交流活动。\n我相信，黎文安一定能够顺利完成研究生阶段的学习。因此，我郑重地向您推荐他。如需了解更多情况，请发邮件至chenml@hcmue.edu.vn联系我。\n推荐人：陈美玲\n2026年12月23日"},"essay":{"title":"话题类型①：科技与生活","feat":["科技类话题常问：科技（手机、网络、人工智能）对生活是好是坏？","最稳的观点：科技是工具，有利有弊，关键在于怎样使用。","可以从工作、学习、人际关系、健康几个方面分析。"],"tpl":"【开头】随着……的发展，……已经……。有人认为……，有人认为……。我认为，……本身没有好坏，关键在于……。\n【利】一方面，……。\n【弊】另一方面，……。\n【办法】因此，我们应该……。\n【结尾】只有……，才能……。","ph":[["科技相关",["给生活带来了极大的便利","提高了工作效率","过度依赖","带来了新的问题","个人信息安全"]],["辩证",["凡事都有两面性","是一把双刃剑","关键在于如何使用"]]],"model":{"topic":"科技是促进还是限制了人的全面发展？","text":"随着科技的飞速发展，手机、电脑和人工智能已经深入到我们生活的每一个方面。有人认为科技促进了人的全面发展，也有人认为科技限制了人的发展。我认为，科技本身没有好坏，关键在于我们怎样使用它。\n一方面，科技为人的发展提供了前所未有的机会。今天，一个住在小城市的年轻人，通过网络就能学习世界一流大学的课程；一个不会说外语的人，借助翻译软件也能和外国朋友交流。科技让学习变得更加方便，也让每个人都有机会发现和发展自己的兴趣。\n另一方面，如果过度依赖科技，人的一些能力也会退化。比如，很多人习惯了用导航，离开手机就找不到路；习惯了用输入法，提笔就忘字；习惯了在网上聊天，面对面交流时反而不知道说什么。\n因此，我们应该做科技的主人，而不是科技的奴隶。我们可以利用科技提高效率、学习知识，但也要给自己留出读书、运动、和朋友面对面交流的时间。\n只有合理地使用科技，它才能真正促进我们的全面发展。"},"prac":"有人认为“网络让人更孤独了”。你同意吗？不少于300字。","ref":"现在，几乎每个人都离不开网络，我们在网上聊天、购物、看新闻、交朋友。可是，也有人认为，网络让人变得更孤独了。我认为，网络本身不会让人孤独，关键在于我们怎样使用它。\n一方面，网络确实拉近了人与人之间的距离。在国外留学或者工作的人，可以通过视频随时和家人见面；有共同爱好的人，即使住在不同的国家，也能在网上成为好朋友。对于一些性格内向的人来说，网络也给了他们表达自己的机会。\n另一方面，如果过度沉迷网络，人确实容易变得孤独。有的人在网上有几百个“好友”，现实生活中却没有一个可以说心里话的朋友；有的人每天下班就躺在床上刷手机，周末也不愿意出门见人。时间长了，他们和现实世界的联系就越来越少。\n因此，我们应该把网络当作交流的工具，而不是逃避现实的地方。在网上认识了朋友，可以约出来见面；和家人在一起的时候，可以放下手机，多聊聊天。\n只有平衡好网络和现实生活，我们才能既享受网络的便利，又不感到孤独。"},"read":{"cz":9,"sen":4},"ls":{"l1":[9],"l3":[4]},"cy":[18,19]},{"title":"就…而言 · 寻物启事","grammar":[{"title":"对……而言 / 就……而言","base":"对（于）A 而言/来说，……；就 A 而言，……　—— đối với A mà nói; xét về A","ex":["对新员工而言，熟悉公司的规定最重要。","就质量而言，这家供应商的产品是最好的。"]},{"title":"从……来看","base":"从 + 角度/方面 + 来看，……　—— nhìn từ góc độ …","ex":["从长远来看，培养人才比买设备更重要。","从数据来看，今年的销售情况比去年好。"]}],"ex":[{"a":"对孩子而言，父母的陪伴最重要。","c":["对","孩子","而言，","父母的","陪伴","最","重要"]},{"a":"就价格而言，网上比商店便宜。","c":["就","价格","而言，","网上","比","商店","便宜"]},{"a":"从长远来看，这个投资是值得的。","c":["从","长远","来看，","这个","投资","是","值得的"]},{"a":"对我而言，健康比金钱重要。","c":["对","我","而言，","健康","比","金钱","重要"]},{"a":"就这件事而言，我们都有责任。","c":["就","这件事","而言，","我们","都","有","责任"]},{"a":"从结果来看，这次改革很成功。","c":["从","结果","来看，","这次","改革","很","成功"]},{"a":"对一个公司而言，信誉就是生命。","c":["对","一个","公司","而言，","信誉","就是","生命"]},{"a":"从客户的角度来看，这个价格还是太高了。","c":["从","客户的","角度","来看，","这个","价格","还是","太高了"]}],"app":{"type":"寻物启事","feat":["标题写“寻物启事”，说明丢失的时间、地点。","详细描述丢失物品的特征（颜色、大小、里面有什么）。","写清楚联系方式和感谢（或酬谢）。"],"tpl":"寻物启事\n本人于×月×日……（时间）在……（地点）不慎丢失……一个/一部。\n物品特征：……\n……（说明物品对自己的重要性）\n如有拾到者，请联系……，本人将……（感谢/酬谢）。\n失主：……\n××年×月×日","ph":[["丢失",["不慎丢失","可能遗落在……","下车时忘在了……"]],["特征",["黑色、长方形、约……厘米","里面有……","外面贴着……"]],["感谢",["必有重谢","不胜感激","请与本人联系"]]],"model":"寻物启事\n本人于12月20日（星期六）下午四点左右，在土龙木市“永安”超市二楼的休息区不慎丢失黑色双肩包一个。\n物品特征：背包是黑色的，中等大小，正面有一个白色的熊猫图案。包里有一台银色的笔记本电脑、一个蓝色的钱包（里面有身份证和两张银行卡）、一本中文书《汉语写作教程》以及一串钥匙。\n电脑里存着我一年来的工作资料，对我非常重要，身份证和银行卡补办起来也很麻烦。\n如有拾到者，请拨打电话0918-765-432与我联系，或交到超市一楼服务台。本人必有重谢！\n失主：阮先生\n2026年12月20日","prac":"你在公司附近的咖啡店丢了一部手机。请写一则寻物启事。不少于150字。","ref":"寻物启事\n本人于12月22日（星期一）中午十二点半左右，在BW工业区门口的“绿叶”咖啡店不慎丢失手机一部，可能遗落在靠窗的座位上。\n物品特征：手机是白色的，屏幕右下角有一道小裂痕，外面套着一个浅蓝色的手机壳，壳上贴着一张小猫的贴纸。手机壳里还夹着一张公司的门卡，上面写着我的名字“黎氏花”。\n手机里有很多孩子的照片和重要的工作联系人，对我来说非常重要。\n如有拾到者，请拨打电话0274-555-888（公司前台）联系我，或者把手机交给咖啡店的服务员。本人必有重谢，不胜感激！\n失主：黎氏花\n2026年12月22日"},"essay":{"title":"话题类型②：工作与职业","feat":["常见问题：选择工作看兴趣还是看收入？跳槽好不好？年轻人该不该创业？","可以结合自己的工作经历举例，更真实、更有说服力。","注意不要只写一方面，要说明在什么情况下怎样选择。"],"tpl":"【开头】……是每个人都会面对的问题。……。我认为，……。\n【理由一】……\n【理由二】……\n【条件】当然，……的情况下，……。\n【结尾】因此，……。","ph":[["职业相关",["发展前景","工作环境","薪资待遇","职业规划","积累经验","发挥特长"]],["选择",["在……和……之间做出选择","适合自己的才是最好的","根据自己的情况"]]],"model":{"topic":"选择工作时，兴趣和收入哪个更重要？","text":"选择工作时，很多人都会在兴趣和收入之间犹豫。我认为，从长远来看，兴趣比收入更重要，但在刚工作时，也要考虑现实的经济条件。\n首先，兴趣是做好工作的最好动力。如果一个人对工作感兴趣，他就会主动学习、不怕困难，也更容易取得成绩。我的朋友大学学的是财务，可是她更喜欢设计，后来她转行做了平面设计师，虽然一开始收入不高，但是三年后，她已经成了公司最受欢迎的设计师，收入也超过了以前。\n其次，只为了收入而工作，很容易感到疲惫和空虚。我身边有些人工资很高，但每天上班都很痛苦，几年后不得不换工作。\n当然，对于刚毕业、经济压力大的年轻人来说，收入也不能完全不考虑。在这种情况下，可以先找一份收入稳定的工作，同时利用业余时间发展自己的兴趣，等条件成熟了再转向自己喜欢的方向。\n因此，选择工作时，我们既要看眼前，也要看长远，最好能找到兴趣和收入之间的平衡点。"},"prac":"有人说“年轻人应该经常换工作，多尝试”，也有人说“应该在一家公司长期发展”。你怎么看？不少于300字。","ref":"关于年轻人要不要经常换工作，人们有不同的看法。我认为，年轻人可以在刚工作的几年里多尝试，但不能过于频繁地跳槽，找到方向以后就应该踏踏实实地长期发展。\n一方面，刚毕业的年轻人往往不清楚自己真正适合做什么。多换一两份工作，可以接触不同的行业，了解自己的兴趣和长处。我的同学毕业后先做了一年销售，发现自己不喜欢，后来换到了人事部门，现在做得非常开心。\n另一方面，如果一两年就换一次工作，什么都只学了一点儿，就很难在一个领域积累深厚的经验。而且，招聘的公司看到简历上频繁的跳槽记录，也会担心这个人不够稳定。\n从长远来看，一个人的价值来自专业能力的积累，而积累需要时间。在一家公司长期工作，还能建立起同事和客户的信任，获得更多晋升的机会。\n因此，我建议年轻人在工作的前两三年可以多尝试，但找到适合自己的方向后，就应该静下心来，在一个领域深入发展。"},"read":{"cz":10,"long":5},"ls":{"l1":[10],"l3":[0]},"cy":[20,21]},{"title":"尽管…却 · 产品介绍","grammar":[{"title":"尽管……，（但是）……却……","base":"尽管 + 事实，但/却 + 相反的结果　—— mặc dù … nhưng …","ex":["尽管价格不便宜，这款手机却卖得非常好。","尽管他已经很累了，但还是坚持把工作做完。"]},{"title":"……固然……，但（是）……","base":"A 固然 + 优点，但 + 更重要的是 B　—— A đúng là …, nhưng …","ex":["速度固然重要，但质量更重要。","学历固然重要，但能力才是关键。"]}],"ex":[{"a":"尽管下着大雨，他却准时到了。","c":["尽管","下着","大雨，","他","却","准时","到了"]},{"a":"钱固然重要，但健康更重要。","c":["钱","固然","重要，","但","健康","更","重要"]},{"a":"尽管工作很辛苦，她却从来不抱怨。","c":["尽管","工作","很","辛苦，","她","却","从来","不","抱怨"]},{"a":"这个方案固然好，但是成本太高了。","c":["这个","方案","固然","好，","但是","成本","太高了"]},{"a":"尽管失败了很多次，他也没有放弃。","c":["尽管","失败了","很多次，","他","也","没有","放弃"]},{"a":"经验固然宝贵，但也要不断学习新知识。","c":["经验","固然","宝贵，","但","也","要","不断","学习","新","知识"]},{"a":"尽管我们做了准备，还是出了问题。","c":["尽管","我们","做了","准备，","还是","出了","问题"]},{"a":"这家店固然有名，但服务不怎么样。","c":["这家","店","固然","有名，","但","服务","不怎么样"]}],"app":{"type":"产品介绍","feat":["介绍产品的名称、用途、主要特点和优势。","最好分条写，每条一个特点，用具体数字更有说服力。","最后写价格、购买方式或注意事项。"],"tpl":"××产品介绍\n……（产品名称）是……（公司）推出的一款……，适用于……。\n主要特点：\n一、……\n二、……\n三、……\n价格/购买方式：……\n注意事项：……","ph":[["特点",["体积小、重量轻","操作简单，一键……","采用……技术","续航时间长达……小时"]],["优势",["与同类产品相比，……","性价比高","售后服务完善，保修……年"]]],"model":"“小绿”智能保温杯产品介绍\n“小绿”智能保温杯是绿洲生活用品公司推出的一款新产品，适合上班族、学生和喜欢户外运动的人使用。\n主要特点：\n一、保温效果好。杯子采用双层不锈钢真空设计，装入热水后，十二小时内水温仍能保持在六十度以上。\n二、智能显示温度。杯盖上有一个小屏幕，轻轻一按就能看到水温，避免喝到太烫的水。\n三、轻便好携带。容量五百毫升，重量只有三百克，可以放进普通的背包里。\n四、安全环保。所有材料都通过了食品安全检测，可以长期重复使用，减少塑料瓶的浪费。\n价格：每个三十五万越南盾，在各大超市和网上商城均有销售。\n注意事项：杯子不能放进微波炉，清洗时不要用硬刷子刷屏幕。","prac":"请为你们公司（或你熟悉的一种产品）写一段产品介绍，包括用途、特点和价格。不少于150字。","ref":"“安心”家用空气净化器产品介绍\n“安心”家用空气净化器是清风电器公司推出的一款新产品，适合在卧室、客厅和办公室使用，面积在三十平方米以内的房间效果最好。\n主要特点：\n一、净化能力强。采用三层过滤技术，能有效去除空气中的灰尘、花粉和异味，三十分钟就能让房间的空气变得清新。\n二、安静节能。睡眠模式下声音很小，不会影响休息；每天运行八小时，一个月只用十度电左右。\n三、操作方便。可以用手机远程控制，屏幕上随时显示室内空气质量。\n价格：每台三百五十万越南盾，购买后提供两年免费保修，滤网每半年更换一次。\n注意事项：请不要把净化器放在潮湿的地方，使用时注意关好门窗。"},"essay":{"title":"话题类型③：教育与学习","feat":["常见问题：网课和面授哪个好？考试成绩重要吗？孩子要不要上补习班？","可以从学生、家长、老师、社会几个角度分析。","建议型结尾：家长应该……，学校应该……，学生自己应该……。"],"tpl":"【开头】在……问题上，……。我认为……。\n【角度一】从学生的角度来看，……。\n【角度二】从……的角度来看，……。\n【建议】因此，……应该……；……也应该……。\n【结尾】……。","ph":[["教育相关",["因材施教","全面发展","应试教育","培养能力","兴趣是最好的老师","寓教于乐"]],["多角度",["从……的角度来看","对……而言","站在……的立场上"]]],"model":{"topic":"网上学习能代替课堂学习吗？","text":"近几年，网上学习越来越普遍，很多人认为将来网课可以代替课堂。我认为，网上学习是课堂学习很好的补充，但还不能完全代替它。\n从学习者的角度来看，网上学习确实有很多优点。时间和地点很自由，下班以后在家里也能学习；还可以反复观看视频，不懂的地方多听几遍。我自己就是通过网课准备HSK考试的，节省了很多来回路上的时间。\n然而，从学习效果的角度来看，课堂学习仍有不可替代的作用。在课堂上，老师能看到学生的表情，及时发现问题；同学之间可以讨论、合作，学习的氛围也更好。而上网课时，很多人一边听课一边看手机，注意力很难集中，有的人报了课程却一直没有上完。\n此外，对于小孩子来说，学校不仅是学知识的地方，也是学习与人相处的地方，这一点网课更是无法做到的。\n因此，最好的方式是把两者结合起来：用网课预习和复习，在课堂上讨论和练习。这样既能发挥网络的优势，又能保证学习的效果。"},"prac":"有人认为“考试成绩不能代表一个人的能力”。你同意吗？不少于300字。","ref":"在学校里，考试成绩常常被看作评价学生的最重要标准。但也有人认为，考试成绩不能代表一个人的能力。我基本同意这个观点，但我认为考试也有它的价值。\n首先，考试只能考查一部分能力。一张试卷主要考的是知识和解题技巧，而沟通能力、创造力、团队合作精神等，很难通过考试看出来。我的一位同学在学校时成绩一般，可是他非常善于和人打交道，工作以后成了公司最优秀的销售。\n其次，考试成绩也受到很多偶然因素的影响。有的学生平时学得很好，可是考试那天身体不舒服或者太紧张，就没有发挥好。\n不过，考试并不是没有意义的。从学校和社会的角度来看，考试是一种相对公平、方便的评价方法；从学生的角度来看，考试也能督促自己复习，发现自己的不足。比如，我通过一次次的HSK考试，清楚地知道了自己哪方面还需要提高。\n因此，我们应该正确看待考试成绩，既不能完全忽视它，也不能只用分数来判断一个人。学校和用人单位也应该用更多元的方式来评价人。"},"read":{"cz":11,"sen":5},"ls":{"l1":[11],"l3":[1]},"cy":[22,23]},{"title":"越…越 · 活动通知","grammar":[{"title":"越……越……","base":"A 越……，B 越……；越来越……　—— càng … càng …","ex":["中文学得越多，越觉得有意思。","这座城市的变化越来越大。"]},{"title":"日益 / 逐渐","base":"日益 + 形容词/动词（văn viết）；逐渐 + 动词　—— ngày càng; dần dần","ex":["两国之间的贸易往来日益密切。","新员工逐渐熟悉了工作流程。"]}],"ex":[{"a":"天气越来越冷了。","c":["天气","越来越","冷了"]},{"a":"你越紧张，就越容易出错。","c":["你","越","紧张，","就","越","容易","出错"]},{"a":"环境问题日益严重。","c":["环境","问题","日益","严重"]},{"a":"他们的关系逐渐好了起来。","c":["他们的","关系","逐渐","好了","起来"]},{"a":"雨越下越大，我们只好回家了。","c":["雨","越","下","越","大，","我们","只好","回家了"]},{"a":"人们对健康的要求日益提高。","c":["人们","对","健康的","要求","日益","提高"]},{"a":"产品越受欢迎，竞争就越激烈。","c":["产品","越","受欢迎，","竞争","就","越","激烈"]},{"a":"她逐渐习惯了一个人生活。","c":["她","逐渐","习惯了","一个人","生活"]}],"app":{"type":"活动报名通知","feat":["说明活动的名称、目的、时间、地点、参加对象。","写清楚报名方式和截止时间。","可以加上活动的亮点和奖励，吸引大家参加。"],"tpl":"关于举办……的通知\n各位……：\n为了……，……决定举办……。具体安排如下：\n一、活动时间：……\n二、活动地点：……\n三、参加对象：……\n四、活动内容：……\n五、报名方式：请于×月×日前……\n欢迎大家积极报名参加！\n……\n××年×月×日","ph":[["目的",["为了丰富员工的业余生活","为了增进同事之间的交流","为了提高大家的……能力"]],["报名",["请于……前报名","名额有限，报满为止","报名请联系……"]],["鼓励",["欢迎大家积极参加","届时将评出……并颁发奖品"]]],"model":"关于举办第一届员工中文演讲比赛的通知\n各位同事：\n为了提高大家学习中文的兴趣，增进中越员工之间的交流，公司工会决定举办第一届员工中文演讲比赛。具体安排如下：\n一、比赛时间：2027年1月15日（星期五）下午三点。\n二、比赛地点：公司二楼培训室。\n三、参加对象：全体越南籍员工，不限中文水平。\n四、比赛内容：以“我和我的工作”为题，进行三至五分钟的中文演讲。比赛将评出一等奖一名、二等奖两名、三等奖三名，并颁发奖金和证书。\n五、报名方式：请于1月8日前向本部门主管报名，或在Lark上联系工会小李。\n欢迎大家积极报名参加！\n公司工会\n2026年12月25日","prac":"公司要组织员工周末去海边旅游，请写一则活动报名通知。不少于150字。","ref":"关于组织员工头顿一日游的通知\n各位同事：\n为了感谢大家一年来的辛勤工作，让大家在紧张的工作之余放松身心，公司决定组织全体员工去头顿海边一日游。具体安排如下：\n一、活动时间：2027年1月10日（星期日），早上六点半出发，晚上七点左右返回。\n二、集合地点：公司正门口，统一乘坐大巴车前往。\n三、参加对象：公司全体员工，每人可以带一名家属。\n四、活动内容：上午游泳、沙滩排球比赛，中午吃海鲜大餐，下午自由活动。费用全部由公司承担。\n五、报名方式：请于1月5日前在Lark群里接龙报名，注明是否带家属。\n请大家带好泳衣、防晒霜和身份证。欢迎大家积极报名！\n行政部\n2026年12月26日"},"essay":{"title":"话题类型④：环境与城市","feat":["常见问题：环保靠政府还是靠个人？城市化的利与弊？垃圾分类？","写环保话题容易空洞，一定要有具体的做法和例子。","结尾常从“个人—企业—政府”三个层面提出建议。"],"tpl":"【开头】近年来，……问题日益严重。……。我认为，……。\n【个人】对个人而言，……。\n【企业】对企业而言，……。\n【政府】对政府而言，……。\n【结尾】……需要全社会的共同努力。……","ph":[["环境相关",["节约资源","绿色出行","垃圾分类","低碳生活","可持续发展","生态环境"]],["层面",["对个人而言","企业应该承担社会责任","政府应该加强管理和宣传"]]],"model":{"topic":"保护环境，主要靠政府还是靠个人？","text":"近年来，环境问题日益严重，空气污染、水污染、垃圾围城等问题引起了人们的广泛关注。有人认为保护环境主要是政府的事，也有人认为要靠每个人自觉。我认为，保护环境需要政府和个人共同努力，缺一不可。\n对政府而言，制定规则和提供条件是最重要的。比如，政府可以制定法律，严格管理排放污染的工厂；可以修建更多的地铁和公交线路，鼓励市民绿色出行；还可以在小区里设置分类垃圾桶，让垃圾分类变得方便易行。\n对个人而言，每个人的日常习惯同样重要。如果大家都随手关灯、少用塑料袋、把垃圾分类投放，汇集起来就是一股巨大的力量。我们小区实行垃圾分类以后，一开始很多人嫌麻烦，但在志愿者的提醒下，大家逐渐养成了习惯，现在小区变得干净多了。\n可见，政府的规则需要个人的配合才能落实，个人的行动也需要政府提供条件才能长久。\n保护环境需要全社会的共同努力。只有政府和每个人都承担起自己的责任，我们才能拥有蓝天白云和绿水青山。"},"prac":"越来越多的人从农村搬到城市生活。请谈谈城市化的好处和问题。不少于300字。","ref":"近几十年来，越来越多的人从农村来到城市工作和生活，城市化的速度越来越快。我认为，城市化给人们带来了更多的机会，但也带来了一些需要解决的问题。\n首先，城市化让人们有了更好的发展机会。城市里工厂多、公司多，工作机会也多；医院、学校等公共服务也比农村好得多。很多农村的年轻人来到城市以后，不但收入提高了，孩子也能接受更好的教育。\n然而，城市化也带来了不少问题。城市人口越来越多，房价越来越高，交通越来越堵，环境污染也越来越严重。与此同时，农村的年轻人大量外出，留下的大多是老人和孩子，有的村子变得越来越冷清。\n对政府而言，应该合理规划城市，多建公共住房和公共交通；同时也要发展农村经济，让年轻人在家乡附近也能找到好工作。对个人而言，来到城市后要不断学习技能，适应城市生活，也不要忘了常回家看看。\n总之，城市化是社会发展的趋势，只有处理好城市和农村的关系，才能让每个人都过上更好的生活。"},"read":{"cz":12,"long":6},"ls":{"l1":[12],"l3":[2]},"cy":[24,25]},{"title":"非但不…反而 · 申请书","grammar":[{"title":"非但不/没……，反而……","base":"非但不 A，反而 B　—— chẳng những không A mà ngược lại còn B","ex":["他非但没有生气，反而笑了起来。","吃药以后，病非但没好，反而更严重了。"]},{"title":"反倒 / 反而","base":"……，反倒/反而 + 与预期相反的结果　—— ngược lại","ex":["休息了一天，反倒觉得更累了。","便宜的东西有时候反而更贵。"]}],"ex":[{"a":"他非但不感谢我，反而怪我。","c":["他","非但","不","感谢","我，","反而","怪","我"]},{"a":"雨非但没停，反而越下越大。","c":["雨","非但","没","停，","反而","越下越大"]},{"a":"省钱买了便宜货，反而多花了钱。","c":["省钱","买了","便宜货，","反而","多","花了","钱"]},{"a":"批评他以后，他非但没改，反而更不认真了。","c":["批评","他","以后，","他","非但","没","改，","反而","更","不","认真了"]},{"a":"人多了，效率反倒低了。","c":["人","多了，","效率","反倒","低了"]},{"a":"我想帮他，结果反而给他添了麻烦。","c":["我","想","帮","他，","结果","反而","给","他","添了","麻烦"]},{"a":"价格降了以后，销量非但没增加，反而减少了。","c":["价格","降了","以后，","销量","非但","没","增加，","反而","减少了"]},{"a":"越着急反而越容易出错。","c":["越","着急","反而","越","容易","出错"]}],"app":{"type":"申请书","feat":["标题写“……申请书”，开头写给谁。","说明申请的事情和理由，理由要充分、具体。","结尾写“特此申请，请批准”，再写申请人和日期。"],"tpl":"……申请书\n尊敬的……：\n我是……，于……年进入……工作/学习。\n现申请……。理由如下：\n一、……\n二、……\n……（承诺）\n特此申请，恳请批准！\n申请人：……\n××年×月×日","ph":[["开头",["我是……部门的……","本人于……年……入职"]],["理由",["理由如下","工作期间，我……","为了……，我希望……"]],["承诺与结尾",["如果申请获得批准，我将……","特此申请，恳请批准"]]],"model":"转岗申请书\n尊敬的人事部领导：\n我是生产部的质检员阮文安，于2024年3月进入公司工作，至今已近三年。\n现申请从生产部质检岗位调到采购部，担任采购助理一职。理由如下：\n一、我在大学学的是国际贸易专业，对采购和供应链管理很感兴趣，也有相关的专业知识。\n二、近两年来，我坚持学习中文，已经通过了HSK五级，能用中文和中国供应商进行基本的沟通。\n三、三年的质检工作让我熟悉了公司各类原材料和零件的质量标准，这对采购工作会有很大的帮助。\n如果申请获得批准，我一定尽快熟悉新岗位的工作，并做好质检岗位的工作交接，不影响生产部的正常工作。\n特此申请，恳请批准！\n申请人：阮文安\n2026年12月26日","prac":"你想申请公司的中文培训课程（公司负担学费）。请写一份申请书。不少于150字。","ref":"培训申请书\n尊敬的总经理：\n我是行政部的员工黄氏兰，于2025年5月入职，主要负责员工档案、工资和社会保险等工作。\n现申请参加公司组织的中级中文培训课程。理由如下：\n一、公司的管理人员大多是中国同事，很多文件和会议都使用中文。目前我的中文只有HSK四级水平，在工作中常常需要同事帮忙翻译，影响了工作效率。\n二、我对学习中文非常有兴趣，每天下班后都会自学一个小时，但是缺少系统的指导。\n三、提高中文水平以后，我可以更好地与中国同事沟通，也能帮助越南员工理解公司的规定。\n如果申请获得批准，我保证按时上课，认真完成作业，并争取在一年内通过HSK六级考试。\n特此申请，恳请批准！\n申请人：黄氏兰\n2026年12月27日"},"essay":{"title":"话题类型⑤：社会现象","feat":["常见问题：人口老龄化、“躺平”、网红经济、外卖、共享经济等。","结构：描述现象 → 分析原因 → 说明影响 → 表明态度和建议。","描述现象时可以用“越来越多的……”“……的现象十分普遍”。"],"tpl":"【现象】如今，……的现象越来越普遍。\n【原因】这种现象的出现，……。\n【影响】它一方面……，另一方面……。\n【态度】在我看来，……。\n【建议】……","ph":[["描述现象",["……的现象十分普遍","越来越多的人选择……","……成了一种新的潮流"]],["态度",["我们应该理性看待……","不能一概而论","既不要……，也不要……"]]],"model":{"topic":"你怎么看待“人口老龄化”问题？","text":"如今，人口老龄化已经成为很多国家面临的共同问题。在越南，六十岁以上的老人也越来越多。\n这种现象的出现，一方面是因为医疗水平提高了，人们的寿命越来越长；另一方面，年轻人生孩子越来越少，新出生的人口在减少。\n老龄化给社会带来了不少挑战。从家庭来看，很多年轻人既要工作，又要照顾父母和孩子，压力非常大；从社会来看，劳动力会越来越少，养老和医疗的费用会越来越高。\n在我看来，老龄化并不完全是坏事，它说明社会在进步，人们的生活质量提高了。关键是要提前做好准备。政府应该完善养老制度，多建设社区养老中心，让老人在家门口就能得到照顾；企业可以为身体健康、有经验的老人提供合适的工作机会；作为子女，我们也应该多陪伴父母，关心他们的身心健康。\n总之，我们应该积极面对老龄化，让每一位老人都能安享晚年。"},"prac":"现在很多年轻人选择“躺平”，不想努力工作。你怎么看待这种现象？不少于300字。","ref":"如今，“躺平”这个词在年轻人中十分流行。它指的是一些年轻人不想再拼命工作，只想过简单、低欲望的生活。\n这种现象的出现，主要有以下原因。一方面，年轻人面临的竞争越来越激烈，房价高、工作压力大，很多人努力了很久却看不到希望，于是选择放弃。另一方面，年轻人的价值观也在变化，他们不愿意为了金钱牺牲健康和生活。\n“躺平”有它合理的地方。它提醒我们，人生不只有工作，休息和快乐同样重要。但是，如果长期“躺平”，完全放弃努力，人就会失去成长的机会，生活也会变得越来越困难。\n在我看来，我们应该理性看待“躺平”。累了的时候，可以给自己放个假，调整一下心态；但休息之后，还是要找到自己的目标，继续前进。社会也应该为年轻人创造更公平的发展环境，减轻他们的压力，让他们看到努力的意义。\n总之，适当地“躺一躺”没有问题，但不能一直“躺”下去。"},"read":{"cz":13,"sen":6},"ls":{"l1":[13],"l3":[3]},"cy":[26,27]},{"title":"无论…都 · 祝贺信 · 总复习","grammar":[{"title":"无论/不管……，都/也……","base":"无论 + 疑问词/A还是B，都 + 结果不变　—— bất kể … đều …","ex":["无论遇到什么困难，我们都不能放弃。","不管刮风还是下雨，他都坚持跑步。"]},{"title":"不论……，总……","base":"不论 + 条件，总（是）……　—— dù … vẫn luôn …","ex":["不论多晚回家，妈妈总会给我留一盏灯。","不论工作多忙，她总是笑着面对每一位客户。"]}],"ex":[{"a":"无论你去哪儿，都要注意安全。","c":["无论","你","去","哪儿，","都","要","注意","安全"]},{"a":"不管多贵，我都要买。","c":["不管","多","贵，","我","都","要","买"]},{"a":"无论结果怎么样，我们都尽力了。","c":["无论","结果","怎么样，","我们","都","尽力了"]},{"a":"不论是谁，都必须遵守公司的规定。","c":["不论","是","谁，","都","必须","遵守","公司的","规定"]},{"a":"不管你同意不同意，我都要试一试。","c":["不管","你","同意","不","同意，","我","都","要","试","一试"]},{"a":"无论学什么，都要有耐心。","c":["无论","学","什么，","都","要","有","耐心"]},{"a":"不论什么时候，他总是第一个到公司。","c":["不论","什么","时候，","他","总是","第一个","到","公司"]},{"a":"不管工作多累，她都坚持学习中文。","c":["不管","工作","多","累，","她","都","坚持","学习","中文"]}],"app":{"type":"祝贺信","feat":["写给获得成绩、升职、开业、结婚等的人或单位。","具体写出对方取得的成绩，表达真诚的祝贺。","结尾表达良好的祝愿和希望继续合作/联系。"],"tpl":"贺　信\n尊敬的/亲爱的……：\n欣闻……（对方的喜事），我谨代表……向……表示热烈的祝贺！\n……（对方的努力和成绩）\n……（对未来的祝愿）\n祝……！\n……\n××年×月×日","ph":[["祝贺",["欣闻……","谨向您表示热烈的祝贺","可喜可贺"]],["肯定",["这是您多年努力的结果","这一成绩来之不易"]],["祝愿",["祝贵公司生意兴隆、事业蒸蒸日上","祝您在新的岗位上取得更大的成绩"]]],"model":"贺　信\n尊敬的陈总：\n欣闻贵公司在平阳省新建的第二工厂正式投产，我谨代表康达科技（越南）有限公司全体员工，向您和贵公司表示热烈的祝贺！\n五年前，贵公司在越南只有一个小车间和三十多名员工；今天，贵公司已经拥有两座现代化工厂，员工人数超过八百人，产品远销欧美多个国家。这一成绩来之不易，是您和全体员工多年来辛勤努力的结果。\n作为贵公司的长期合作伙伴，我们为你们取得的成绩感到由衷的高兴，也期待双方在今后的合作中更进一步，共同发展。\n祝贵公司生意兴隆，事业蒸蒸日上！\n康达科技（越南）有限公司\n总经理　王海\n2026年12月28日","prac":"你的好朋友通过了HSK六级考试，还找到了一份很好的翻译工作。请给他/她写一封祝贺信。不少于150字。","ref":"亲爱的阿美：\n听说你不但以二百六十分的好成绩通过了HSK六级考试，还被一家中资企业录用为翻译，我真为你高兴，在这里向你表示最热烈的祝贺！\n我知道，这个好成绩来之不易。这两年，你每天下班后都坚持学习两个小时，周末别人去玩的时候，你在家里背单词、写作文、做模拟题。有好几次你考得不理想，都想放弃了，可是第二天又重新拿起了书本。正是因为你的坚持，才有了今天的收获。\n新的工作一定会有新的挑战，但我相信，以你的努力和认真，一定能做得非常出色。等你有空的时候，我们一起吃个饭，好好庆祝一下吧！\n祝你工作顺利，天天开心！\n你的好朋友：小兰\n2026年12月28日"},"essay":{"title":"总复习：议论文的检查清单","feat":["写完后用2分钟检查：① 开头有没有明确的观点？② 每段第一句是不是中心句？③ 每个理由有没有例子？","④ 有没有用到让步（诚然……但是……）让文章更全面？⑤ 结尾有没有总结并提出建议？","⑥ 字数是否超过300字？⑦ 有没有错别字和漏掉的标点？"],"tpl":"【开头】话题 + 不同看法 + 我的观点\n【理由一】中心句 + 例子\n【理由二】中心句 + 例子/对比\n【让步】诚然……，但是……\n【结尾】总之 + 观点 + 建议/希望","ph":[["高分表达",["不可否认","由此可见","归根结底","与其说……，不如说……","之所以……，是因为……","只有……，才能……"]],["衔接",["与此同时","除此之外","换句话说","正因为如此"]]],"model":{"topic":"成功的关键是天赋还是努力？","text":"什么是成功的关键？有人认为是天赋，也有人认为是努力。我认为，天赋固然重要，但努力才是成功最关键的因素。\n诚然，天赋会让一些人在某些方面起步更早、进步更快。比如，有的人天生乐感好，学音乐比别人容易；有的人记忆力强，学外语进步很快。不可否认，这些都是成功的有利条件。\n但是，天赋只是起点，努力决定终点。很多有天赋的人，因为不肯努力，最后一事无成；而很多看起来普通的人，凭着几十年如一日的坚持，取得了让人佩服的成就。我们公司的一位老技师，只有初中学历，却通过二十多年的学习和积累，成了全厂技术最好的人，连外国专家都向他请教。\n此外，现代社会的大部分工作并不需要特殊的天赋，需要的是认真、负责和不断学习的态度。对普通人来说，努力是唯一可以由自己掌握的东西。\n由此可见，与其羡慕别人的天赋，不如把精力放在自己的努力上。只有坚持不懈地付出，我们才能一步一步走向成功。"},"prac":"你认为“细节决定成败”这句话有道理吗？不少于300字。","ref":"人们常说“细节决定成败”，意思是一件事能不能成功，往往取决于小小的细节。我非常赞同这个观点，尤其是在工作中。\n首先，很多大问题都是由小细节引起的。在工厂里，一个零件的尺寸差了零点一毫米，可能就会让整批产品不合格；在财务工作中，一个数字写错，可能就会给公司带来很大的损失。我刚工作的时候，就因为在报关单上写错了一个字母，导致货物在海关多停了三天。\n其次，注重细节能赢得别人的信任。客户在选择合作伙伴时，往往会通过一些小事来判断对方是否可靠，比如回复邮件是否及时、文件是否整齐、承诺的时间是否做到。\n诚然，只注意细节而忘了大方向也是不行的。一个人如果把所有时间都花在小事上，就可能看不到更重要的目标。但是，在方向正确的前提下，细节往往决定了最后的结果。\n总之，细节虽小，影响却很大。我们在工作和生活中都应该养成认真细致的习惯，把每一件小事做好，这样才能把大事做成。"},"read":{"cz":14,"long":7},"ls":{"l1":[14],"l3":[4]},"cy":[28,29]}],"mk":[{"ap":"你所在的公司要举办年终晚会，需要员工准备节目。请你以工会的名义写一则通知。不少于150字。","apr":"通　知\n各位同事：\n一年的工作即将结束，为了感谢大家的辛勤付出，丰富员工的业余生活，公司决定于2027年1月22日（星期五）晚上六点在公司餐厅举办年终晚会。现将有关事项通知如下：\n一、每个部门至少准备一个节目，形式不限，唱歌、跳舞、小品、乐器表演都可以，每个节目时间不超过五分钟。\n二、请各部门于1月10日前把节目名称和表演人员名单报给工会。\n三、晚会将评选“最佳节目奖”和“最佳人气奖”，并设有抽奖环节，奖品丰富。\n希望大家积极参与，共同度过一个快乐的夜晚！\n公司工会\n2026年12月28日","es":"有人说“只要努力就一定能成功”。你同意这种说法吗？不少于300字。","esr":"有人说“只要努力就一定能成功”。我认为，努力是成功必不可少的条件，但只有努力还不够，还需要正确的方向和方法。\n首先，没有努力就不可能成功。不管是学习一门外语，还是做好一份工作，都需要长时间的付出。我身边通过HSK六级考试的朋友，没有一个不是每天坚持学习的。\n但是，努力的方向错了，再努力也很难成功。比如，有的人学中文只背单词，从来不开口说，学了几年还是不能和中国人交流。这不是不努力，而是方法不对。\n此外，成功还需要一些客观条件，比如机会、环境、身体状况等。有的人非常努力，却因为生病或者家庭原因，暂时没有取得理想的结果。我们不能因此说他们不够努力。\n所以说，努力不等于成功，但成功一定需要努力。我们应该在努力的同时，不断思考自己的方向和方法是否正确，及时调整。这样，努力才能真正带来收获。\n总之，与其相信“只要努力就一定成功”，不如说“聪明地努力，成功的可能性就会更大”。"},{"ap":"你要搬家了，有一些家具想便宜卖掉。请写一则转让信息。不少于150字。","apr":"家具转让\n本人因下个月要搬到河内工作，现将家里的一些家具和电器低价转让，均为八成新，适合刚租房的上班族和学生。\n具体物品如下：\n一、双人床一张（含床垫），一米五宽，原价六百万越南盾，现价两百万。\n二、白色衣柜一个，两门，原价三百万，现价一百万。\n三、书桌和椅子一套，现价八十万。\n四、小冰箱一台，一百二十升，用了一年，制冷效果很好，现价一百五十万。\n所有物品可以单独购买，全部买走可以再优惠。买家需要自己搬运，我可以帮忙联系搬家公司。\n看货地址：平阳省土龙木市阳光公寓5栋802室。\n联系电话：0909-555-777（阿明），晚上七点以后或周末可看货。","es":"有人认为孩子应该尽早学习使用电子产品，你怎么看？不少于300字。","esr":"现在，很多孩子两三岁就开始玩手机、平板电脑。有人认为，孩子应该尽早学习使用电子产品，这样才能适应未来的社会。我认为，孩子可以接触电子产品，但不宜过早，更不能过多。\n诚然，电子产品是现代生活中不可缺少的工具。适当使用，能让孩子学到很多知识，比如通过动画片学习英语、通过小游戏认识数字。将来他们学习和工作也离不开电脑，早一点儿接触确实有好处。\n但是，年龄太小的孩子长时间看屏幕，对视力伤害很大。我朋友的孩子才六岁，就已经戴上了眼镜。此外，电子产品里的游戏和视频很容易让人上瘾，孩子一旦习惯了快速的刺激，就很难坐下来读书、画画，也不愿意出去和小朋友玩。\n更重要的是，孩子小时候最需要的是和父母的交流、和大自然的接触。这些是任何电子产品都替代不了的。\n因此，我建议父母控制孩子使用电子产品的时间，比如三岁以前尽量不让孩子玩，上学以后每天不超过一个小时，而且父母最好陪在旁边。只有这样，电子产品才能成为孩子成长的帮手。"},{"ap":"你们公司新建了员工健身房，请写一则开放通知，说明开放时间、使用规定等。不少于150字。","apr":"关于员工健身房开放的通知\n各位同事：\n为了丰富大家的业余生活，帮助大家保持健康的身体，公司在宿舍楼一楼新建了员工健身房，将于2027年1月4日起正式开放。现将有关事项通知如下：\n一、开放时间：每天早上六点至八点，晚上六点至十点，周日全天开放。\n二、健身房内有跑步机、动感单车、哑铃等器材，全体员工可以免费使用。\n三、使用规定：进入健身房请穿运动鞋；使用器材后请放回原处；请不要在健身房内吸烟、吃东西；如发现器材损坏，请及时向行政部报告。\n四、第一次使用前，请到行政部登记，领取门卡。\n希望大家合理安排时间，坚持锻炼！\n行政部\n2026年12月29日","es":"有人说“压力就是动力”，也有人说“压力会把人压垮”。你怎么看？不少于300字。","esr":"关于压力，有人说“压力就是动力”，也有人说“压力会把人压垮”。我认为，压力本身没有好坏，关键在于压力的大小和我们面对压力的态度。\n首先，适当的压力能让人进步。如果没有考试的压力，很多学生可能不会认真复习；如果没有业绩的压力，很多员工可能每天都得过且过。我准备HSK考试的时候，正是因为离考试只剩两个月，才每天逼着自己多做一套题，最后取得了不错的成绩。\n但是，压力太大就会适得其反。长期处在巨大的压力下，人会失眠、焦虑，身体也会出问题。我的一位同事因为连续几个月加班，最后病倒住院，工作反而耽误了更多。\n更重要的是，面对压力的态度会影响结果。同样的压力，有的人把它当作挑战，积极想办法解决；有的人只会抱怨和担心，结果越来越焦虑。\n因此，我们应该学会管理压力：给自己定合理的目标，把大任务分成小任务；压力太大时，要学会休息，找家人朋友聊一聊。这样，压力才能真正变成前进的动力。"},{"ap":"你在网上看到一个中文学习交流活动，想参加。请给主办方写一封报名邮件，介绍自己并说明参加的原因。不少于150字。","apr":"主题：报名参加“中越青年中文交流会”——阮氏梅\n尊敬的主办方：\n您好！我在贵中心的网站上看到了“中越青年中文交流会”的通知，非常希望能够参加。\n我叫阮氏梅，今年二十八岁，在平阳省一家中资企业做人事工作。我学习中文已经四年了，去年通过了HSK五级，正在准备HSK六级考试。\n参加这次活动，主要有两个原因：一是我平时说中文的机会比较少，希望通过交流活动提高口语水平；二是我对中国的传统文化很感兴趣，想认识更多中国朋友，了解他们的生活。如果有需要，我也很愿意帮忙做一些翻译或者组织工作。\n我的联系方式：电话0912-333-444，邮箱mei.nguyen@email.com。\n期待您的回复，谢谢！\n阮氏梅\n2026年12月29日","es":"你认为学习外语最重要的是什么？不少于300字。","esr":"随着国际交流越来越多，很多人都在学习外语。那么，学习外语最重要的是什么？我认为，最重要的是坚持和多用。\n首先，学习外语需要长时间的坚持。语言不是几个月就能学好的，需要每天积累。我学中文的第一年，进步很快；第二年却觉得遇到了“瓶颈”，好像怎么学都没有进步，差点儿就放弃了。后来在老师的鼓励下坚持下来，第三年突然发现自己能看懂中文新闻了。\n其次，学外语一定要多用。很多人背了几千个单词，却不敢开口说。其实，语言是交流的工具，只有在使用中才能真正掌握。我在公司里每天都主动和中国同事用中文聊天，说错了就请他们纠正，口语进步得比在课堂上快多了。\n当然，好的方法和老师也很重要，可以让我们少走弯路。但再好的方法，如果不坚持、不使用，也不会有效果。\n总之，学外语没有捷径。只要每天坚持学一点儿，大胆地用起来，就一定能把外语学好。"},{"ap":"你们小区要举办“二手物品交换”活动，请写一则活动通知。不少于150字。","apr":"“旧物换新主”二手物品交换活动通知\n各位业主：\n为了倡导绿色生活，减少浪费，同时增进邻里之间的交流，阳光花园业主委员会将举办“旧物换新主”二手物品交换活动。具体安排如下：\n一、活动时间：2027年1月16日（星期六）上午八点至十一点。\n二、活动地点：小区中心花园。\n三、可交换物品：书籍、玩具、衣服、小家电、厨房用品等，物品要干净、能正常使用。\n四、活动方式：每户可以带五件以内的物品，现场自由交换；没有换出去的物品，可以捐给附近的福利院。\n五、报名方式：请于1月12日前到物业服务中心登记，或在业主群里报名。\n欢迎大家带着孩子一起参加！\n阳光花园业主委员会\n2026年12月30日","es":"现在很多人喜欢“超前消费”，比如用信用卡、分期付款买东西。你怎么看？不少于300字。","esr":"现在，信用卡和各种分期付款越来越普遍，很多年轻人喜欢“超前消费”，先用以后的钱买现在想要的东西。我认为，适度的超前消费可以接受，但一定要量力而行。\n一方面，超前消费有它的好处。比如，刚工作的年轻人需要一台电脑工作，一次付清有困难，通过分期付款就可以马上买到，提高工作效率。买房贷款也是一种超前消费，让很多人提前实现了拥有自己房子的梦想。\n另一方面，如果不加控制，超前消费会带来很大的风险。有的人看到喜欢的东西就买，一个月的工资还不够还信用卡；有的人同时在好几个平台借钱，最后欠下了自己根本还不起的债，生活陷入困境。\n在我看来，消费最重要的是理性。买东西之前，应该问问自己：这是真正需要的，还是只是想要？以后的收入能不能按时还款？如果答案是肯定的，适当地超前消费没有问题；如果不能确定，宁可等一等，也不要冲动。\n总之，钱要花在需要的地方。我们应该根据自己的收入合理安排消费，做金钱的主人。"},{"ap":"你的同事要离职了，请你以部门的名义给他写一封感谢信。不少于150字。","apr":"感谢信\n亲爱的老张：\n得知您下个月就要回国了，我们采购部的每一位同事都非常舍不得。在这里，我们想对您说一声：谢谢！\n三年前，采购部刚成立，什么制度都没有。是您带着我们一点一点地建立了供应商档案，制定了采购流程。您总说：“每一分钱都是公司的钱，要花得明明白白。”这句话，我们会一直记在心里。\n工作之余，您还耐心地教我们中文，带我们吃中国菜，过中国的春节。在我们心里，您不仅是一位好领导，也是一位好朋友。\n希望您回国以后一切顺利，有机会一定要回越南看看我们！\n祝您身体健康，万事如意！\n采购部全体同事\n2026年12月30日","es":"有人认为“老人应该和子女住在一起”，也有人认为“老人应该独立生活”。你怎么看？不少于300字。","esr":"关于老人是否应该和子女住在一起，人们有不同的看法。我认为，这个问题没有统一的答案，应该根据老人的身体状况和双方的意愿来决定。\n和子女住在一起，有很多好处。老人如果身体不好，子女可以随时照顾；老人也可以帮忙照看孙子孙女，一家人热热闹闹的，老人不会感到孤单。在越南，很多家庭至今还保留着三代同堂的传统。\n但是，住在一起也容易产生矛盾。两代人的生活习惯和观念不同，比如作息时间、教育孩子的方法、花钱的方式等，时间长了难免会有摩擦。有的老人觉得在子女家里不自由，反而不开心。\n独立生活的老人，可以按照自己的方式安排时间，参加社区活动，和老朋友聚会，生活更加自由。但如果身体出了问题，身边没有人照顾，就会比较危险。\n因此，我认为身体健康的老人可以选择独立生活，但最好住得离子女近一些，子女要经常回去看看；身体不好的老人，最好和子女住在一起，或者选择专业的养老机构。不管哪种方式，最重要的是让老人生活得舒心、安心。"},{"ap":"你在一家酒店住了三天，服务非常好。请给酒店经理写一封表扬信。不少于150字。","apr":"表扬信\n尊敬的海景酒店经理：\n您好！我是上周在贵酒店入住的客人陈明，房间号1206。这次入住给我留下了非常深刻的印象，特意写信表扬贵酒店的员工。\n入住第一天晚上，我突然发烧，打电话到前台求助。值班的阿兰小姐不仅马上给我送来了药和热水，还帮我联系了附近的医院，第二天早上又打电话问我身体怎么样了。此外，客房服务员每天都把房间打扫得非常干净，餐厅的服务员也总是笑着为客人服务。\n出门在外，能遇到这么热情、细心的服务，让我感到非常温暖。在此，我向贵酒店的全体员工，特别是阿兰小姐，表示衷心的感谢！以后来头顿，我一定还会选择贵酒店。\n祝贵酒店生意兴隆！\n客人：陈明\n2026年12月31日","es":"你认为现代人应该怎样平衡工作和家庭？不少于300字。","esr":"在现代社会，很多人每天忙于工作，回到家已经很晚了，陪伴家人的时间越来越少。怎样平衡工作和家庭，成了很多人关心的问题。我认为，关键在于合理安排时间，并且分清主次。\n首先，要提高工作效率，尽量不把工作带回家。很多加班其实是因为白天的时间没有安排好。如果上班时集中精力，把重要的事情先做完，就能按时下班，把晚上的时间留给家人。\n其次，要重视和家人在一起的质量，而不只是时间。即使每天只有一个小时陪孩子，只要放下手机，认真地听他说话，陪他读一本书，孩子也能感受到父母的爱。\n此外，家庭成员之间要互相理解和分担。夫妻两个人都工作，家务就应该一起做；工作特别忙的时候，要提前和家人沟通，请他们理解。\n当然，有时候工作和家庭难免会冲突，比如项目紧急的时候必须加班。这时候，可以在忙完以后多抽些时间补偿家人。\n总之，工作是为了让家人生活得更好，不能因为工作而失去家庭。只要用心安排，工作和家庭是可以兼顾的。"},{"ap":"你们公司要引进一批新设备，请写一份采购申请，说明原因、设备数量和预算。不少于150字。","apr":"关于购买新型检测设备的申请\n尊敬的总经理：\n为了提高产品质量检测的效率和准确度，质检部申请购买新型三维测量仪两台。原因如下：\n一、目前公司使用的两台测量仪已经用了五年，精度下降，最近一个月出现了三次测量误差，差点儿导致不合格产品出厂。\n二、随着订单量增加，现有设备每天要连续工作十六个小时，检测速度跟不上生产速度，常常影响出货时间。\n三、新型测量仪可以自动生成检测报告，检测速度比现在快一倍，还能减少人工记录的错误。\n预算：每台约八亿越南盾，两台共计十六亿越南盾（含安装和培训费用）。我们已经比较了三家供应商的报价，详细资料见附件。\n以上申请，请审批。\n质检部\n2027年1月4日","es":"有人说“细节决定成败”，也有人说“大方向比细节更重要”。你怎么看？不少于300字。","esr":"有人说“细节决定成败”，也有人说“大方向比细节更重要”。我认为，大方向和细节都很重要，二者缺一不可，但先后顺序要分清：先定方向，再抓细节。\n首先，方向决定了努力有没有意义。如果方向错了，细节做得再好，也只是在错误的路上越走越远。比如，一家公司如果没有看清市场的变化，继续生产没人需要的产品，那么生产过程管理得再细致，也很难成功。\n其次，方向确定以后，细节就决定了结果。同样的计划，有的人做得很成功，有的人却失败了，差别往往就在细节上。在我们工厂，一个零件差了零点一毫米，就可能让整批产品被退货。\n此外，不同的岗位对两者的要求也不同。管理者更需要看清大方向，制定正确的战略；而一线员工更需要做好每一个细节，把计划落到实处。\n所以，与其争论哪个更重要，不如把二者结合起来。方向是灯塔，细节是脚下的路。只有看清方向，再走好每一步，才能真正到达目的地。"},{"ap":"你想请邻居帮忙在你出差期间照顾你的猫。请写一张留言条，说明需要做的事情。不少于150字。","apr":"李阿姨：\n您好！我下周一要去河内出差五天，周五晚上才能回来。家里的小猫“团团”没人照顾，想麻烦您帮忙照看一下，真不好意思。\n需要做的事情如下：\n一、每天早上和晚上各喂一次猫粮，每次一小碗就够了，猫粮放在厨房左边的柜子里。\n二、每天换一次干净的水。\n三、每两天清理一次猫砂盆，新的猫砂在阳台上。\n“团团”很乖，不咬人，但是有点儿怕生，如果它躲在床底下不出来，您不用管它，饭放在那儿它自己会吃。\n家里的钥匙我放在您家门口的信箱里了。如果有什么问题，可以随时给我打电话：0909-111-222。\n等我回来，给您带河内的特产！非常感谢您！\n小梅\n1月5日","es":"现在越来越多的人养宠物。你认为养宠物有什么好处和问题？不少于300字。","esr":"现在，越来越多的家庭开始养宠物，猫和狗已经成了很多人生活中的重要伙伴。我认为，养宠物有很多好处，但也需要主人承担起相应的责任。\n首先，宠物能给人带来快乐和陪伴。工作一天回到家，看到小狗跑过来迎接自己，所有的疲惫都没有了。对于独居的老人来说，宠物更像是家人，能减少他们的孤独感。\n其次，养宠物还能培养孩子的责任心。孩子在照顾宠物的过程中，学会了关心别的生命，也学会了坚持每天喂食、打扫。\n但是，养宠物也带来了一些问题。比如，有的主人遛狗时不牵绳，吓到了路人；有的不清理宠物的粪便，影响了小区的环境；还有的人一时冲动买了宠物，后来嫌麻烦就扔掉，导致街上流浪猫狗越来越多。\n因此，我认为养宠物之前一定要考虑清楚：自己有没有时间、有没有经济能力照顾它。养了以后，要遵守公共规定，不给别人添麻烦。政府也应该加强管理，比如要求给宠物登记、打疫苗。\n总之，宠物是我们的朋友，也是我们的责任。只有做一个负责任的主人，人和宠物才能和谐相处。"},{"ap":"公司食堂要调整开放时间，请写一则通知。不少于150字。","apr":"关于调整员工食堂开放时间的通知\n各位同事：\n由于公司从下个月起实行两班倒的工作制度，为了方便大家用餐，经研究决定，员工食堂的开放时间从2027年2月1日起调整如下：\n一、早餐：早上六点至八点。\n二、午餐：中午十一点至下午一点半，分两批用餐。生产部十一点至十二点，其他部门十二点至一点半。\n三、晚餐：下午五点半至七点。\n四、夜宵：晚上十点至十点半，仅供晚班员工。\n请大家按照规定的时间用餐，避免排队拥挤。用餐后请把餐具放到指定的地方，节约粮食，不要浪费。\n如对食堂的饭菜有意见或建议，欢迎随时向行政部反映。\n行政部\n2027年1月20日","es":"有人说“读书无用”，因为很多学历不高的人也赚了大钱。你怎么看？不少于300字。","esr":"现在有一种说法：“读书无用”，理由是很多学历不高的人也做生意赚了大钱，而一些大学毕业生却找不到好工作。我认为，这种说法是片面的。\n诚然，学历和收入之间并不是完全对应的关系。社会上确实有一些人没上过大学，靠着自己的勤劳和聪明创业成功。也有一些大学生毕业后找不到满意的工作。\n但是，我们不能用个别例子来否定读书的作用。从整体上看，受教育程度越高，就业的机会越多，收入也相对稳定。而且，那些没上过大学却成功的人，大多也是在工作中不断学习、不断读书的人，只是他们的学习不在学校里而已。\n更重要的是，读书的意义不只是为了赚钱。读书能开阔眼界，培养独立思考的能力，让人在面对困难时有更多的办法，在生活中有更多的乐趣。这些价值是无法用金钱来衡量的。\n因此，“读书无用”的说法是不对的。我们应该把读书当作一辈子的事情，不管在学校里还是走上社会，都要坚持学习。"},{"ap":"你们公司要招聘实习生，请写一则招聘信息，发到大学的就业网站上。不少于150字。","apr":"实习生招聘\n明光精密制造有限公司是一家专业生产高尔夫球杆零件的外资企业，位于平阳省BW工业区，现有员工五百多人。现面向在校大学生招聘实习生五名。\n一、实习岗位：采购助理两名、人事助理一名、中文翻译两名。\n二、要求：大三或大四在校学生，专业不限；中文翻译岗位要求HSK五级以上；工作认真，有责任心，能连续实习三个月以上。\n三、待遇：每月实习补贴四百万越南盾；提供免费午餐和班车；表现优秀者毕业后可以优先录用。\n四、实习时间：2027年3月至6月，每周至少工作四天。\n有意者请将简历和学生证照片发送至hr@mingguang.vn，邮件主题请写“实习申请+姓名+岗位”。报名截止日期：2月20日。\n明光公司人事部\n2027年1月25日","es":"你认为大学生毕业后应该先就业还是先创业？不少于300字。","esr":"大学生毕业后，是先找一份工作，还是马上自己创业？这是很多年轻人面临的选择。我认为，对大多数大学生来说，先就业、再创业是更稳妥的选择。\n首先，创业需要经验。一个刚毕业的学生，虽然有热情、有想法，但往往不了解市场，不懂管理，也不知道怎样和客户、供应商打交道。如果先在公司工作几年，就能学到很多书本上学不到的东西，为以后的创业打好基础。\n其次，创业需要资金和人脉。在工作中，我们可以积累一定的资金，也能认识各行各业的人，这些都是创业时非常宝贵的资源。我的一位朋友在一家贸易公司工作了五年，后来自己开公司时，第一批客户都是以前工作中认识的。\n当然，如果有特别好的想法和机会，也有足够的支持，年轻时创业也未尝不可。即使失败了，年轻人也有时间重新开始。\n但是总的来说，创业的成功率并不高。与其冒很大的风险，不如先就业，在工作中积累经验、资金和人脉，等条件成熟了再创业，成功的可能性会大得多。"},{"ap":"你参加了一次公司组织的培训，请写一份简短的培训总结发给经理。不少于150字。","apr":"主题：“高效沟通”培训总结——黄氏兰\n刘经理：\n您好！1月20日至21日，我参加了公司组织的“高效沟通”培训，现将收获总结如下：\n一、学会了“先说结论，再说原因”的汇报方法。以前我向领导汇报工作时常常说很多细节，重点不清楚；以后我会先用一句话说明结果，再解释具体情况。\n二、了解了倾听的重要性。培训老师说，好的沟通者首先是一个好的倾听者。在和员工谈话时，我会多听少说，不急着打断别人。\n三、学习了写工作邮件的技巧，比如主题要清楚、一封邮件只说一件事、重要的内容放在前面。\n这次培训内容很实用，我会把学到的方法用到日常工作中。建议以后可以多组织这样的培训，让更多同事参加。\n人事部　黄氏兰\n2027年1月23日","es":"有人认为“沟通能力比专业能力更重要”。你同意吗？不少于300字。","esr":"在职场中，有人认为沟通能力比专业能力更重要。我认为，专业能力是基础，沟通能力是放大器，二者都很重要，但在不同的阶段作用不同。\n首先，专业能力是立足的根本。一名会计如果算不清账，一名工程师如果修不好机器，沟通能力再好，也很难得到别人的信任。刚开始工作时，我们最需要做的就是把专业知识学扎实，把本职工作做好。\n其次，随着职位的提高，沟通能力会变得越来越重要。普通员工主要和机器、数据打交道，而管理者每天要和上级、下属、客户沟通。一个技术很好但不会沟通的人，可能很难带领团队完成任务。我们公司有一位技术主管，能力很强，但脾气急，经常和员工发生矛盾，后来团队的效率反而下降了。\n此外，沟通能力能让专业能力发挥更大的作用。同样一个好方案，会表达的人能让大家很快理解并支持，不会表达的人可能就被忽视了。\n因此，我们既要不断提高专业能力，也要有意识地锻炼沟通能力。只有二者兼备，才能在职场中走得更远。"},{"ap":"你们部门要组织一次聚餐，请给同事们写一封邀请邮件。不少于150字。","apr":"主题：邀请：财务部新年聚餐（1月30日晚）\n各位同事：\n大家好！新的一年已经开始，回想过去的一年，我们部门顺利完成了年度审计、系统升级等多项重要工作，这离不开每一位同事的努力和配合。为了感谢大家，也为了让大家在新年里有一个轻松愉快的开始，部门决定组织一次新年聚餐。\n时间：1月30日（星期五）晚上六点半。\n地点：土龙木市“老地方”中餐厅二楼包间（公司门口坐车十分钟）。\n费用：由部门经费承担，大家不用带钱，带上好心情就行！\n为了方便预订座位，请于1月27日前回复是否参加，以及有没有不吃的食物。需要搭车的同事也请告诉我，我来安排。\n期待和大家一起度过一个愉快的晚上！\n财务部　阿芳\n2027年1月22日","es":"有人说“朋友越多越好”，也有人说“朋友贵精不贵多”。你怎么看？不少于300字。","esr":"关于交朋友，有人认为朋友越多越好，也有人认为朋友贵精不贵多。我比较赞同后一种看法，但也认为广交朋友有它的价值。\n一方面，朋友多确实有好处。在工作和生活中，认识的人多，信息就多，机会也多。比如，找工作、找房子、遇到不懂的问题时，朋友多就容易找到帮忙的人。性格开朗的人，也能从和很多人的交往中得到快乐。\n另一方面，真正的朋友往往只有几个。很多所谓的“朋友”，只是一起吃过饭、在网上聊过天的熟人，等你真正遇到困难时，他们可能就不见了。而真正的朋友，会在你失败时陪着你，在你犯错时提醒你，这样的友谊需要时间和真心来维护。\n人的时间和精力是有限的，如果把时间花在应付很多泛泛之交上，就没有时间好好经营最重要的友谊。\n因此，我认为，我们可以多认识一些人，开阔自己的视野，但要把更多的时间和真心留给几个最好的朋友。正所谓“相识满天下，知心能几人”，懂得珍惜知心朋友的人，才是真正富有的人。"},{"ap":"你买的手机出了问题，想申请退货。请给网店客服写一封邮件，说明情况和要求。不少于150字。","apr":"主题：申请退货——订单号ST20270108321\n尊敬的“数码天地”客服：\n您好！我于1月8日在贵店购买了一部“星光X5”手机，订单号ST20270108321，价格六百五十万越南盾，1月10日收到货。\n使用了三天以后，我发现手机存在以下问题：一、充电非常慢，充满电需要五个多小时；二、通话时常常听不清对方的声音，有杂音；三、玩游戏或者看视频时，机身特别烫。我已经按照说明书重新启动和恢复出厂设置，问题仍然没有解决。\n根据贵店“七天无理由退货”的承诺，我现在申请退货退款。手机及包装、配件、发票都完好保存，我可以随时寄回。请告诉我退货的地址和办理方式。\n希望尽快得到您的回复，谢谢！\n联系电话：0903-222-333\n顾客：林小姐\n2027年1月13日","es":"你认为人工智能会给教育带来什么样的变化？不少于300字。","esr":"近几年，人工智能发展得非常快，也开始进入学校和课堂。我认为，人工智能会给教育带来巨大的变化，但它不能代替老师。\n首先，人工智能能让学习更加个性化。在传统的课堂上，一个老师要面对几十个学生，很难照顾到每个人的水平。而人工智能可以根据每个学生的情况，推荐适合的练习，及时发现他们的问题。比如，我准备HSK考试时，就用了一个智能软件，它会根据我的错题，自动安排复习的内容，效果非常好。\n其次，人工智能能减轻老师的工作负担。批改作业、整理成绩这些重复性的工作可以交给机器，老师就能把更多的时间用在备课和关心学生上。\n但是，人工智能也带来了新的问题。有的学生直接用人工智能写作业、写作文，自己却不动脑子，这样反而学不到真正的知识。\n更重要的是，教育不仅仅是传授知识，还包括培养学生的品格、情感和与人合作的能力。这些需要老师用自己的言行去影响学生，是机器无法做到的。\n因此，我们应该把人工智能当作教育的好帮手，而不是让它代替老师和学生的思考。"},{"ap":"你看到一家中资企业招聘中文翻译，请写一封求职信。不少于150字。","apr":"求职信\n尊敬的人事部负责人：\n您好！我在招聘网站上看到贵公司正在招聘中文翻译，特写信应聘这个职位。\n我叫黎氏玉，今年二十六岁，毕业于胡志明市国家大学中文系。毕业后，我在一家贸易公司做了三年中文翻译和跟单工作，主要负责合同、发票的翻译，以及陪同中国客户参观工厂。去年我通过了HSK六级考试，成绩是二百五十分，能够熟练地进行中越互译。\n我工作认真细致，善于沟通，能适应出差和加班。我了解到贵公司在越南发展很快，非常希望能加入贵公司，用自己的语言能力为公司和客户提供帮助。\n随信附上我的简历和HSK证书复印件。如果能有面试的机会，我将非常感谢。\n联系电话：0911-777-888\n此致\n敬礼！\n黎氏玉\n2027年2月1日","es":"你认为旅游对一个人有什么意义？不少于300字。","esr":"现在，越来越多的人喜欢在假期出去旅游。有人认为旅游只是花钱玩一玩，没有什么意义。我认为，旅游对一个人的成长有很重要的意义。\n首先，旅游能开阔眼界。书本上的知识再多，也不如亲眼看一看。第一次去中国西安的时候，站在兵马俑面前，我才真正感受到了中国历史的悠久，这种震撼是看图片无法体会的。\n其次，旅游能让人放松身心。平时工作压力大，每天的生活都差不多。到一个新的地方，看看不一样的风景，吃吃当地的美食，能让人忘掉烦恼，回来以后工作也更有精神。\n此外，旅游还能锻炼人的能力。一个人出门在外，要自己安排行程、处理各种突发情况，比如航班延误、找不到酒店等。这些经历能让人变得更独立、更勇敢。\n当然，旅游也要量力而行，不要为了“打卡”拍照而花太多钱，更不要只是走马观花。用心去了解一个地方的文化和人，旅游才更有意义。\n总之，旅游不只是玩，更是一种学习和成长的方式。如果有条件，我们应该多出去走走，看看更大的世界。"}]},"read":[{"day":1,"title":"一块被忽视的牌子","mk":["被"],"p":[["我家附近有一个小公园，公园里有一条清澈的小河。","河边竖着一块“禁止钓鱼”的牌子，可是很多人都把它当作看不见。","去年夏天，河里的小鱼几乎被钓光了，河水也被扔进去的垃圾弄脏了。"],["有一天，一位老人在河边捡垃圾，他的行为被附近的孩子们看见了。","孩子们被老人所感动，也开始和他一起打扫河边。","后来，这件事被记者报道了出去，很多市民都来参加活动。"],["现在，河水又变得清清的，小鱼也回来了。","那块曾经被忽视的牌子，终于被大家重视起来。","这件事让我明白：保护环境不能只靠一块牌子，更要靠每个人的行动。"]],"w":[["清澈","trong vắt"],["竖","dựng"],["忽视","xem nhẹ"],["钓","câu (cá)"],["捡","nhặt"],["报道","đưa tin"],["市民","người dân thành phố"],["重视","coi trọng"]],"q":[["去年夏天，小河怎么了？",["河水被弄脏了","河边的牌子被拿走了","公园被关了","老人钓了很多鱼"],0],["孩子们为什么开始打扫河边？",["老师要求他们","他们被老人感动了","记者请他们去","他们想去钓鱼"],1],["关于那块牌子，可以知道什么？",["是老人竖的","一开始没有人重视","已经被拿掉了","上面写着“禁止游泳”"],1],["这篇短文主要想告诉我们什么？",["钓鱼很有意思","记者的工作很重要","保护环境要靠每个人的行动","公园应该关门"],2]],"vi":"Gần nhà tôi có một công viên nhỏ, trong công viên có một con sông nhỏ trong vắt. Bên sông dựng một tấm biển “Cấm câu cá”, nhưng nhiều người coi như không thấy. Mùa hè năm ngoái, cá trong sông gần như bị câu hết, nước sông cũng bị rác vứt xuống làm bẩn.\nMột hôm, một cụ già nhặt rác bên sông, việc làm của cụ bị bọn trẻ gần đó nhìn thấy. Bọn trẻ cảm động trước cụ, cũng bắt đầu cùng cụ dọn bờ sông. Sau đó, chuyện này được phóng viên đưa tin, rất nhiều người dân đến tham gia.\nBây giờ nước sông lại trong veo, cá nhỏ cũng đã quay lại. Tấm biển từng bị xem nhẹ cuối cùng cũng được mọi người coi trọng. Chuyện này giúp tôi hiểu: bảo vệ môi trường không thể chỉ dựa vào một tấm biển, mà phải dựa vào hành động của mỗi người."},{"day":2,"title":"把垃圾分一分","mk":["把"],"p":[["刚搬到中国的时候，我常常把垃圾都扔进同一个垃圾桶里。","有一次，楼下的王阿姨看见了，她没有批评我，而是耐心地把每种垃圾的标识讲给我听：可回收的、厨余的、有害的和其他的。"],["从那以后，我每天都把垃圾分好类再拿下楼。","开始的时候觉得很麻烦，常常把塑料瓶放错地方。","后来我把分类方法写在一张纸上，贴在了厨房的墙上，慢慢地就记住了。"],["现在，我不但自己做到了，还把这个习惯带回了国，教给了家人。","每当回忆起王阿姨，我都会感到很温暖。","我明白了：把小事做好，就是对环境最大的帮助。"]],"w":[["搬","chuyển (nhà)"],["批评","phê bình"],["耐心","kiên nhẫn"],["标识","ký hiệu"],["回收","tái chế, thu hồi"],["厨余","rác nhà bếp"],["塑料瓶","chai nhựa"],["分类","phân loại"]],"q":[["王阿姨看见“我”扔垃圾以后做了什么？",["批评了“我”","给“我”讲了垃圾标识","帮“我”扔了垃圾","告诉了别人"],1],["为了记住分类方法，“我”做了什么？",["把方法写在纸上贴在墙上","买了四个垃圾桶","上网查资料","每天去问王阿姨"],0],["开始的时候，“我”觉得垃圾分类怎么样？",["很简单","很有意思","很麻烦","没有用"],2],["下面哪一项是正确的？",["“我”现在在中国工作","“我”把这个习惯带回了国","王阿姨是“我”的老师","“我”从来没放错过"],1]],"vi":"Lúc mới chuyển đến Trung Quốc, tôi thường vứt hết rác vào cùng một thùng. Có lần, dì Vương ở tầng dưới nhìn thấy, dì không trách tôi mà kiên nhẫn giảng cho tôi nghe ký hiệu từng loại rác: rác tái chế, rác nhà bếp, rác độc hại và rác khác.\nTừ đó, ngày nào tôi cũng phân loại rác xong mới mang xuống. Lúc đầu thấy rất phiền, hay để chai nhựa nhầm chỗ. Sau đó tôi viết cách phân loại ra một tờ giấy dán lên tường bếp, dần dần thì nhớ được.\nBây giờ tôi không chỉ tự làm được mà còn mang thói quen này về nước, dạy cho người nhà. Mỗi khi nhớ lại dì Vương, tôi đều thấy ấm áp. Tôi hiểu ra: làm tốt việc nhỏ chính là giúp đỡ lớn nhất cho môi trường."},{"day":3,"title":"爸爸的旧电池箱","mk":[],"p":[["我的爸爸是一个非常懂得生活的人。","他性格开朗，说话幽默，家里总是充满了欢声笑语。"],["爸爸有一个特别的习惯：家里的废旧电池，他从来不随手扔掉，而是放进阳台上的一个小箱子里。","小时候我很不理解，觉得这个箱子又旧又难看。","爸爸告诉我，废旧电池对人体和环境都有危害，如果随处丢弃，结果就可想而知了。"],["每到月底，爸爸都会带着我，把箱子里的电池送到小区的回收点。","慢慢地，邻居们也开始这样做。","现在，小区专门设立了一个电池回收箱。","爸爸的这个小习惯，深深地影响着我，也影响着身边的人。"]],"w":[["开朗","cởi mở"],["废旧","cũ hỏng"],["随手","tiện tay"],["阳台","ban công"],["危害","nguy hại"],["丢弃","vứt bỏ"],["月底","cuối tháng"],["设立","lập, đặt"]],"q":[["爸爸是一个什么样的人？",["很严肃","开朗幽默","不爱说话","很粗心"],1],["小时候，“我”觉得那个箱子怎么样？",["很漂亮","又旧又难看","很有用","太小了"],1],["每到月底，爸爸会做什么？",["买新电池","把电池送到回收点","打扫阳台","去看邻居"],1],["根据短文，小区现在怎么样？",["不允许用电池","设立了电池回收箱","开始卖旧电池","邻居都搬走了"],1]],"vi":"Bố tôi là người rất biết sống. Ông tính tình cởi mở, nói chuyện hài hước, nhà lúc nào cũng rộn tiếng cười.\nBố có một thói quen đặc biệt: pin cũ trong nhà ông không bao giờ tiện tay vứt đi, mà bỏ vào một cái hộp nhỏ ngoài ban công. Hồi nhỏ tôi không hiểu, thấy cái hộp vừa cũ vừa xấu. Bố bảo tôi, pin cũ có hại cho cả cơ thể và môi trường, nếu vứt bừa bãi thì hậu quả có thể tưởng tượng được.\nCứ cuối tháng, bố lại dẫn tôi mang pin trong hộp đến điểm thu gom của khu dân cư. Dần dần, hàng xóm cũng bắt đầu làm theo. Bây giờ khu dân cư đã đặt riêng một thùng thu gom pin. Thói quen nhỏ này của bố ảnh hưởng sâu sắc đến tôi, và cả những người xung quanh."},{"day":4,"title":"一本书和一部手机","mk":["比","没有","不像","不如"],"p":[["现在，很多年轻人觉得看手机比看书方便多了。","手机里的信息又多又新，打开就能看；而一本书又厚又重，带在身上很不方便。"],["但我的想法跟他们不太一样。","面对生活中的压力，我更喜欢读一本纸质书。","手机上的内容虽然比书多得多，可是常常让人越看越累；读书却不像刷手机那么让人着急，它能让我安静下来，慢慢思考。"],["当然，我并不认为书一定比手机好。","用手机查资料比去图书馆快得多，学习汉语的时候也离不开它。","就我而言，最重要的是找到适合自己的方式：工作时用手机，休息时读本书。","没有什么比内心的平静更重要的了。"]],"w":[["信息","thông tin"],["纸质","bằng giấy"],["内容","nội dung"],["刷手机","lướt điện thoại"],["着急","sốt ruột"],["思考","suy nghĩ"],["适合","phù hợp"],["平静","bình yên"]],"q":[["很多年轻人认为什么？",["看书比看手机方便","看手机比看书方便多了","书比手机便宜","手机里的信息太旧"],1],["作者为什么喜欢读纸质书？",["书的内容比手机多","书能让他安静下来，慢慢思考","书比较便宜","书是朋友送的"],1],["作者认为手机有什么优点？",["查资料比去图书馆快","不会让人觉得累","比书轻","能看小说"],0],["作者的观点是什么？",["书一定比手机好","不应该用手机","要找到适合自己的方式","应该多去图书馆"],2]],"vi":"Hiện nay, nhiều bạn trẻ thấy xem điện thoại tiện hơn đọc sách nhiều. Thông tin trong điện thoại vừa nhiều vừa mới, mở ra là xem được; còn một cuốn sách vừa dày vừa nặng, mang theo người rất bất tiện.\nNhưng suy nghĩ của tôi không giống họ lắm. Đối mặt với áp lực cuộc sống, tôi thích đọc một cuốn sách giấy hơn. Nội dung trên điện thoại tuy nhiều hơn sách rất nhiều nhưng thường càng xem càng mệt; đọc sách lại không khiến người ta sốt ruột như lướt điện thoại, nó giúp tôi lắng lại và suy nghĩ chậm rãi.\nĐương nhiên, tôi không cho rằng sách nhất định tốt hơn điện thoại. Dùng điện thoại tra tài liệu nhanh hơn đến thư viện nhiều, khi học tiếng Trung cũng không thể thiếu nó. Với tôi, quan trọng nhất là tìm được cách phù hợp với mình: làm việc thì dùng điện thoại, nghỉ ngơi thì đọc sách. Không có gì quan trọng hơn sự bình yên trong lòng."},{"day":5,"title":"一位戴着眼镜的年轻老板","mk":["得"],"p":[["在我们公司楼下，有一家开了三年的小咖啡店。","老板是一位戴着眼镜、个子不高的年轻人。","大学毕业以后，他没有选择去大公司工作，而是用自己攒下的钱创业，开了这家咖啡店。"],["刚开始的时候，店里的客人少得可怜，他常常一个人忙到晚上十一点才回家。","可是他从不放弃，每天把店里收拾得干干净净，把每一杯咖啡都做得很认真。","经过几年的经营，咖啡店逐渐发展起来，现在已经有了五名员工。"],["有一次我问他成功的秘密，他笑着说：“一家小店的发展离不开诚实的服务。","只要真心对待每一位客人，客人就会回来。”"]],"w":[["攒","dành dụm"],["创业","khởi nghiệp"],["可怜","đáng thương"],["放弃","từ bỏ"],["经营","kinh doanh"],["逐渐","dần dần"],["员工","nhân viên"],["秘密","bí quyết, bí mật"]],"q":[["老板大学毕业以后做了什么？",["去了大公司","自己创业，开了咖啡店","继续读书","当了老师"],1],["刚开始的时候，咖啡店怎么样？",["客人很多","客人很少","已经有五名员工","只卖茶"],1],["关于老板，下面哪一项正确？",["个子很高","戴着眼镜","年纪很大","不爱笑"],1],["老板认为成功的秘密是什么？",["地点好","价格便宜","诚实的服务","员工多"],2]],"vi":"Dưới tòa nhà công ty chúng tôi có một quán cà phê nhỏ đã mở ba năm. Chủ quán là một chàng trai trẻ đeo kính, dáng không cao. Tốt nghiệp đại học xong, anh không chọn vào công ty lớn mà dùng tiền mình dành dụm để khởi nghiệp, mở quán cà phê này.\nLúc mới mở, khách trong quán ít đến thảm, anh thường một mình bận đến 11 giờ đêm mới về nhà. Nhưng anh không bao giờ bỏ cuộc, ngày nào cũng dọn quán sạch sẽ tinh tươm, pha từng ly cà phê thật chăm chút. Sau vài năm kinh doanh, quán dần phát triển, giờ đã có năm nhân viên.\nCó lần tôi hỏi anh bí quyết thành công, anh cười nói: “Sự phát triển của một quán nhỏ không thể thiếu sự phục vụ thật thà. Chỉ cần chân thành với từng vị khách, khách sẽ quay lại.”"},{"day":6,"title":"一次难忘的教训","mk":[],"p":[["上个月，我坐地铁去公司上班，下车的时候不小心把手机落在了座位上。","等我发现的时候，地铁已经开走了。","当时我又着急又害怕，因为手机里有很多重要的工作资料。"],["后来，我跑到服务台找工作人员帮忙。","工作人员听完我的情况，马上打电话联系下一站。","半个小时以后，一位乘客把手机送到了服务台，我终于找回了它。","我去商店买了一盒巧克力感谢那位乘客。"],["从那以后，我每次下车前都会提醒自己：再检查一下身边的东西。","这次经历让我明白，只有养成细心的习惯，才能避免很多麻烦。"]],"w":[["教训","bài học"],["落","bỏ quên"],["座位","chỗ ngồi"],["服务台","quầy phục vụ"],["乘客","hành khách"],["提醒","nhắc nhở"],["养成","hình thành"],["避免","tránh"]],"q":[["“我”把手机落在了哪儿？",["公司","地铁座位上","服务台","商店"],1],["发现手机丢了以后，“我”做了什么？",["回家了","去服务台找工作人员帮忙","马上买了新手机","给同事打电话"],1],["手机是怎么找回来的？",["警察送来的","一位乘客送到了服务台","同事捡到的","在家里找到的"],1],["这次经历让“我”明白了什么？",["要多买巧克力","坐地铁不安全","要养成细心的习惯","手机不重要"],2]],"vi":"Tháng trước, tôi đi tàu điện ngầm đến công ty, lúc xuống tàu sơ ý bỏ quên điện thoại trên ghế. Khi tôi phát hiện thì tàu đã chạy mất. Lúc đó tôi vừa sốt ruột vừa sợ, vì trong điện thoại có nhiều tài liệu công việc quan trọng.\nSau đó tôi chạy đến quầy phục vụ nhờ nhân viên giúp. Nhân viên nghe xong liền gọi điện liên lạc với ga kế tiếp. Nửa tiếng sau, một hành khách mang điện thoại đến quầy, cuối cùng tôi đã tìm lại được. Tôi ra cửa hàng mua một hộp sô-cô-la để cảm ơn vị hành khách ấy.\nTừ đó, mỗi lần xuống tàu tôi đều tự nhắc mình: kiểm tra lại đồ bên người. Trải nghiệm này giúp tôi hiểu, chỉ khi hình thành thói quen cẩn thận mới tránh được nhiều phiền phức."},{"day":7,"title":"让我舍不得的城市","mk":["请","让","使","鼓励","要求"],"p":[["时间过得真快，转眼间，我在北京的留学生活就要结束了。","回想起这两年，最让我舍不得的是我的汉语老师——张老师。"],["刚来的时候，我连点菜都不会。","张老师常常请我们去学校附近的饭馆吃饭，让我们自己用汉语点菜。","她还鼓励我们多跟中国人聊天，要求我们每天写日记。","正是这些小事，使我的汉语水平提高得很快。"],["现在，我已经习惯了这里的生活：用手机叫外卖、在网上购物、骑共享单车去上课，这些都让我觉得非常方便。","下个月我就要回国了，衷心地希望张老师健康快乐，也希望在不久的将来，我还能回到北京看看。"]],"w":[["转眼间","chớp mắt"],["舍不得","không nỡ"],["点菜","gọi món"],["鼓励","khích lệ"],["日记","nhật ký"],["外卖","đồ ăn giao tận nơi"],["共享单车","xe đạp công cộng"],["衷心","chân thành"]],"q":[["最让“我”舍不得的是什么？",["北京烤鸭","张老师","共享单车","学校宿舍"],1],["张老师为什么常常请学生去饭馆吃饭？",["为了庆祝生日","让他们用汉语点菜","学校要求的","学生请客"],1],["张老师没有要求学生做哪件事？",["多跟中国人聊天","每天写日记","用汉语点菜","在网上购物"],3],["“我”下个月要做什么？",["回国","去上海","当老师","搬家"],0]],"vi":"Thời gian trôi nhanh thật, chớp mắt cuộc sống du học ở Bắc Kinh của tôi sắp kết thúc. Nhớ lại hai năm qua, điều khiến tôi không nỡ rời xa nhất là cô giáo tiếng Trung của tôi — cô Trương.\nLúc mới đến, tôi đến gọi món cũng không biết. Cô Trương thường mời chúng tôi đến quán ăn gần trường, để chúng tôi tự gọi món bằng tiếng Trung. Cô còn khích lệ chúng tôi trò chuyện nhiều với người Trung Quốc, yêu cầu chúng tôi mỗi ngày viết nhật ký. Chính những việc nhỏ ấy giúp trình độ tiếng Trung của tôi tiến bộ rất nhanh.\nGiờ tôi đã quen với cuộc sống ở đây: dùng điện thoại gọi đồ ăn, mua sắm trên mạng, đạp xe công cộng đi học, tất cả đều khiến tôi thấy rất tiện. Tháng sau tôi về nước rồi, thật lòng mong cô Trương mạnh khỏe vui vẻ, cũng mong trong tương lai không xa, tôi còn được quay lại Bắc Kinh."},{"day":8,"title":"选择工作的时候","mk":["应该","愿意","一定要","可以","能"],"p":[["大学毕业的时候，我同时收到了两份工作邀请。","一家是外资企业，待遇丰厚，可是经常要出差加班；另一家是本地的小公司，工资不高，但是工作比较轻松，离家也近。"],["我应该选哪一个呢？","父母希望我去外资企业，他们说年轻人应该多积累经验；朋友却劝我选小公司，因为可以有更多的时间享受生活。","我想了很久，一方面我想多赚钱，另一方面我又不愿意放弃自己的爱好。"],["最后，我选择了外资企业，但是我要求自己每周一定要抽出两个晚上去跑步、读书。","现在三年过去了，我不但积累了丰富的工作经验，身体也比以前更健康了。","我明白，鱼和熊掌有时是可以兼得的，关键看你能不能安排好时间。"]],"w":[["邀请","lời mời"],["外资企业","doanh nghiệp vốn nước ngoài"],["待遇","đãi ngộ"],["出差","đi công tác"],["加班","tăng ca"],["劝","khuyên"],["抽出","dành ra"],["兼得","có được cả hai"]],"q":[["关于那家外资企业，可以知道什么？",["工资不高","离家很近","待遇丰厚，但常要出差加班","工作很轻松"],2],["朋友为什么劝“我”选小公司？",["工资高","可以有更多时间享受生活","能积累经验","朋友也在那里工作"],1],["“我”每周要求自己做什么？",["加班","抽出两个晚上跑步、读书","出差","回家看父母"],1],["“鱼和熊掌有时是可以兼得的”是什么意思？",["鱼比熊掌好吃","两样好东西有时可以同时得到","只能选择其中一个","工作比爱好重要"],1]],"vi":"Khi tốt nghiệp đại học, tôi cùng lúc nhận được hai lời mời làm việc. Một là doanh nghiệp vốn nước ngoài, đãi ngộ hậu hĩnh nhưng thường xuyên phải đi công tác, tăng ca; một là công ty nhỏ ở địa phương, lương không cao nhưng công việc khá nhẹ nhàng, lại gần nhà.\nTôi nên chọn bên nào đây? Bố mẹ muốn tôi vào doanh nghiệp nước ngoài, họ nói người trẻ nên tích lũy nhiều kinh nghiệm; bạn bè thì khuyên tôi chọn công ty nhỏ, vì có thể có nhiều thời gian tận hưởng cuộc sống hơn. Tôi nghĩ rất lâu, một mặt tôi muốn kiếm nhiều tiền, mặt khác lại không muốn bỏ sở thích của mình.\nCuối cùng tôi chọn doanh nghiệp nước ngoài, nhưng tự yêu cầu mỗi tuần nhất định phải dành ra hai buổi tối để chạy bộ, đọc sách. Giờ ba năm đã trôi qua, tôi không chỉ tích lũy được nhiều kinh nghiệm làm việc mà sức khỏe cũng tốt hơn trước. Tôi hiểu rằng “cá và tay gấu” đôi khi có thể có cả hai, mấu chốt là bạn có sắp xếp được thời gian hay không."},{"day":9,"title":"我们的周末篮球队","mk":["有","是"],"p":[["我们学校有很多课余活动，有唱歌比赛、书法班，还有各种球队。","我最喜欢的课余活动之一是打篮球。"],["我们的篮球队是去年秋天成立的，队里有八个人，有中国学生，也有韩国、日本和美国的留学生。","刚开始的时候，大家互相不太了解，比赛时也总是配合不好。","可惜的是，第一次比赛我们输得很惨。"],["后来，我们每个周末都一起练习，练完球还一起去吃饭、聊天。","慢慢地，大家成了好朋友，配合也越来越好。","今年春天，我们终于进入了学校比赛的决赛。","虽然最后只得了第二名，但大家都觉得格外开心。","这是因为：一方面，打篮球锻炼了身体；另一方面，我们学会了团队合作。"]],"w":[["课余","ngoài giờ học"],["书法","thư pháp"],["成立","thành lập"],["配合","phối hợp"],["可惜","đáng tiếc"],["输","thua"],["决赛","chung kết"],["格外","đặc biệt"]],"q":[["篮球队是什么时候成立的？",["今年春天","去年秋天","上个周末","去年冬天"],1],["关于篮球队，下面哪一项正确？",["队里有八个人","队里有五个人","只有中国学生","只有留学生"],0],["第一次比赛的结果怎么样？",["得了第一名","进入了决赛","输得很惨","没有参加"],2],["大家为什么觉得格外开心？",["得了第一名","锻炼了身体，也学会了团队合作","老师请大家吃饭","比赛终于结束了"],1]],"vi":"Trường chúng tôi có rất nhiều hoạt động ngoại khóa: thi hát, lớp thư pháp, còn có đủ các đội bóng. Một trong những hoạt động ngoại khóa tôi thích nhất là chơi bóng rổ.\nĐội bóng rổ của chúng tôi thành lập từ mùa thu năm ngoái, trong đội có tám người, có sinh viên Trung Quốc, cũng có du học sinh Hàn Quốc, Nhật Bản và Mỹ. Lúc đầu mọi người chưa hiểu nhau lắm, thi đấu cũng hay phối hợp không tốt. Đáng tiếc là trận đầu tiên chúng tôi thua rất thảm.\nSau đó, cuối tuần nào chúng tôi cũng tập cùng nhau, tập xong còn đi ăn, trò chuyện. Dần dần mọi người thành bạn tốt, phối hợp cũng ngày càng ăn ý. Mùa xuân năm nay, cuối cùng chúng tôi đã vào chung kết giải của trường. Tuy cuối cùng chỉ được giải nhì, nhưng ai cũng thấy đặc biệt vui. Bởi vì: một mặt, chơi bóng rổ giúp rèn luyện thân thể; mặt khác, chúng tôi học được cách làm việc nhóm."},{"day":10,"title":"我的汉语学习方法","mk":["贴着","放着","挂着"],"p":[["我学习汉语已经三年了。","我的房间里到处是小纸条：门上贴着“开门”两个字，桌子上放着一张写满生词的卡片，墙上挂着一幅中国地图。","每次走过它们，我都会大声读一遍。"],["刚开始的时候，我很容易受到母语的影响，常常把汉语的语序说错。","后来，我的辅导老师告诉我一个好方法：每天跟读一段课文，把自己的声音录下来，再和原文比较。","坚持了半年以后，我的发音有了明显的进步。"],["此外，我还找到了一个中国语伴。","我们每周见两次面，一次说汉语，一次说我的母语。","在他的帮助下，现在，我不但敢开口说汉语了，HSK五级也顺利通过了。","我相信，只要方法对，学习就会事半功倍。"]],"w":[["纸条","mẩu giấy"],["生词","từ mới"],["母语","tiếng mẹ đẻ"],["语序","trật tự từ"],["辅导","phụ đạo"],["跟读","đọc theo"],["明显","rõ rệt"],["事半功倍","làm ít được nhiều"]],"q":[["“我”的房间墙上挂着什么？",["一张卡片","一幅中国地图","一张照片","一个日历"],1],["辅导老师建议的方法是什么？",["多看中国电影","每天跟读课文，录音后和原文比较","多写汉字","去中国旅行"],1],["“我”和语伴每周见几次面？",["一次","两次","三次","每天都见"],1],["根据短文，下面哪一项正确？",["“我”学汉语一年了","“我”已经通过了HSK五级","“我”的发音一直不好","语伴是“我”的老师"],1]],"vi":"Tôi học tiếng Trung đã ba năm. Trong phòng tôi chỗ nào cũng có mẩu giấy: trên cửa dán hai chữ “mở cửa”, trên bàn đặt một tấm thẻ viết kín từ mới, trên tường treo một tấm bản đồ Trung Quốc. Mỗi lần đi ngang qua, tôi đều đọc to một lượt.\nLúc mới học, tôi rất dễ bị tiếng mẹ đẻ ảnh hưởng, hay nói sai trật tự từ tiếng Trung. Sau đó, thầy phụ đạo chỉ cho tôi một cách hay: mỗi ngày đọc theo một đoạn bài khóa, ghi âm giọng mình rồi so với bản gốc. Kiên trì nửa năm, phát âm của tôi tiến bộ rõ rệt.\nNgoài ra, tôi còn tìm được một bạn học tiếng người Trung Quốc. Mỗi tuần chúng tôi gặp hai lần, một lần nói tiếng Trung, một lần nói tiếng mẹ đẻ của tôi. Nhờ bạn ấy giúp đỡ, giờ tôi không chỉ dám mở miệng nói tiếng Trung mà còn thi đỗ HSK 5 suôn sẻ. Tôi tin rằng chỉ cần đúng phương pháp, việc học sẽ làm ít được nhiều."}],"days":[{"grammar":[{"title":"“被”字句","base":"主语 + 被 + 宾语 + 动词 + 其他成分","baseEx":["我的自行车被弟弟骑走了。","窗户被大风吹开了。","蛋糕被孩子们吃光了。"],"notes":[{"p":"主语 + 被 + 宾语 + 所 + 动词","ex":["大家都被他的故事所感动。","游客们被这里的风景所吸引。"]},{"p":"主语 + 被 + 宾语 + 动词 + 成/作/为 + 宾语","ex":["这本小说被翻译成了十几种语言。","他被大家选为班长。"]},{"p":"主语 + 被 + 宾语 + 动词 + 结果补语 + 了","ex":["杯子被猫打碎了。","那份文件被我放错地方了。"]},{"p":"主语 + 否定副词 + 被……（否定词放在“被”前面）","ex":["我的建议没被经理采纳。","别让孩子被开水烫到。"]}],"real":[{"a":"会议室已经被别人订了。","c":["会议室","已经","被","别人","订了"]},{"a":"他被一家外企录用了。","c":["他","被","一家","外企","录用了"]},{"a":"这项新技术被广泛应用到生产中。","c":["这项","新技术","被","广泛","应用到","生产中"]}]}],"ex":[{"a":"那本词典被同学借走了。","c":["那本","词典","被","同学","借走了"]},{"a":"我们的方案已经被客户接受了。","c":["我们的","方案","已经","被","客户","接受了"]},{"a":"他的手机昨天被小偷偷走了。","c":["他的手机","昨天","被","小偷","偷走了"]},{"a":"我的衣服被雨淋湿了。","c":["我的","衣服","被","雨","淋湿了"]},{"a":"那位老人被好心人送到了医院。","c":["那位","老人","被","好心人","送到了","医院"]},{"a":"这个问题被他解决得很好。","c":["这个","问题","被","他","解决得","很好"]},{"a":"房间被妈妈收拾得干干净净。","c":["房间","被","妈妈","收拾得","干干净净"]},{"a":"他被公司派到上海出差了。","c":["他","被","公司","派到","上海","出差了"]},{"a":"我被这首歌感动得流下了眼泪。","c":["我","被","这首歌","感动得","流下了","眼泪"]},{"a":"小心别被狗咬了。","c":["小心","别","被","狗","咬了"]}],"e1":{"title":"短文1：叙述事情Ⅰ","real":"晚会 准备 紧张 成功 感谢","feat":["5个词里通常有名词、动词、形容词，可以把它们串成一件事。","常常有表示时间、动作或者心情的词。","最容易的写法是写成一个小故事（记叙文）。"],"try":"生日 惊喜 朋友 蛋糕 难忘","ex":[{"text":"我永远忘不了去年的生日。那天，我加班到很晚，心想朋友们一定都忘了。没想到，我一打开家门，灯突然亮了，朋友们拿着蛋糕大声唱起了生日歌。这个惊喜让我感动极了。从那以后，我更加珍惜身边的朋友。","tpl":"我永远忘不了……。那天，……。没想到，……。从那以后，……。","ph":[["时间",["那天，……","记得那年……","上个周末，……","当我……的时候","后来，……","从那以后，……"]],["心情",["我感动极了","我又惊又喜","心里暖暖的","那一刻，我明白了……","让我难以忘记的是……"]]],"models":[{"w":"晚会 准备 紧张 成功 感谢","t":"我永远忘不了公司的新年晚会。那天，我第一次上台表演，虽然准备了一个多月，可是上台前还是非常紧张。没想到，表演结束时，台下响起了热烈的掌声。晚会很成功，我特别感谢一直帮我练习的同事。从那以后，我变得更自信了。"},{"w":"旅行 迷路 热情 帮助 感动","t":"我永远忘不了第一次去杭州旅行。那天，我在西湖边迷路了，手机也没电了。没想到，一位卖水果的阿姨看出我很着急，热情地把我带到了地铁站。她的帮助让我非常感动。从那以后，看到需要帮助的人，我也会主动上前。"}]},{"text":"对很多年轻人来说，生日是一年中最特别的日子。它不仅意味着自己又长大了一岁，而且是和朋友相聚的好机会。比如，大家一起吃蛋糕，给过生日的人准备一个小惊喜。所以，生日常常是一年中最难忘的一天。","tpl":"对……来说，……是……。它不仅……，而且……。比如，……。所以，……。","ph":[["解释",["对……来说，……","……意味着……","在我看来，……","众所周知，……"]],["举例",["比如，……","拿……来说","像……这样的……"]],["总结",["所以，……","总之，……","总而言之，……","由此可见，……"]]],"models":[{"w":"晚会 准备 紧张 成功 感谢","t":"对新员工来说，公司的新年晚会是一次展示自己的好机会。它不仅能让大家放松一下，而且能让同事们互相了解。比如，有人唱歌，有人跳舞，虽然上台前都很紧张，但是大家准备得很认真，晚会非常成功。所以，我很感谢公司举办这样的活动。"},{"w":"旅行 迷路 热情 帮助 感动","t":"对喜欢旅行的人来说，迷路是常有的事。它不仅会让人着急，而且有时还会带来意外的收获。比如，你可能会遇到热情的当地人，得到他们的帮助，这种经历往往让人很感动。所以，旅行时迷路也不一定是坏事。"}]}],"prac":"公司 加班 疲惫 坚持 鼓励","refs":["我永远忘不了刚进公司的那段日子。那时，我们部门几乎每天都要加班，我常常疲惫得不想说话，甚至想过放弃。没想到，经理发现以后，经常鼓励我，还教我怎样安排时间。从那以后，我学会了坚持，工作也越来越顺利了。","对很多上班族来说，加班是生活的一部分。它不仅让人身体疲惫，而且会减少陪伴家人的时间。比如，有的人一个星期要加好几个晚上的班。所以，公司应该合理安排工作，同事之间也要互相鼓励，这样大家才能坚持下去。"]},"e2":{"title":"短文2：图标类Ⅰ","feat":["图片多是标志或提示牌，一般没有人物。","它的目的通常是提醒或者告诉人们一件事。","可以说明它的意思，也可以联想写一个小故事。"],"tryImg":{"t":"sign","i":"cig","ban":1,"l":"禁止吸烟"},"ex":[{"text":"在我家附近的公交车站，有一个“禁止吸烟”的标志。它的意思是在这里不能抽烟。可是，每天早上还是有人一边等车一边抽烟，旁边的孩子和老人只能捂着鼻子。这让我想到：一个标志能不能起作用，关键在于每个人是否自觉。","tpl":"在……附近，有一个“……”的标志。它的意思是……。可是，……。这让我想到：……。","ph":[["位置",["在……附近，……","在……的门口，……","……的墙上贴着……","在……的旁边，……"]],["地点",["公交车站、地铁站、加油站","商场入口、医院大厅、图书馆","小区门口、学校操场、公园湖边"]],["联想",["这让我想到：……","由此可见，……","我认为，……","每个人都应该……"]]],"models":[{"img":{"t":"sign","i":"car","ban":1,"l":"禁止停车"},"t":"在我们公司门口，有一个“禁止停车”的标志。它的意思是这里是消防通道，车辆不能停放。可是，有些送货的司机为了方便，还是把车停在这里。这让我想到：方便了自己，可能就会给别人带来危险。"}]},{"text":"这是一个禁止吸烟的标志，它告诉我们：在这里不能抽烟。在公共场所吸烟，不但会影响自己的健康，而且会让周围的人吸二手烟。我们每个人都应该遵守规定，一起创造一个干净的环境。","tpl":"这是一个……的标志，它告诉我们：……。……，不但……，而且……。我们每个人都应该……。","ph":[["说明",["这是一个……的标志","它表示……","它提醒人们……","它的目的是……"]],["原因",["因为……","这样做是为了……","否则，……"]]],"models":[{"img":{"t":"sign","i":"exit","ban":0,"l":"安全出口"},"t":"这是一个安全出口的标志，它告诉我们：遇到紧急情况时，可以从这里离开。商场、电影院、酒店都有这个标志，一旦发生火灾，它不但能帮人们很快找到逃生的路，而且能减少伤亡。我们每个人到了新的地方，都应该先看看安全出口在哪儿。"}]}],"pracImg":{"t":"sign","i":"phone","ban":1,"l":"禁止使用手机"},"refs":["在我常去的加油站，墙上有一个“禁止使用手机”的标志。它的意思是在加油的时候不能打电话。可是，我发现有些司机一边加油一边看手机。这让我想到：很多事故都是因为人们不重视这些小小的提示。","这是一个禁止使用手机的标志，它告诉我们：在这里不能打电话或者玩手机。在加油站使用手机，不但可能引起火灾，而且会影响工作人员。我们每个人都应该遵守这个规定，保护自己，也保护别人。"]},"day":1},{"grammar":[{"title":"“把”字句","base":"主语 + 把 + 宾语 + 动词 + 其他成分","baseEx":["我把作业交给老师了。","他把车停在了楼下。","妈妈把菜洗干净了。"],"notes":[{"p":"主语 + 把 + 宾语1 + 动词 + 在/到/给 + 宾语2","ex":["请把文件放在我的桌子上。","他把礼物送给了女朋友。"]},{"p":"主语 + 把 + 宾语1 + 动词 + 成/作 + 宾语2","ex":["我把美元换成了人民币。","她一直把我当作亲妹妹。"]},{"p":"主语 + 把 + 宾语 + 动词 + 趋向补语 + 了","ex":["服务员把菜端上来了。","孩子把小鸟放出去了。"]},{"p":"主语 + 否定副词/能愿动词 + 把……","ex":["你千万别把这件事告诉别人。","我们应该把时间安排得更合理一些。"]}],"real":[{"a":"他已经把报告写完了。","c":["他","已经","把","报告","写完了"]},{"a":"请把会议时间改到下午三点。","c":["请","把","会议","时间","改到","下午三点"]},{"a":"她把房间布置得很漂亮。","c":["她","把","房间","布置得","很漂亮"]}]}],"ex":[{"a":"我把钥匙忘在办公室了。","c":["我","把","钥匙","忘在","办公室了"]},{"a":"请把空调温度调高一点儿。","c":["请","把","空调","温度","调高","一点儿"]},{"a":"他把这个好消息告诉了大家。","c":["他","把","这个","好消息","告诉了","大家"]},{"a":"服务员把账单送了过来。","c":["服务员","把","账单","送了","过来"]},{"a":"我们要把垃圾分类扔。","c":["我们","要","把","垃圾","分类","扔"]},{"a":"她把中文小说翻译成了越南语。","c":["她","把","中文","小说","翻译成了","越南语"]},{"a":"经理把会议推迟到了周五。","c":["经理","把","会议","推迟到了","周五"]},{"a":"你把这些数据整理一下。","c":["你","把","这些","数据","整理","一下"]},{"a":"弟弟把我的电脑弄坏了。","c":["弟弟","把","我的","电脑","弄坏了"]},{"a":"我终于把这本书看完了。","c":["我","终于","把","这本书","看完了"]}],"e1":{"title":"短文1：叙述事情Ⅱ","real":"宿舍 室友 理解 开心 帮助","feat":["词语里常有地点、人物和心情。","可以通过回忆一段经历来写。","也可以写不同的人对一件事的不同想法。"],"try":"大学 老师 耐心 进步 怀念","ex":[{"text":"每次想起大学的生活，我都觉得很怀念。那时候，我的汉语不太好，上课常常听不懂。我们的王老师非常耐心，下课后经常留下来给我讲问题。在她的帮助下，我的汉语进步得很快。我真希望能再回到那段时光。","tpl":"每次想起……，我都觉得……。那时候，……。……，……。在……的帮助下，……。我真希望……。","ph":[["回忆",["每次想起……","每当回忆起……","一想到……","记得那时候……"]],["感受",["我都觉得很怀念","我总是很感动","心里充满了感激","我都会笑起来"]],["结尾",["我真希望……","我会永远记得……","我很珍惜……","那是我最快乐的时光"]]],"models":[{"w":"宿舍 室友 理解 开心 帮助","t":"每次想起住在学校宿舍的日子，我都觉得很开心。那时候，我刚到中国，什么都不习惯。我的室友是一个越南女孩，她很理解我的感受，常常陪我去超市、教我坐地铁。在她的帮助下，我很快适应了新生活。我真希望我们能一直做好朋友。"}]},{"text":"每个人对大学老师的看法都不一样。有的人喜欢知识丰富的老师，有的人喜欢幽默风趣的老师，还有的人喜欢严格要求学生的老师。而我最怀念的是有耐心的老师，因为他们让我看到了自己的进步。","tpl":"每个人对……的看法都不一样。有的人……，有的人……，还有的人……。而我……，因为……。","ph":[["开头",["每个人对……的看法都不一样","关于……，大家有不同的意见","每个人都有自己的选择"]],["举例",["有的人……，有的人……","一些人……，另一些人……","大部分人……，少数人……"]],["观点",["而我认为……","我自己的想法是……","对我来说，……"]]],"models":[{"w":"宿舍 室友 理解 开心 帮助","t":"每个人对宿舍生活的看法都不一样。有的人觉得和室友住在一起很热闹，有的人觉得没有自己的空间，还有的人担心生活习惯不同。而我觉得住宿舍很开心，因为室友之间只要互相理解、互相帮助，就能成为一辈子的朋友。"}]}],"prac":"毕业 照片 舍不得 回忆 未来","refs":["每次想起毕业那天拍的照片，我都觉得很舍不得。那时候，我们全班同学穿着毕业服，在学校门口笑得特别开心。拍完照片，大家互相拥抱，说好以后常联系。在那一刻，我明白了友谊的珍贵。我真希望未来还能和他们一起回到学校。","每个人对毕业的看法都不一样。有的人觉得终于可以工作赚钱了，有的人舍不得离开学校，还有的人对未来感到担心。而我最喜欢翻看毕业照片，因为那些美好的回忆会给我面对未来的勇气。"]},"e2":{"title":"短文2：图标类Ⅱ","feat":["图片多是生活中常见的标识。","可以写它在什么地方能看到、有什么用。","也可以简单地发表自己的看法。"],"tryImg":{"t":"sign","i":"recycle","ban":0,"l":"可回收物"},"ex":[{"text":"这是一个可回收物的标识，图片中有三个首尾相连的箭头，它表示这里的垃圾可以回收利用。这种标识在很多小区和公园都能看到，大家千万不要忽视它。比如喝完的饮料瓶，我们可以扔进这个垃圾桶，从而减少资源浪费。","tpl":"这是一个……的标识，图片中有……，它表示……。这种标识在……都能看到，大家千万不要忽视它。比如……，我们可以……，从而……。","ph":[["描述",["图片中有……","图片的中间是……","图片上画着……"]],["地点",["这种标识随处可见","在很多公共场所都能看到","商场、车站、公园里都有"]],["建议",["大家千万不要忽视它","我们应该……，从而……","希望每个人都能……"]]],"models":[{"img":{"t":"sign","i":"bike","ban":0,"l":"自行车道"},"t":"这是一个自行车道的标识，图片中有一辆自行车，它表示这条路是专门给骑车的人走的。这种标识在很多城市的马路上都能看到，大家千万不要忽视它。比如开车的时候，我们不能占用自行车道，从而保证骑车人的安全。"}]},{"text":"近几年，垃圾分类问题越来越受到人们的关注。这个问题之所以重要，是因为很多垃圾其实可以回收再利用。我们要想保护环境，就要从身边的小事做起，比如把饮料瓶放进可回收垃圾桶。这样做不仅能节约资源，还能减少污染。","tpl":"近几年，……问题越来越受到人们的关注。这个问题之所以……，是因为……。我们要想……，就要……。这样做不仅……，还……。","ph":[["引出话题",["近几年，……越来越受到关注","随着社会的发展，……","……已经成为一个热门话题"]],["原因",["之所以……，是因为……","……的主要原因是……","……导致了……"]],["办法",["我们要想……，就要……","只有……，才能……","每个人都可以从小事做起"]]],"models":[{"img":{"t":"sign","i":"cig","ban":1,"l":"禁止吸烟"},"t":"近几年，公共场所吸烟的问题越来越受到人们的关注。这个问题之所以严重，是因为二手烟对周围的人伤害很大。我们要想解决这个问题，就要加强管理，同时让吸烟的人了解危害。这样做不仅能保护大家的健康，还能让城市变得更文明。"}]}],"pracImg":{"t":"sign","i":"seatbelt","ban":0,"l":"请系好安全带"},"refs":["这是一个提醒系安全带的标识，图片中有一个系着安全带的人，它表示坐车时要系好安全带。这种标识在汽车和飞机上都能看到，大家千万不要忽视它。比如坐出租车的时候，即使路程很短，我们也应该系好安全带，从而保证自己的安全。","近几年，交通安全问题越来越受到人们的关注。这个问题之所以重要，是因为很多事故都是因为人们大意造成的。我们要想减少伤害，就要从系好安全带这样的小事做起。这样做不仅能保护自己，还能让家人放心。"]},"day":2},{"grammar":[{"title":"动词谓语句","base":"主语 + 动词谓语 + 名词宾语","baseEx":["经理参加了会议。","我们签订了合同。","她表达了自己的想法。"],"notes":[{"p":"主语 + 助动词 + 动词短语","ex":["公司必须提高产品质量。","你应该多跟同事沟通。","员工一定要遵守安全规定。","他不愿意改变原来的计划。"]}],"real":[{"a":"她从事财务工作。","c":["她","从事","财务","工作"]},{"a":"这家工厂面临很大的压力。","c":["这家","工厂","面临","很大的","压力"]},{"a":"我们需要调整生产计划。","c":["我们","需要","调整","生产","计划"]}]},{"title":"形容词谓语句","base":"主语 + 形容词谓语","baseEx":["今年的订单很多。","这个房间非常安静。","他的态度很认真。"],"notes":[{"p":"主语 + 程度副词 + 形容词","ex":["这里的冬天特别冷。","最近的工作更忙了。"]},{"p":"主语 + 两个形容词短语","ex":["这条路又窄又长。"]},{"p":"主语 + 形容词 + 补语","ex":["大家高兴极了。","天渐渐暗下来了。"]},{"p":"状态形容词作谓语，常加“的”","ex":["她的脸红红的。","院子里静悄悄的。"]}],"real":[{"a":"这次活动非常成功。","c":["这次","活动","非常","成功"]},{"a":"车间里打扫得干干净净的。","c":["车间里","打扫得","干干净净的"]}]}],"ex":[{"a":"运动可以减轻压力。","c":["运动","可以","减轻","压力"]},{"a":"我们应该保护环境。","c":["我们","应该","保护","环境"]},{"a":"她负责公司的招聘工作。","c":["她","负责","公司的","招聘","工作"]},{"a":"学生必须按时交作业。","c":["学生","必须","按时","交","作业"]},{"a":"工厂下个月开始生产新产品。","c":["工厂","下个月","开始","生产","新产品"]},{"a":"他的建议得到了大家的支持。","c":["他的","建议","得到了","大家的","支持"]},{"a":"这家公司的服务很周到。","c":["这家","公司的","服务","很","周到"]},{"a":"今天的天气特别好。","c":["今天的","天气","特别","好"]},{"a":"他已经适应了这里的生活。","c":["他","已经","适应了","这里的","生活"]},{"a":"我们的产品受到了客户的欢迎。","c":["我们的","产品","受到了","客户的","欢迎"]}],"e1":{"title":"短文1：家庭生活","real":"周末 做饭 热闹 爸爸 幸福","feat":["词语一般和家庭生活有关，很贴近日常。","常有人物、动作和心情。","可以写一个家人，也可以写一次家庭活动。"],"try":"妈妈 关心 唠叨 理解 温暖","ex":[{"text":"我的妈妈是一个非常关心家人的人。只要我出门，她就会唠叨半天：天冷要多穿衣服，路上要注意安全。以前我觉得很烦，后来我才理解，这是她表达爱的方式。有妈妈在，家里永远是最温暖的地方。","tpl":"我的……是一个……的人。只要……，……就……。以前……，后来我才……。有……在，……。","ph":[["描述人物",["我的……是一个……的人","他性格开朗，非常幽默","她总是把家人放在第一位","他是家里最有耐心的人"]],["叙述",["只要……，他就……","记得有一次，……","每到……的时候，……","以前……，后来才……"]],["感受",["家里永远是最温暖的地方","我们一家人在一起很幸福","我真为有这样的家人感到骄傲"]]],"models":[{"w":"周末 做饭 热闹 爸爸 幸福","t":"我的爸爸是一个非常会生活的人。只要到了周末，他就会去市场买菜，给全家做一桌好吃的饭。以前我只知道吃，后来我才明白，做饭也是他放松心情的方式。每次一家人围在一起吃饭，又热闹又幸福。"}]},{"text":"在家庭生活中，有很多温暖的回忆。其中最让我难忘的是，有一年我生病住院，妈妈每天都来医院照顾我，一边给我讲故事，一边唠叨我要按时吃药。那时我才真正理解了妈妈对我的关心。","tpl":"在……中，有很多……。其中最让我难忘的是，……。那时我才……。","ph":[["场景",["在家庭生活中","在和父母一起生活的日子里","在我小的时候"]],["举例",["其中最让我难忘的是……","其中印象最深的是……","我至今还记得……"]]],"models":[{"w":"周末 做饭 热闹 爸爸 幸福","t":"在家庭生活中，有很多幸福的回忆。其中最让我难忘的是，每个周末爸爸都会教我做饭。有一次我把鸡蛋炒糊了，全家人都笑了，厨房里特别热闹。那时我才知道，幸福其实就是一家人在一起的这些小事。"}]}],"prac":"奶奶 照顾 健康 陪伴 感动","refs":["我的奶奶是一个特别坚强的人。只要家里有人生病，她就会细心地照顾，自己却从来不说累。以前我觉得这是理所当然的，后来我才明白她付出了多少。现在奶奶年纪大了，身体不太健康，我常常回家陪伴她。有奶奶在，我总是很感动。","在家庭生活中，有很多让人感动的事。其中最让我难忘的是，去年奶奶住院时，全家人轮流到医院照顾她，陪她聊天、散步。奶奶的身体慢慢健康起来了。那时我才明白，家人的陪伴是最好的礼物。"]},"e2":{"title":"短文2：物品类Ⅰ","realImg":{"t":"scene","i":["sign2","person"],"c":"一个人站在路口的指示牌前","v":"Một người đứng trước biển chỉ đường ở ngã tư"},"feat":["图片多是一个具体的物品，如路牌、电池、塑料袋、香烟等。","可以描写它反映出的某种社会现象。","最后提出自己的建议。"],"tryImg":{"t":"scene","i":["bag"],"c":"一个装满东西的塑料袋","v":"Một chiếc túi ni-lông đựng đầy đồ"},"ex":[{"text":"在生活中，我们经常看到大量使用塑料袋的现象。我们都知道塑料袋很难自然分解，如果不加以控制，不断地使用下去，结果就可想而知了。所以，我们应该自己带购物袋，只有这样才能真正减少白色污染。","tpl":"在生活中，我们经常看到……的现象。我们都知道……，如果不……，结果就可想而知了。所以，我们应该……，只有这样才能……。","ph":[["描述现象",["在生活中，……的现象随处可见","在我们身边，……每天都在发生","现在，越来越多的人……"]],["因果",["之所以会出现这种现象，是因为……","……造成了……","如果不……，结果就可想而知了"]],["建议",["我们应该……，只有这样才能……","政府应该……","每个人如果都能……，那么……"]]],"models":[{"img":{"t":"scene","i":["battery"],"c":"一堆用完的旧电池","v":"Một đống pin cũ đã dùng hết"},"t":"在生活中，我们经常看到把旧电池和普通垃圾一起扔掉的现象。我们都知道旧电池里有对环境有害的物质，如果不加以管理，随便丢弃，结果就可想而知了。所以，我们应该把旧电池放进专门的回收箱，只有这样才能保护我们的土地和水。"}]},{"text":"说起塑料袋，不可否认，它给我们的生活带来了很多方便，但是它对环境的污染也越来越严重。因此我认为，如果大家还不改变购物习惯，最终会导致我们的生活环境变得越来越差。","tpl":"说起……，不可否认，……，但是……。因此我认为，如果……，最终会导致……。","ph":[["话题",["说起……","谈到……","关于……的问题"]],["观点",["因此我认为，……","所以，我们不能忽视……","因此我希望大家都能……"]]],"models":[{"img":{"t":"scene","i":["laptop","person"],"c":"一个年轻人坐在沙发上看电脑","v":"Một bạn trẻ ngồi trên sofa xem máy tính"},"t":"说起电脑，不可否认，它让我们的工作和学习都变得更方便了，但是很多年轻人每天在电脑前坐十几个小时，很少运动。因此我认为，如果不注意合理安排时间，最终会导致身体越来越差。"}]}],"pracImg":{"t":"scene","i":["car","car","car"],"c":"马路上排着长长的车队","v":"Trên đường ô tô xếp hàng dài"},"refs":["在生活中，我们经常看到堵车的现象。我们都知道私家车的数量增加得越来越快，如果不加以控制，道路只会越来越拥挤，结果就可想而知了。所以，我们应该多坐公共交通工具，只有这样才能减轻交通压力。","说起汽车，不可否认，它让人们出行更方便了，但是汽车太多也带来了堵车和空气污染的问题。因此我认为，如果大家都只想着自己开车，最终会导致城市交通越来越糟糕。"]},"day":3},{"grammar":[{"title":"比较句","base":"A + 比 + B + 形容词（+ 程度/数量）　·　否定：A + 没有/不如 + B + 形容词","baseEx":["今天比昨天更热。","这台机器比那台快得多。","我没有他那么高。","坐公交车不如坐地铁方便。"],"notes":[{"p":"A + 比 + B + 更/还 + 形容词","ex":["这个月的订单比上个月还多。"]},{"p":"A + 比 + B + 形容词 + 一点儿/一些/得多/多了","ex":["这家店的价格比那家便宜一些。","今年的销售额比去年高多了。"]},{"p":"A + 比 + B + 动词 + 得 + 补语","ex":["她比我说得流利。"]},{"p":"A 比 B + 形容词 + 具体数量","ex":["哥哥比我大三岁。","这批货比计划晚到了两天。"]},{"p":"A 比 B + 早/晚/多/少 + 动词 + 数量","ex":["我比他早到了十分钟。","今天比昨天多生产了五百件。"]},{"p":"A + 有/没有 + B +（这么/那么）+ 形容词","ex":["你的汉语有她那么好吗？","这里的冬天没有北方那么冷。"]},{"p":"没有什么比 A 更 + 形容词 + 的了","ex":["没有什么比健康更重要的了。"]}],"real":[{"a":"这次考试比上次难多了。","c":["这次","考试","比","上次","难","多了"]}]}],"ex":[{"a":"坐高铁比坐大巴快多了。","c":["坐","高铁","比","坐","大巴","快","多了"]},{"a":"这件衣服比那件贵一百块。","c":["这件","衣服","比","那件","贵","一百块"]},{"a":"他每天都比别人来得早。","c":["他","每天","都","比","别人","来得","早"]},{"a":"今年的雨没有去年那么多。","c":["今年的","雨","没有","去年","那么","多"]},{"a":"她的汉语说得比我流利。","c":["她的","汉语","说得","比","我","流利"]},{"a":"网上购物比去商店方便。","c":["网上","购物","比","去","商店","方便"]},{"a":"我觉得看书不如看电影有意思。","c":["我","觉得","看书","不如","看电影","有意思"]},{"a":"这个城市一年比一年漂亮。","c":["这个","城市","一年","比","一年","漂亮"]},{"a":"没有什么比家人更重要的了。","c":["没有","什么","比","家人","更","重要的了"]},{"a":"他和他哥哥一样高。","c":["他","和","他哥哥","一样","高"]}],"e1":{"title":"短文1：观念想法","real":"压力 乐观 心态 调整 适合","feat":["词语多是比较抽象的名词、动词、形容词。","常有“压力”“态度”“健康”“责任”这类词。","可以写自己对某个问题的看法。"],"try":"金钱 幸福 重要 追求 满足","ex":[{"text":"对于金钱和幸福的关系，每个人都有不同的看法。就我而言，钱很重要，但它不是幸福的全部。每当看到有人为了追求更多的钱而失去健康时，我都会提醒自己：懂得满足的人，才是真正幸福的人。","tpl":"对于……，每个人都有不同的看法。就我而言，……。每当……时，我都会提醒自己：……。","ph":[["开头",["对于……，每个人都有不同的看法","面对……，不同的人有不同的选择","关于……，大家的想法不一样"]],["表达观点",["就我而言，……","在我看来，……","我始终相信……"]],["自我提醒",["我都会提醒自己……","我常常告诉自己……","我会要求自己……"]]],"models":[{"w":"压力 乐观 心态 调整 适合","t":"对于工作压力，每个人都有不同的看法。就我而言，压力不一定是坏事，关键是要有乐观的心态。每当工作太多、感到累的时候，我都会提醒自己：先停下来，找一个适合自己的方法调整一下，比如散散步、听听音乐，然后再继续努力。"}]},{"text":"我是一个容易满足的人，因为从小父母就告诉我：幸福不在于拥有多少金钱，而在于有没有一颗知足的心。也正是因为如此，我从来不羡慕别人，而是努力追求自己想要的生活。","tpl":"我是一个……的人，因为从小……就告诉我：……。也正是因为如此，我……。","ph":[["自我介绍",["我是一个乐观的人","我是一个做事认真的人","我是一个不怕困难的人"]],["家庭影响",["从小父母就告诉我……","爸爸常常对我说……","妈妈教育我……"]],["结果",["也正是因为如此，……","所以直到现在，我……","这句话一直影响着我"]]],"models":[{"w":"压力 乐观 心态 调整 适合","t":"我是一个很乐观的人，因为从小妈妈就告诉我：遇到压力不要害怕，要学会调整心态。也正是因为如此，不管工作多忙，我都能找到适合自己的放松方式，每天都开开心心地生活。"}]}],"prac":"工作 家庭 平衡 时间 选择","refs":["对于工作和家庭的关系，每个人都有不同的看法。就我而言，两者都很重要，关键是学会平衡。每当工作忙得没有时间陪家人时，我都会提醒自己：再忙也要留一点儿时间给家人，因为家庭是我努力工作的动力。","我是一个很重视家庭的人，因为从小父亲就告诉我：工作是为了让家人生活得更好，不能本末倒置。也正是因为如此，在选择工作时，我更愿意选择离家近、时间比较固定的公司，这样我就能平衡好工作和家庭。"]},"e2":{"title":"短文2：物品类Ⅱ","realImg":{"t":"scene","i":["gift"],"c":"一个包装好的礼物盒","v":"Một hộp quà đã được gói đẹp"},"feat":["图片多是礼物、书、花、手表等具体物品。","可以介绍这个物品的作用和意义。","也可以写和这个物品有关的一段经历。"],"tryImg":{"t":"scene","i":["book"],"c":"一本打开的书","v":"Một cuốn sách đang mở"},"ex":[{"text":"从小我就喜欢看书，喜欢在书里认识不同的世界。我曾经读过一本关于一个小镇医生的小说，他一辈子都在帮助穷人看病。直到现在，那个故事还常常让我想起，做人要善良。","tpl":"从小我就喜欢……，喜欢……。我曾经……。直到现在，……。","ph":[["时间",["从小我就……","上中学的时候，……","工作以后，……"]],["回忆",["我曾经……","记得有一次，……","几年前，……"]],["现在",["直到现在，……","到现在为止，……","现在的我依然……"]]],"models":[{"img":{"t":"scene","i":["watch"],"c":"一块精致的手表","v":"Một chiếc đồng hồ đeo tay tinh xảo"},"t":"从小我就喜欢各种各样的手表，喜欢听它们“嘀嗒嘀嗒”的声音。我曾经收到过一份特别的礼物，那是爷爷年轻时戴过的一块旧手表。直到现在，我还把它放在床头，每次看到它，就好像爷爷还在我身边。"}]},{"text":"书是人类积累知识的重要工具。通过读书，你可以了解不同国家的历史和文化，学会很多做人的道理。当然，读书也能让你在忙碌的生活中安静下来，找到属于自己的快乐。","tpl":"……是……的……。通过……，你可以……，……。当然，……也能……。","ph":[["说明",["……是传递感情的工具","……是用来……的东西","……代表着……"]],["作用",["通过……，你可以……","有了……，我们可以……","当然，它也能……"]]],"models":[{"img":{"t":"scene","i":["flower"],"c":"一束鲜花","v":"Một bó hoa tươi"},"t":"鲜花是人们表达感情的美好礼物。通过不同的花，你可以表达不同的心意，比如玫瑰代表爱情，康乃馨代表对母亲的感谢。当然，鲜花也能让房间变得更漂亮，让人的心情变得更好。"}]}],"pracImg":{"t":"scene","i":["cert"],"c":"一张荣誉证书","v":"Một tấm giấy khen / chứng nhận"},"refs":["从小我就喜欢参加各种比赛，喜欢挑战自己。我曾经参加过一次全市的汉语演讲比赛，并获得了一等奖的证书。直到现在，那张证书还挂在我的房间里，它让我记住了努力的意义。","证书是证明一个人能力的重要材料。通过各种证书，用人单位可以了解你掌握了哪些知识和技能。当然，证书也能给你带来自信，但是最重要的还是真正的能力。"]},"day":4},{"grammar":[{"title":"定语","base":"定语：放在名词前面，修饰、限定中心语（常用“的”）","baseEx":["我看完了桌子上的那本杂志。","这是一家生产电子产品的公司。","她穿着一条蓝色的长裙子。"],"notes":[{"p":"限定性定语：表示范围、领属、时间、数量","ex":["这个月的三次会议都在上海开。","我们公司的员工都很年轻。"]},{"p":"描写性定语：表示性质、状态、用途、材料","ex":["这是一张木头做的桌子。","他是一个很有经验的工程师。"]},{"p":"多个定语的顺序：领属 + 数量 + 动词短语 + 形容词 + 名词","ex":["我们公司那两台新买的大型打印机","她是一位工作认真、让人放心的会计。"]}],"real":[]},{"title":"补语","base":"结果补语 · 趋向补语 · 可能补语 · 程度补语 · 时量补语","baseEx":[],"notes":[{"p":"1. 结果补语：动词 + 形容词/动词","ex":["洗干净、说清楚、写错、看完、听懂、找到、卖光"]},{"p":"2. 趋向补语：动词 + 上来/下去/进来/出去/回来/过来/起来……","ex":["他把箱子搬上来了。","老师走进教室来了。"]},{"p":"3. 可能补语：动词 + 得/不 + 补语","ex":["字太小了，我看不清楚。","这么多菜，我们吃得完吗？"]},{"p":"4. 程度补语：动词/形容词 + 得 + 补语","ex":["她跑得很快。","他高兴得跳了起来。"]},{"p":"5. 时量补语：表示持续多长时间","ex":["我学了两年汉语。","他已经离开公司半年了。"]}],"real":[{"a":"这是一个很有意义的活动。","c":["这是","一个","很有","意义的","活动"]},{"a":"他把报告写得很清楚。","c":["他","把","报告","写得","很","清楚"]}]}],"ex":[{"a":"她是一位有二十年经验的医生。","c":["她","是","一位","有","二十年","经验的","医生"]},{"a":"我买了一台很好用的洗衣机。","c":["我","买了","一台","很","好用的","洗衣机"]},{"a":"这是一本介绍中国历史的书。","c":["这","是","一本","介绍","中国","历史的","书"]},{"a":"那个穿红衣服的女孩是我妹妹。","c":["那个","穿","红衣服的","女孩","是","我妹妹"]},{"a":"我们正在讨论一个很重要的问题。","c":["我们","正在","讨论","一个","很","重要的","问题"]},{"a":"他把书放回书架上去了。","c":["他","把","书","放回","书架上","去了"]},{"a":"这么多工作今天做得完吗？","c":["这么","多","工作","今天","做得完","吗"]},{"a":"她紧张得说不出话来。","c":["她","紧张得","说不出","话来"]},{"a":"我在这家公司工作了五年。","c":["我","在","这家","公司","工作了","五年"]},{"a":"孩子们从教室里跑了出来。","c":["孩子们","从","教室里","跑了","出来"]}],"e1":{"title":"短文1：社会工作","real":"创业 困难 坚持 经验 成功","feat":["词语多和学习、工作、事业有关。","可以写自己工作或成长的经历。","最后写出自己的体会。"],"try":"毕业 应聘 面试 机会 努力","ex":[{"text":"大学毕业以后，我去一家外贸公司应聘。经过三轮面试，我终于得到了这份工作。刚开始的时候，我连报价单都不会做，后来在同事的帮助下慢慢学会了。在这段时间里，我明白了：机会只留给努力的人。","tpl":"大学毕业以后，我……。经过……，我……。刚开始的时候，……，后来……。在这段时间里，我明白了：……。","ph":[["经历",["经过几年的努力，……","通过……，我逐渐……","刚开始的时候，……"]],["体会",["在这段时间里，我明白了……","我总结出……","现在我才意识到……"]],["工作相关",["积累经验","提高能力","得到领导的认可","和同事合作"]]],"models":[{"w":"创业 困难 坚持 经验 成功","t":"大学毕业以后，我和两个朋友一起创业，开了一家小咖啡店。经过两年的经营，我们遇到了很多困难，有一段时间几乎没有客人。刚开始的时候，我们都想过放弃，后来大家一起坚持了下来，还积累了不少经验。在这段时间里，我明白了：成功没有捷径。"}]},{"text":"人生中什么最重要？有的人认为找到一份收入高的工作最重要，有的人认为做自己喜欢的事最重要。而我认为，抓住每一个学习的机会，不断让自己进步，才是最重要的。","tpl":"人生中什么最重要？有的人认为……最重要，有的人认为……最重要。而我认为，……，才是最重要的。","ph":[["提问",["人生中什么最重要？","什么样的工作才是好工作？","成功到底是什么？"]],["观点",["有的人认为……，有的人认为……","而我认为……","就我而言，……"]]],"models":[{"w":"创业 困难 坚持 经验 成功","t":"人生中什么最重要？有的人认为年轻时就要创业，早点儿成功最重要；有的人认为先在大公司积累经验最重要。而我认为，不管选择哪条路，遇到困难时能坚持下去，才是最重要的。"}]}],"prac":"青年 志愿者 服务 社会 收获","refs":["大学毕业以后，我参加了一个青年志愿者项目，去山区的小学教孩子们英语。经过一年的服务，我和孩子们成了好朋友。刚开始的时候，我很不习惯那里的生活，后来慢慢适应了。在这段时间里，我明白了：服务社会，收获最大的其实是自己。","人生中什么最重要？有的人认为赚钱最重要，有的人认为家庭最重要。而我认为，年轻的时候多参加志愿者活动，用自己的能力去服务社会，帮助需要帮助的人，才是最有收获的。"]},"e2":{"title":"短文2：人物类","realImg":{"t":"scene","i":["person","phone"],"c":"一个女孩笑着打电话","v":"Một cô gái vừa cười vừa gọi điện thoại"},"feat":["图片以人物和他的动作为主，如打电话、看书、开会等。","可以写地点、人物外貌、动作和心情。","可以描写画面，也可以编一个故事。"],"tryImg":{"t":"scene","i":["person","laptop"],"c":"一个年轻人在咖啡店用电脑工作","v":"Một bạn trẻ làm việc với máy tính trong quán cà phê"},"ex":[{"text":"在咖啡店的窗边，坐着一位年轻的男士。他穿着白衬衫，戴着眼镜，正在认真地用电脑工作。他的表情很专注，桌上的咖啡已经凉了，他也没有发现。我想他可能是在准备明天的会议吧。","tpl":"在……，坐着/站着一位……。他穿着……，正在……。他的……，……。我想他可能是在……吧。","ph":[["地点",["在公园的长椅上，坐着……","在办公室里，……","在公司门口，站着……","在马路边，……"]],["外貌",["他穿着一身西装","她留着长头发","他戴着一副眼镜","她手里拿着……"]],["猜测",["我想他可能是在……吧","看起来她好像……","我猜他一定……"]]],"models":[{"img":{"t":"scene","i":["person","book"],"c":"一个女孩坐在草地上看书","v":"Một cô gái ngồi trên bãi cỏ đọc sách"},"t":"在学校的草地上，坐着一位可爱的女孩。她穿着运动服，扎着马尾辫，正在安静地看一本书。她看得很入迷，有时候还会轻轻地笑起来。我想那一定是一本很有意思的小说吧。"}]},{"text":"每个人都有属于自己的工作方式，就像图中的这位年轻人。我也是这样，比起办公室，我更喜欢在安静的咖啡店里工作。今天看到这张图片，让我想起了很多自己一边喝咖啡一边工作的下午。","tpl":"每个人都有属于自己的……，就像图中的……。我也是这样，……。今天看到这张图片，让我想起了……。","ph":[["开头",["每个人都有自己的梦想，就像……","每个人都有属于自己的生活方式","就像图中的……一样"]],["联想",["我也是这样，……","我也曾经……","看到这张图片，我想起了……"]]],"models":[{"img":{"t":"scene","i":["child","gift"],"c":"一个小女孩在拆礼物","v":"Một bé gái đang mở quà"},"t":"每个人小时候都有自己的期待，就像图中的这个小女孩。我也是这样，小时候最盼望的就是过生日，因为可以收到礼物。今天看到这张图片，让我想起了很多小时候拆礼物的快乐时光。"}]}],"pracImg":{"t":"scene","i":["person","tree"],"c":"一个女孩坐在公园的树下写东西","v":"Một cô gái ngồi dưới gốc cây trong công viên viết gì đó"},"refs":["在公园的大树下，坐着一位漂亮的女孩。她穿着白色的连衣裙，戴着一顶草帽，手里拿着一支笔，正在本子上写着什么。她的脸上带着淡淡的微笑，我想她可能是在写日记吧。","每个人都有属于自己的放松方式，就像图中的这位女孩。我也是这样，周末喜欢一个人去公园，坐在树下写写东西。今天看到这张图片，让我想起了很多安静又美好的下午。"]},"day":5},{"grammar":[{"title":"连动句","base":"主语 + 动词1（+ 宾语1）+ 动词2（+ 宾语2）","baseEx":["我去银行办业务。","他坐地铁上班。","我们没有时间吃午饭。"],"notes":[{"p":"两个动作有先后或目的关系，动词1常表示方式或去哪儿","ex":["她去超市买东西。","我来中国学习汉语。"]},{"p":"状语一般放在第一个动词前面","ex":["你马上去通知大家。","他也坐飞机去北京。"]},{"p":"表示方式、工具的动词短语放在前面","ex":["他用汉语介绍产品。","我骑车去公司。"]},{"p":"否定词放在第一个动词前面","ex":["他不坐公交车上班。","我们没去机场接他。"]}],"real":[{"a":"他周末常常去图书馆看书。","c":["他","周末","常常","去","图书馆","看书"]},{"a":"请您到前台办理手续。","c":["请","您","到","前台","办理","手续"]}]}],"ex":[{"a":"我下班后去健身房锻炼。","c":["我","下班后","去","健身房","锻炼"]},{"a":"她用手机付钱。","c":["她","用","手机","付钱"]},{"a":"我们开车去郊区玩儿。","c":["我们","开车","去","郊区","玩儿"]},{"a":"他拿着文件走进了办公室。","c":["他","拿着","文件","走进了","办公室"]},{"a":"老师站起来回答问题。","c":["老师","站起来","回答","问题"]},{"a":"我去邮局寄包裹。","c":["我","去","邮局","寄","包裹"]},{"a":"他们坐着聊天。","c":["他们","坐着","聊天"]},{"a":"我打算明年去中国留学。","c":["我","打算","明年","去","中国","留学"]},{"a":"经理没空参加这次活动。","c":["经理","没","空","参加","这次","活动"]},{"a":"请大家排队买票。","c":["请","大家","排队","买票"]}],"e1":{"title":"短文1：经验与教训","real":"挑战 失败 经验 自信 收获","feat":["词语多是抽象的名词、动词、形容词。","常和经历的过程、结果有关。","可以写一次经历，以及从中得到的经验或教训。"],"try":"熬夜 身体 后悔 习惯 健康","ex":[{"text":"上个月我生了一场病。为了完成工作，我连续一个星期熬夜，结果发烧住进了医院。躺在病床上的时候，我非常后悔。我终于明白：只有养成健康的生活习惯，才能有好的身体，才能更好地工作。","tpl":"上个月我……。为了……，我……，结果……。……的时候，我……。我终于明白：只有……，才能……，才能……。","ph":[["时间与感悟",["那段时间，……","直到……，我才知道……","从那以后，我再也不……了","这次经历让我明白……"]],["条件关系",["只有……，才……","只要……，就……","无论……，都……","不管……，都……"]]],"models":[{"w":"挑战 失败 经验 自信 收获","t":"上个月我参加了公司的演讲比赛。为了挑战自己，我准备了很久，结果还是失败了。比赛结束的时候，我很难过。可是我终于明白：只有不断积累经验，才能变得更自信，才能有更大的收获。"}]},{"text":"改掉熬夜的习惯，在开始的时候往往很难，但是，如果你能坚持每天按时睡觉，时间长了，身体就会慢慢变好。健康的作息对我们的工作和生活都有很大的好处。所以，从今天开始早点儿睡吧！","tpl":"……在开始的时候往往……，但是，如果……，时间长了，……就……。……对……有很大的好处。所以，……吧！","ph":[["变化",["在开始的时候往往……","时间长了，……","随着时间的推移，……","越来越……"]],["影响",["对……有好处/有坏处","对……有帮助","会影响……","……有利于……"]],["鼓励",["加油！","坚持就是胜利！","失败是成功之母！"]]],"models":[{"w":"挑战 失败 经验 自信 收获","t":"接受新的挑战在开始的时候往往会失败，但是，如果你不放弃，时间长了，就会积累越来越多的经验。这些经验对你以后的工作有很大的好处，也会让你变得更自信。所以，勇敢地去试试吧！"}]}],"prac":"马虎 错误 损失 认真 检查","refs":["上个月我在工作中犯了一个错误。因为做事马虎，我在订单上多写了一个零，结果给公司带来了不小的损失。被经理批评的时候，我很难过。我终于明白：只有认真检查，才能避免错误，才能得到大家的信任。","改掉马虎的毛病，在开始的时候往往很难，但是，如果你能坚持做完每件事都再检查一遍，时间长了，错误就会越来越少。认真的态度对工作有很大的好处，能帮公司减少损失。所以，做事一定要认真！"]},"e2":{"title":"短文2：图标类Ⅲ","feat":["图片多是提示性的图标，没有人物。","目的是提醒、警告或者劝阻人们。","可以写一个和它有关的故事，也可以解释它的作用。"],"tryImg":{"t":"sign","i":"sos","ban":0,"l":"紧急求助"},"ex":[{"text":"有一次，我在外地出差，晚上回酒店的路上钱包被偷了。当时我又着急又害怕，后来想起了紧急求助电话，就马上打了110。警察很快就来了，最后帮我找回了钱包。现在想起来，我还很感谢那位警察。","tpl":"有一次，……，当时……，后来……，最后……。现在想起来，……。","ph":[["回忆",["有一次，……","几年前，……","在我上大学的时候，……"]],["心情",["又着急又害怕","又高兴又激动","又难过又后悔"]],["结束",["最后，……","最终，……","现在想起来，……"]]],"models":[{"img":{"t":"sign","i":"seat","ban":0,"l":"老弱病残孕专座"},"t":"有一次，我坐地铁去上班，当时车上人很多，我好不容易找到一个座位。后来上来一位抱着孩子的妈妈，我看到座位旁边“爱心专座”的标志，就马上站起来让给了她。最后她笑着对我说了声谢谢。现在想起来，我心里还是暖暖的。"}]},{"text":"这是一个我们经常能看到的图标，它提醒我们：遇到危险或者紧急情况时，要马上求助。比如在中国，110是报警电话，119是火警电话，再比如120是急救电话。这些电话都是免费的。","tpl":"这是一个我们经常能看到的……，它提醒我们：……。比如……，再比如……。","ph":[["提醒",["它提醒我们：不要……","它告诉人们，在……的时候，要……","它让我们注意……"]],["举例",["比如……，再比如……","例如……，又如……"]]],"models":[{"img":{"t":"sign","i":"camera","ban":1,"l":"禁止拍照"},"t":"这是一个我们经常能看到的图标，它提醒我们：在一些特殊的地方不能拍照。比如博物馆里的一些珍贵文物，强光会对它们造成伤害，再比如有的展览涉及个人隐私。所以，看到这个图标，我们一定要遵守规定。"}]}],"pracImg":{"t":"sign","i":"quiet","ban":0,"l":"请保持安静"},"refs":["有一次，我和朋友去图书馆学习，当时旁边有两个学生一直在大声聊天。后来，图书馆的工作人员走过来，指了指墙上“请保持安静”的标志，他们才不好意思地停了下来。最后大家都能安心地看书了。现在想起来，遵守规则真的很重要。","这是一个我们经常能看到的图标，它提醒我们：在一些公共场所要保持安静。比如图书馆、医院，再比如电影院和考场。在这些地方大声说话，会影响别人，所以我们要自觉遵守。"]},"day":6},{"grammar":[{"title":"兼语句","base":"主语 + 动词1 + 兼语（既是宾语又是主语）+ 动词2/形容词……","baseEx":["经理让我写一份报告。","老师请我们介绍自己。","这个消息使大家很兴奋。"],"notes":[{"p":"主语 + 叫/让/使/令 + 兼语 + 谓语","ex":["加班太多让人很累。","他的话令大家很失望。"]},{"p":"主语 + 请/要求/鼓励/派/邀请 + 兼语 + 动词短语","ex":["公司派他去越南工作。","我们邀请客户参观工厂。"]},{"p":"主语 + 有 + 兼语 + 动词短语","ex":["我有个同事会说三种语言。"]},{"p":"常见兼语动词","ex":["让、叫、使、令、请、派、要求、鼓励、允许、邀请、劝、帮助、提醒、命令、组织、推荐"]}],"real":[{"a":"客户要求我们下周交货。","c":["客户","要求","我们","下周","交货"]},{"a":"这件事让我很感动。","c":["这件事","让","我","很","感动"]}]}],"
