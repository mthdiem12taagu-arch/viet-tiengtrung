<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK5 Viết · 25 ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm study companion, precise like an exam booklet
   IDEA: 方格稿纸 — the HSK answer grid paper; every writing box is live grid paper
   PICTURE: home = 25-cell grid sheet, each day a cell stamped 完 when done
   COLOUR+TYPE: white paper, ink slate, jade grid lines, gold stamp; Noto Serif SC for Chinese, Be Vietnam Pro for UI
   LAYOUT: one centred column ≤ 860px, sticky top bar, bottom tab bar for iPad/phone thumbs */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161a);--paper:light-dark(#fbfcfb,#151d22);--ink:light-dark(#1c2430,#e6ebef);--mute:light-dark(#5d6873,#9aa7b2);--grid:light-dark(#2f8f6b,#4fbf95);--gridl:light-dark(#d5ebe1,#23413a);--gold:light-dark(#b8860b,#e0b546);--goldl:light-dark(#fbf1d6,#3a3115);--line:light-dark(#e3e8ec,#26323a);--warn:light-dark(#a0522d,#e39a6c);--warnl:light-dark(#fbeee3,#3a2618);--ok:light-dark(#1f7a5c,#5fd0a6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
.zh,.cn{font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.brand{font-weight:700;font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.brand .cn{font-size:18px}
.tog{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:14px}
.tog[aria-pressed=true]{border-color:var(--grid);color:var(--grid);font-weight:600}
main{max-width:860px;margin:auto;padding:18px 14px 30px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:170px;text-align:center;padding:9px 4px 10px;color:var(--mute);text-decoration:none;font-size:13px;line-height:1.2}
nav.tabs a b{display:block;font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;margin-bottom:2px}
nav.tabs a.on{color:var(--grid)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;margin:6px 0 6px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:28px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
.lead{color:var(--mute);margin:0 0 14px}
.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px solid var(--grid);background:var(--paper)}
.cell{aspect-ratio:1.35;border:1px solid var(--gridl);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);padding:4px;text-align:center}
.cell:hover{background:color-mix(in srgb,var(--grid) 6%,transparent)}
.cell .n{font-family:"Noto Serif SC",serif;font-size:clamp(20px,4.5vw,32px);font-weight:700;line-height:1}
.cell .t{font-size:11px;color:var(--mute);line-height:1.25;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.mock .n{color:var(--grid)}
.cell .stamp{position:absolute;top:5px;right:5px;width:26px;height:26px;border:2px solid var(--gold);color:var(--gold);border-radius:50%;font:700 13px/22px "Noto Serif SC",serif;text-align:center;transform:rotate(-12deg)}
.cell.cur{outline:3px solid var(--gold);outline-offset:-3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px}
.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.pri{color:#fff;background:var(--grid);border-color:var(--grid);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
@media(max-width:600px){.cell{aspect-ratio:1}}
.btn.sm{min-height:36px;padding:0 11px;font-size:14px;border-radius:10px;font-weight:500}
.btn:focus-visible,.tog:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--paper);margin:12px 0}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:57px;background:var(--bg);z-index:5}
.seg button{flex:none;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--paper);font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pat{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;background:var(--goldl);border-radius:10px;padding:8px 12px;display:inline-block;margin:4px 0 8px}
.s{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.s .zh{font-size:19px;line-height:1.7}
.py{grid-column:1/-1;color:var(--grid);font-size:14px;line-height:1.5;display:none}
body.showpy .py{display:block}
.say{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;flex:none}
.say svg{width:18px;height:18px}
.label{font-size:13px;font-weight:700;color:var(--grid);margin:16px 0 4px;text-transform:none}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.w{border:1px solid var(--gridl);border-radius:10px;padding:4px 10px;background:var(--paper);text-align:center;line-height:1.25}
.w .cn{font-size:20px;font-weight:700;display:block}
.w small{font-size:12px;color:var(--mute)}
.w.used{border-color:var(--grid);background:color-mix(in srgb,var(--grid) 10%,transparent)}
.tpl{border:2px solid var(--grid);border-radius:14px;padding:14px;margin:10px 0;background:var(--paper)}
.tpl .zh{font-size:19px;line-height:1.9}
.essay .zh{font-size:18px;line-height:1.95}
mark{background:var(--goldl);color:inherit;border-bottom:2px solid var(--gold);padding:0 1px}
.hole{display:inline-block;min-width:2em;border-bottom:2px solid var(--grid);color:transparent;cursor:pointer;background:color-mix(in srgb,var(--grid) 8%,transparent);border-radius:3px;user-select:none}
.hole.rev{color:var(--grid);background:none}
.memb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.memb button{min-height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.memb button.on{border-color:var(--grid);color:var(--grid);font-weight:700}
textarea{width:100%;font:18px/1.8 "Noto Serif SC",serif;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:120px}
textarea:focus{outline:2px solid var(--grid)}
.diff{font:18px/1.9 "Noto Serif SC",serif;margin-top:8px}
.diff .g{color:var(--ok)}.diff .m{color:var(--warn);background:var(--warnl);text-decoration:underline}.diff .x{color:var(--mute);text-decoration:line-through}
.gp{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));border:1.5px solid var(--grid);margin-top:8px;max-width:600px}
.gp i{aspect-ratio:1;border:.5px solid var(--gridl);font:normal clamp(11px,2.6vw,20px)/1 "Noto Serif SC",serif;display:flex;align-items:center;justify-content:center}
.gp i.k80{box-shadow:inset 0 -3px 0 var(--gold)}
.cnt{font-weight:700}.cnt.ok{color:var(--ok)}.cnt.low{color:var(--warn)}
.ord .ans{min-height:54px;border:2px dashed var(--gridl);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ord .pool{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:500 18px/1 "Noto Serif SC",serif}
.ord .ans .chip{background:color-mix(in srgb,var(--grid) 10%,var(--paper));border-color:var(--grid)}
.ord.good .ans{border-color:var(--ok);border-style:solid}
.ord.bad .ans{border-color:var(--warn);border-style:solid}
.fb{font-size:15px;margin:4px 0}.fb.good{color:var(--ok)}.fb.bad{color:var(--warn)}
.ordq{border-bottom:1px solid var(--line);padding:10px 0 12px}
.ordq .num{font-weight:700;color:var(--grid);margin-right:6px}
figure{margin:8px 0}
.pic figcaption{font-size:16px;margin-top:4px}.pic.scene{max-width:380px}.ph6{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:18px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--goldl),var(--paper))}figure img{max-width:min(100%,360px);border-radius:10px;border:1px solid var(--line);display:block}
.model{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:var(--paper)}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.phg{margin:6px 0 10px}
.phg .pl{display:flex;flex-wrap:wrap;gap:6px}
.ph{border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--bg);font:17px/1.4 "Noto Serif SC",serif;text-align:left}
.ph small{display:none;font:13px "Be Vietnam Pro",sans-serif;color:var(--grid)}
body.showpy .ph small{display:block}
.fc{border:2px solid var(--grid);border-radius:18px;padding:22px 18px;min-height:240px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.fc .kind{font-size:13px;color:var(--mute)}
.fc .q{font:24px/1.7 "Noto Serif SC",serif}
.fc .qv{font-size:18px;color:var(--grid)}
.fc .a{border-top:1px dashed var(--line);padding-top:12px;font:20px/1.8 "Noto Serif SC",serif}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.rate button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;line-height:1.2}
.rate button small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.deck{display:flex;flex-wrap:wrap;gap:8px}
.deck label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:40px;background:var(--paper);font-size:14px}
.deck input{width:18px;height:18px;accent-color:var(--grid)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grid)}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.t td.cn{font-size:18px;white-space:nowrap}
.adv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.adv button{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:6px 4px;line-height:1.2}
.adv .cn{font-size:20px;display:block}.adv small{color:var(--grid);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--grid)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute)}
.hl{background:var(--goldl);border-radius:12px;padding:12px 14px}

.rp{font:20px/2 "Noto Serif SC",serif;margin:0 0 6px;text-indent:2em}
.sen{cursor:pointer;border-radius:4px}.sen:hover{background:color-mix(in srgb,var(--grid) 8%,transparent)}.sen.on{background:var(--goldl)}
.vw{border-bottom:2px dotted var(--grid)}
.gm{color:var(--gold);font-weight:700}
.rpy{color:var(--grid);font-size:14px;line-height:1.6;margin:0 0 14px;display:none}body.showpy .rpy{display:block}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qt{font:18px/1.6 "Noto Serif SC",serif;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:17px/1.4 "Noto Serif SC",serif}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.no{border-color:var(--warn);background:var(--warnl)}
.rlist{display:grid;gap:10px}
.rli{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);text-decoration:none;color:var(--ink)}
.rli .n{font:700 26px/1 "Noto Serif SC",serif;color:var(--grid);text-align:center;border-right:1px solid var(--gridl)}
.rli .tt{font:19px/1.3 "Noto Serif SC",serif}
.vi{white-space:pre-line;font-size:15px;line-height:1.7}

.gp.c20{grid-template-columns:repeat(20,minmax(0,1fr));max-width:720px}
.gp.c20 i{font-size:clamp(9px,2vw,17px)}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--grid);text-align:center;color:var(--grid);font-weight:700;padding:0 4px}
.blank.ok{color:var(--ok)}.blank.no{color:var(--warn);border-color:var(--warn)}
select.sel{font:16px "Be Vietnam Pro";min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 8px}
.steps li{margin:4px 0}
.cyl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cyi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);text-align:left}
.cyi .cn{font-size:21px;font-weight:700}.cyi .p{color:var(--grid);font-size:13px}.cyi .v{font-size:14px}.cyi .ex{font:15px/1.6 "Noto Serif SC",serif;color:var(--mute);margin-top:4px}
.big{font-size:44px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--grid);line-height:1}
@media(max-width:600px){nav.tabs a{font-size:10.5px;padding-inline:2px}nav.tabs a b{font-size:18px}}
@media(max-width:600px){.brand .full{display:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:21px}.rate button{font-size:13px}.seg{top:55px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
<div class="brand"><span class="cn">新HSK5级写作</span><span class="full">· học thuộc 25 ngày</span></div>
<button class="tog" id="tPy" aria-pressed="false" title="Hiện/ẩn pinyin">拼音</button>
<button class="tog" id="tSet" title="Cài đặt">Cài đặt</button>
</div></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
<a href="#home" data-t="home"><b>路</b>Lộ trình</a>
<a href="#read" data-t="read"><b>读</b>Đọc hiểu</a>
<a href="#h6" data-t="h6"><b>六</b>HSK6</a>
<a href="#review" data-t="review"><b>记</b>Ôn tập</a>
<a href="#drill" data-t="drill"><b>练</b>Luyện nhanh</a>
<a href="#appendix" data-t="appendix"><b>附</b>Phụ lục</a>
</nav>

<script>
const D={"h6":{"bing":[{"o":["这本书的作者是一位著名的历史学家。","通过这次培训，使我的业务水平有了很大的提高。","他每天早上都会去公园跑半个小时步。","春天到了，公园里的花都开了。"],"a":1,"e":"Thiếu chủ ngữ: “通过……，使……” làm câu mất chủ ngữ. Sửa: bỏ “通过” hoặc bỏ “使”."},{"o":["我们要尽量避免不犯同样的错误。","这家餐厅的菜不但好吃，而且价格也很合理。","经过三年的努力，他终于考上了理想的大学。","她把房间收拾得干干净净。"],"a":0,"e":"Phủ định thừa: “避免” đã mang nghĩa “tránh”, thêm “不” thành nghĩa ngược. Sửa: 避免犯同样的错误。"},{"o":["看了这部电影，大家都很受感动。","能否保持良好的心态，是考试取得好成绩的关键。","他是我见过的最认真负责的人之一。","这次会议讨论并通过了明年的工作计划。"],"a":1,"e":"Hai mặt – một mặt: “能否” (có hay không) đi với “取得好成绩” (một mặt). Sửa: 保持良好的心态，是……的关键。"},{"o":["截至今年十月底，公司已经完成了全年任务的百分之九十。","为了提高工作效率，公司引进了一套新的管理系统。","大约有三百人左右参加了这次活动。","他的建议得到了大家的一致认可。"],"a":2,"e":"Trùng lặp nghĩa: “大约” và “左右” cùng nghĩa “khoảng”. Chỉ giữ một từ."},{"o":["我们要发扬和继承中华民族的优秀传统。","这件事给我留下了深刻的印象。","他的汉语水平提高得很快。","这座城市的人口比十年前增加了一倍多。"],"a":0,"e":"Sai trật tự logic: phải “继承” (kế thừa) trước rồi mới “发扬” (phát huy). Sửa: 继承和发扬。"},{"o":["他穿着一件白衬衫和一顶黑帽子。","这个消息让大家非常兴奋。","由于天气原因，航班推迟了两个小时。","这家公司的产品远销世界各地。"],"a":0,"e":"Kết hợp sai: “穿” không đi với “帽子”. Sửa: 穿着一件白衬衫，戴着一顶黑帽子。"},{"o":["随着经济的发展，人们的生活水平不断提高。","他的报告引起了领导的高度重视。","我们的任务已经提前三天完成了。","只要努力学习，才能取得好成绩。"],"a":3,"e":"Sai cặp liên từ: “只要……就……” / “只有……才……”. Sửa: 只有努力学习，才能……"},{"o":["他是一个经验丰富的老师。","这篇文章的观点很新颖，语言也很生动。","不管天气多么冷，他都坚持每天跑步。","我们一定要防止类似的事故不再发生。"],"a":3,"e":"Phủ định thừa: “防止” đã là “ngăn không cho xảy ra”, thêm “不再” thành nghĩa ngược. Sửa: 防止类似的事故再次发生。"},{"o":["这家工厂的产量今年比去年降低了一倍。","他从小就对音乐产生了浓厚的兴趣。","我们终于找到了解决问题的办法。","她一边听音乐，一边做作业。"],"a":0,"e":"Sai logic số liệu: “giảm” không dùng “一倍” (giảm một lần là về 0). Dùng phân số: 降低了一半 / 百分之五十。"},{"o":["他的成功离不开家人的支持。","关于这个问题，我们明天再讨论吧。","这个问题我们已经讨论很多次了。","在老师的帮助下，取得了很大的进步。"],"a":3,"e":"Thiếu chủ ngữ: “在……下” là trạng ngữ, câu không có ai “取得进步”. Sửa: 在老师的帮助下，我取得了很大的进步。"}],"fill":[{"t":"人们常说“早起的鸟儿有虫吃”，很多成功人士都有早起的（1）。研究（2），早上是大脑最清醒的时候，这时候学习或工作，效率会比较高。不过，专家也提醒，早起的前提是要保证充足的睡眠，（3）反而会影响健康。","o":["习惯 表明 否则","风俗 证明 因此","规矩 说明 然而","爱好 显示 何况"],"a":0,"e":"习惯 thói quen (风俗 phong tục của cộng đồng); 研究表明 cố định; 否则 “nếu không thì”."},{"t":"茶已经成为中国人日常生活中不可（1）的一部分。朋友来了，（2）上一杯热茶，是表示欢迎和尊重；一家人坐在一起喝茶聊天，既轻松又（3）。","o":["缺乏 煮 温柔","缺少 泡 温馨","欠缺 炒 温和","短缺 烤 暖和"],"a":1,"e":"不可缺少 cụm cố định; 泡茶 pha trà; 温馨 ấm cúng (dùng cho không khí gia đình)."},{"t":"在职场中，沟通能力（1）重要。很多工作上的误会，并不是因为能力不够，（2）因为沟通不到位。一个善于沟通的人，能够准确地表达自己的想法，也能耐心地（3）别人的意见，这样团队合作才会更加顺利。","o":["特殊 而且 听见","非常 所以 打听","格外 而是 倾听","尤其 但是 听说"],"a":2,"e":"不是……而是…… cặp cố định; 倾听意见 lắng nghe ý kiến; 格外重要 = đặc biệt quan trọng."},{"t":"随着网络购物的（1），快递行业发展得越来越快。然而，大量的快递包装也带来了严重的环境问题。为了（2）浪费，一些快递公司开始使用可以重复利用的包装盒，消费者也可以把包装（3）给快递员回收。","o":["普遍 缩小 给予","普通 降低 送","广泛 减轻 递","普及 减少 交"],"a":3,"e":"……的普及 sự phổ cập (danh từ); 减少浪费 giảm lãng phí; 交给 giao cho."},{"t":"有些人遇到困难就容易放弃，（1）有些人却能坚持到底。心理学家认为，这和一个人的“心理弹性”有关。心理弹性强的人，（2）遇到多大的挫折，都能很快调整好自己的心态，把困难看作（3）的机会。","o":["而 无论 成长","但 尽管 发展","并 即使 增长","却 不管 生长"],"a":0,"e":"而 nối hai vế đối lập (vế sau đã có 却 nên D thừa); 无论……都…… ; 成长的机会 cơ hội trưởng thành."}],"sen":[{"t":"很多人都有拖延的习惯，明明知道事情很重要，（1）。心理学研究发现，拖延并不完全是因为懒，（2）。当一项任务看起来太难或者太大的时候，人们会本能地想要逃避。\n那么，怎样才能改掉拖延的习惯呢？专家建议，（3）。比如，要写一份十页的报告，可以先给自己定一个小目标：今天只写一页。（4），压力就会小很多，开始行动也就变得容易了。另外，完成一个小目标后，可以适当地奖励一下自己，（5）。","o":["而是和人们害怕失败的心理有关","却总是一拖再拖","可以把大任务分成几个小任务","这样能让人更有动力继续下去","当任务变小了以后"],"a":[1,0,2,4,3]},{"t":"中国的高铁被称为“中国速度”的代表。（1），中国已经建成了世界上规模最大的高速铁路网。如今，从北京到上海，坐高铁只需要四个多小时，（2）。\n高铁不仅缩短了城市之间的距离，（3）。很多年轻人选择“双城生活”：在一个城市工作，周末坐高铁回另一个城市的家。对于游客来说，（4），说走就走的旅行变得越来越普遍。\n当然，高铁的发展也面临一些问题，比如建设成本高、部分线路乘客少等。（5），是未来需要继续思考的问题。","o":["经过十几年的快速发展","如何让高铁更好地服务于社会","而以前坐普通火车要十几个小时","高铁让短途旅行更加方便","也改变了人们的生活方式"],"a":[0,2,4,3,1]}],"long":[{"title":"断舍离","t":["“断舍离”这个词最早来自日本，近几年在中国的年轻人中也流行起来。所谓“断”，是指不买不需要的东西；“舍”，是指扔掉家里没用的东西；“离”，是指不再执着于物品，让自己从对物品的依赖中解放出来。","很多人家里都堆满了东西：几年没穿过的衣服、只用过一次的厨房用具、舍不得扔的旧杂志……这些东西不仅占用了空间，也会让人感到压力。有研究表明，生活在杂乱环境中的人，更容易感到焦虑，工作效率也更低。","实行“断舍离”并不容易。很多人在整理的时候总会想：“这个以后可能还用得上。”其实，如果一件东西一年都没有用过，那么以后用到它的可能性也很小。专家建议，整理物品时可以问自己三个问题：我现在需要它吗？它适合现在的我吗？它会让我感到开心吗？如果三个答案都是否定的，就可以考虑把它送人或者捐出去。","值得注意的是，“断舍离”的目的不是让人过苦日子，而是学会选择。当我们只留下真正需要和喜欢的东西时，生活会变得更简单，内心也会更加轻松。"],"q":[["根据第一段，“舍”指的是：",["不买不需要的东西","扔掉家里没用的东西","不再依赖物品","把东西送给朋友"],1],["根据第二段，生活在杂乱环境中的人：",["更有创造力","更容易感到焦虑","更节约","更开心"],1],["专家建议整理物品时应该：",["把东西全部扔掉","先问自己三个问题","请别人帮忙整理","每年整理一次"],1],["作者认为“断舍离”的目的是：",["过苦日子","节省钱","学会选择","方便搬家"],2]]},{"title":"远程办公","t":["疫情以后，越来越多的公司开始尝试远程办公，也就是员工不用每天去办公室，而是在家里通过网络完成工作。","对员工来说，远程办公最大的好处是节省了通勤时间。在大城市，很多人每天花在上下班路上的时间超过两个小时。在家工作，这些时间就可以用来休息、锻炼或者陪伴家人。对公司来说，远程办公可以减少办公室租金等费用，还能招聘到住在其他城市的优秀人才。","不过，远程办公也带来了新的问题。首先，工作和生活的界限变得模糊了。有的员工发现，在家工作反而比在公司更累，因为晚上十点了还在回复工作消息。其次，同事之间缺少面对面的交流，团队的凝聚力可能会下降，新员工也很难快速融入团队。","因此，越来越多的公司选择了“混合办公”的方式：每周有几天在办公室，几天在家里。这样既能保持工作的灵活性，又能保证团队之间的沟通。专家认为，未来的办公方式不会只有一种，关键是找到适合公司和员工的平衡点。"],"q":[["对员工来说，远程办公最大的好处是：",["工资更高","节省通勤时间","工作更少","不用开会"],1],["下面哪一项不是远程办公给公司带来的好处？",["减少办公室租金","能招聘其他城市的人才","提高团队凝聚力","减少办公费用"],2],["有的员工觉得在家工作更累，是因为：",["家里网络不好","工作和生活的界限模糊了","家里太吵","没有电脑"],1],["根据短文，“混合办公”是指：",["只在家工作","只在办公室工作","每周有几天在办公室，几天在家","和别的公司一起办公"],2]]},{"title":"为什么我们记不住梦","t":["几乎每个人都有过这样的经历：早上醒来的时候，明明记得自己做了一个很有意思的梦，可是起床刷个牙的工夫，梦的内容就忘得差不多了。这是为什么呢？","科学家认为，这和大脑在睡眠时的工作方式有关。人在做梦时，大脑中负责把短期记忆转化为长期记忆的区域并不活跃，因此梦的内容只能暂时保存在短期记忆里。醒来以后，如果我们不马上回忆或者记录，这些内容很快就会被新的信息“覆盖”。","另外，梦的内容往往没有逻辑，场景变化快，人物也常常莫名其妙地出现和消失。和有完整情节的故事相比，这种杂乱的信息本来就更难记住。","有趣的是，有些人能比别人记住更多的梦。研究发现，这类人在睡眠中更容易短暂醒来，而这些短暂的清醒时刻，给了大脑记录梦境的机会。如果你想记住自己的梦，可以在床边放一个本子，醒来后先别着急起床，闭着眼睛回忆一下，再把它写下来。坚持一段时间，你会发现记住的梦越来越多。"],"q":[["根据第二段，梦的内容为什么容易忘记？",["梦的时间太短","负责转化长期记忆的区域不活跃","大脑完全休息了","梦不重要"],1],["第三段主要说明梦的内容：",["很有逻辑","杂乱，所以难记","非常有意思","和现实一样"],1],["能记住更多梦的人有什么特点？",["睡得更多","在睡眠中更容易短暂醒来","记忆力特别好","很少做梦"],1],["如果想记住梦，作者建议：",["早点儿睡觉","醒来马上起床","醒来后先回忆再写下来","睡前多喝水"],2]]}],"l1":[{"t":"很多人以为喝咖啡会让人脱水，其实，适量喝咖啡并不会造成身体缺水。专家建议，健康的成年人每天喝咖啡最好不要超过三杯。","o":["咖啡会让人脱水","每天喝咖啡最好不超过三杯","咖啡对身体没有好处","成年人不能喝咖啡"],"a":1},{"t":"小王第一次去朋友家做客，带了一束菊花。朋友的妈妈看到以后，脸色马上变了。原来，在中国，菊花一般是用来纪念去世的人的。","o":["小王常去朋友家","朋友的妈妈很喜欢菊花","在中国，菊花常用来纪念去世的人","小王送了一盒点心"],"a":2},{"t":"这家书店晚上不关门，二十四小时营业。很多年轻人下班以后来这里看书，有的人甚至一直待到天亮。书店老板说，他希望给城市里的人留一盏灯。","o":["书店二十四小时营业","书店晚上十点关门","书店只卖杂志","老板不喜欢年轻人"],"a":0},{"t":"面试的时候，第一印象非常重要。研究表明，面试官往往在见面后的前几分钟就已经对应聘者形成了基本的判断。所以，穿着整洁、准时到达，是面试成功的第一步。","o":["面试时间越长越好","穿着不太重要","面试官很少做判断","第一印象在面试中非常重要"],"a":3},{"t":"熊猫看起来胖胖的，动作也很慢，但其实它们是爬树的高手。小熊猫出生几个月以后，就能自己爬到很高的树上去休息了。","o":["熊猫爬树很厉害","熊猫不会爬树","小熊猫一出生就会爬树","熊猫动作很快"],"a":0},{"t":"老李退休以后，开始学习画画。刚开始，他连一条直线都画不好。但是他每天坚持练习三个小时，五年后，他的作品竟然在市里的画展上获了奖。","o":["老李年轻时是画家","老李放弃了画画","老李每天练习三个小时","老李的作品没有获奖"],"a":2},{"t":"很多公司规定，员工在报销费用的时候，必须提供正规的发票。没有发票，或者发票上的信息不完整，财务部门是不能报销的。","o":["报销不需要发票","发票信息可以不完整","财务部门不管报销","报销时必须提供正规发票"],"a":3},{"t":"“塞翁失马，焉知非福”这句话告诉我们，坏事在一定条件下也可能变成好事。所以遇到不顺利的事情时，不要太难过。","o":["坏事永远是坏事","坏事有时也可能变成好事","应该多养马","遇到困难要放弃"],"a":1}],"l3":[{"title":"机场广播","t":"各位乘客，大家好。由于前方天气原因，本次航班将推迟大约四十分钟起飞。在等待期间，我们将为您提供免费的饮料和小吃。需要转机的乘客，请到登机口旁边的服务台办理相关手续，工作人员会帮您重新安排后面的航班。给您带来的不便，我们深表歉意，感谢您的理解和配合。","q":[["航班为什么推迟？",["飞机出了故障","天气原因","乘客太多","机场太忙"],1],["航班大约推迟多长时间？",["二十分钟","半个小时","四十分钟左右","一个小时"],2],["需要转机的乘客应该怎么做？",["先回家","去服务台办理手续","给航空公司打电话","在座位上等广播"],1]]},{"title":"采访：咖啡店老板","t":"记者：您的咖啡店开了五年，为什么一直坚持用本地的咖啡豆？老板：我是云南人，小时候家里就种咖啡。很多人不知道，云南咖啡的品质其实很好，只是以前没什么名气。我开这家店，一方面是想让更多人尝到好咖啡，另一方面也是想帮家乡的农民把咖啡卖出去。现在，我们店里百分之八十的咖啡豆都来自云南的小农场。记者：未来有什么打算？老板：明年我们准备在网上开一家店，让全国的顾客都能买到云南咖啡。","q":[["老板是哪里人？",["北京","上海","云南","广东"],2],["店里有多少咖啡豆来自云南？",["一半","百分之八十","全部","百分之二十"],1],["老板明年打算做什么？",["开第二家店","在网上开店","去国外学习","关掉咖啡店"],1]]}],"cy":[["全力以赴","dốc toàn lực","为了完成这个项目，大家都全力以赴。"],["一举两得","một công đôi việc","骑自行车上班既锻炼身体又保护环境，真是一举两得。"],["半途而废","bỏ dở giữa chừng","学习语言最怕半途而废。"],["千方百计","trăm phương nghìn kế","他千方百计地想办法降低成本。"],["实事求是","đúng với thực tế, trung thực","写报告一定要实事求是。"],["迫不及待","nóng lòng không chờ được","一下课，孩子们就迫不及待地跑了出去。"],["津津有味","say sưa, ngon lành","他津津有味地听爷爷讲故事。"],["不可思议","khó tin, không thể tưởng tượng","这么短的时间就完成了任务，真是不可思议。"],["理所当然","lẽ đương nhiên","帮助有困难的同事是理所当然的事。"],["精益求精","đã tốt còn muốn tốt hơn","他对产品质量总是精益求精。"],["一丝不苟","tỉ mỉ, không qua loa chút nào","她工作一丝不苟，从来没出过错。"],["名副其实","danh xứng với thực","这家店的烤鸭名副其实，非常好吃。"],["层出不穷","liên tục xuất hiện","网络上的新词层出不穷。"],["络绎不绝","nườm nượp không dứt","节假日，来参观的游客络绎不绝。"],["兴高采烈", 重。"],["画蛇添足","vẽ rắn thêm chân, làm thừa","文章已经很好了，再加这段就是画蛇添足。"],["守株待兔","ôm cây đợi thỏ","做生意不能守株待兔，要主动寻找客户。"],["塞翁失马","tái ông mất ngựa, họa phúc khó lường","塞翁失马，焉知非福，这次失败也许是好事。"],["自言自语","tự nói một mình","他一边走一边自言自语。"]],"sx":[{"title":"一碗面","topic":"Lòng tốt · tự trọng","text":["二十年前，在一个小县城的火车站旁边，有一家很小的面馆。面馆的老板姓陈，五十多岁，为人热情。他做的牛肉面汤浓肉多，价格却很便宜，所以来吃面的大多是附近干活的工人和赶路的旅客。","一个冬天的晚上，外面下着大雪，面馆快要关门了。这时，门被轻轻推开，走进来一个十几岁的男孩。他穿着一件很薄的旧外套，脸冻得通红。男孩在门口站了很久，才小声问：“老板，一碗面多少钱？”陈老板说：“八块。”男孩低下头，从口袋里掏出一把零钱，数了好几遍，只有五块钱。他红着脸说：“对不起，那我不吃了。”说完转身就要走。","陈老板叫住了他，笑着说：“今天正好有活动，晚上九点以后进门的客人，一碗面只要五块。”男孩愣了一下，眼睛一下子亮了起来。陈老板给他端上了一大碗热腾腾的牛肉面，还特意多加了一个鸡蛋。男孩吃得很香，连汤都喝得干干净净。临走时，他向陈老板深深地鞠了一躬。","其实，面馆从来没有什么“九点以后的活动”。陈老板只是看出了男孩的难处，又不想伤害他的自尊心。","时间一年一年过去，陈老板老了，面馆也因为城市改造被拆掉了。他早就忘了那个下雪的晚上。","去年春天，一个穿着西装的年轻人找到了陈老板的家。他说自己是一家食品公司的经理，想请陈老板做公司的技术顾问，帮助他们开发一款新的牛肉面。陈老板觉得很奇怪：“我只是一个开小面馆的，你为什么找我？”年轻人笑了笑，说：“二十年前的一个雪夜，您用五块钱卖给我一碗面，还多给了我一个鸡蛋。那天我刚从家里跑出来，身上只剩下五块钱，本来已经对生活失去了信心。是那碗面让我知道，这个世界上还有温暖。”","陈老板这才想起来，原来那个男孩就是他。后来，在陈老板的帮助下，那款牛肉面一上市就受到了顾客的欢迎。包装上印着一句话：“一碗热面，温暖一个人。”"],"key":["人物：陈老板（面馆老板）、男孩（后来的食品公司经理）","起因：雪夜，男孩只有5块钱，一碗面8块","经过：陈老板编了“九点以后5块”的活动，还多加一个鸡蛋","转折：二十年后，年轻经理请陈老板做技术顾问","结果：经理就是当年的男孩；新面很受欢迎","主题：善意保护别人的自尊，也会改变别人的一生"],"model":["二十年前，陈老板在一个小县城的火车站旁边开了一家面馆。他为人热情，面做得好吃，价格也便宜。","一个下大雪的晚上，面馆快关门时，一个穿得很少的男孩走了进来。他问一碗面多少钱，陈老板说八块，可是男孩身上只有五块钱，他不好意思地准备离开。陈老板叫住他，说九点以后吃面只要五块钱。其实这个活动根本不存在，陈老板只是想帮助男孩，又不想伤害他的自尊心。他不但给男孩端上了一大碗面，还多加了一个鸡蛋。男孩吃完后向他深深地鞠了一躬。","很多年过去了，面馆被拆了，陈老板也忘了这件事。去年，一位年轻的食品公司经理找到他，请他做公司的技术顾问。原来，这位经理就是当年的那个男孩。那天他从家里跑出来，对生活失去了信心，是那碗面让他感受到了温暖。","在陈老板的帮助下，公司开发的牛肉面很受欢迎，包装上写着：“一碗热面，温暖一个人。”"]},{"title":"一次特别的面试","topic":"Tuyển dụng · thái độ làm việc","text":["李明大学毕业后，一直想进一家有名的外贸公司工作。经过几轮笔试和面试，他终于进入了最后一轮。和他一起参加最后一轮面试的，还有另外四个年轻人，他们都毕业于名牌大学，有的还有国外留学的经历。李明心里很没底。","面试那天，人事部的王经理把五个人带进一间会议室，说：“总经理临时有个重要的会，要晚一个小时才能到，请大家在这里等一下。”说完就离开了。","会议室里很乱，桌子上放着用过的纸杯，地上有几张废纸，椅子也东一把西一把。几个年轻人看了看，有的拿出手机看新闻，有的坐下来复习准备好的材料，还有两个人小声地聊起天来。","李明等了一会儿，觉得有点儿无聊。他想：反正也没事做，不如把会议室收拾一下。于是，他把纸杯扔进了垃圾桶，把地上的废纸捡了起来，又把椅子一把一把摆整齐。有人笑着对他说：“你是来面试的，又不是来打扫卫生的。”李明笑了笑，没有说什么，又顺手给窗台上的花浇了水。","一个小时过去了，王经理回到会议室，宣布面试结果：“谢谢大家，今天的面试已经结束了。李明，恭喜你，你被录取了。”大家都愣住了：“总经理还没来，怎么就结束了？”","王经理解释说：“其实，总经理今天并没有开会。刚才这一个小时，就是最后一轮面试。我们公司做的是外贸生意，每天要处理很多细节，客户最在意的就是我们是不是认真、负责。学历和能力我们在前几轮已经了解了，这一轮，我们想看看大家在没有人注意的时候会怎么做。”","另外几个人听了，都不好意思地低下了头。","后来，李明在这家公司工作了十几年，从一个普通的业务员成长为部门经理。每当有新员工入职，他都会给他们讲这个故事，并告诉他们：机会往往就藏在那些别人看不上的小事里。"],"key":["人物：李明、人事部王经理、另外四个应聘者","起因：最后一轮面试，其他人都是名牌大学毕业，李明没把握","经过：经理说总经理晚到一小时；会议室很乱，只有李明收拾","转折：经理宣布李明被录取——这一小时就是最后一轮面试","原因：外贸工作重细节，公司看重认真负责","结果+道理：李明成了部门经理；机会藏在小事里"],"model":["李明大学毕业后，想进一家有名的外贸公司。经过几轮考试，他和另外四个年轻人进入了最后一轮面试。其他人都毕业于名牌大学，李明心里没有把握。","面试那天，人事经理把他们带进一间会议室，说总经理要晚一个小时才能到，请大家等一下。会议室里又脏又乱，可是大家有的看手机，有的复习材料，有的聊天，谁也没有在意。李明觉得反正没事做，就把会议室收拾得干干净净，还给花浇了水。有人笑话他不是来打扫卫生的，他也没有在意。","一个小时后，经理回来宣布：李明被录取了。大家都很吃惊。经理解释说，总经理根本没有开会，刚才的一个小时就是最后一轮面试。外贸工作要处理很多细节，公司最看重员工是否认真负责，所以想看看大家在没人注意时会怎么做。","后来，李明在这家公司从普通业务员做到了部门经理。他常常告诉新员工：机会往往藏在别人看不上的小事里。"]},{"title":"最后一座房子","topic":"Thái độ quyết định kết quả","text":["有一位老木匠，在一家建筑公司干了四十多年。他手艺好，做事认真，盖的房子又结实又漂亮，老板一直很信任他。","这一年，老木匠六十五岁了。他觉得自己累了，想退休回家，好好陪陪老伴儿，享受一下轻松的生活。他把这个想法告诉了老板。老板很舍不得他，再三挽留，可是老木匠已经下定了决心。最后，老板只好同意了，但是提出了一个请求：“您能不能在走之前，再帮我盖最后一座房子？”老木匠虽然有点儿不情愿，但还是答应了。","可是，大家很快发现，老木匠的心已经不在工作上了。他每天来得很晚，走得很早，选材料的时候也不像以前那样仔细，有的木头有裂缝，他也没有换掉。工人们问他某个地方应该怎么做，他总是不耐烦地说：“随便吧，差不多就行了。”结果，这座房子盖得马马虎虎，跟他以前的作品比起来差远了。","房子终于盖好了，老木匠松了一口气，去找老板告别。老板把一把钥匙放到他的手里，真诚地说：“这些年您辛苦了。这座房子是我送给您的退休礼物，从今天起，它就是您的家了。”","老木匠一下子愣住了，脸红得说不出话来。他心里非常后悔：如果早知道这是给自己盖的房子，他一定会用最好的材料、最认真的态度去做。可是，现在一切都来不及了，他只能住在这座自己亲手盖的、并不满意的房子里。","其实，我们每个人又何尝不是在为自己“盖房子”呢？我们今天的态度，决定了明天住在什么样的“房子”里。每一份工作、每一次学习，都值得我们全力以赴，因为最后住进去的人，正是我们自己。"],"key":["人物：老木匠、老板","起因：干了四十多年，六十五岁想退休","经过：老板请他盖最后一座房子；他心不在焉，马马虎虎","转折：老板把房子作为退休礼物送给他","结果：老木匠非常后悔，只能住在不满意的房子里","道理：今天的态度决定明天的生活，要全力以赴"],"model":["有一位老木匠在建筑公司工作了四十多年，他手艺好，做事认真，老板很信任他。","六十五岁那年，老木匠想退休回家陪老伴儿。老板舍不得他走，但最后还是同意了，只请他在离开前再盖最后一座房子。老木匠答应了，可是他的心已经不在工作上了。他每天来得晚走得早，选材料也不仔细，遇到问题总是说“差不多就行”。结果，这座房子盖得很一般，比他以前的作品差多了。","房子盖好后，老木匠去向老板告别。没想到，老板把钥匙交给他，说这座房子是送给他的退休礼物。老木匠非常吃惊，也非常后悔。如果早知道是给自己盖的，他一定会用最好的材料、最认真的态度。可是一切都来不及了，他只能住在这座自己不满意的房子里。","这个故事告诉我们，我们每个人都在为自己“盖房子”。今天的态度决定了明天的生活，所以做每一件事都应该全力以赴。"]},{"title":"会计小周的“慢”","topic":"Kế toán · cẩn thận","text":["周晴是一家贸易公司的会计，刚工作两年。在同事们眼里，她做事有点儿“慢”：别人一个下午就能做完的报表，她常常要花一天；每一张发票，她都要对着合同和收货单核对两三遍；有时候为了一笔几块钱的差额，她能一直查到晚上八九点。","财务部的老员工张姐常常劝她：“小周，差不多就行了，几块钱的事，没人会在意的。”部门里有人背后笑她太死板，甚至有人觉得她是能力不够，所以才做得慢。周晴听了心里也很委屈，但她觉得，账目上的每一个数字都代表着公司的钱，马虎不得。","去年年底，公司准备和一家大客户签一个很重要的合同。合同签订以前，对方要求检查公司过去三年的财务资料。总经理很紧张，因为这家客户以要求严格出名，以前就有好几家公司因为账目不清楚而失去了合作机会。","检查进行了整整一个星期。最后一天，对方的财务总监专门找到总经理，说：“我们检查过很多公司，你们的账是做得最清楚的。每一张发票都能找到对应的合同，每一笔差额都有说明。说实话，能把账做得这么细的公司，我们放心。”合同顺利签了下来，金额是公司去年全年收入的一半。","在年终总结大会上，总经理特别表扬了周晴，还给她发了一笔奖金。他说：“很多人觉得慢就是效率低。可是在财务工作里，一次‘快’带来的错误，可能需要十次‘慢’来弥补。小周的慢，其实是对公司负责。”","那天晚上，张姐走到周晴的办公桌前，有点儿不好意思地说：“以后我做的报表，也请你帮我再核对一遍吧。”周晴笑着点了点头。从那以后，财务部渐渐形成了一个新习惯：每份报表都至少要核对两遍。"],"key":["人物：会计周晴、老员工张姐、总经理、客户的财务总监","起因：周晴做事“慢”，同事笑她死板","经过：大客户签合同前检查三年财务资料","转折：对方说这家公司的账做得最清楚，合同签成","结果：总经理表扬并发奖金：“一次快的错误要十次慢来弥补”","结尾：同事请她核对报表，部门养成核对两遍的习惯"],"model":["周晴是一家贸易公司的会计。她做事很“慢”：每张发票都要核对好几遍，为了几块钱的差额也会查到很晚。同事们劝她差不多就行，有人笑她死板，还有人觉得她能力不够。她心里很委屈，但仍然认为账目上的每个数字都马虎不得。","去年年底，公司要和一家大客户签一份重要的合同。对方要求严格，先要检查公司三年的财务资料。总经理很紧张，因为以前有不少公司因为账目不清楚失去了机会。检查进行了一个星期，最后对方的财务总监说，他们检查过很多公司，这家公司的账做得最清楚，所以很放心。合同顺利签了下来，金额相当于公司去年收入的一半。","在年终大会上，总经理表扬了周晴，还给她发了奖金。他说在财务工作中，一次“快”带来的错误，可能需要十次“慢”来弥补，周晴的慢是对公司负责。后来，同事们也开始请她帮忙核对报表，财务部渐渐养成了每份报表至少核对两遍的习惯。"]},{"title":"妈妈学手机","topic":"Gia đình · công nghệ","text":["王阿姨今年六十二岁，退休以前是一名小学老师。女儿在外地工作，前年给她买了一部智能手机，希望她能用微信和家里人视频聊天。","可是，王阿姨对这部手机一直很头疼。屏幕上的图标密密麻麻，她常常不知道该点哪一个。有一次，她想给女儿发一张照片，结果不小心把照片发到了女儿公司的工作群里，弄得女儿哭笑不得。还有一次，她在网上看到一条“免费领鸡蛋”的消息，按照提示输入了自己的银行卡号，差一点儿被骗走了一万多块钱。从那以后，她干脆把手机放进了抽屉，只用来接电话。","女儿知道以后，没有责怪她，而是在春节回家的时候，专门花了一个星期教妈妈用手机。她把常用的功能一个一个写在一个小本子上：怎么视频、怎么发照片、怎么用手机付款，还写上了几条“安全提醒”，比如“陌生人发来的链接不要点”“任何人要银行卡密码都不能给”。每教会一个功能，她就让妈妈自己操作三遍。","刚开始，王阿姨学得很慢，常常是学了后面就忘了前面。她有点儿灰心，说：“我老了，学不会这些新东西了。”女儿握着她的手说：“妈，您当年教我写字的时候，也是一笔一画地教了无数遍。现在换我来教您，咱们慢慢来。”","一个月以后，王阿姨不但能熟练地和女儿视频，还学会了在网上买菜、预约挂号。她甚至在小区里开了一个“手机课堂”，每个星期六上午教其他老人用手机。她把女儿写的小本子复印了很多份，发给大家。","王阿姨说：“时代变化得太快了，我们老年人不能被落下。只要有人愿意耐心地教，我们也愿意认真地学。”"],"key":["人物：王阿姨（退休小学老师）、女儿","起因：女儿买了智能手机，王阿姨用不好","经过：错发照片到工作群；差点被骗一万多块；把手机放进抽屉","转折：女儿春节回家教了一个星期，写小本子和安全提醒","结果：学会视频、网上买菜、预约挂号，还开了“手机课堂”","道理：有人耐心教，老年人也愿意认真学"],"model":["王阿姨六十二岁，退休前是小学老师。女儿在外地工作，给她买了一部智能手机，希望能和她视频聊天。","可是王阿姨用不好手机。她曾经把照片错发到女儿公司的工作群里，还差点儿因为相信“免费领鸡蛋”的消息被骗走一万多块钱。从那以后，她就把手机放了起来，只用来接电话。","女儿知道后没有责怪她，春节回家时专门花了一个星期教她。女儿把常用功能写在小本子上，还写了几条安全提醒，每教一个功能就让妈妈自己操作三遍。王阿姨刚开始学得很慢，有点儿灰心，女儿就鼓励她说，当年妈妈教自己写字也很有耐心，现在自己也会耐心地教妈妈。","一个月后，王阿姨不但会和女儿视频，还学会了网上买菜和预约挂号。她还在小区开了“手机课堂”，教其他老人用手机。她认为，时代变化很快，只要有人耐心教，老年人也愿意认真学。"]}]},"read":[{"day":1,"title":"一块被忽视的牌子","mk":["被"],"p":[["我家附近有一个小公园，公园里有一条清澈的小河。","河边竖着一块“禁止钓鱼”的牌子，可是很多人都把它当作看不见。","去年夏天，河里的小鱼几乎被钓光了，河水也被扔进去的垃圾弄脏了。"],["有一天，一位老人在河边捡垃圾，他的行为被附近的孩子们看见了。","孩子们被老人所感动，也开始和他一起打扫河边。","后来，这件事被记者报道了出去，很多市民都来参加活动。"],["现在，河水又变得清清的，小鱼也回来了。","那块曾经被忽视的牌子，终于被大家重视起来。","这件事让我明白：保护环境不能只靠一块牌子，更要靠每个人的行动。"]],"w":[["清澈","trong vắt"],["竖","dựng"],["忽视","xem nhẹ"],["钓","câu (cá)"],["捡","nhặt"],["报道","đưa tin"],["市民","người dân thành phố"],["重视","coi trọng"]],"q":[["去年夏天，小河怎么了？",["河水被弄脏了","河边的牌子被拿走了","公园被关了","老人钓了很多鱼"],0],["孩子们为什么开始打扫河边？",["老师要求他们","他们被老人感动了","记者请他们去","他们想去钓鱼"],1],["关于那块牌子，可以知道什么？",["是老人竖的","一开始没有人重视","已经被拿掉了","上面写着“禁止游泳”"],1],["这篇短文主要想告诉我们什么？",["钓鱼很有意思","记者的工作很重要","保护环境要靠每个人的行动","公园应该关门"],2]],"vi":"Gần nhà tôi có một công viên nhỏ, trong công viên có một con sông nhỏ trong vắt. Bên sông dựng một tấm biển “Cấm câu cá”, nhưng nhiều người coi như không thấy. Mùa hè năm ngoái, cá trong sông gần như bị câu hết, nước sông cũng bị rác vứt xuống làm bẩn.\nMột hôm, một cụ già nhặt rác bên sông, việc làm của cụ bị bọn trẻ gần đó nhìn thấy. Bọn trẻ cảm động trước cụ, cũng bắt đầu cùng cụ dọn bờ sông. Sau đó, chuyện này được phóng viên đưa tin, rất nhiều người dân đến tham gia.\nBây giờ nước sông lại trong veo, cá nhỏ cũng đã quay lại. Tấm biển từng bị xem nhẹ cuối cùng cũng được mọi người coi trọng. Chuyện này giúp tôi hiểu: bảo vệ môi trường không thể chỉ dựa vào một tấm biển, mà phải dựa vào hành động của mỗi người."},{"day":2,"title":"把垃圾分一分","mk":["把"],"p":[["刚搬到中国的时候，我常常把垃圾都扔进同一个垃圾桶里。","有一次，楼下的王阿姨看见了，她没有批评我，而是耐心地把每种垃圾的标识讲给我听：可回收的、厨余的、有害的和其他的。"],["从那以后，我每天都把垃圾分好类再拿下楼。","开始的时候觉得很麻烦，常常把塑料瓶放错地方。","后来我把分类方法写在一张纸上，贴在了厨房的墙上，慢慢地就记住了。"],["现在，我不但自己做到了，还把这个习惯带回了国，教给了家人。","每当回忆起王阿姨，我都会感到很温暖。","我明白了：把小事做好，就是对环境最大的帮助。"]],"w":[["搬","chuyển (nhà)"],["批评","phê bình"],["耐心","kiên nhẫn"],["标识","ký hiệu"],["回收","tái chế, thu hồi"],["厨余","rác nhà bếp"],["塑料瓶","chai nhựa"],["分类","phân loại"]],"q":[["王阿姨看见“我”扔垃圾以后做了什么？",["批评了“我”","给“我”讲了垃圾标识","帮“我”扔了垃圾","告诉了别人"],1],["为了记住分类方法，“我”做了什么？",["把方法写在纸上贴在墙上","买了四个垃圾桶","上网查资料","每天去问王阿姨"],0],["开始的时候，“我”觉得垃圾分类怎么样？",["很简单","很有意思","很麻烦","没有用"],2],["下面哪一项是正确的？",["“我”现在在中国工作","“我”把这个习惯带回了国","王阿姨是“我”的老师","“我”从来没放错过"],1]],"vi":"Lúc mới chuyển đến Trung Quốc, tôi thường vứt hết rác vào cùng một thùng. Có lần, dì Vương ở tầng dưới nhìn thấy, dì không trách tôi mà kiên nhẫn giảng cho tôi nghe ký hiệu từng loại rác: rác tái chế, rác nhà bếp, rác độc hại và rác khác.\nTừ đó, ngày nào tôi cũng phân loại rác xong mới mang xuống. Lúc đầu thấy rất phiền, hay để chai nhựa nhầm chỗ. Sau đó tôi viết cách phân loại ra một tờ giấy dán lên tường bếp, dần dần thì nhớ được.\nBây giờ tôi không chỉ tự làm được mà còn mang thói quen này về nước, dạy cho người nhà. Mỗi khi nhớ lại dì Vương, tôi đều thấy ấm áp. Tôi hiểu ra: làm tốt việc nhỏ chính là giúp đỡ lớn nhất cho môi trường."},{"day":3,"title":"爸爸的旧电池箱","mk":[],"p":[["我的爸爸是一个非常懂得生活的人。","他性格开朗，说话幽默，家里总是充满了欢声笑语。"],["爸爸有一个特别的习惯：家里的废旧电池，他从来不随手扔掉，而是放进阳台上的一个小箱子里。","小时候我很不理解，觉得这个箱子又旧又难看。","爸爸告诉我，废旧电池对人体和环境都有危害，如果随处丢弃，结果就可想而知了。"],["每到月底，爸爸都会带着我，把箱子里的电池送到小区的回收点。","慢慢地，邻居们也开始这样做。","现在，小区专门设立了一个电池回收箱。","爸爸的这个小习惯，深深地影响着我，也影响着身边的人。"]],"w":[["开朗","cởi mở"],["废旧","cũ hỏng"],["随手","tiện tay"],["阳台","ban công"],["危害","nguy hại"],["丢弃","vứt bỏ"],["月底","cuối tháng"],["设立","lập, đặt"]],"q":[["爸爸是一个什么样的人？",["很严肃","开朗幽默","不爱说话","很粗心"],1],["小时候，“我”觉得那个箱子怎么样？",["很漂亮","又旧又难看","很有用","太小了"],1],["每到月底，爸爸会做什么？",["买新电池","把电池送到回收点","打扫阳台","去看邻居"],1],["根据短文，小区现在怎么样？",["不允许用电池","设立了电池回收箱","开始卖旧电池","邻居都搬走了"],1]],"vi":"Bố tôi là người rất biết sống. Ông tính tình cởi mở, nói chuyện hài hước, nhà lúc nào cũng rộn tiếng cười.\nBố có một thói quen đặc biệt: pin cũ trong nhà ông không bao giờ tiện tay vứt đi, mà bỏ vào một cái hộp nhỏ ngoài ban công. Hồi nhỏ tôi không hiểu, thấy cái hộp vừa cũ vừa xấu. Bố bảo tôi, pin cũ có hại cho cả cơ thể và môi trường, nếu vứt bừa bãi thì hậu quả có thể tưởng tượng được.\nCứ cuối tháng, bố lại dẫn tôi mang pin trong hộp đến điểm thu gom của khu dân cư. Dần dần, hàng xóm cũng bắt đầu làm theo. Bây giờ khu dân cư đã đặt riêng một thùng thu gom pin. Thói quen nhỏ này của bố ảnh hưởng sâu sắc đến tôi, và cả những người xung quanh."},{"day":4,"title":"一本书和一部手机","mk":["比","没有","不像","不如"],"p":[["现在，很多年轻人觉得看手机比看书方便多了。","手机里的信息又多又新，打开就能看；而一本书又厚又重，带在身上很不方便。"],["但我的想法跟他们不太一样。","面对生活中的压力，我更喜欢读一本纸质书。","手机上的内容虽然比书多得多，可是常常让人越看越累；读书却不像刷手机那么让人着急，它能让我安静下来，慢慢思考。"],["当然，我并不认为书一定比手机好。","用手机查资料比去图书馆快得多，学习汉语的时候也离不开它。","就我而言，最重要的是找到适合自己的方式：工作时用手机，休息时读本书。","没有什么比内心的平静更重要的了。"]],"w":[["信息","thông tin"],["纸质","bằng giấy"],["内容","nội dung"],["刷手机","lướt điện thoại"],["着急","sốt ruột"],["思考","suy nghĩ"],["适合","phù hợp"],["平静","bình yên"]],"q":[["很多年轻人认为什么？",["看书比看手机方便","看手机比看书方便多了","书比手机便宜","手机里的信息太旧"],1],["作者为什么喜欢读纸质书？",["书的内容比手机多","书能让他安静下来，慢慢思考","书比较便宜","书是朋友送的"],1],["作者认为手机有什么优点？",["查资料比去图书馆快","不会让人觉得累","比书轻","能看小说"],0],["作者的观点是什么？",["书一定比手机好","不应该用手机","要找到适合自己的方式","应该多去图书馆"],2]],"vi":"Hiện nay, nhiều bạn trẻ thấy xem điện thoại tiện hơn đọc sách nhiều. Thông tin trong điện thoại vừa nhiều vừa mới, mở ra là xem được; còn một cuốn sách vừa dày vừa nặng, mang theo người rất bất tiện.\nNhưng suy nghĩ của tôi không giống họ lắm. Đối mặt với áp lực cuộc sống, tôi thích đọc một cuốn sách giấy hơn. Nội dung trên điện thoại tuy nhiều hơn sách rất nhiều nhưng thường càng xem càng mệt; đọc sách lại không khiến người ta sốt ruột như lướt điện thoại, nó giúp tôi lắng lại và suy nghĩ chậm rãi.\nĐương nhiên, tôi không cho rằng sách nhất định tốt hơn điện thoại. Dùng điện thoại tra tài liệu nhanh hơn đến thư viện nhiều, khi học tiếng Trung cũng không thể thiếu nó. Với tôi, quan trọng nhất là tìm được cách phù hợp với mình: làm việc thì dùng điện thoại, nghỉ ngơi thì đọc sách. Không có gì quan trọng hơn sự bình yên trong lòng."},{"day":5,"title":"一位戴着眼镜的年轻老板","mk":["得"],"p":[["在我们公司楼下，有一家开了三年的小咖啡店。","老板是一位戴着眼镜、个子不高的年轻人。","大学毕业以后，他没有选择去大公司工作，而是用自己攒下的钱创业，开了这家咖啡店。"],["刚开始的时候，店里的客人少得可怜，他常常一个人忙到晚上十一点才回家。","可是他从不放弃，每天把店里收拾得干干净净，把每一杯咖啡都做得很认真。","经过几年的经营，咖啡店逐渐发展起来，现在已经有了五名员工。"],["有一次我问他成功的秘密，他笑着说：“一家小店的发展离不开诚实的服务。","只要真心对待每一位客人，客人就会回来。”"]],"w":[["攒","dành dụm"],["创业","khởi nghiệp"],["可怜","đáng thương"],["放弃","từ bỏ"],["经营","kinh doanh"],["逐渐","dần dần"],["员工","nhân viên"],["秘密","bí quyết, bí mật"]],"q":[["老板大学毕业以后做了什么？",["去了大公司","自己创业，开了咖啡店","继续读书","当了老师"],1],["刚开始的时候，咖啡店怎么样？",["客人很多","客人很少","已经有五名员工","只卖茶"],1],["关于老板，下面哪一项正确？",["个子很高","戴着眼镜","年纪很大","不爱笑"],1],["老板认为成功的秘密是什么？",["地点好","价格便宜","诚实的服务","员工多"],2]],"vi":"Dưới tòa nhà công ty chúng tôi có một quán cà phê nhỏ đã mở ba năm. Chủ quán là một chàng trai trẻ đeo kính, dáng không cao. Tốt nghiệp đại học xong, anh không chọn vào công ty lớn mà dùng tiền mình dành dụm để khởi nghiệp, mở quán cà phê này.\nLúc mới mở, khách trong quán ít đến thảm, anh thường một mình bận đến 11 giờ đêm mới về nhà. Nhưng anh không bao giờ bỏ cuộc, ngày nào cũng dọn quán sạch sẽ tinh tươm, pha từng ly cà phê thật chăm chút. Sau vài năm kinh doanh, quán dần phát triển, giờ đã có năm nhân viên.\nCó lần tôi hỏi anh bí quyết thành công, anh cười nói: “Sự phát triển của một quán nhỏ không thể thiếu sự phục vụ thật thà. Chỉ cần chân thành với từng vị khách, khách sẽ quay lại.”"},{"day":6,"title":"一次难忘的教训","mk":[],"p":[["上个月，我坐地铁去公司上班，下车的时候不小心把手机落在了座位上。","等我发现的时候，地铁已经开走了。","当时我又着急又害怕，因为手机里有很多重要的工作资料。"],["后来，我跑到服务台找工作人员帮忙。","工作人员听完我的情况，马上打电话联系下一站。","半个小时以后，一位乘客把手机送到了服务台，我终于找回了它。","我去商店买了一盒巧克力感谢那位乘客。"],["从那以后，我每次下车前都会提醒自己：再检查一下身边的东西。","这次经历让我明白，只有养成细心的习惯，才能避免很多麻烦。"]],"w":[["教训","bài học"],["落","bỏ quên"],["座位","chỗ ngồi"],["服务台","quầy phục vụ"],["乘客","hành khách"],["提醒","nhắc nhở"],["养成","hình thành"],["避免","tránh"]],"q":[["“我”把手机落在了哪儿？",["公司","地铁座位上","服务台","商店"],1],["发现手机丢了以后，“我”做了什么？",["回家了","去服务台找工作人员帮忙","马上买了新手机","给同事打电话"],1],["手机是怎么找回来的？",["警察送来的","一位乘客送到了服务台","同事捡到的","在家里找到的"],1],["这次经历让“我”明白了什么？",["要多买巧克力","坐地铁不安全","要养成细心的习惯","手机不重要"],2]],"vi":"Tháng trước, tôi đi tàu điện ngầm đến công ty, lúc xuống tàu sơ ý bỏ quên điện thoại trên ghế. Khi tôi phát hiện thì tàu đã chạy mất. Lúc đó tôi vừa sốt ruột vừa sợ, vì trong điện thoại có nhiều tài liệu công việc quan trọng.\nSau đó tôi chạy đến quầy phục vụ nhờ nhân viên giúp. Nhân viên nghe xong liền gọi điện liên lạc với ga kế tiếp. Nửa tiếng sau, một hành khách mang điện thoại đến quầy, cuối cùng tôi đã tìm lại được. Tôi ra cửa hàng mua một hộp sô-cô-la để cảm ơn vị hành khách ấy.\nTừ đó, mỗi lần xuống tàu tôi đều tự nhắc mình: kiểm tra lại đồ bên người. Trải nghiệm này giúp tôi hiểu, chỉ khi hình thành thói quen cẩn thận mới tránh được nhiều phiền phức."},{"day":7,"title":"让我舍不得的城市","mk":["请","让","使","鼓励","要求"],"p":[["时间过得真快，转眼间，我在北京的留学生活就要结束了。","回想起这两年，最让我舍不得的是我的汉语老师——张老师。"],["刚来的时候，我连点菜都不会。","张老师常常请我们去学校附近的饭馆吃饭，让我们自己用汉语点菜。","她还鼓励我们多跟中国人聊天，要求我们每天写日记。","正是这些小事，使我的汉语水平提高得很快。"],["现在，我已经习惯了这里的生活：用手机叫外卖、在网上购物、骑共享单车去上课，这些都让我觉得非常方便。","下个月我就要回国了，衷心地希望张老师健康快乐，也希望在不久的将来，我还能回到北京看看。"]],"w":[["转眼间","chớp mắt"],["舍不得","không nỡ"],["点菜","gọi món"],["鼓励","khích lệ"],["日记","nhật ký"],["外卖","đồ ăn giao tận nơi"],["共享单车","xe đạp công cộng"],["衷心","chân thành"]],"q":[["最让“我”舍不得的是什么？",["北京烤鸭","张老师","共享单车","学校宿舍"],1],["张老师为什么常常请学生去饭馆吃饭？",["为了庆祝生日","让他们用汉语点菜","学校要求的","学生请客"],1],["张老师没有要求学生做哪件事？",["多跟中国人聊天","每天写日记","用汉语点菜","在网上购物"],3],["“我”下个月要做什么？",["回国","去上海","当老师","搬家"],0]],"vi":"Thời gian trôi nhanh thật, chớp mắt cuộc sống du học ở Bắc Kinh của tôi sắp kết thúc. Nhớ lại hai năm qua, điều khiến tôi không nỡ rời xa nhất là cô giáo tiếng Trung của tôi — cô Trương.\nLúc mới đến, tôi đến gọi món cũng không biết. Cô Trương thường mời chúng tôi đến quán ăn gần trường, để chúng tôi tự gọi món bằng tiếng Trung. Cô còn khích lệ chúng tôi trò chuyện nhiều với người Trung Quốc, yêu cầu chúng tôi mỗi ngày viết nhật ký. Chính những việc nhỏ ấy giúp trình độ tiếng Trung của tôi tiến bộ rất nhanh.\nGiờ tôi đã quen với cuộc sống ở đây: dùng điện thoại gọi đồ ăn, mua sắm trên mạng, đạp xe công cộng đi học, tất cả đều khiến tôi thấy rất tiện. Tháng sau tôi về nước rồi, thật lòng mong cô Trương mạnh khỏe vui vẻ, cũng mong trong tương lai không xa, tôi còn được quay lại Bắc Kinh."},{"day":8,"title":"选择工作的时候","mk":["应该","愿意","一定要","可以","能"],"p":[["大学毕业的时候，我同时收到了两份工作邀请。","一家是外资企业，待遇丰厚，可是经常要出差加班；另一家是本地的小公司，工资不高，但是工作比较轻松，离家也近。"],["我应该选哪一个呢？","父母希望我去外资企业，他们说年轻人应该多积累经验；朋友却劝我选小公司，因为可以有更多的时间享受生活。","我想了很久，一方面我想多赚钱，另一方面我又不愿意放弃自己的爱好。"],["最后，我选择了外资企业，但是我要求自己每周一定要抽出两个晚上去跑步、读书。","现在三年过去了，我不但积累了丰富的工作经验，身体也比以前更健康了。","我明白，鱼和熊掌有时是可以兼得的，关键看你能不能安排好时间。"]],"w":[["邀请","lời mời"],["外资企业","doanh nghiệp vốn nước ngoài"],["待遇","đãi ngộ"],["出差","đi công tác"],["加班","tăng ca"],["劝","khuyên"],["抽出","dành ra"],["兼得","có được cả hai"]],"q":[["关于那家外资企业，可以知道什么？",["工资不高","离家很近","待遇丰厚，但常要出差加班","工作很轻松"],2],["朋友为什么劝“我”选小公司？",["工资高","可以有更多时间享受生活","能积累经验","朋友也在那里工作"],1],["“我”每周要求自己做什么？",["加班","抽出两个晚上跑步、读书","出差","回家看父母"],1],["“鱼和熊掌有时是可以兼得的”是什么意思？",["鱼比熊掌好吃","两样好东西有时可以同时得到","只能选择其中一个","工作比爱好重要"],1]],"vi":"Khi tốt nghiệp đại học, tôi cùng lúc nhận được hai lời mời làm việc. Một là doanh nghiệp vốn nước ngoài, đãi ngộ hậu hĩnh nhưng thường xuyên phải đi công tác, tăng ca; một là công ty nhỏ ở địa phương, lương không cao nhưng công việc khá nhẹ nhàng, lại gần nhà.\nTôi nên chọn bên nào đây? Bố mẹ muốn tôi vào doanh nghiệp nước ngoài, họ nói người trẻ nên tích lũy nhiều kinh nghiệm; bạn bè thì khuyên tôi chọn công ty nhỏ, vì có thể có nhiều thời gian tận hưởng cuộc sống hơn. Tôi nghĩ rất lâu, một mặt tôi muốn kiếm nhiều tiền, mặt khác lại không muốn bỏ sở thích của mình.\nCuối cùng tôi chọn doanh nghiệp nước ngoài, nhưng tự yêu cầu mỗi tuần nhất định phải dành ra hai buổi tối để chạy bộ, đọc sách. Giờ ba năm đã trôi qua, tôi không chỉ tích lũy được nhiều kinh nghiệm làm việc mà sức khỏe cũng tốt hơn trước. Tôi hiểu rằng “cá và tay gấu” đôi khi có thể có cả hai, mấu chốt là bạn có sắp xếp được thời gian hay không."},{"day":9,"title":"我们的周末篮球队","mk":["有","是"],"p":[["我们学校有很多课余活动，有唱歌比赛、书法班，还有各种球队。","我最喜欢的课余活动之一是打篮球。"],["我们的篮球队是去年秋天成立的，队里有八个人，有中国学生，也有韩国、日本和美国的留学生。","刚开始的时候，大家互相不太了解，比赛时也总是配合不好。","可惜的是，第一次比赛我们输得很惨。"],["后来，我们每个周末都一起练习，练完球还一起去吃饭、聊天。","慢慢地，大家成了好朋友，配合也越来越好。","今年春天，我们终于进入了学校比赛的决赛。","虽然最后只得了第二名，但大家都觉得格外开心。","这是因为：一方面，打篮球锻炼了身体；另一方面，我们学会了团队合作。"]],"w":[["课余","ngoài giờ học"],["书法","thư pháp"],["成立","thành lập"],["配合","phối hợp"],["可惜","đáng tiếc"],["输","thua"],["决赛","chung kết"],["格外","đặc biệt"]],"q":[["篮球队是什么时候成立的？",["今年春天","去年秋天","上个周末","去年冬天"],1],["关于篮球队，下面哪一项正确？",["队里有八个人","队里有五个人","只有中国学生","只有留学生"],0],["第一次比赛的结果怎么样？",["得了第一名","进入了决赛","输得很惨","没有参加"],2],["大家为什么觉得格外开心？",["得了第一名","锻炼了身体，也学会了团队合作","老师请大家吃饭","比赛终于结束了"],1]],"vi":"Trường chúng tôi có rất nhiều hoạt động ngoại khóa: thi hát, lớp thư pháp, còn có đủ các đội bóng. Một trong những hoạt động ngoại khóa tôi thích nhất là chơi bóng rổ.\nĐội bóng rổ của chúng tôi thành lập từ mùa thu năm ngoái, trong đội có tám người, có sinh viên Trung Quốc, cũng có du học sinh Hàn Quốc, Nhật Bản và Mỹ. Lúc đầu mọi người chưa hiểu nhau lắm, thi đấu cũng hay phối hợp không tốt. Đáng tiếc là trận đầu tiên chúng tôi thua rất thảm.\nSau đó, cuối tuần nào chúng tôi cũng tập cùng nhau, tập xong còn đi ăn, trò chuyện. Dần dần mọi người thành bạn tốt, phối hợp cũng ngày càng ăn ý. Mùa xuân năm nay, cuối cùng chúng tôi đã vào chung kết giải của trường. Tuy cuối cùng chỉ được giải nhì, nhưng ai cũng thấy đặc biệt vui. Bởi vì: một mặt, chơi bóng rổ giúp rèn luyện thân thể; mặt khác, chúng tôi học được cách làm việc nhóm."},{"day":10,"title":"我的汉语学习方法","mk":["贴着","放着","挂着"],"p":[["我学习汉语已经三年了。","我的房间里到处是小纸条：门上贴着“开门”两个字，桌子上放着一张写满生词的卡片，墙上挂着一幅中国地图。","每次走过它们，我都会大声读一遍。"],["刚开始的时候，我很容易受到母语的影响，常常把汉语的语序说错。","后来，我的辅导老师告诉我一个好方法：每天跟读一段课文，把自己的声音录下来，再和原文比较。","坚持了半年以后，我的发音有了明显的进步。"],["此外，我还找到了一个中国语伴。","我们每周见两次面，一次说汉语，一次说我的母语。","在他的帮助下，现在，我不但敢开口说汉语了，HSK五级也顺利通过了。","我相信，只要方法对，学习就会事半功倍。"]],"w":[["纸条","mẩu giấy"],["生词","từ mới"],["母语","tiếng mẹ đẻ"],["语序","trật tự từ"],["辅导","phụ đạo"],["跟读","đọc theo"],["明显","rõ rệt"],["事半功倍","làm ít được nhiều"]],"q":[["“我”的房间墙上挂着什么？",["一张卡片","一幅中国地图","一张照片","一个日历"],1],["辅导老师建议的方法是什么？",["多看中国电影","每天跟读课文，录音后和原文比较","多写汉字","去中国旅行"],1],["“我”和语伴每周见几次面？",["一次","两次","三次","每天都见"],1],["根据短文，下面哪一项正确？",["“我”学汉语一年了","“我”已经通过了HSK五级","“我”的发音一直不好","语伴是“我”的老师"],1]],"vi":"Tôi học tiếng Trung đã ba năm. Trong phòng tôi chỗ nào cũng có mẩu giấy: trên cửa dán hai chữ “mở cửa”, trên bàn đặt một tấm thẻ viết kín từ mới, trên tường treo một tấm bản đồ Trung Quốc. Mỗi lần đi ngang qua, tôi đều đọc to một lượt.\nLúc mới học, tôi rất dễ bị tiếng mẹ đẻ ảnh hưởng, hay nói sai trật tự từ tiếng Trung. Sau đó, thầy phụ đạo chỉ cho tôi một cách hay: mỗi ngày đọc theo một đoạn bài khóa, ghi âm giọng mình rồi so với bản gốc. Kiên trì nửa năm, phát âm của tôi tiến bộ rõ rệt.\nNgoài ra, tôi còn tìm được một bạn học tiếng người Trung Quốc. Mỗi tuần chúng tôi gặp hai lần, một lần nói tiếng Trung, một lần nói tiếng mẹ đẻ của tôi. Nhờ bạn ấy giúp đỡ, giờ tôi không chỉ dám mở miệng nói tiếng Trung mà còn thi đỗ HSK 5 suôn sẻ. Tôi tin rằng chỉ cần đúng phương pháp, việc học sẽ làm ít được nhiều."}],"days":[{"grammar":[{"title":"“被”字句","base":"主语 + 被 + 宾语 + 动词 + 其他成分","baseEx":["我的自行车被弟弟骑走了。","窗户被大风吹开了。","蛋糕被孩子们吃光了。"],"notes":[{"p":"主语 + 被 + 宾语 + 所 + 动词","ex":["大家都被他的故事所感动。","游客们被这里的风景所吸引。"]},{"p":"主语 + 被 + 宾语 + 动词 + 成/作/为 + 宾语","ex":["这本小说被翻译成了十几种语言。","他被大家选为班长。"]},{"p":"主语 + 被 + 宾语 + 动词 + 结果补语 + 了","ex":["杯子被猫打碎了。","那份文件被我放错地方了。"]},{"p":"主语 + 否定副词 + 被……（否定词放在“被”前面）","ex":["我的建议没被经理采纳。","别让孩子被开水烫到。"]}],"real":[{"a":"会议室已经被别人订了。","c":["会议室","已经","被","别人","订了"]},{"a":"他被一家外企录用了。","c":["他","被","一家","外企","录用了"]},{"a":"这项新技术被广泛应用到生产中。","c":["这项","新技术","被","广泛","应用到","生产中"]}]}],"ex":[{"a":"那本词典被同学借走了。","c":["那本","词典","被","同学","借走了"]},{"a":"我们的方案已经被客户接受了。","c":["我们的","方案","已经","被","客户","接受了"]},{"a":"他的手机昨天被小偷偷走了。","c":["他的手机","昨天","被","小偷","偷走了"]},{"a":"我的衣服被雨淋湿了。","c":["我的","衣服","被","雨","淋湿了"]},{"a":"那位老人被好心人送到了医院。","c":["那位","老人","被","好心人","送到了","医院"]},{"a":"这个问题被他解决得很好。","c":["这个","问题","被","他","解决得","很好"]},{"a":"房间被妈妈收拾得干干净净。","c":["房间","被","妈妈","收拾得","干干净净"]},{"a":"他被公司派到上海出差了。","c":["他","被","公司","派到","上海","出差了"]},{"a":"我被这首歌感动得流下了眼泪。","c":["我","被","这首歌","感动得","流下了","眼泪"]},{"a":"小心别被狗咬了。","c":["小心","别","被","狗","咬了"]}],"e1":{"title":"短文1：叙述事情Ⅰ","real":"晚会 准备 紧张 成功 感谢","feat":["5个词里通常有名词、动词、形容词，可以把它们串成一件事。","常常有表示时间、动作或者心情的词。","最容易的写法是写成一个小故事（记叙文）。"],"try":"生日 惊喜 朋友 蛋糕 难忘","ex":[{"text":"我永远忘不了去年的生日。那天，我加班到很晚，心想朋友们一定都忘了。没想到，我一打开家门，灯突然亮了，朋友们拿着蛋糕大声唱起了生日歌。这个惊喜让我感动极了。从那以后，我更加珍惜身边的朋友。","tpl":"我永远忘不了……。那天，……。没想到，……。从那以后，……。","ph":[["时间",["那天，……","记得那年……","上个周末，……","当我……的时候","后来，……","从那以后，……"]],["心情",["我感动极了","我又惊又喜","心里暖暖的","那一刻，我明白了……","让我难以忘记的是……"]]],"models":[{"w":"晚会 准备 紧张 成功 感谢","t":"我永远忘不了公司的新年晚会。那天，我第一次上台表演，虽然准备了一个多月，可是上台前还是非常紧张。没想到，表演结束时，台下响起了热烈的掌声。晚会很成功，我特别感谢一直帮我练习的同事。从那以后，我变得更自信了。"},{"w":"旅行 迷路 热情 帮助 感动","t":"我永远忘不了第一次去杭州旅行。那天，我在西湖边迷路了，手机也没电了。没想到，一位卖水果的阿姨看出我很着急，热情地把我带到了地铁站。她的帮助让我非常感动。从那以后，看到需要帮助的人，我也会主动上前。"}]},{"text":"对很多年轻人来说，生日是一年中最特别的日子。它不仅意味着自己又长大了一岁，而且是和朋友相聚的好机会。比如，大家一起吃蛋糕，给过生日的人准备一个小惊喜。所以，生日常常是一年中最难忘的一天。","tpl":"对……来说，……是……。它不仅……，而且……。比如，……。所以，……。","ph":[["解释",["对……来说，……","……意味着……","在我看来，……","众所周知，……"]],["举例",["比如，……","拿……来说","像……这样的……"]],["总结",["所以，……","总之，……","总而言之，……","由此可见，……"]]],"models":[{"w":"晚会 准备 紧张 成功 感谢","t":"对新员工来说，公司的新年晚会是一次展示自己的好机会。它不仅能让大家放松一下，而且能让同事们互相了解。比如，有人唱歌，有人跳舞，虽然上台前都很紧张，但是大家准备得很认真，晚会非常成功。所以，我很感谢公司举办这样的活动。"},{"w":"旅行 迷路 热情 帮助 感动","t":"对喜欢旅行的人来说，迷路是常有的事。它不仅会让人着急，而且有时还会带来意外的收获。比如，你可能会遇到热情的当地人，得到他们的帮助，这种经历往往让人很感动。所以，旅行时迷路也不一定是坏事。"}]}],"prac":"公司 加班 疲惫 坚持 鼓励","refs":["我永远忘不了刚进公司的那段日子。那时，我们部门几乎每天都要加班，我常常疲惫得不想说话，甚至想过放弃。没想到，经理发现以后，经常鼓励我，还教我怎样安排时间。从那以后，我学会了坚持，工作也越来越顺利了。","对很多上班族来说，加班是生活的一部分。它不仅让人身体疲惫，而且会减少陪伴家人的时间。比如，有的人一个星期要加好几个晚上的班。所以，公司应该合理安排工作，同事之间也要互相鼓励，这样大家才能坚持下去。"]},"e2":{"title":"短文2：图标类Ⅰ","feat":["图片多是标志或提示牌，一般没有人物。","它的目的通常是提醒或者告诉人们一件事。","可以说明它的意思，也可以联想写一个小故事。"],"tryImg":{"t":"sign","i":"cig","ban":1,"l":"禁止吸烟"},"ex":[{"text":"在我家附近的公交车站，有一个“禁止吸烟”的标志。它的意思是在这里不能抽烟。可是，每天早上还是有人一边等车一边抽烟，旁边的孩子和老人只能捂着鼻子。这让我想到：一个标志能不能起作用，关键在于每个人是否自觉。","tpl":"在……附近，有一个“……”的标志。它的意思是……。可是，……。这让我想到：……。","ph":[["位置",["在……附近，……","在……的门口，……","……的墙上贴着……","在……的旁边，……"]],["地点",["公交车站、地铁站、加油站","商场入口、医院大厅、图书馆","小区门口、学校操场、公园湖边"]],["联想",["这让我想到：……","由此可见，……","我认为，……","每个人都应该……"]]],"models":[{"img":{"t":"sign","i":"car","ban":1,"l":"禁止停车"},"t":"在我们公司门口，有一个“禁止停车”的标志。它的意思是这里是消防通道，车辆不能停放。可是，有些送货的司机为了方便，还是把车停在这里。这让我想到：方便了自己，可能就会给别人带来危险。"}]},{"text":"这是一个禁止吸烟的标志，它告诉我们：在这里不能抽烟。在公共场所吸烟，不但会影响自己的健康，而且会让周围的人吸二手烟。我们每个人都应该遵守规定，一起创造一个干净的环境。","tpl":"这是一个……的标志，它告诉我们：……。……，不但……，而且……。我们每个人都应该……。","ph":[["说明",["这是一个……的标志","它表示……","它提醒人们……","它的目的是……"]],["原因",["因为……","这样做是为了……","否则，……"]]],"models":[{"img":{"t":"sign","i":"exit","ban":0,"l":"安全出口"},"t":"这是一个安全出口的标志，它告诉我们：遇到紧急情况时，可以从这里离开。商场、电影院、酒店都有这个标志，一旦发生火灾，它不但能帮人们很快找到逃生的路，而且能减少伤亡。我们每个人到了新的地方，都应该先看看安全出口在哪儿。"}]}],"pracImg":{"t":"sign","i":"phone","ban":1,"l":"禁止使用手机"},"refs":["在我常去的加油站，墙上有一个“禁止使用手机”的标志。它的意思是在加油的时候不能打电话。可是，我发现有些司机一边加油一边看手机。这让我想到：很多事故都是因为人们不重视这些小小的提示。","这是一个禁止使用手机的标志，它告诉我们：在这里不能打电话或者玩手机。在加油站使用手机，不但可能引起火灾，而且会影响工作人员。我们每个人都应该遵守这个规定，保护自己，也保护别人。"]},"day":1},{"grammar":[{"title":"“把”字句","base":"主语 + 把 + 宾语 + 动词 + 其他成分","baseEx":["我把作业交给老师了。","他把车停在了楼下。","妈妈把菜洗干净了。"],"notes":[{"p":"主语 + 把 + 宾语1 + 动词 + 在/到/给 + 宾语2","ex":["请把文件放在我的桌子上。","他把礼物送给了女朋友。"]},{"p":"主语 + 把 + 宾语1 + 动词 + 成/作 + 宾语2","ex":["我把美元换成了人民币。","她一直把我当作亲妹妹。"]},{"p":"主语 + 把 + 宾语 + 动词 + 趋向补语 + 了","ex":["服务员把菜端上来了。","孩子把小鸟放出去了。"]},{"p":"主语 + 否定副词/能愿动词 + 把……","ex":["你千万别把这件事告诉别人。","我们应该把时间安排得更合理一些。"]}],"real":[{"a":"他已经把报告写完了。","c":["他","已经","把","报告","写完了"]},{"a":"请把会议时间改到下午三点。","c":["请","把","会议","时间","改到","下午三点"]},{"a":"她把房间布置得很漂亮。","c":["她","把","房间","布置得","很漂亮"]}]}],"ex":[{"a":"我把钥匙忘在办公室了。","c":["我","把","钥匙","忘在","办公室了"]},{"a":"请把空调温度调高一点儿。","c":["请","把","空调","温度","调高","一点儿"]},{"a":"他把这个好消息告诉了大家。","c":["他","把","这个","好消息","告诉了","大家"]},{"a":"服务员把账单送了过来。","c":["服务员","把","账单","送了","过来"]},{"a":"我们要把垃圾分类扔。","c":["我们","要","把","垃圾","分类","扔"]},{"a":"她把中文小说翻译成了越南语。","c":["她","把","中文","小说","翻译成了","越南语"]},{"a":"经理把会议推迟到了周五。","c":["经理","把","会议","推迟到了","周五"]},{"a":"你把这些数据整理一下。","c":["你","把","这些","数据","整理","一下"]},{"a":"弟弟把我的电脑弄坏了。","c":["弟弟","把","我的","电脑","弄坏了"]},{"a":"我终于把这本书看完了。","c":["我","终于","把","这本书","看完了"]}],"e1":{"title":"短文1：叙述事情Ⅱ","real":"宿舍 室友 理解 开心 帮助","feat":["词语里常有地点、人物和心情。","可以通过回忆一段经历来写。","也可以写不同的人对一件事的不同想法。"],"try":"大学 老师 耐心 进步 怀念","ex":[{"text":"每次想起大学的生活，我都觉得很怀念。那时候，我的汉语不太好，上课常常听不懂。我们的王老师非常耐心，下课后经常留下来给我讲问题。在她的帮助下，我的汉语进步得很快。我真希望能再回到那段时光。","tpl":"每次想起……，我都觉得……。那时候，……。……，……。在……的帮助下，……。我真希望……。","ph":[["回忆",["每次想起……","每当回忆起……","一想到……","记得那时候……"]],["感受",["我都觉得很怀念","我总是很感动","心里充满了感激","我都会笑起来"]],["结尾",["我真希望……","我会永远记得……","我很珍惜……","那是我最快乐的时光"]]],"models":[{"w":"宿舍 室友 理解 开心 帮助","t":"每次想起住在学校宿舍的日子，我都觉得很开心。那时候，我刚到中国，什么都不习惯。我的室友是一个越南女孩，她很理解我的感受，常常陪我去超市、教我坐地铁。在她的帮助下，我很快适应了新生活。我真希望我们能一直做好朋友。"}]},{"text":"每个人对大学老师的看法都不一样。有的人喜欢知识丰富的老师，有的人喜欢幽默风趣的老师，还有的人喜欢严格要求学生的老师。而我最怀念的是有耐心的老师，因为他们让我看到了自己的进步。","tpl":"每个人对……的看法都不一样。有的人……，有的人……，还有的人……。而我……，因为……。","ph":[["开头",["每个人对……的看法都不一样","关于……，大家有不同的意见","每个人都有自己的选择"]],["举例",["有的人……，有的人……","一些人……，另一些人……","大部分人……，少数人……"]],["观点",["而我认为……","我自己的想法是……","对我来说，……"]]],"models":[{"w":"宿舍 室友 理解 开心 帮助","t":"每个人对宿舍生活的看法都不一样。有的人觉得和室友住在一起很热闹，有的人觉得没有自己的空间，还有的人担心生活习惯不同。而我觉得住宿舍很开心，因为室友之间只要互相理解、互相帮助，就能成为一辈子的朋友。"}]}],"prac":"毕业 照片 舍不得 回忆 未来","refs":["每次想起毕业那天拍的照片，我都觉得很舍不得。那时候，我们全班同学穿着毕业服，在学校门口笑得特别开心。拍完照片，大家互相拥抱，说好以后常联系。在那一刻，我明白了友谊的珍贵。我真希望未来还能和他们一起回到学校。","每个人对毕业的看法都不一样。有的人觉得终于可以工作赚钱了，有的人舍不得离开学校，还有的人对未来感到担心。而我最喜欢翻看毕业照片，因为那些美好的回忆会给我面对未来的勇气。"]},"e2":{"title":"短文2：图标类Ⅱ","feat":["图片多是生活中常见的标识。","可以写它在什么地方能看到、有什么用。","也可以简单地发表自己的看法。"],"tryImg":{"t":"sign","i":"recycle","ban":0,"l":"可回收物"},"ex":[{"text":"这是一个可回收物的标识，图片中有三个首尾相连的箭头，它表示这里的垃圾可以回收利用。这种标识在很多小区和公园都能看到，大家千万不要忽视它。比如喝完的饮料瓶，我们可以扔进这个垃圾桶，从而减少资源浪费。","tpl":"这是一个……的标识，图片中有……，它表示……。这种标识在……都能看到，大家千万不要忽视它。比如……，我们可以……，从而……。","ph":[["描述",["图片中有……","图片的中间是……","图片上画着……"]],["地点",["这种标识随处可见","在很多公共场所都能看到","商场、车站、公园里都有"]],["建议",["大家千万不要忽视它","我们应该……，从而……","希望每个人都能……"]]],"models":[{"img":{"t":"sign","i":"bike","ban":0,"l":"自行车道"},"t":"这是一个自行车道的标识，图片中有一辆自行车，它表示这条路是专门给骑车的人走的。这种标识在很多城市的马路上都能看到，大家千万不要忽视它。比如开车的时候，我们不能占用自行车道，从而保证骑车人的安全。"}]},{"text":"近几年，垃圾分类问题越来越受到人们的关注。这个问题之所以重要，是因为很多垃圾其实可以回收再利用。我们要想保护环境，就要从身边的小事做起，比如把饮料瓶放进可回收垃圾桶。这样做不仅能节约资源，还能减少污染。","tpl":"近几年，……问题越来越受到人们的关注。这个问题之所以……，是因为……。我们要想……，就要……。这样做不仅……，还……。","ph":[["引出话题",["近几年，……越来越受到关注","随着社会的发展，……","……已经成为一个热门话题"]],["原因",["之所以……，是因为……","……的主要原因是……","……导致了……"]],["办法",["我们要想……，就要……","只有……，才能……","每个人都可以从小事做起"]]],"models":[{"img":{"t":"sign","i":"cig","ban":1,"l":"禁止吸烟"},"t":"近几年，公共场所吸烟的问题越来越受到人们的关注。这个问题之所以严重，是因为二手烟对周围的人伤害很大。我们要想解决这个问题，就要加强管理，同时让吸烟的人了解危害。这样做不仅能保护大家的健康，还能让城市变得更文明。"}]}],"pracImg":{"t":"sign","i":"seatbelt","ban":0,"l":"请系好安全带"},"refs":["这是一个提醒系安全带的标识，图片中有一个系着安全带的人，它表示坐车时要系好安全带。这种标识在汽车和飞机上都能看到，大家千万不要忽视它。比如坐出租车的时候，即使路程很短，我们也应该系好安全带，从而保证自己的安全。","近几年，交通安全问题越来越受到人们的关注。这个问题之所以重要，是因为很多事故都是因为人们大意造成的。我们要想减少伤害，就要从系好安全带这样的小事做起。这样做不仅能保护自己，还能让家人放心。"]},"day":2},{"grammar":[{"title":"动词谓语句","base":"主语 + 动词谓语 + 名词宾语","baseEx":["经理参加了会议。","我们签订了合同。","她表达了自己的想法。"],"notes":[{"p":"主语 + 助动词 + 动词短语","ex":["公司必须提高产品质量。","你应该多跟同事沟通。","员工一定要遵守安全规定。","他不愿意改变原来的计划。"]}],"real":[{"a":"她从事财务工作。","c":["她","从事","财务","工作"]},{"a":"这家工厂面临很大的压力。","c":["这家","工厂","面临","很大的","压力"]},{"a":"我们需要调整生产计划。","c":["我们","需要","调整","生产","计划"]}]},{"title":"形容词谓语句","base":"主语 + 形容词谓语","baseEx":["今年的订单很多。","这个房间非常安静。","他的态度很认真。"],"notes":[{"p":"主语 + 程度副词 + 形容词","ex":["这里的冬天特别冷。","最近的工作更忙了。"]},{"p":"主语 + 两个形容词短语","ex":["这条路又窄又长。"]},{"p":"主语 + 形容词 + 补语","ex":["大家高兴极了。","天渐渐暗下来了。"]},{"p":"状态形容词作谓语，常加“的”","ex":["她的脸红红的。","院子里静悄悄的。"]}],"real":[{"a":"这次活动非常成功。","c":["这次","活动","非常","成功"]},{"a":"车间里打扫得干干净净的。","c":["车间里","打扫得","干干净净的"]}]}],"ex":[{"a":"运动可以减轻压力。","c":["运动","可以","减轻","压力"]},{"a":"我们应该保护环境。","c":["我们","应该","保护","环境"]},{"a":"她负责公司的招聘工作。","c":["她","负责","公司的","招聘","工作"]},{"a":"学生必须按时交作业。","c":["学生","必须","按时","交","作业"]},{"a":"工厂下个月开始生产新产品。","c":["工厂","下个月","开始","生产","新产品"]},{"a":"他的建议得到了大家的支持。","c":["他的","建议","得到了","大家的","支持"]},{"a":"这家公司的服务很周到。","c":["这家","公司的","服务","很","周到"]},{"a":"今天的天气特别好。","c":["今天的","天气","特别","好"]},{"a":"他已经适应了这里的生活。","c":["他","已经","适应了","这里的","生活"]},{"a":"我们的产品受到了客户的欢迎。","c":["我们的","产品","受到了","客户的","欢迎"]}],"e1":{"title":"短文1：家庭生活","real":"周末 做饭 热闹 爸爸 幸福","feat":["词语一般和家庭生活有关，很贴近日常。","常有人物、动作和心情。","可以写一个家人，也可以写一次家庭活动。"],"try":"妈妈 关心 唠叨 理解 温暖","ex":[{"text":"我的妈妈是一个非常关心家人的人。只要我出门，她就会唠叨半天：天冷要多穿衣服，路上要注意安全。以前我觉得很烦，后来我才理解，这是她表达爱的方式。有妈妈在，家里永远是最温暖的地方。","tpl":"我的……是一个……的人。只要……，……就……。以前……，后来我才……。有……在，……。","ph":[["描述人物",["我的……是一个……的人","他性格开朗，非常幽默","她总是把家人放在第一位","他是家里最有耐心的人"]],["叙述",["只要……，他就……","记得有一次，……","每到……的时候，……","以前……，后来才……"]],["感受",["家里永远是最温暖的地方","我们一家人在一起很幸福","我真为有这样的家人感到骄傲"]]],"models":[{"w":"周末 做饭 热闹 爸爸 幸福","t":"我的爸爸是一个非常会生活的人。只要到了周末，他就会去市场买菜，给全家做一桌好吃的饭。以前我只知道吃，后来我才明白，做饭也是他放松心情的方式。每次一家人围在一起吃饭，又热闹又幸福。"}]},{"text":"在家庭生活中，有很多温暖的回忆。其中最让我难忘的是，有一年我生病住院，妈妈每天都来医院照顾我，一边给我讲故事，一边唠叨我要按时吃药。那时我才真正理解了妈妈对我的关心。","tpl":"在……中，有很多……。其中最让我难忘的是，……。那时我才……。","ph":[["场景",["在家庭生活中","在和父母一起生活的日子里","在我小的时候"]],["举例",["其中最让我难忘的是……","其中印象最深的是……","我至今还记得……"]]],"models":[{"w":"周末 做饭 热闹 爸爸 幸福","t":"在家庭生活中，有很多幸福的回忆。其中最让我难忘的是，每个周末爸爸都会教我做饭。有一次我把鸡蛋炒糊了，全家人都笑了，厨房里特别热闹。那时我才知道，幸福其实就是一家人在一起的这些小事。"}]}],"prac":"奶奶 照顾 健康 陪伴 感动","refs":["我的奶奶是一个特别坚强的人。只要家里有人生病，她就会细心地照顾，自己却从来不说累。以前我觉得这是理所当然的，后来我才明白她付出了多少。现在奶奶年纪大了，身体不太健康，我常常回家陪伴她。有奶奶在，我总是很感动。","在家庭生活中，有很多让人感动的事。其中最让我难忘的是，去年奶奶住院时，全家人轮流到医院照顾她，陪她聊天、散步。奶奶的身体慢慢健康起来了。那时我才明白，家人的陪伴是最好的礼物。"]},"e2":{"title":"短文2：物品类Ⅰ","realImg":{"t":"scene","i":["sign2","person"],"c":"一个人站在路口的指示牌前","v":"Một người đứng trước biển chỉ đường ở ngã tư"},"feat":["图片多是一个具体的物品，如路牌、电池、塑料袋、香烟等。","可以描写它反映出的某种社会现象。","最后提出自己的建议。"],"tryImg":{"t":"scene","i":["bag"],"c":"一个装满东西的塑料袋","v":"Một chiếc túi ni-lông đựng đầy đồ"},"ex":[{"text":"在生活中，我们经常看到大量使用塑料袋的现象。我们都知道塑料袋很难自然分解，如果不加以控制，不断地使用下去，结果就可想而知了。所以，我们应该自己带购物袋，只有这样才能真正减少白色污染。","tpl":"在生活中，我们经常看到……的现象。我们都知道……，如果不……，结果就可想而知了。所以，我们应该……，只有这样才能……。","ph":[["描述现象",["在生活中，……的现象随处可见","在我们身边，……每天都在发生","现在，越来越多的人……"]],["因果",["之所以会出现这种现象，是因为……","……造成了……","如果不……，结果就可想而知了"]],["建议",["我们应该……，只有这样才能……","政府应该……","每个人如果都能……，那么……"]]],"models":[{"img":{"t":"scene","i":["battery"],"c":"一堆用完的旧电池","v":"Một đống pin cũ đã dùng hết"},"t":"在生活中，我们经常看到把旧电池和普通垃圾一起扔掉的现象。我们都知道旧电池里有对环境有害的物质，如果不加以管理，随便丢弃，结果就可想而知了。所以，我们应该把旧电池放进专门的回收箱，只有这样才能保护我们的土地和水。"}]},{"text":"说起塑料袋，不可否认，它给我们的生活带来了很多方便，但是它对环境的污染也越来越严重。因此我认为，如果大家还不改变购物习惯，最终会导致我们的生活环境变得越来越差。","tpl":"说起……，不可否认，……，但是……。因此我认为，如果……，最终会导致……。","ph":[["话题",["说起……","谈到……","关于……的问题"]],["观点",["因此我认为，……","所以，我们不能忽视……","因此我希望大家都能……"]]],"models":[{"img":{"t":"scene","i":["laptop","person"],"c":"一个年轻人坐在沙发上看电脑","v":"Một bạn trẻ ngồi trên sofa xem máy tính"},"t":"说起电脑，不可否认，它让我们的工作和学习都变得更方便了，但是很多年轻人每天在电脑前坐十几个小时，很少运动。因此我认为，如果不注意合理安排时间，最终会导致身体越来越差。"}]}],"pracImg":{"t":"scene","i":["car","car","car"],"c":"马路上排着长长的车队","v":"Trên đường ô tô xếp hàng dài"},"refs":["在生活中，我们经常看到堵车的现象。我们都知道私家车的数量增加得越来越快，如果不加以控制，道路只会越来越拥挤，结果就可想而知了。所以，我们应该多坐公共交通工具，只有这样才能减轻交通压力。","说起汽车，不可否认，它让人们出行更方便了，但是汽车太多也带来了堵车和空气污染的问题。因此我认为，如果大家都只想着自己开车，最终会导致城市交通越来越糟糕。"]},"day":3},{"grammar":[{"title":"比较句","base":"A + 比 + B + 形容词（+ 程度/数量）　·　否定：A + 没有/不如 + B + 形容词","baseEx":["今天比昨天更热。","这台机器比那台快得多。","我没有他那么高。","坐公交车不如坐地铁方便。"],"notes":[{"p":"A + 比 + B + 更/还 + 形容词","ex":["这个月的订单比上个月还多。"]},{"p":"A + 比 + B + 形容词 + 一点儿/一些/得多/多了","ex":["这家店的价格比那家便宜一些。","今年的销售额比去年高多了。"]},{"p":"A + 比 + B + 动词 + 得 + 补语","ex":["她比我说得流利。"]},{"p":"A 比 B + 形容词 + 具体数量","ex":["哥哥比我大三岁。","这批货比计划晚到了两天。"]},{"p":"A 比 B + 早/晚/多/少 + 动词 + 数量","ex":["我比他早到了十分钟。","今天比昨天多生产了五百件。"]},{"p":"A + 有/没有 + B +（这么/那么）+ 形容词","ex":["你的汉语有她那么好吗？","这里的冬天没有北方那么冷。"]},{"p":"没有什么比 A 更 + 形容词 + 的了","ex":["没有什么比健康更重要的了。"]}],"real":[{"a":"这次考试比上次难多了。","c":["这次","考试","比","上次","难","多了"]}]}],"ex":[{"a":"坐高铁比坐大巴快多了。","c":["坐","高铁","比","坐","大巴","快","多了"]},{"a":"这件衣服比那件贵一百块。","c":["这件","衣服","比","那件","贵","一百块"]},{"a":"他每天都比别人来得早。","c":["他","每天","都","比","别人","来得","早"]},{"a":"今年的雨没有去年那么多。","c":["今年的","雨","没有","去年","那么","多"]},{"a":"她的汉语说得比我流利。","c":["她的","汉语","说得","比","我","流利"]},{"a":"网上购物比去商店方便。","c":["网上","购物","比","去","商店","方便"]},{"a":"我觉得看书不如看电影有意思。","c":["我","觉得","看书","不如","看电影","有意思"]},{"a":"这个城市一年比一年漂亮。","c":["这个","城市","一年","比","一年","漂亮"]},{"a":"没有什么比家人更重要的了。","c":["没有","什么","比","家人","更","重要的了"]},{"a":"他和他哥哥一样高。","c":["他","和","他哥哥","一样","高"]}],"e1":{"title":"短文1：观念想法","real":"压力 乐观 心态 调整 适合","feat":["词语多是比较抽象的名词、动词、形容词。","常有“压力”“态度”“健康”“责任”这类词。","可以写自己对某个问题的看法。"],"try":"金钱 幸福 重要 追求 满足","ex":[{"text":"对于金钱和幸福的关系，每个人都有不同的看法。就我而言，钱很重要，但它不是幸福的全部。每当看到有人为了追求更多的钱而失去健康时，我都会提醒自己：懂得满足的人，才是真正幸福的人。","tpl":"对于……，每个人都有不同的看法。就我而言，……。每当……时，我都会提醒自己：……。","ph":[["开头",["对于……，每个人都有不同的看法","面对……，不同的人有不同的选择","关于……，大家的想法不一样"]],["表达观点",["就我而言，……","在我看来，……","我始终相信……"]],["自我提醒",["我都会提醒自己……","我常常告诉自己……","我会要求自己……"]]],"models":[{"w":"压力 乐观 心态 调整 适合","t":"对于工作压力，每个人都有不同的看法。就我而言，压力不一定是坏事，关键是要有乐观的心态。每当工作太多、感到累的时候，我都会提醒自己：先停下来，找一个适合自己的方法调整一下，比如散散步、听听音乐，然后再继续努力。"}]},{"text":"我是一个容易满足的人，因为从小父母就告诉我：幸福不在于拥有多少金钱，而在于有没有一颗知足的心。也正是因为如此，我从来不羡慕别人，而是努力追求自己想要的生活。","tpl":"我是一个……的人，因为从小……就告诉我：……。也正是因为如此，我……。","ph":[["自我介绍",["我是一个乐观的人","我是一个做事认真的人","我是一个不怕困难的人"]],["家庭影响",["从小父母就告诉我……","爸爸常常对我说……","妈妈教育我……"]],["结果",["也正是因为如此，……","所以直到现在，我……","这句话一直影响着我"]]],"models":[{"w":"压力 乐观 心态 调整 适合","t":"我是一个很乐观的人，因为从小妈妈就告诉我：遇到压力不要害怕，要学会调整心态。也正是因为如此，不管工作多忙，我都能找到适合自己的放松方式，每天都开开心心地生活。"}]}],"prac":"工作 家庭 平衡 时间 选择","refs":["对于工作和家庭的关系，每个人都有不同的看法。就我而言，两者都很重要，关键是学会平衡。每当工作忙得没有时间陪家人时，我都会提醒自己：再忙也要留一点儿时间给家人，因为家庭是我努力工作的动力。","我是一个很重视家庭的人，因为从小父亲就告诉我：工作是为了让家人生活得更好，不能本末倒置。也正是因为如此，在选择工作时，我更愿意选择离家近、时间比较固定的公司，这样我就能平衡好工作和家庭。"]},"e2":{"title":"短文2：物品类Ⅱ","realImg":{"t":"scene","i":["gift"],"c":"一个包装好的礼物盒","v":"Một hộp quà đã được gói đẹp"},"feat":["图片多是礼物、书、花、手表等具体物品。","可以介绍这个物品的作用和意义。","也可以写和这个物品有关的一段经历。"],"tryImg":{"t":"scene","i":["book"],"c":"一本打开的书","v":"Một cuốn sách đang mở"},"ex":[{"text":"从小我就喜欢看书，喜欢在书里认识不同的世界。我曾经读过一本关于一个小镇医生的小说，他一辈子都在帮助穷人看病。直到现在，那个故事还常常让我想起，做人要善良。","tpl":"从小我就喜欢……，喜欢……。我曾经……。直到现在，……。","ph":[["时间",["从小我就……","上中学的时候，……","工作以后，……"]],["回忆",["我曾经……","记得有一次，……","几年前，……"]],["现在",["直到现在，……","到现在为止，……","现在的我依然……"]]],"models":[{"img":{"t":"scene","i":["watch"],"c":"一块精致的手表","v":"Một chiếc đồng hồ đeo tay tinh xảo"},"t":"从小我就喜欢各种各样的手表，喜欢听它们“嘀嗒嘀嗒”的声音。我曾经收到过一份特别的礼物，那是爷爷年轻时戴过的一块旧手表。直到现在，我还把它放在床头，每次看到它，就好像爷爷还在我身边。"}]},{"text":"书是人类积累知识的重要工具。通过读书，你可以了解不同国家的历史和文化，学会很多做人的道理。当然，读书也能让你在忙碌的生活中安静下来，找到属于自己的快乐。","tpl":"……是……的……。通过……，你可以……，……。当然，……也能……。","ph":[["说明",["……是传递感情的工具","……是用来……的东西","……代表着……"]],["作用",["通过……，你可以……","有了……，我们可以……","当然，它也能……"]]],"models":[{"img":{"t":"scene","i":["flower"],"c":"一束鲜花","v":"Một bó hoa tươi"},"t":"鲜花是人们表达感情的美好礼物。通过不同的花，你可以表达不同的心意，比如玫瑰代表爱情，康乃馨代表对母亲的感谢。当然，鲜花也能让房间变得更漂亮，让人的心情变得更好。"}]}],"pracImg":{"t":"scene","i":["cert"],"c":"一张荣誉证书","v":"Một tấm giấy khen / chứng nhận"},"refs":["从小我就喜欢参加各种比赛，喜欢挑战自己。我曾经参加过一次全市的汉语演讲比赛，并获得了一等奖的证书。直到现在，那张证书还挂在我的房间里，它让我记住了努力的意义。","证书是证明一个人能力的重要材料。通过各种证书，用人单位可以了解你掌握了哪些知识和技能。当然，证书也能给你带来自信，但是最重要的还是真正的能力。"]},"day":4},{"grammar":[{"title":"定语","base":"定语：放在名词前面，修饰、限定中心语（常用“的”）","baseEx":["我看完了桌子上的那本杂志。","这是一家生产电子产品的公司。","她穿着一条蓝色的长裙子。"],"notes":[{"p":"限定性定语：表示范围、领属、时间、数量","ex":["这个月的三次会议都在上海开。","我们公司的员工都很年轻。"]},{"p":"描写性定语：表示性质、状态、用途、材料","ex":["这是一张木头做的桌子。","他是一个很有经验的工程师。"]},{"p":"多个定语的顺序：领属 + 数量 + 动词短语 + 形容词 + 名词","ex":["我们公司那两台新买的大型打印机","她是一位工作认真、让人放心的会计。"]}],"real":[]},{"title":"补语","base":"结果补语 · 趋向补语 · 可能补语 · 程度补语 · 时量补语","baseEx":[],"notes":[{"p":"1. 结果补语：动词 + 形容词/动词","ex":["洗干净、说清楚、写错、看完、听懂、找到、卖光"]},{"p":"2. 趋向补语：动词 + 上来/下去/进来/出去/回来/过来/起来……","ex":["他把箱子搬上来了。","老师走进教室来了。"]},{"p":"3. 可能补语：动词 + 得/不 + 补语","ex":["字太小了，我看不清楚。","这么多菜，我们吃得完吗？"]},{"p":"4. 程度补语：动词/形容词 + 得 + 补语","ex":["她跑得很快。","他高兴得跳了起来。"]},{"p":"5. 时量补语：表示持续多长时间","ex":["我学了两年汉语。","他已经离开公司半年了。"]}],"real":[{"a":"这是一个很有意义的活动。","c":["这是","一个","很有","意义的","活动"]},{"a":"他把报告写得很清楚。","c":["他","把","报告","写得","很","清楚"]}]}],"ex":[{"a":"她是一位有二十年经验的医生。","c":["她","是","一位","有","二十年","经验的","医生"]},{"a":"我买了一台很好用的洗衣机。","c":["我","买了","一台","很","好用的","洗衣机"]},{"a":"这是一本介绍中国历史的书。","c":["这","是","一本","介绍","中国","历史的","书"]},{"a":"那个穿红衣服的女孩是我妹妹。","c":["那个","穿","红衣服的","女孩","是","我妹妹"]},{"a":"我们正在讨论一个很重要的问题。","c":["我们","正在","讨论","一个","很","重要的","问题"]},{"a":"他把书放回书架上去了。","c":["他","把","书","放回","书架上","去了"]},{"a":"这么多工作今天做得完吗？","c":["这么","多","工作","今天","做得完","吗"]},{"a":"她紧张得说不出话来。","c":["她","紧张得","说不出","话来"]},{"a":"我在这家公司工作了五年。","c":["我","在","这家","公司","工作了","五年"]},{"a":"孩子们从教室里跑了出来。","c":["孩子们","从","教室里","跑了","出来"]}],"e1":{"title":"短文1：社会工作","real":"创业 困难 坚持 经验 成功","feat":["词语多和学习、工作、事业有关。","可以写自己工作或成长的经历。","最后写出自己的体会。"],"try":"毕业 应聘 面试 机会 努力","ex":[{"text":"大学毕业以后，我去一家外贸公司应聘。经过三轮面试，我终于得到了这份工作。刚开始的时候，我连报价单都不会做，后来在同事的帮助下慢慢学会了。在这段时间里，我明白了：机会只留给努力的人。","tpl":"大学毕业以后，我……。经过……，我……。刚开始的时候，……，后来……。在这段时间里，我明白了：……。","ph":[["经历",["经过几年的努力，……","通过……，我逐渐……","刚开始的时候，……"]],["体会",["在这段时间里，我明白了……","我总结出……","现在我才意识到……"]],["工作相关",["积累经验","提高能力","得到领导的认可","和同事合作"]]],"models":[{"w":"创业 困难 坚持 经验 成功","t":"大学毕业以后，我和两个朋友一起创业，开了一家小咖啡店。经过两年的经营，我们遇到了很多困难，有一段时间几乎没有客人。刚开始的时候，我们都想过放弃，后来大家一起坚持了下来，还积累了不少经验。在这段时间里，我明白了：成功没有捷径。"}]},{"text":"人生中什么最重要？有的人认为找到一份收入高的工作最重要，有的人认为做自己喜欢的事最重要。而我认为，抓住每一个学习的机会，不断让自己进步，才是最重要的。","tpl":"人生中什么最重要？有的人认为……最重要，有的人认为……最重要。而我认为，……，才是最重要的。","ph":[["提问",["人生中什么最重要？","什么样的工作才是好工作？","成功到底是什么？"]],["观点",["有的人认为……，有的人认为……","而我认为……","就我而言，……"]]],"models":[{"w":"创业 困难 坚持 经验 成功","t":"人生中什么最重要？有的人认为年轻时就要创业，早点儿成功最重要；有的人认为先在大公司积累经验最重要。而我认为，不管选择哪条路，遇到困难时能坚持下去，才是最重要的。"}]}],"prac":"青年 志愿者 服务 社会 收获","refs":["大学毕业以后，我参加了一个青年志愿者项目，去山区的小学教孩子们英语。经过一年的服务，我和孩子们成了好朋友。刚开始的时候，我很不习惯那里的生活，后来慢慢适应了。在这段时间里，我明白了：服务社会，收获最大的其实是自己。","人生中什么最重要？有的人认为赚钱最重要，有的人认为家庭最重要。而我认为，年轻的时候多参加志愿者活动，用自己的能力去服务社会，帮助需要帮助的人，才是最有收获的。"]},"e2":{"title":"短文2：人物类","realImg":{"t":"scene","i":["person","phone"],"c":"一个女孩笑着打电话","v":"Một cô gái vừa cười vừa gọi điện thoại"},"feat":["图片以人物和他的动作为主，如打电话、看书、开会等。","可以写地点、人物外貌、动作和心情。","可以描写画面，也可以编一个故事。"],"tryImg":{"t":"scene","i":["person","laptop"],"c":"一个年轻人在咖啡店用电脑工作","v":"Một bạn trẻ làm việc với máy tính trong quán cà phê"},"ex":[{"text":"在咖啡店的窗边，坐着一位年轻的男士。他穿着白衬衫，戴着眼镜，正在认真地用电脑工作。他的表情很专注，桌上的咖啡已经凉了，他也没有发现。我想他可能是在准备明天的会议吧。","tpl":"在……，坐着/站着一位……。他穿着……，正在……。他的……，……。我想他可能是在……吧。","ph":[["地点",["在公园的长椅上，坐着……","在办公室里，……","在公司门口，站着……","在马路边，……"]],["外貌",["他穿着一身西装","她留着长头发","他戴着一副眼镜","她手里拿着……"]],["猜测",["我想他可能是在……吧","看起来她好像……","我猜他一定……"]]],"models":[{"img":{"t":"scene","i":["person","book"],"c":"一个女孩坐在草地上看书","v":"Một cô gái ngồi trên bãi cỏ đọc sách"},"t":"在学校的草地上，坐着一位可爱的女孩。她穿着运动服，扎着马尾辫，正在安静地看一本书。她看得很入迷，有时候还会轻轻地笑起来。我想那一定是一本很有意思的小说吧。"}]},{"text":"每个人都有属于自己的工作方式，就像图中的这位年轻人。我也是这样，比起办公室，我更喜欢在安静的咖啡店里工作。今天看到这张图片，让我想起了很多自己一边喝咖啡一边工作的下午。","tpl":"每个人都有属于自己的……，就像图中的……。我也是这样，……。今天看到这张图片，让我想起了……。","ph":[["开头",["每个人都有自己的梦想，就像……","每个人都有属于自己的生活方式","就像图中的……一样"]],["联想",["我也是这样，……","我也曾经……","看到这张图片，我想起了……"]]],"models":[{"img":{"t":"scene","i":["child","gift"],"c":"一个小女孩在拆礼物","v":"Một bé gái đang mở quà"},"t":"每个人小时候都有自己的期待，就像图中的这个小女孩。我也是这样，小时候最盼望的就是过生日，因为可以收到礼物。今天看到这张图片，让我想起了很多小时候拆礼物的快乐时光。"}]}],"pracImg":{"t":"scene","i":["person","tree"],"c":"一个女孩坐在公园的树下写东西","v":"Một cô gái ngồi dưới gốc cây trong công viên viết gì đó"},"refs":["在公园的大树下，坐着一位漂亮的女孩。她穿着白色的连衣裙，戴着一顶草帽，手里拿着一支笔，正在本子上写着什么。她的脸上带着淡淡的微笑，我想她可能是在写日记吧。","每个人都有属于自己的放松方式，就像图中的这位女孩。我也是这样，周末喜欢一个人去公园，坐在树下写写东西。今天看到这张图片，让我想起了很多安静又美好的下午。"]},"day":5},{"grammar":[{"title":"连动句","base":"主语 + 动词1（+ 宾语1）+ 动词2（+ 宾语2）","baseEx":["我去银行办业务。","他坐地铁上班。","我们没有时间吃午饭。"],"notes":[{"p":"两个动作有先后或目的关系，动词1常表示方式或去哪儿","ex":["她去超市买东西。","我来中国学习汉语。"]},{"p":"状语一般放在第一个动词前面","ex":["你马上去通知大家。","他也坐飞机去北京。"]},{"p":"表示方式、工具的动词短语放在前面","ex":["他用汉语介绍产品。","我骑车去公司。"]},{"p":"否定词放在第一个动词前面","ex":["他不坐公交车上班。","我们没去机场接他。"]}],"real":[{"a":"他周末常常去图书馆看书。","c":["他","周末","常常","去","图书馆","看书"]},{"a":"请您到前台办理手续。","c":["请","您","到","前台","办理","手续"]}]}],"ex":[{"a":"我下班后去健身房锻炼。","c":["我","下班后","去","健身房","锻炼"]},{"a":"她用手机付钱。","c":["她","用","手机","付钱"]},{"a":"我们开车去郊区玩儿。","c":["我们","开车","去","郊区","玩儿"]},{"a":"他拿着文件走进了办公室。","c":["他","拿着","文件","走进了","办公室"]},{"a":"老师站起来回答问题。","c":["老师","站起来","回答","问题"]},{"a":"我去邮局寄包裹。","c":["我","去","邮局","寄","包 进",["除了……，还……","不但……，而且……","不仅……，还……"]],["商务",["激烈的市场竞争","长期合作","产品质量","售后服务","合作伙伴"]]],"models":[{"w":"客户 合作 价格 质量 满意","t":"想要和大客户建立长期合作，那绝对不是一件容易的事。除了要给出合理的价格，还要保证稳定的质量和准时交货。如果这几个方面都做得好，就能让客户满意，合作自然会越来越顺利。"}]}],"prac":"产品 市场 竞争 品牌 消费者","refs":["随着经济的发展，市场上的同类产品越来越多，竞争也越来越激烈。一方面，消费者希望买到便宜的产品；另一方面，他们又越来越重视品牌和质量。可是，好的品牌往往价格不低，消费者常常很难做出选择。","想要在激烈的市场竞争中占有一席之地，那绝对不是一件容易的事。除了产品的质量要好，还要建立自己的品牌，了解消费者真正的需要。如果这些都做到了，就能在市场中站稳脚跟。"]},"e2":{"title":"短文2：情景类Ⅰ","feat":["图片多是生活中常见的场景，有一个或几个人。","可以编一个故事，写出事情的前后变化。","也可以对这个场景发表看法。"],"tryImg":{"t":"scene","i":["person","run"],"c":"清晨，一男一女在公园里跑步","v":"Buổi sáng, một nam một nữ chạy bộ trong công viên"},"ex":[{"text":"一年前，我的身体很差，因为工作压力大，所以经常失眠。后来，我的朋友建议我每天早上去公园跑步。于是，我们约好一起坚持。现在，我不但睡得好了，而且精神也比以前好多了。","tpl":"……前，……。因为……，所以……。后来，……。于是，……。现在，……。","ph":[["过去",["一年前，……","刚来中国的时候，……","在我小的时候，……"]],["困难",["我被……困扰着","我不习惯……","我听不懂……"]],["因果",["因为……所以……","由于……，因此……","之所以……，是因为……"]]],"models":[{"img":{"t":"scene","i":["person","doctor"],"c":"一个人在医院和医生说话","v":"Một người đang nói chuyện với bác sĩ ở bệnh viện"},"t":"半年前，我总是觉得头疼，因为每天对着电脑工作十几个小时，所以颈椎出了问题。后来，我去医院看了医生，医生建议我每工作一个小时就起来活动一下。于是，我开始按时休息。现在，我的头疼已经好多了。"}]},{"text":"跑步是一种非常好的运动。首先，它可以让我们的身体更健康；其次，它不需要特别的场地和设备，随时都可以开始。需要注意的是，跑步前一定要做好准备活动，以免受伤。","tpl":"……是一种非常好的……。首先，……；其次，……。需要注意的是，……。","ph":[["列举",["首先……，其次……","第一……，第二……","首先……，然后……，最后……"]],["提醒",["需要注意的是……","值得注意的是……","千万不要忘了……"]]],"models":[{"img":{"t":"scene","i":["person","drop"],"c":"一位女士在喝水","v":"Một người phụ nữ đang uống nước"},"t":"多喝水是一种非常好的生活习惯。首先，它可以帮助身体排出垃圾；其次，它能让皮肤保持水分，看起来更有精神。需要注意的是，不要等到口渴了才喝水，最好每天分几次慢慢地喝。"}]}],"pracImg":{"t":"scene","i":["person","book"],"c":"一个人在安静的图书馆里看书","v":"Một người đang đọc sách trong thư viện yên tĩnh"},"refs":["一个月前，我在写毕业论文，因为找不到需要的资料，所以非常着急。后来，老师建议我去学校图书馆试试。于是，我每天都去那里查资料。现在，我的论文已经快写完了，我也爱上了在图书馆学习的感觉。","在图书馆学习是一种非常好的习惯。首先，那里很安静，可以让人集中精力；其次，那里有很多书和资料，查起来很方便。需要注意的是，一定要爱护借来的书，按时还书。"]},"day":8},{"grammar":[{"title":"“有”字句","base":"主语 + 有 + （定语）+ 宾语","baseEx":["我们部门有十二个人。","他有很多工作经验。","这个城市有很多公园。"],"notes":[{"p":"“的”字短语 + 有 + 数量","ex":["报名参加比赛的有五十多人。"]},{"p":"主语 + 有了/有过 + 宾语（表示变化或经历）","ex":["这几年家乡有了很大的变化。","我有过一次去国外工作的机会。"]},{"p":"有 + 名词 + 动词（表示“有……可以做”）","ex":["我今天有很多事要做。"]}],"real":[]},{"title":"“是……的”句","base":"主语 + 是 + 时间/地点/方式 + 动词 + 的（强调已经发生的事）","baseEx":["我是去年来越南的。","这些零件是在工厂里检查的。","他是坐飞机来的。"],"notes":[{"p":"“的”字短语 + 是 + 宾语","ex":["最重要的是安全。","我最喜欢的是周末。"]},{"p":"主语 + 是 + 动词短语 + 的（说明情况）","ex":["这个价格是很合理的。"]},{"p":"否定：不是……的","ex":["这个决定不是我做的。"]}],"real":[{"a":"他的这个想法是很有道理的。","c":["他的","这个","想法","是","很","有","道理的"]},{"a":"每个人都有自己的梦想。","c":["每个人","都","有","自己的","梦想"]}]}],"ex":[{"a":"我们公司有两个仓库。","c":["我们","公司","有","两个","仓库"]},{"a":"这家超市有很多进口水果。","c":["这家","超市","有","很多","进口","水果"]},{"a":"他有一个很好的建议。","c":["他","有","一个","很","好的","建议"]},{"a":"我的手机是在网上买的。","c":["我的","手机","是","在","网上","买的"]},{"a":"这份报告是昨天写完的。","c":["这份","报告","是","昨天","写完的"]},{"a":"那次会议是在上海开的。","c":["那次","会议","是","在","上海","开的"]},{"a":"参加培训的有三十个新员工。","c":["参加","培训的","有","三十个","新员工"]},{"a":"我是坐高铁来的。","c":["我","是","坐","高铁","来的"]},{"a":"最让我担心的是交货时间。","c":["最","让","我","担心的","是","交货","时间"]},{"a":"学校附近有一家很有名的书店。","c":["学校","附近","有","一家","很","有名的","书店"]}],"e1":{"title":"短文1：课余生活","real":"比赛 参加 可惜 总结 争取","feat":["词语常和各种活动有关（比赛、旅游、社团）。","可以描述一次活动。","也可以评论这类活动的好处。"],"try":"活动 参观 了解 文化 机会","ex":[{"text":"每个学期学校都会组织我们参加各种各样的活动。比如，上个月学校带我们参观了博物馆，我们不仅看到了很多古代的文物，而且对当地的历史文化有了更多的了解。非常感谢学校给我们提供这样难得的机会。","tpl":"每个学期学校都会组织我们参加各种各样的活动。比如，……，我们不仅……，而且……。非常感谢学校给我们提供这样难得的机会。","ph":[["递进",["不仅……，而且……","不但……，还……","……，甚至……"]],["旅游参观",["名胜古迹","风景优美","历史悠久","增长知识","参观、游览、欣赏"]]],"models":[{"w":"比赛 参加 可惜 总结 争取","t":"每个学期学校都会组织我们参加各种各样的活动。比如，上周我们班参加了学校的篮球比赛，虽然很可惜只得了第二名，但是我们不仅锻炼了身体，而且学会了一起总结经验，大家决定明年争取拿第一。非常感谢学校给我们提供这样难得的机会。"}]},{"text":"我最喜欢的课余活动之一是参观博物馆。这是因为：一方面，它能让我了解一个地方的历史和文化；另一方面，它也是放松心情的好方法。希望学校以后能多组织这样的活动。","tpl":"我最喜欢的……之一是……。这是因为：一方面，……；另一方面，……。希望……。","ph":[["并列",["一方面……，另一方面……","一来……，二来……","既……，又……"]],["因果",["因为……，所以……","之所以……，是因为……","由于……，因此……"]]],"models":[{"w":"比赛 参加 可惜 总结 争取","t":"我最喜欢的课余活动之一是参加演讲比赛。这是因为：一方面，它能锻炼我的口语和胆量；另一方面，每次比赛后总结经验，都让我进步很多。去年很可惜没有进入决赛，今年我一定要争取更好的成绩。"}]}],"prac":"爬山 风景 锻炼 放松 坚持","refs":["每个学期学校都会组织我们参加各种各样的活动。比如，上个周末学校组织我们去爬山，我们不仅欣赏了美丽的风景，而且锻炼了身体，最累的时候大家互相鼓励，终于坚持爬到了山顶。非常感谢学校给我们提供这样放松的机会。","我最喜欢的课余活动之一是爬山。这是因为：一方面，爬山可以锻炼身体，让人坚持下去的能力越来越强；另一方面，站在山顶看风景，所有的压力都能放松下来。希望学校能多安排这样的活动。"]},"e2":{"title":"短文2：情景类Ⅱ","feat":["图片多是几个人在一起的场景，如聚会、开会、运动。","可以写自己和朋友、同事的经历。","也可以写人们对这类场景的不同看法。"],"tryImg":{"t":"scene","i":["person","coffee","person"],"c":"几个朋友坐在咖啡店里聊天","v":"Mấy người bạn ngồi trò chuyện trong quán cà phê"},"ex":[{"text":"我来越南工作已经两年多了，在这里我认识了很多好朋友。周末的时候，我们常常聚在一起。有时候去咖啡店聊天，有时候一起去吃越南菜，还有的时候，我们会一起去海边玩儿。有他们在，我一点儿也不觉得孤单。","tpl":"我……已经……了，在这里我……。……的时候，我们常常……。有时候……，有时候……，还有的时候，……。有……，我……。","ph":[["时间经历",["我来中国已经一年多了","我们认识差不多五年了","我们在一起工作三年了"]],["集体活动",["一起逛街","一起聚餐","一起去旅游","一起打球、唱歌"]],["收获",["在这里我认识了很多朋友","在他们的帮助下，……","有他们在，我……"]]],"models":[{"img":{"t":"scene","i":["person","person","person"],"c":"几个同事举杯庆祝","v":"Mấy đồng nghiệp nâng ly chúc mừng"},"t":"我在这家公司工作已经三年了，在这里我认识了一群很好的同事。忙完一个项目的时候，我们常常一起庆祝。有时候去餐厅吃饭，有时候去唱卡拉OK，还有的时候，大家一起去郊外烧烤。有这样的同事，我工作起来特别开心。"}]},{"text":"有人说，朋友之间最重要的是经常见面、一起玩儿；但是也有人说，真正的朋友不需要天天在一起。我觉得，不管见面多少，只要在对方需要的时候能出现，就是好朋友。","tpl":"有人说……；但是也有人说……。我觉得，……。","ph":[["观点",["有人说……","有人认为……","众所周知，……","听说……"]],["递进",["不仅……还……","不但……而且……","除了……还……"]]],"models":[{"img":{"t":"scene","i":["person","person"],"c":"两个人在办公室握手","v":"Hai người bắt tay nhau trong văn phòng"},"t":"有人说，在工作中，能力最重要；但是也有人说，人际关系比能力更重要。我觉得，两者都很重要，一个人除了要有过硬的能力，还要善于和别人合作，这样才能把工作做好。"}]}],"pracImg":{"t":"scene","i":["person","ball","person"],"c":"几个年轻人在打篮球","v":"Mấy bạn trẻ đang chơi bóng rổ"},"refs":["我来中国留学已经一年多了，在这里我认识了很多爱运动的朋友。下课的时候，我们常常一起打篮球。有时候在学校的球场，有时候在体育馆，还有的时候，我们会参加学校的比赛。有他们陪着，我的留学生活特别快乐。","有人说，篮球是男孩子的运动；但是也有人说，女孩子也应该多打篮球。我觉得，运动没有男女之分，打篮球不仅能锻炼身体，还能培养团队合作精神，每个人都可以试一试。"]},"day":9},{"grammar":[{"title":"存现句","base":"处所/时间 + 动词 + 着/了/趋向补语 + 数量 + 名词（表示存在、出现、消失）","baseEx":["墙上挂着一张地图。","前面开过来一辆车。","我们班走了两个同学。"],"notes":[{"p":"(1) 表示存在：处所 + 动词 + 着 + 名词","ex":["桌子上放着几份合同。","门口站着一位保安。","常用动词：放、挂、贴、站、坐、躺、停、写、摆。"]},{"p":"(2) 表示出现：处所 + 动词 + 了/过来/进来 + 名词","ex":["办公室来了一位新同事。","会议室里走进来几个客户。"]},{"p":"(3) 表示消失：处所 + 动词 + 了 + 名词","ex":["仓库里少了三箱货。","树上飞走了一只鸟。"]}],"real":[{"a":"门口贴着一张通知。","c":["门口","贴着","一张","通知"]}]}],"ex":[{"a":"桌子上放着一台笔记本电脑。","c":["桌子上","放着","一台","笔记本电脑"]},{"a":"教室里坐着很多学生。","c":["教室里","坐着","很多","学生"]},{"a":"墙上挂着一幅山水画。","c":["墙上","挂着","一幅","山水画"]},{"a":"楼下停着一辆白色的汽车。","c":["楼下","停着","一辆","白色的","汽车"]},{"a":"前面走过来一位老人。","c":["前面","走过来","一位","老人"]},{"a":"我们公司来了一位新经理。","c":["我们","公司","来了","一位","新经理"]},{"a":"天上飞过一群鸟。","c":["天上","飞过","一群","鸟"]},{"a":"河边种着很多柳树。","c":["河边","种着","很多","柳树"]},{"a":"昨天小区里搬走了两户人家。","c":["昨天","小区里","搬走了","两户","人家"]},{"a":"黑板上写着今天的作业。","c":["黑板上","写着","今天的","作业"]}],"e1":{"title":"短文1：学习与方法","real":"方法 进步 明显 坚持 辅导","feat":["词语常是抽象的名词、动词、副词。","大部分和学习有关。","可以写自己的学习经历、方法或经验。"],"try":"困难 语伴 练习 提高 成绩","ex":[{"text":"我学习汉语已经两年了。刚开始的时候，我遇到了很多困难，特别是声调总是说不准。后来，我找到了一个中国语伴，我们每周一起练习口语。在她的帮助下，现在我的汉语水平有了很大的提高，考试成绩也越来越好。","tpl":"我学习……已经……了。刚开始的时候，……。后来，……。在……的帮助下，现在……。","ph":[["学习经历",["我学习汉语已经……了","我考过两次HSK","我上过口语课和听力课"]],["学习相关",["课前预习，课后复习","老师耐心地讲解","我的口语/听力/写作水平提高了很多","取得了理想的成绩"]]],"models":[{"w":"方法 进步 明显 坚持 辅导","t":"我学习汉语已经一年多了。刚开始的时候，我觉得汉字特别难记，常常写错。后来，我的辅导老师教了我一个好方法：把汉字拆成几个部分来记。我每天坚持练习半个小时。在老师的帮助下，现在我写汉字的进步非常明显。"}]},{"text":"在学习汉语的过程中，遇到困难是很正常的。如果你想提高得快一点儿，就要多找机会练习，比如找一个语伴每天聊聊天。此外，每次考试以后认真总结，也能让你的成绩越来越好。","tpl":"在学习……的过程中，……。如果你想……，就要……。此外，……。","ph":[["假设",["如果……，就……","要是……，就……","假如……，那么……"]],["学习方法",["查资料","互相学习","取长补短","活学活用","死记硬背","课前预习","课后复习"]]],"models":[{"w":"方法 进步 明显 坚持 辅导","t":"在学习汉语的过程中，方法比时间更重要。如果你想进步得明显一点儿，就要找到适合自己的学习方法，比如每天坚持听写和跟读。此外，有条件的话，找一位老师辅导一下，也能帮你少走很多弯路。"}]}],"prac":"母语 影响 发音 比较 注意","refs":["我学习汉语已经三年了。刚开始的时候，我的发音受母语的影响很大，常常把声调说错。后来，老师让我把汉语和母语的发音比较一下，找出不同的地方。在老师的帮助下，现在我说话的时候会特别注意声调，发音好多了。","在学习汉语的过程中，母语常常会影响我们的发音和语法。如果你想说得更标准，就要多比较两种语言的不同，注意自己容易出错的地方。此外，多听多跟读，也是提高发音的好方法。"]},"e2":{"title":"短文2：情景类Ⅲ","feat":["图片多是生活中常见的情景，有一个或几个人。","可以先描述图片，再联系社会现象。","最后表达自己的观点。"],"tryImg":{"t":"scene","i":["person","bike"],"c":"一位年轻职员骑自行车上班","v":"Một nh const cloze=(t,lv)=>{
  if(lv===0)return esc(t);

  while(i<t.length){
    if(!isHan(t[i])){out+=esc(t[i]);i++;continue}
    let j=i;while(j<t.length&&isHan(t[j])&&j-i<2)j++;

  if(ds.sxagain!=null){SXP={i:SXP.i,ph:'read',t0:Date.now()};render();window.scrollTo(0,0);return}
  if(ds.sck){const i=+ds.sck;const q=H().sen[i];let ok=0;const fill=[];q.a.forEach((ans,k)=>{const v=document.querySelector(`[data-ss="${i}-${k}"]`).value;if(+v===ans&&v!=='')ok++;fill.push(q.o[ans])});document.getElementById('st'+i).innerHTML=blanks(q.t,fill);document.querySelectorAll(`#st${i} .blank`).forEach((b,k)=>{const v=document.querySelector(`[data-ss="${i}-${k}"]`).value;b.classList.add(+v===q.a[k]&&v!==''?'ok':'no')});document.getElementById('sf'+i).className='fb '+(ok===5?'good':'bad');document.getElementById('sf'+i).textContent=`Đúng ${ok}/5. Đáp án: `+q.a.map((x,k)=>`(${k+1}) ${'ABCDE'[x]}`).join('  ');return}
  if(ds.lsh){lsShow[ds.lsh]=!lsShow[ds.lsh];render();return}
  if(ds.cynext!=null){newCyQ();render();return}
  if(ds.cysrs!=null){RVONLY='h6cy';RV=null;location.hash='review';return}
  if(ds.rvall!=null){RVONLY=null;RV=null;render();return}
  if(ds.ap){apTab=ds.ap;render();return}
  if(ds.copy!=null){const v=$('#bk').value;navigator.clipboard.writeText(v).then(()=>toast('Đã chép mã sao lưu'),()=>{$('#bk').select();toast('Hãy chọn và chép thủ công')});return}
  if(ds.restore!=null){try{const s=JSON.parse($('#bk').value);ST=Object.assign(ST,s);save();RV=null;toast('Đã khôi phục tiến độ');render()}catch(err){toast('Mã không hợp lệ')}return}
  if(ds.reset!=null){if(t.dataset.arm){ST={py:ST.py,rate:ST.rate,done:{},seen:{},srs:{},drafts:{},newPerDay:20,newLog:{},decks:null,scope:'seen'};save();RV=null;toast('Đã xoá tiến độ');render()}else{t.dataset.arm=1;t.textContent='Bấm lần nữa để xoá hẳn'}return}
});
document.addEventListener('keydown',e=>{if(e.target.classList?.contains('hole')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.classList.toggle('rev')}});
const correctOrder=o=>{const c=o.item.c;return c.map((_,i)=>i)};
render();
}
