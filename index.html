<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện thi HSK 5–6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm study companion, precise like an exam booklet
   IDEA: 方格稿纸 — the HSK answer grid paper; every writing box is live grid paper
   PICTURE: home = 25-cell grid sheet, each day a cell stamped 完 when done
   COLOUR+TYPE: white paper, ink slate, jade grid lines, gold stamp; Noto Serif SC for Chinese, Be Vietnam Pro for UI
   LAYOUT: one centred column ≤ 860px, sticky top bar, bottom tab bar for iPad/phone thumbs */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161a);--paper:light-dark(#fbfcfb,#151d22);--ink:light-dark(#1c2430,#e6ebef);--mute:light-dark(#5d6873,#9aa7b2);--grid:light-dark(#2f8f6b,#4fbf95);--gridl:light-dark(#d5ebe1,#23413a);--gold:light-dark(#b8860b,#e0b546);--goldl:light-dark(#fbf1d6,#3a3115);--line:light-dark(#e3e8ec,#26323a);--warn:light-dark(#a0522d,#e39a6c);--warnl:light-dark(#fbeee3,#3a2618);--ok:light-dark(#1f7a5c,#5fd0a6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
.zh,.cn{font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.brand{font-weight:700;font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.brand .cn{font-size:18px}
.tog{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:14px}
.tog[aria-pressed=true]{border-color:var(--grid);color:var(--grid);font-weight:600}
main{max-width:860px;margin:auto;padding:18px 14px 30px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:170px;text-align:center;padding:9px 4px 10px;color:var(--mute);text-decoration:none;font-size:13px;line-height:1.2}
nav.tabs a b{display:block;font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;margin-bottom:2px}
nav.tabs a.on{color:var(--grid)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;margin:6px 0 6px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:28px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
.lead{color:var(--mute);margin:0 0 14px}
.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px solid var(--grid);background:var(--paper)}
.cell{aspect-ratio:1.35;border:1px solid var(--gridl);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);padding:4px;text-align:center}
.cell:hover{background:color-mix(in srgb,var(--grid) 6%,transparent)}
.cell .n{font-family:"Noto Serif SC",serif;font-size:clamp(20px,4.5vw,32px);font-weight:700;line-height:1}
.cell .t{font-size:11px;color:var(--mute);line-height:1.25;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.mock .n{color:var(--grid)}
.cell .stamp{position:absolute;top:5px;right:5px;width:26px;height:26px;border:2px solid var(--gold);color:var(--gold);border-radius:50%;font:700 13px/22px "Noto Serif SC",serif;text-align:center;transform:rotate(-12deg)}
.cell.cur{outline:3px solid var(--gold);outline-offset:-3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px}
.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.pri{color:#fff;background:var(--grid);border-color:var(--grid);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
@media(max-width:600px){.cell{aspect-ratio:1}}
.btn.sm{min-height:36px;padding:0 11px;font-size:14px;border-radius:10px;font-weight:500}
.btn:focus-visible,.tog:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--paper);margin:12px 0}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:57px;background:var(--bg);z-index:5}
.seg button{flex:none;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--paper);font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pat{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;background:var(--goldl);border-radius:10px;padding:8px 12px;display:inline-block;margin:4px 0 8px}
.s{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.s .zh{font-size:19px;line-height:1.7}
.py{grid-column:1/-1;color:var(--grid);font-size:14px;line-height:1.5;display:none}
body.showpy .py{display:block}
.say{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;flex:none}
.say svg{width:18px;height:18px}
.label{font-size:13px;font-weight:700;color:var(--grid);margin:16px 0 4px;text-transform:none}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.w{border:1px solid var(--gridl);border-radius:10px;padding:4px 10px;background:var(--paper);text-align:center;line-height:1.25}
.w .cn{font-size:20px;font-weight:700;display:block}
.w small{font-size:12px;color:var(--mute)}
.w.used{border-color:var(--grid);background:color-mix(in srgb,var(--grid) 10%,transparent)}
.tpl{border:2px solid var(--grid);border-radius:14px;padding:14px;margin:10px 0;background:var(--paper)}
.tpl .zh{font-size:19px;line-height:1.9}
.essay .zh{font-size:18px;line-height:1.95}
.mem .body{white-space:pre-line}
mark{background:var(--goldl);color:inherit;border-bottom:2px solid var(--gold);padding:0 1px}
.hole{display:inline-block;min-width:2em;border-bottom:2px solid var(--grid);color:transparent;cursor:pointer;background:color-mix(in srgb,var(--grid) 8%,transparent);border-radius:3px;user-select:none}
.hole.rev{color:var(--grid);background:none}
.memb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.memb button{min-height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.memb button.on{border-color:var(--grid);color:var(--grid);font-weight:700}
textarea{width:100%;font:18px/1.8 "Noto Serif SC",serif;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:120px}
textarea:focus{outline:2px solid var(--grid)}
.diff{font:18px/1.9 "Noto Serif SC",serif;margin-top:8px}
.diff .g{color:var(--ok)}.diff .m{color:var(--warn);background:var(--warnl);text-decoration:underline}.diff .x{color:var(--mute);text-decoration:line-through}
.gp{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));border:1.5px solid var(--grid);margin-top:8px;max-width:600px}
.gp i{aspect-ratio:1;border:.5px solid var(--gridl);font:normal clamp(11px,2.6vw,20px)/1 "Noto Serif SC",serif;display:flex;align-items:center;justify-content:center}
.gp i.k80{box-shadow:inset 0 -3px 0 var(--gold)}
.cnt{font-weight:700}.cnt.ok{color:var(--ok)}.cnt.low{color:var(--warn)}
.ord .ans{min-height:54px;border:2px dashed var(--gridl);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ord .pool{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:500 18px/1 "Noto Serif SC",serif}
.ord .ans .chip{background:color-mix(in srgb,var(--grid) 10%,var(--paper));border-color:var(--grid)}
.ord.good .ans{border-color:var(--ok);border-style:solid}
.ord.bad .ans{border-color:var(--warn);border-style:solid}
.fb{font-size:15px;margin:4px 0}.fb.good{color:var(--ok)}.fb.bad{color:var(--warn)}
.ordq{border-bottom:1px solid var(--line);padding:10px 0 12px}
.ordq .num{font-weight:700;color:var(--grid);margin-right:6px}
figure{margin:8px 0}
.pic figcaption{font-size:16px;margin-top:4px}.pic.scene{max-width:380px}.ph6{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:18px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--goldl),var(--paper))}figure img{max-width:min(100%,360px);border-radius:10px;border:1px solid var(--line);display:block}
.model{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:var(--paper)}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.phg{margin:6px 0 10px}
.phg .pl{display:flex;flex-wrap:wrap;gap:6px}
.ph{border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--bg);font:17px/1.4 "Noto Serif SC",serif;text-align:left}
.ph small{display:none;font:13px "Be Vietnam Pro",sans-serif;color:var(--grid)}
body.showpy .ph small{display:block}
.fc{border:2px solid var(--grid);border-radius:18px;padding:22px 18px;min-height:240px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.fc .kind{font-size:13px;color:var(--mute)}
.fc .q{font:24px/1.7 "Noto Serif SC",serif}
.fc .qv{font-size:18px;color:var(--grid)}
.fc .a{border-top:1px dashed var(--line);padding-top:12px;font:20px/1.8 "Noto Serif SC",serif}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.rate button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;line-height:1.2}
.rate button small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.deck{display:flex;flex-wrap:wrap;gap:8px}
.deck label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:40px;background:var(--paper);font-size:14px}
.deck input{width:18px;height:18px;accent-color:var(--grid)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grid)}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.t td.cn{font-size:18px;white-space:nowrap}
.adv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.adv button{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:6px 4px;line-height:1.2}
.adv .cn{font-size:20px;display:block}.adv small{color:var(--grid);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--grid)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute)}
.hl{background:var(--goldl);border-radius:12px;padding:12px 14px}

.rp{font:20px/2 "Noto Serif SC",serif;margin:0 0 6px;text-indent:2em}
.sen{cursor:pointer;border-radius:4px}.sen:hover{background:color-mix(in srgb,var(--grid) 8%,transparent)}.sen.on{background:var(--goldl)}
.vw{border-bottom:2px dotted var(--grid)}
.gm{color:var(--gold);font-weight:700}
.rpy{color:var(--grid);font-size:14px;line-height:1.6;margin:0 0 14px;display:none}body.showpy .rpy{display:block}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qt{font:18px/1.6 "Noto Serif SC",serif;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:17px/1.4 "Noto Serif SC",serif}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.no{border-color:var(--warn);background:var(--warnl)}
.rlist{display:grid;gap:10px}
.rli{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);text-decoration:none;color:var(--ink)}
.rli .n{font:700 26px/1 "Noto Serif SC",serif;color:var(--grid);text-align:center;border-right:1px solid var(--gridl)}
.rli .tt{font:19px/1.3 "Noto Serif SC",serif}
.vi{white-space:pre-line;font-size:15px;line-height:1.7}

.gp.c20{grid-template-columns:repeat(20,minmax(0,1fr));max-width:720px}
.gp.c20 i{font-size:clamp(9px,2vw,17px)}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--grid);text-align:center;color:var(--grid);font-weight:700;padding:0 4px}
.blank.ok{color:var(--ok)}.blank.no{color:var(--warn);border-color:var(--warn)}
select.sel{font:16px "Be Vietnam Pro";min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 8px}
.steps li{margin:4px 0}
.cyl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cyi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);text-align:left}
.cyi .cn{font-size:21px;font-weight:700}.cyi .p{color:var(--grid);font-size:13px}.cyi .v{font-size:14px}.cyi .ex{font:15px/1.6 "Noto Serif SC",serif;color:var(--mute);margin-top:4px}
.big{font-size:44px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--grid);line-height:1}
@media(max-width:600px){nav.tabs a{font-size:10.5px;padding-inline:2px}nav.tabs a b{font-size:18px}}
@media(max-width:600px){.brand .full{display:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:21px}.rate button{font-size:13px}.seg{top:55px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
<div class="brand"><span class="cn">HSK 5·6 备考</span><span class="full">· luyện thi HSK5 &amp; HSK6</span></div>
<button class="tog" id="tPy" aria-pressed="false" title="Hiện/ẩn pinyin">拼音</button>
<button class="tog" id="tSet" title="Cài đặt">Cài đặt</button>
</div></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
<a href="#home" data-t="home"><b>五</b>HSK5</a>
<a href="#read" data-t="read"><b>读</b>Đọc hiểu</a>
<a href="#h6" data-t="h6"><b>六</b>HSK6</a>
<a href="#review" data-t="review"><b>记</b>Ôn tập</a>
<a href="#drill" data-t="drill"><b>练</b>Luyện nhanh</a>
<a href="#appendix" data-t="appendix"><b>附</b>Phụ lục</a>
</nav>

<script>
const D={"h6":{"bing":[{"o":["这本书的作者是一位著名的历史学家。","通过这次培训，使我的业务水平有了很大的提高。","他每天早上都会去公园跑半个小时步。","春天到了，公园里的花都开了。"],"a":1,"e":"Thiếu chủ ngữ: “通过……，使……” làm câu mất chủ ngữ. Sửa: bỏ “通过” hoặc bỏ “使”."},{"o":["我们要尽量避免不犯同样的错误。","这家餐厅的菜不但好吃，而且价格也很合理。","经过三年的努力，他终于考上了理想的大学。","她把房间收拾得干干净净。"],"a":0,"e":"Phủ định thừa: “避免” đã mang nghĩa “tránh”, thêm “不” thành nghĩa ngược. Sửa: 避免犯同样的错误。"},{"o":["看了这部电影，大家都很受感动。","能否保持良好的心态，是考试取得好成绩的关键。","他是我见过的最认真负责的人之一。","这次会议讨论并通过了明年的工作计划。"],"a":1,"e":"Hai mặt – một mặt: “能否” (có hay không) đi với “取得好成绩” (một mặt). Sửa: 保持良好的心态，是……的关键。"},{"o":["截至今年十月底，公司已经完成了全年任务的百分之九十。","为了提高工作效率，公司引进了一套新的管理系统。","大约有三百人左右参加了这次活动。","他的建议得到了大家的一致认可。"],"a":2,"e":"Trùng lặp nghĩa: “大约” và “左右” cùng nghĩa “khoảng”. Chỉ giữ một từ."},{"o":["我们要发扬和继承中华民族的优秀传统。","这件事给我留下了深刻的印象。","他的汉语水平提高得很快。","这座城市的人口比十年前增加了一倍多。"],"a":0,"e":"Sai trật tự logic: phải “继承” (kế thừa) trước rồi mới “发扬” (phát huy). Sửa: 继承和发扬。"},{"o":["他穿着一件白衬衫和一顶黑帽子。","这个消息让大家非常兴奋。","由于天气原因，航班推迟了两个小时。","这家公司的产品远销世界各地。"],"a":0,"e":"Kết hợp sai: “穿” không đi với “帽子”. Sửa: 穿着一件白衬衫，戴着一顶黑帽子。"},{"o":["随着经济的发展，人们的生活水平不断提高。","他的报告引起了领导的高度重视。","我们的任务已经提前三天完成了。","只要努力学习，才能取得好成绩。"],"a":3,"e":"Sai cặp liên từ: “只要……就……” / “只有……才……”. Sửa: 只有努力学习，才能……"},{"o":["他是一个经验丰富的老师。","这篇文章的观点很新颖，语言也很生动。","不管天气多么冷，他都坚持每天跑步。","我们一定要防止类似的事故不再发生。"],"a":3,"e":"Phủ định thừa: “防止” đã là “ngăn không cho xảy ra”, thêm “不再” thành nghĩa ngược. Sửa: 防止类似的事故再次发生。"},{"o":["这家工厂的产量今年比去年降低了一倍。","他从小就对音乐产生了浓厚的兴趣。","我们终于找到了解决问题的办法。","她一边听音乐，一边做作业。"],"a":0,"e":"Sai logic số liệu: “giảm” không dùng “一倍” (giảm một lần là về 0). Dùng phân số: 降低了一半 / 百分之五十。"},{"o":["他的成功离不开家人的支持。","关于这个问题，我们明天再讨论吧。","这个问题我们已经讨论很多次了。","在老师的帮助下，取得了很大的进步。"],"a":3,"e":"Thiếu chủ ngữ: “在……下” là trạng ngữ, câu không có ai “取得进步”. Sửa: 在老师的帮助下，我取得了很大的进步。"},{"o":["今年夏天比往年热得多。","他说的话让大家都笑了起来。","这家工厂的产品主要出口到欧洲。","经过讨论，大家终于统一了。"],"a":3,"e":"Thiếu tân ngữ: “统一了” thống nhất cái gì? Sửa: 统一了意见。"},{"o":["你千万别忘了带护照。","这个问题并不像你想的那么简单。","他从来没有迟到过。","谁也不能否认这不是一个好办法。"],"a":3,"e":"Phủ định chồng phủ định làm nghĩa ngược: “不能否认……不是” = khẳng định là không tốt. Sửa: 谁也不能否认这是一个好办法。"},{"o":["他的年龄大约在三十岁左右。","这次会议由王经理主持。","请大家在规定时间内交卷。","他把车停在了公司门口。"],"a":0,"e":"Trùng lặp: “大约” và “左右” cùng nghĩa. Giữ một từ."},{"o":["这个消息很快传遍了全城。","他提高了工作效率。","我们要努力改善人民的生活水平。","公司召开了年度总结大会。"],"a":2,"e":"Kết hợp sai: “改善” đi với “条件/环境”; “水平” đi với “提高”. Sửa: 提高人民的生活水平。"},{"o":["昨天晚上我看了一部很有意思的电影。","他把会议的时间告诉了大家。","我们要及时地解决并发现问题。","这些年轻的志愿者都来自北京。"],"a":2,"e":"Sai trật tự: phải “phát hiện” rồi mới “giải quyết”. Sửa: 及时地发现并解决问题。"},{"o":["他的意见得到了大家的支持。","一个人能否成功，关键在于他是否努力。","我们明天上午九点在会议室开会。","是否坚持锻炼，是身体健康的重要条件。"],"a":3,"e":"Hai mặt – một mặt: “是否坚持” (có/không) mà “身体健康” chỉ một mặt. Sửa: 坚持锻炼，是身体健康的重要条件。"},{"o":["如果明天下雨，活动就改到室内。","只有多练习，才能提高口语水平。","虽然天气不好，但是比赛照常进行。","不但他会说英语，而且会说法语。"],"a":3,"e":"Vị trí liên từ: hai vế cùng chủ ngữ thì “不但” đứng sau chủ ngữ. Sửa: 他不但会说英语，而且会说法语。"},{"o":["我们终于完成了这个项目。","这本书一共有十二章。","他每天早上六点起床。","参加会议的有老师、学生和教育工作者。"],"a":3,"e":"Lẫn phạm vi: “老师” đã thuộc “教育工作者”, không thể liệt kê ngang hàng."},{"o":["这台机器的性能非常稳定。","这次失败的原因是由于准备不充分造成的。","他的建议被领导采纳了。","我们正在讨论明年的计划。"],"a":1,"e":"Trộn hai cấu trúc: “原因是……” và “由于……造成的”. Sửa: 这次失败的原因是准备不充分。"},{"o":["小王和小李一起去看望老师，他带了一束花。","下周我们要去上海出差。","这家餐厅的服务很周到。","请把这封信交给经理。"],"a":0,"e":"Chỉ thay không rõ: “他” là 小王 hay 小李? Nói rõ người."}],"fill":[{"t":"人们常说“早起的鸟儿有虫吃”，很多成功人士都有早起的（1）。研究（2），早上是大脑最清醒的时候，这时候学习或工作，效率会比较高。不过，专家也提醒，早起的前提是要保证充足的睡眠，（3）反而会影响健康。","o":["习惯 表明 否则","风俗 证明 因此","规矩 说明 然而","爱好 显示 何况"],"a":0,"e":"习惯 thói quen (风俗 phong tục của cộng đồng); 研究表明 cố định; 否则 “nếu không thì”."},{"t":"茶已经成为中国人日常生活中不可（1）的一部分。朋友来了，（2）上一杯热茶，是表示欢迎和尊重；一家人坐在一起喝茶聊天，既轻松又（3）。","o":["缺乏 煮 温柔","缺少 泡 温馨","欠缺 炒 温和","短缺 烤 暖和"],"a":1,"e":"不可缺少 cụm cố định; 泡茶 pha trà; 温馨 ấm cúng (dùng cho không khí gia đình)."},{"t":"在职场中，沟通能力（1）重要。很多工作上的误会，并不是因为能力不够，（2）因为沟通不到位。一个善于沟通的人，能够准确地表达自己的想法，也能耐心地（3）别人的意见，这样团队合作才会更加顺利。","o":["特殊 而且 听见","非常 所以 打听","格外 而是 倾听","尤其 但是 听说"],"a":2,"e":"不是……而是…… cặp cố định; 倾听意见 lắng nghe ý kiến; 格外重要 = đặc biệt quan trọng."},{"t":"随着网络购物的（1），快递行业发展得越来越快。然而，大量的快递包装也带来了严重的环境问题。为了（2）浪费，一些快递公司开始使用可以重复利用的包装盒，消费者也可以把包装（3）给快递员回收。","o":["普遍 缩小 给予","普通 降低 送","广泛 减轻 递","普及 减少 交"],"a":3,"e":"……的普及 sự phổ cập (danh từ); 减少浪费 giảm lãng phí; 交给 giao cho."},{"t":"有些人遇到困难就容易放弃，（1）有些人却能坚持到底。心理学家认为，这和一个人的“心理弹性”有关。心理弹性强的人，（2）遇到多大的挫折，都能很快调整好自己的心态，把困难看作（3）的机会。","o":["而 无论 成长","但 尽管 发展","并 即使 增长","却 不管 生长"],"a":0,"e":"而 nối hai vế đối lập (vế sau đã có 却 nên D thừa); 无论……都…… ; 成长的机会 cơ hội trưởng thành."},{"t":"春节前，很多公司都会给员工发年终奖，这是对大家一年辛苦工作的（1）。不过，年终奖的多少往往（2）公司当年的效益。效益好的公司，奖金可能是好几个月的工资；效益不好的公司，（3）只能发一个红包表示心意。","o":["承认 依赖 何况","批准 在于 况且","证明 关于 反而","肯定 取决于 甚至"],"a":3,"e":"对……的肯定 sự ghi nhận; 取决于 phụ thuộc vào (quyết định bởi); 甚至 thậm chí."},{"t":"做事情要有计划。一份好的计划，可以让我们把有限的时间和精力（1）在最重要的事情上。但计划也不是一成不变的，遇到突发情况时，要学会（2）调整。只有这样，才能在变化中（3）主动。","o":["聚集 同时 坚持","集中 及时 保持","集合 准时 维持","收集 按时 保存"],"a":1,"e":"集中精力 tập trung sức lực; 及时调整 điều chỉnh kịp thời; 保持主动 giữ thế chủ động."},{"t":"这家老字号饭店已经有一百多年的历史了。几代厨师一直（1）传统做法，每一道菜都要经过十几道工序。虽然价格比普通饭店贵一些，但来吃饭的客人还是（2）。很多老顾客说，在这里吃饭，吃的不仅是味道，更是一种（3）。","o":["坚强 兴高采烈 想念","坚定 层出不穷 记忆","坚决 争先恐后 纪念","坚持 络绎不绝 回忆"],"a":3,"e":"坚持做法 kiên trì cách làm; 络绎不绝 khách nườm nượp; 一种回忆 một kỷ niệm (danh từ)."},{"t":"随着人工智能的发展，很多重复性的工作将会被机器（1）。有人因此担心自己会失业。但专家指出，新技术在淘汰一些岗位的同时，也会（2）出新的职业。对普通人来说，最重要的是保持学习的能力，（3）时代的变化。","o":["代替 创造 适应","替换 制造 合适","改变 建造 符合","交换 制作 适合"],"a":0,"e":"被机器代替 bị máy thay thế; 创造出新的职业 tạo ra nghề mới; 适应变化 thích nghi (适合 là tính từ/động từ không đi với 变化)."}],"sen":[{"t":"很多人都有拖延的习惯，明明知道事情很重要，（1）。心理学研究发现，拖延并不完全是因为懒，（2）。当一项任务看起来太难或者太大的时候，人们会本能地想要逃避。\n那么，怎样才能改掉拖延的习惯呢？专家建议，（3）。比如，要写一份十页的报告，可以先给自己定一个小目标：今天只写一页。（4），压力就会小很多，开始行动也就变得容易了。另外，完成一个小目标后，可以适当地奖励一下自己，（5）。","o":["而是和人们害怕失败的心理有关","却总是一拖再拖","可以把大任务分成几个小任务","这样能让人更有动力继续下去","当任务变小了以后"],"a":[1,0,2,4,3]},{"t":"中国的高铁被称为“中国速度”的代表。（1），中国已经建成了世界上规模最大的高速铁路网。如今，从北京到上海，坐高铁只需要四个多小时，（2）。\n高铁不仅缩短了城市之间的距离，（3）。很多年轻人选择“双城生活”：在一个城市工作，周末坐高铁回另一个城市的家。对于游客来说，（4），说走就走的旅行变得越来越普遍。\n当然，高铁的发展也面临一些问题，比如建设成本高、部分线路乘客少等。（5），是未来需要继续思考的问题。","o":["经过十几年的快速发展","如何让高铁更好地服务于社会","而以前坐普通火车要十几个小时","高铁让短途旅行更加方便","也改变了人们的生活方式"],"a":[0,2,4,3,1]},{"t":"很多人认为，失眠只是一个小问题，（1）。其实，长期失眠不仅会让人白天没精神，（2）。专家建议，要想睡个好觉，首先要养成规律的作息，每天在差不多的时间上床睡觉。其次，睡前一个小时最好不要看手机，（3）。另外，适当的运动也有助于睡眠，（4）。如果这些方法都试过了还是睡不着，（5）。","o":["因为手机屏幕的光会影响大脑分泌帮助睡眠的物质","不用太在意","但运动时间最好安排在睡前三小时以前","还会增加患多种疾病的风险","就应该及时去医院看医生"],"a":[1,3,0,2,4]},{"t":"开会是职场中常见的工作方式，（1）。有调查显示，员工平均每周要花六个多小时开会，（2）。那么，怎样才能提高会议效率呢？首先，会前要明确会议的目的，（3）。其次，开会时要控制时间，（4）。最后，会议结束前要明确每项任务的负责人和完成时间，（5）。","o":["不要让讨论偏离主题","但并不是所有的会议都是有效的","这样才能保证会议的决定真正落实","其中有将近一半的时间被认为是浪费的","并提前把相关材料发给参会人员"],"a":[1,3,4,0,2]}],"long":[{"title":"断舍离","t":["“断舍离”这个词最早来自日本，近几年在中国的年轻人中也流行起来。所谓“断”，是指不买不需要的东西；“舍”，是指扔掉家里没用的东西；“离”，是指不再执着于物品，让自己从对物品的依赖中解放出来。","很多人家里都堆满了东西：几年没穿过的衣服、只用过一次的厨房用具、舍不得扔的旧杂志……这些东西不仅占用了空间，也会让人感到压力。有研究表明，生活在杂乱环境中的人，更容易感到焦虑，工作效率也更低。","实行“断舍离”并不容易。很多人在整理的时候总会想：“这个以后可能还用得上。”其实，如果一件东西一年都没有用过，那么以后用到它的可能性也很小。专家建议，整理物品时可以问自己三个问题：我现在需要它吗？它适合现在的我吗？它会让我感到开心吗？如果三个答案都是否定的，就可以考虑把它送人或者捐出去。","值得注意的是，“断舍离”的目的不是让人过苦日子，而是学会选择。当我们只留下真正需要和喜欢的东西时，生活会变得更简单，内心也会更加轻松。"],"q":[["根据第一段，“舍”指的是：",["不买不需要的东西","扔掉家里没用的东西","不再依赖物品","把东西送给朋友"],1],["根据第二段，生活在杂乱环境中的人：",["更有创造力","更容易感到焦虑","更节约","更开心"],1],["专家建议整理物品时应该：",["把东西全部扔掉","先问自己三个问题","请别人帮忙整理","每年整理一次"],1],["作者认为“断舍离”的目的是：",["过苦日子","节省钱","学会选择","方便搬家"],2]]},{"title":"远程办公","t":["疫情以后，越来越多的公司开始尝试远程办公，也就是员工不用每天去办公室，而是在家里通过网络完成工作。","对员工来说，远程办公最大的好处是节省了通勤时间。在大城市，很多人每天花在上下班路上的时间超过两个小时。在家工作，这些时间就可以用来休息、锻炼或者陪伴家人。对公司来说，远程办公可以减少办公室租金等费用，还能招聘到住在其他城市的优秀人才。","不过，远程办公也带来了新的问题。首先，工作和生活的界限变得模糊了。有的员工发现，在家工作反而比在公司更累，因为晚上十点了还在回复工作消息。其次，同事之间缺少面对面的交流，团队的凝聚力可能会下降，新员工也很难快速融入团队。","因此，越来越多的公司选择了“混合办公”的方式：每周有几天在办公室，几天在家里。这样既能保持工作的灵活性，又能保证团队之间的沟通。专家认为，未来的办公方式不会只有一种，关键是找到适合公司和员工的平衡点。"],"q":[["对员工来说，远程办公最大的好处是：",["工资更高","节省通勤时间","工作更少","不用开会"],1],["下面哪一项不是远程办公给公司带来的好处？",["减少办公室租金","能招聘其他城市的人才","提高团队凝聚力","减少办公费用"],2],["有的员工觉得在家工作更累，是因为：",["家里网络不好","工作和生活的界限模糊了","家里太吵","没有电脑"],1],["根据短文，“混合办公”是指：",["只在家工作","只在办公室工作","每周有几天在办公室，几天在家","和别的公司一起办公"],2]]},{"title":"为什么我们记不住梦","t":["几乎每个人都有过这样的经历：早上醒来的时候，明明记得自己做了一个很有意思的梦，可是起床刷个牙的工夫，梦的内容就忘得差不多了。这是为什么呢？","科学家认为，这和大脑在睡眠时的工作方式有关。人在做梦时，大脑中负责把短期记忆转化为长期记忆的区域并不活跃，因此梦的内容只能暂时保存在短期记忆里。醒来以后，如果我们不马上回忆或者记录，这些内容很快就会被新的信息“覆盖”。","另外，梦的内容往往没有逻辑，场景变化快，人物也常常莫名其妙地出现和消失。和有完整情节的故事相比，这种杂乱的信息本来就更难记住。","有趣的是，有些人能比别人记住更多的梦。研究发现，这类人在睡眠中更容易短暂醒来，而这些短暂的清醒时刻，给了大脑记录梦境的机会。如果你想记住自己的梦，可以在床边放一个本子，醒来后先别着急起床，闭着眼睛回忆一下，再把它写下来。坚持一段时间，你会发现记住的梦越来越多。"],"q":[["根据第二段，梦的内容为什么容易忘记？",["梦的时间太短","负责转化长期记忆的区域不活跃","大脑完全休息了","梦不重要"],1],["第三段主要说明梦的内容：",["很有逻辑","杂乱，所以难记","非常有意思","和现实一样"],1],["能记住更多梦的人有什么特点？",["睡得更多","在睡眠中更容易短暂醒来","记忆力特别好","很少做梦"],1],["如果想记住梦，作者建议：",["早点儿睡觉","醒来马上起床","醒来后先回忆再写下来","睡前多喝水"],2]]},{"title":"“慢就业”","t":["近年来，一些大学毕业生没有马上找工作，也没有继续读书，而是选择先去旅行、做志愿者，或者在家思考自己真正想做什么。这种现象被称为“慢就业”。","对于“慢就业”，人们看法不一。支持的人认为，很多年轻人毕业时并不清楚自己适合做什么，匆忙找一份不喜欢的工作，过不了多久又要辞职，不如花一段时间了解社会、了解自己，再做选择。","反对的人则担心，“慢就业”容易变成“懒就业”。有的年轻人以“慢就业”为借口，长时间依赖父母，既不学习，也不工作，结果离社会越来越远。","专家认为，“慢就业”本身不是问题，关键在于这段时间是否有计划、有目标。如果能利用这段时间提升能力、积累经验，那么“慢”下来反而能让以后的路走得更快。"],"q":[["“慢就业”是指：",["继续读研究生","毕业后不急着马上找工作","毕业后马上工作","工作的速度很慢"],1],["支持“慢就业”的人认为：",["年轻人应该多赚钱","应该依赖父母","工作并不重要","可以先了解自己再做选择"],3],["反对的人担心什么？",["旅行花钱太多","年轻人太累","工作太难找","“慢就业”变成“懒就业”"],3],["专家认为关键在于：",["是否找到高薪工作","这段时间是否有计划、有目标","父母是否同意","是否出国"],1]]},{"title":"会“说话”的植物","t":["人们一直以为植物不会“说话”，但科学家发现，植物之间其实也能“交流”。","当一棵植物被虫子咬了以后，它会释放出一种特殊的气体。附近的植物“闻”到这种气体后，就会提前做好准备，在叶子里产生让虫子不喜欢的物质。这样，当虫子来的时候，它们就不容易受到伤害。","不仅如此，植物的根在地下也能互相“传递信息”。研究发现，在一片森林里，大树和小树的根通过土壤中的真菌连在一起，形成一个巨大的网络。大树可以通过这个网络把养分输送给阳光不足的小树，就像父母照顾孩子一样。","这些发现让人们重新认识了植物。也许在我们看不见的地方，植物们一直在用自己的方式“说话”。"],"q":[["植物被虫子咬了以后会：",["长得更快","释放出一种特殊的气体","马上死去","开出花来"],1],["附近的植物“闻”到气体后会：",["停止生长","在叶子里产生虫子不喜欢的物质","吸引更多虫子","慢慢枯萎"],1],["第三段“就像父母照顾孩子一样”是说：",["小树照顾大树","树会生出小树","真菌照顾大树","大树把养分送给小树"],3],["最适合做这篇短文标题的是：",["森林有多大","怎样种树","虫子的生活","植物的“语言”"],3]]},{"title":"排队的学问","t":["排队是生活中常见的事。在超市结账时，很多人都有这样的感觉：自己排的那一队总是最慢的。这真的是运气不好吗？","其实，这里面有数学的道理。假设超市有三个收银台，那么你排的队是最快的一队的可能性只有三分之一，也就是说，有三分之二的可能性，别的队比你快。所以，“我的队最慢”的感觉其实很正常。","那怎样排队才更快呢？有研究发现，左边的队往往比右边的短，因为大部分人习惯用右手，进门后会自然地向右走。另外，与其选人少的队，不如看看每个人购物车里的东西有多少。一个人买二十样东西，可能比三个人各买三样东西还要慢。","现在，越来越多的银行和医院采用“一条队、多个窗口”的方式：大家排成一队，哪个窗口空了就去哪个。这种方法不但更公平，平均等待时间也更短。"],"q":[["为什么人们常觉得自己排的队最慢？",["从数学上看，别的队更快的可能性更大","超市人太多","运气不好","收银员太慢"],0],["为什么左边的队往往更短？",["左边离门更远","大部分人进门后习惯向右走","左边的收银员更快","左边的东西更便宜"],1],["作者建议选队时应该注意：",["队里有几个人","收银员是谁","购物车里东西的多少","现在几点"],2],["“一条队、多个窗口”的好处是：",["更公平，平均等待时间更短","需要的窗口更少","大家都不用排队","可以插队"],0]]},{"title":"“无陪护病房”","t":["在很多医院，病人住院时，家属需要请假来医院照顾，有的家庭还要花钱请护工。这不仅增加了家庭的经济负担，也让很多上班族左右为难。为了解决这个问题，一些医院开始尝试“无陪护病房”。","所谓“无陪护病房”，就是病人住院期间，生活上的照顾全部由医院的护士和护理员负责，家属不需要在医院陪护。护理员经过专业培训，负责帮病人吃饭、洗漱、翻身等；护士则负责治疗和观察病情。","这种模式受到了很多家庭的欢迎。一位病人的女儿说：“以前我妈住院，我每天下班后都要赶到医院，晚上睡在椅子上，第二天再去上班，身体都快垮了。现在，护理员照顾得很专业，我们放心多了。”","不过，“无陪护病房”的推广也面临一些困难。最主要的问题是护理人员不够，而且护理员的工资不高，工作又辛苦，很多人干不了多久就离开了。此外，有的病人习惯了家人的陪伴，一开始不太适应。专家认为，要让这种模式真正推广开来，还需要加大对护理人员的培养，并提高他们的待遇。"],"q":[["“无陪护病房”是为了解决什么问题？",["医生的工作太忙","药价太贵","医院的病床不够","家属照顾病人的负担太重"],3],["在“无陪护病房”里，谁负责病人吃饭、洗漱？",["经过培训的护理员","医生","病人自己","病人的家属"],0],["第三段中，病人的女儿想说明什么？",["她工作很忙","“无陪护病房”让家属放心了很多","医院的椅子不舒服","她妈妈的病很严重"],1],["“无陪护病房”推广的主要困难是：",["医院不同意","费用太高","护理人员不够","病人太少"],2]]},{"title":"微专业","t":["最近几年，“微专业”在中国的大学里越来越受欢迎。所谓“微专业”，是指围绕某个具体的领域开设的一组课程，一般只有五到八门课，学生可以利用一到两个学期的课余时间学完。","和传统专业相比，微专业的特点是“小而精”。比如，一个学中文的学生可以选修“跨境电商”微专业，学习网上开店、国际物流、数据分析等实用知识；一个学机械的学生可以选修“人工智能应用”微专业，了解最新的技术。","微专业受欢迎的原因主要有两个。一是就业市场越来越需要既懂专业、又有跨领域能力的人才；二是很多学生对自己的专业不太满意，又不想换专业，微专业给了他们一个尝试新方向的机会。","当然，微专业也不能代替系统的专业学习。有的学生一下子选了好几个微专业，结果每个都只学到了皮毛，反而影响了本专业的学习。专家提醒，选择微专业要根据自己的职业规划，宁可少而精，也不要贪多。"],"q":[["关于“微专业”，下面哪项正确？",["需要读四年","只有理科学生能选","课程不多，可以利用课余时间学完","必须换专业"],2],["第二段主要说的是微专业的：",["学费","历史","考试方法","特点和例子"],3],["学生选择微专业的原因之一是：",["学校要求必须选","可以不上本专业的课","微专业比较容易","想尝试新的方向又不想换专业"],3],["专家对选择微专业的建议是：",["越多越好","根据职业规划，少而精","毕业以后再选","只选热门的"],1]]}],"l1":[{"t":"很多人以为喝咖啡会让人脱水，其实，适量喝咖啡并不会造成身体缺水。专家建议，健康的成年人每天喝咖啡最好不要超过三杯。","o":["咖啡会让人脱水","每天喝咖啡最好不超过三杯","咖啡对身体没有好处","成年人不能喝咖啡"],"a":1},{"t":"小王第一次去朋友家做客，带了一束菊花。朋友的妈妈看到以后，脸色马上变了。原来，在中国，菊花一般是用来纪念去世的人的。","o":["小王常去朋友家","朋友的妈妈很喜欢菊花","在中国，菊花常用来纪念去世的人","小王送了一盒点心"],"a":2},{"t":"这家书店晚上不关门，二十四小时营业。很多年轻人下班以后来这里看书，有的人甚至一直待到天亮。书店老板说，他希望给城市里的人留一盏灯。","o":["书店二十四小时营业","书店晚上十点关门","书店只卖杂志","老板不喜欢年轻人"],"a":0},{"t":"面试的时候，第一印象非常重要。研究表明，面试官往往在见面后的前几分钟就已经对应聘者形成了基本的判断。所以，穿着整洁、准时到达，是面试成功的第一步。","o":["面试时间越长越好","穿着不太重要","面试官很少做判断","第一印象在面试中非常重要"],"a":3},{"t":"熊猫看起来胖胖的，动作也很慢，但其实它们是爬树的高手。小熊猫出生几个月以后，就能自己爬到很高的树上去休息了。","o":["熊猫爬树很厉害","熊猫不会爬树","小熊猫一出生就会爬树","熊猫动作很快"],"a":0},{"t":"老李退休以后，开始学习画画。刚开始，他连一条直线都画不好。但是他每天坚持练习三个小时，五年后，他的作品竟然在市里的画展上获了奖。","o":["老李年轻时是画家","老李放弃了画画","老李每天练习三个小时","老李的作品没有获奖"],"a":2},{"t":"很多公司规定，员工在报销费用的时候，必须提供正规的发票。没有发票，或者发票上的信息不完整，财务部门是不能报销的。","o":["报销不需要发票","发票信息可以不完整","财务部门不管报销","报销时必须提供正规发票"],"a":3},{"t":"“塞翁失马，焉知非福”这句话告诉我们，坏事在一定条件下也可能变成好事。所以遇到不顺利的事情时，不要太难过。","o":["坏事永远是坏事","坏事有时也可能变成好事","应该多养马","遇到困难要放弃"],"a":1},{"t":"这家公司实行弹性工作制，员工可以在早上七点到十点之间任意时间上班，只要每天工作满八个小时就行。","o":["员工必须七点上班","公司不要求工作时间","员工每天工作十个小时","员工上班时间比较灵活"],"a":3},{"t":"研究发现，每天走路六千步左右，就能明显降低患心脏病的风险。走得更多当然更好，但效果的增加并不明显。","o":["每天必须走一万步","走得越多效果越明显","走路对心脏没有影响","每天走六千步左右对心脏有好处"],"a":3},{"t":"小张原来是一名会计，三十五岁那年辞职开了一家面包店。虽然收入比以前少了，但他说，每天闻着面包的香味，心里特别踏实。","o":["小张现在还在当会计","小张对现在的生活很满足","小张的收入增加了","小张后悔辞职了"],"a":1},{"t":"很多人不知道，香蕉放进冰箱里反而坏得更快。香蕉最好放在通风、阴凉的地方，温度在十三度左右最合适。","o":["香蕉不适合放进冰箱","香蕉喜欢高温","香蕉应该放进冰箱","香蕉一点儿也不怕冷"],"a":0},{"t":"这次的产品发布会原定于下周三举行，由于部分设备没能按时到货，公司决定推迟到下个月初。","o":["发布会提前了","设备已经全部到了","发布会推迟了","发布会取消了"],"a":2},{"t":"老王开出租车二十年了，北京的大街小巷他都熟悉。有乘客说，坐他的车就像请了一位导游，他会一路给你讲每条胡同的故事。","o":["老王对北京非常熟悉","老王不爱说话","老王是一名导游","老王刚开始开出租车"],"a":0},{"t":"“三人行，必有我师”的意思是，几个人在一起，其中一定有值得我学习的人。它告诉我们，要虚心向别人学习。","o":["别人都不如我","一个人应该有三位老师","要虚心向别人学习","三个人一起走路最好"],"a":2},{"t":"超市里的牛奶一般放在最里面，这样，顾客为了买牛奶，就要经过很多货架，也就可能顺便买其他东西。","o":["顾客不喜欢买牛奶","超市的牛奶很便宜","牛奶一般放在门口","这样安排是为了让顾客多买东西"],"a":3},{"t":"面对批评，有的人会生气，有的人会难过。其实，别人愿意指出你的问题，说明他在乎你。学会接受批评，是一个人成熟的表现。","o":["学会接受批评是成熟的表现","指出你问题的人不在乎你","听到批评应该生气","别人的批评都是错的"],"a":0},{"t":"我们公司每年都会组织员工体检。今年体检的时间是十二月五号上午，体检前一天晚上十点以后不要吃东西。","o":["体检前一天晚上十点以后不能吃东西","体检在下午进行","体检当天可以吃早饭","公司两年体检一次"],"a":0}],"l3":[{"title":"机场广播","t":"各位乘客，大家好。由于前方天气原因，本次航班将推迟大约四十分钟起飞。在等待期间，我们将为您提供免费的饮料和小吃。需要转机的乘客，请到登机口旁边的服务台办理相关手续，工作人员会帮您重新安排后面的航班。给您带来的不便，我们深表歉意，感谢您的理解和配合。","q":[["航班为什么推迟？",["飞机出了故障","天气原因","乘客太多","机场太忙"],1],["航班大约推迟多长时间？",["二十分钟","半个小时","四十分钟左右","一个小时"],2],["需要转机的乘客应该怎么做？",["先回家","去服务台办理手续","给航空公司打电话","在座位上等广播"],1]]},{"title":"采访：咖啡店老板","t":"记者：您的咖啡店开了五年，为什么一直坚持用本地的咖啡豆？老板：我是云南人，小时候家里就种咖啡。很多人不知道，云南咖啡的品质其实很好，只是以前没什么名气。我开这家店，一方面是想让更多人尝到好咖啡，另一方面也是想帮家乡的农民把咖啡卖出去。现在，我们店里百分之八十的咖啡豆都来自云南的小农场。记者：未来有什么打算？老板：明年我们准备在网上开一家店，让全国的顾客都能买到云南咖啡。","q":[["老板是哪里人？",["北京","上海","云南","广东"],2],["店里有多少咖啡豆来自云南？",["一半","百分之八十","全部","百分之二十"],1],["老板明年打算做什么？",["开第二家店","在网上开店","去国外学习","关掉咖啡店"],1]]},{"title":"公司通知","t":"各位同事，下面通知一件事。为了提高大家的安全意识，公司将于本周五下午两点在一楼会议室举行消防安全培训，时间大约一个半小时。培训结束后，还会在停车场进行灭火器使用的实际操作练习。请各部门安排好工作，所有员工必须参加。如果有特殊情况不能参加，请提前向人事部说明。","q":[["培训什么时候举行？",["本周五下午两点","本周四下午","本周五上午","下周一上午"],0],["培训结束后要做什么？",["在停车场练习使用灭火器","继续开会","去医院体检","一起吃饭"],0],["不能参加的人应该怎么做？",["下周再补","提前向人事部说明","直接不来","找总经理请假"],1]]},{"title":"对话：骑车上班","t":"女：你最近怎么每天都骑车上班？男：上个月体检，医生说我血脂有点儿高，让我多运动。我想，与其专门去健身房，不如每天骑车上下班，一举两得。女：从你家到公司得有十公里吧？男：差不多，骑车四十分钟。刚开始腿很疼，现在已经习惯了，而且比坐车还准时，再也不怕堵车了。女：那我也试试，正好我也想减肥。","q":[["男的为什么骑车上班？",["医生让他多运动","他家离公司很近","他的车坏了","为了省钱"],0],["男的家离公司大约多远？",["十公里","四十公里","四公里","一公里"],0],["女的打算怎么做？",["也试试骑车上班","买一辆车","改坐地铁","去健身房"],0]]},{"title":"采访：翻译王老师","t":"记者：您做翻译二十多年了，觉得翻译最难的是什么？王老师：很多人以为最难的是词汇，其实不是。最难的是文化的差别。同样一句话，在中文里很礼貌，翻成另一种语言可能就不太礼貌了。所以翻译不能只看字面意思，还要理解说话人的真正意思。记者：对想当翻译的年轻人，您有什么建议？王老师：多读书，多了解不同国家的文化。语言只是工具，真正决定翻译水平的，是你对两种文化的理解。","q":[["王老师认为翻译最难的是什么？",["文化的差别","发音","词汇","语法"],0],["翻译时应该怎么做？",["只看字面意思","理解说话人的真正意思","翻得越快越好","多用难的词"],1],["王老师给年轻人的建议是：",["多背单词","多读书，多了解不同国家的文化","早点儿工作","尽早出国"],1]]}],"cy":[["全力以赴","dốc toàn lực","为了完成这个项目，大家都全力以赴。"],["一举两得","một công đôi việc","骑自行车上班既锻炼身体又保护环境，真是一举两得。"],["半途而废","bỏ dở giữa chừng","学习语言最怕半途而废。"],["千方百计","trăm phương nghìn kế","他千方百计地想办法降低成本。"],["实事求是","đúng với thực tế, trung thực","写报告一定要实事求是。"],["迫不及待","nóng lòng không chờ được","一下课，孩子们就迫不及待地跑了出去。"],["津津有味","say sưa, ngon lành","他津津有味地听爷爷讲故事。"],["不可思议","khó tin, không thể tưởng tượng","这么短的时间就完成了任务，真是不可思议。 "mỗi người bày tỏ ý kiến","会上大家各抒己见。"],["名列前茅","đứng đầu bảng","他的成绩一直名列前茅。"],["齐心协力","đồng lòng hiệp lực","大家齐心协力，终于按时完成了订单。"],["竭尽全力","dốc hết sức","我们会竭尽全力满足您的需求。"],["无微不至","chu đáo từng li từng tí","妈妈对我的照顾无微不至。"],["喜出望外","mừng ngoài mong đợi","收到录取通知书，他喜出望外。"],["杞人忧天","lo bò trắng răng","你这是杞人忧天，事情没那么严重。"],["画蛇添足","vẽ rắn thêm chân, làm thừa","文章已经很好了，再加这段就是画蛇添足。"],["守株待兔","ôm cây đợi thỏ","做生意不能守株待兔，要主动寻找客户。"],["塞翁失马","tái ông mất ngựa, họa phúc khó lường","塞翁失马，焉知非福，这次失败也许是好事。"],["自言自语","tự nói một mình","他一边走一边自言自语。"]],"sx":[{"title":"一碗面","topic":"Lòng tốt · tự trọng","text":["二十年前，在一个小县城的火车站旁边，有一家很小的面馆。面馆的老板姓陈，五十多岁，为人热情。他做的牛肉面汤浓肉多，价格却很便宜，所以来吃面的大多是附近干活的工人和赶路的旅客。","一个冬天的晚上，外面下着大雪，面馆快要关门了。这时，门被轻轻推开，走进来一个十几岁的男孩。他穿着一件很薄的旧外套，脸冻得通红。男孩在门口站了很久，才小声问：“老板，一碗面多少钱？”陈老板说：“八块。”男孩低下头，从口袋里掏出一把零钱，数了好几遍，只有五块钱。他红着脸说：“对不起，那我不吃了。”说完转身就要走。","陈老板叫住了他，笑着说：“今天正好有活动，晚上九点以后进门的客人，一碗面只要五块。”男孩愣了一下，眼睛一下子亮了起来。陈老板给他端上了一大碗热腾腾的牛肉面，还特意多加了一个鸡蛋。男孩吃得很香，连汤都喝得干干净净。临走时，他向陈老板深深地鞠了一躬。","其实，面馆从来没有什么“九点以后的活动”。陈老板只是看出了男孩的难处，又不想伤害他的自尊心。","时间一年一年过去，陈老板老了，面馆也因为城市改造被拆掉了。他早就忘了那个下雪的晚上。","去年春天，一个穿着西装的年轻人找到了陈老板的家。他说自己是一家食品公司的经理，想请陈老板做公司的技术顾问，帮助他们开发一款新的牛肉面。陈老板觉得很奇怪：“我只是一个开小面馆的，你为什么找我？”年轻人笑了笑，说：“二十年前的一个雪夜，您用五块钱卖给我一碗面，还多给了我一个鸡蛋。那天我刚从家里跑出来，身上只剩下五块钱，本来已经对生活失去了信心。是那碗面让我知道，这个世界上还有温暖。”","陈老板这才想起来，原来那个男孩就是他。后来，在陈老板的帮助下，那款牛肉面一上市就受到了顾客的欢迎。包装上印着一句话：“一碗热面，温暖一个人。”"],"key":["人物：陈老板（面馆老板）、男孩（后来的食品公司经理）","起因：雪夜，男孩只有5块钱，一碗面8块","经过：陈老板编了“九点以后5块”的活动，还多加一个鸡蛋","转折：二十年后，年轻经理请陈老板做技术顾问","结果：经理就是当年的男孩；新面很受欢迎","主题：善意保护别人的自尊，也会改变别人的一生"],"model":["二十年前，陈老板在一个小县城的火车站旁边开了一家面馆。他为人热情，面做得好吃，价格也便宜。","一个下大雪的晚上，面馆快关门时，一个穿得很少的男孩走了进来。他问一碗面多少钱，陈老板说八块，可是男孩身上只有五块钱，他不好意思地准备离开。陈老板叫住他，说九点以后吃面只要五块钱。其实这个活动根本不存在，陈老板只是想帮助男孩，又不想伤害他的自尊心。他不但给男孩端上了一大碗面，还多加了一个鸡蛋。男孩吃完后向他深深地鞠了一躬。","很多年过去了，面馆被拆了，陈老板也忘了这件事。去年，一位年轻的食品公司经理找到他，请他做公司的技术顾问。原来，这位经理就是当年的那个男孩。那天他从家里跑出来，对生活失去了信心，是那碗面让他感受到了温暖。","在陈老板的帮助下，公司开发的牛肉面很受欢迎，包装上写着：“一碗热面，温暖一个人。”"]},{"title":"一次特别的面试","topic":"Tuyển dụng · thái độ làm việc","text":["李明大学毕业后，一直想进一家有名的外贸公司工作。经过几轮笔试和面试，他终于进入了最后一轮。和他一起参加最后一轮面试的，还有另外四个年轻人，他们都毕业于名牌大学，有的还有国外留学的经历。李明心里很没底。","面试那天，人事部的王经理把五个人带进一间会议室，说：“总经理临时有个重要的会，要晚一个小时才能到，请大家在这里等一下。”说完就离开了。","会议室里很乱，桌子上放着用过的纸杯，地上有几张废纸，椅子也东一把西一把。几个年轻人看了看，有的拿出手机看新闻，有的坐下来复习准备好的材料，还有两个人小声地聊起天来。","李明等了一会儿，觉得有点儿无聊。他想：反正也没事做，不如把会议室收拾一下。于是，他把纸杯扔进了垃圾桶，把地上的废纸捡了起来，又把椅子一把一把摆整齐。有人笑着对他说：“你是来面试的，又不是来打扫卫生的。”李明笑了笑，没有说什么，又顺手给窗台上的花浇了水。","一个小时过去了，王经理回到会议室，宣布面试结果：“谢谢大家，今天的面试已经结束了。李明，恭喜你，你被录取了。”大家都愣住了：“总经理还没来，怎么就结束了？”","王经理解释说：“其实，总经理今天并没有开会。刚才这一个小时，就是最后一轮面试。我们公司做的是外贸生意，每天要处理很多细节，客户最在意的就是我们是不是认真、负责。学历和能力我们在前几轮已经了解了，这一轮，我们想看看大家在没有人注意的时候会怎么做。”","另外几个人听了，都不好意思地低下了头。","后来，李明在这家公司工作了十几年，从一个普通的业务员成长为部门经理。每当有新员工入职，他都会给他们讲这个故事，并告诉他们：机会往往就藏在那些别人看不上的小事里。"],"key":["人物：李明、人事部王经理、另外四个应聘者","起因：最后一轮面试，其他人都是名牌大学毕业，李明没把握","经过：经理说总经理晚到一小时；会议室很乱，只有李明收拾","转折：经理宣布李明被录取——这一小时就是最后一轮面试","原因：外贸工作重细节，公司看重认真负责","结果+道理：李明成了部门经理；机会藏在小事里"],"model":["李明大学毕业后，想进一家有名的外贸公司。经过几轮考试，他和另外四个年轻人进入了最后一轮面试。其他人都毕业于名牌大学，李明心里没有把握。","面试那天，人事经理把他们带进一间会议室，说总经理要晚一个小时才能到，请大家等一下。会议室里又脏又乱，可是大家有的看手机，有的复习材料，有的聊天，谁也没有在意。李明觉得反正没事做，就把会议室收拾得干干净净，还给花浇了水。有人笑话他不是来打扫卫生的，他也没有在意。","一个小时后，经理回来宣布：李明被录取了。大家都很吃惊。经理解释说，总经理根本没有开会，刚才的一个小时就是最后一轮面试。外贸工作要处理很多细节，公司最看重员工是否认真负责，所以想看看大家在没人注意时会怎么做。","后来，李明在这家公司从普通业务员做到了部门经理。他常常告诉新员工：机会往往藏在别人看不上的小事里。"]},{"title":"最后一座房子","topic":"Thái độ quyết định kết quả","text":["有一位老木匠，在一家建筑公司干了四十多年。他手艺好，做事认真，盖的房子又结实又漂亮，老板一直很信任他。","这一年，老木匠六十五岁了。他觉得自己累了，想退休回家，好好陪陪老伴儿，享受一下轻松的生活。他把这个想法告诉了老板。老板很舍不得他，再三挽留，可是老木匠已经下定了决心。最后，老板只好同意了，但是提出了一个请求：“您能不能在走之前，再帮我盖最后一座房子？”老木匠虽然有点儿不情愿，但还是答应了。","可是，大家很快发现，老木匠的心已经不在工作上了。他每天来得很晚，走得很早，选材料的时候也不像以前那样仔细，有的木头有裂缝，他也没有换掉。工人们问他某个地方应该怎么做，他总是不耐烦地说：“随便吧，差不多就行了。”结果，这座房子盖得马马虎虎，跟他以前的作品比起来差远了。","房子终于盖好了，老木匠松了一口气，去找老板告别。老板把一把钥匙放到他的手里，真诚地说：“这些年您辛苦了。这座房子是我送给您的退休礼物，从今天起，它就是您的家了。”","老木匠一下子愣住了，脸红得说不出话来。他心里非常后悔：如果早知道这是给自己盖的房子，他一定会用最好的材料、最认真的态度去做。可是，现在一切都来不及了，他只能住在这座自己亲手盖的、并不满意的房子里。","其实，我们每个人又何尝不是在为自己“盖房子”呢？我们今天的态度，决定了明天住在什么样的“房子”里。每一份工作、每一次学习，都值得我们全力以赴，因为最后住进去的人，正是我们自己。"],"key":["人物：老木匠、老板","起因：干了四十多年，六十五岁想退休","经过：老板请他盖最后一座房子；他心不在焉，马马虎虎","转折：老板把房子作为退休礼物送给他","结果：老木匠非常后悔，只能住在不满意的房子里","道理：今天的态度决定明天的生活，要全力以赴"],"model":["有一位老木匠在建筑公司工作了四十多年，他手艺好，做事认真，老板很信任他。","六十五岁那年，老木匠想退休回家陪老伴儿。老板舍不得他走，但最后还是同意了，只请他在离开前再盖最后一座房子。老木匠答应了，可是他的心已经不在工作上了。他每天来得晚走得早，选材料也不仔细，遇到问题总是说“差不多就行”。结果，这座房子盖得很一般，比他以前的作品差多了。","房子盖好后，老木匠去向老板告别。没想到，老板把钥匙交给他，说这座房子是送给他的退休礼物。老木匠非常吃惊，也非常后悔。如果早知道是给自己盖的，他一定会用最好的材料、最认真的态度。可是一切都来不及了，他只能住在这座自己不满意的房子里。","这个故事告诉我们，我们每个人都在为自己“盖房子”。今天的态度决定了明天的生活，所以做每一件事都应该全力以赴。"]},{"title":"会计小周的“慢”","topic":"Kế toán · cẩn thận","text":["周晴是一家贸易公司的会计，刚工作两年。在同事们眼里，她做事有点儿“慢”：别人一个下午就能做完的报表，她常常要花一天；每一张发票，她都要对着合同和收货单核对两三遍；有时候为了一笔几块钱的差额，她能一直查到晚上八九点。","财务部的老员工张姐常常劝她：“小周，差不多就行了，几块钱的事，没人会在意的。”部门里有人背后笑她太死板，甚至有人觉得她是能力不够，所以才做得慢。周晴听了心里也很委屈，但她觉得，账目上的每一个数字都代表着公司的钱，马虎不得。","去年年底，公司准备和一家大客户签一个很重要的合同。合同签订以前，对方要求检查公司过去三年的财务资料。总经理很紧张，因为这家客户以要求严格出名，以前就有好几家公司因为账目不清楚而失去了合作机会。","检查进行了整整一个星期。最后一天，对方的财务总监专门找到总经理，说：“我们检查过很多公司，你们的账是做得最清楚的。每一张发票都能找到对应的合同，每一笔差额都有说明。说实话，能把账做得这么细的公司，我们放心。”合同顺利签了下来，金额是公司去年全年收入的一半。","在年终总结大会上，总经理特别表扬了周晴，还给她发了一笔奖金。他说：“很多人觉得慢就是效率低。可是在财务工作里，一次‘快’带来的错误，可能需要十次‘慢’来弥补。小周的慢，其实是对公司负责。”","那天晚上，张姐走到周晴的办公桌前，有点儿不好意思地说：“以后我做的报表，也请你帮我再核对一遍吧。”周晴笑着点了点头。从那以后，财务部渐渐形成了一个新习惯：每份报表都至少要核对两遍。"],"key":["人物：会计周晴、老员工张姐、总经理、客户的财务总监","起因：周晴做事“慢”，同事笑她死板","经过：大客户签合同前检查三年财务资料","转折：对方说这家公司的账做得最清楚，合同签成","结果：总经理表扬并发奖金：“一次快的错误要十次慢来弥补”","结尾：同事请她核对报表，部门养成核对两遍的习惯"],"model":["周晴是一家贸易公司的会计。她做事很“慢”：每张发票都要核对好几遍，为了几块钱的差额也会查到很晚。同事们劝她差不多就行，有人笑她死板，还有人觉得她能力不够。她心里很委屈，但仍然认为账目上的每个数字都马虎不得。","去年年底，公司要和一家大客户签一份重要的合同。对方要求严格，先要检查公司三年的财务资料。总经理很紧张，因为以前有不少公司因为账目不清楚失去了机会。检查进行了一个星期，最后对方的财务总监说，他们检查过很多公司，这家公司的账做得最清楚，所以很放心。合同顺利签了下来，金额相当于公司去年收入的一半。","在年终大会上，总经理表扬了周晴，还给她发了奖金。他说在财务工作中，一次“快”带来的错误，可能需要十次“慢”来弥补，周晴的慢是对公司负责。后来，同事们也开始请她帮忙核对报表，财务部渐渐养成了每份报表至少核对两遍的习惯。"]},{"title":"妈妈学手机","topic":"Gia đình · công nghệ","text":["王阿姨今年六十二岁，退休以前是一名小学老师。女儿在外地工作，前年给她买了一部智能手机，希望她能用微信和家里人视频聊天。","可是，王阿姨对这部手机一直很头疼。屏幕上的图标密密麻麻，她常常不知道该点哪一个。有一次，她想给女儿发一张照片，结果不小心把照片发到了女儿公司的工作群里，弄得女儿哭笑不得。还有一次，她在网上看到一条“免费领鸡蛋”的消息，按照提示输入了自己的银行卡号，差一点儿被骗走了一万多块钱。从那以后，她干脆把手机放进了抽屉，只用来接电话。","女儿知道以后，没有责怪她，而是在春节回家的时候，专门花了一个星期教妈妈用手机。她把常用的功能一个一个写在一个小本子上：怎么视频、怎么发照片、怎么用手机付款，还写上了几条“安全提醒”，比如“陌生人发来的链接不要点”“任何人要银行卡密码都不能给”。每教会一个功能，她就让妈妈自己操作三遍。","刚开始，王阿姨学得很慢，常常是学了后面就忘了前面。她有点儿灰心，说：“我老了，学不会这些新东西了。”女儿握着她的手说：“妈，您当年教我写字的时候，也是一笔一画地教了无数遍。现在换我来教您，咱们慢慢来。”","一个月以后，王阿姨不但能熟练地和女儿视频，还学会了在网上买菜、预约挂号。她甚至在小区里开了一个“手机课堂”，每个星期六上午教其他老人用手机。她把女儿写的小本子复印了很多份，发给大家。","王阿姨说：“时代变化得太快了，我们老年人不能被落下。只要有人愿意耐心地教，我们也愿意认真地学。”"],"key":["人物：王阿姨（退休小学老师）、女儿","起因：女儿买了智能手机，王阿姨用不好","经过：错发照片到工作群；差点被骗一万多块；把手机放进抽屉","转折：女儿春节回家教了一个星期，写小本子和安全提醒","结果：学会视频、网上买菜、预约挂号，还开了“手机课堂”","道理：有人耐心教，老年人也愿意认真学"],"model":["王阿姨六十二岁，退休前是小学老师。女儿在外地工作，给她买了一部智能手机，希望能和她视频聊天。","可是王阿姨用不好手机。她曾经把照片错发到女儿公司的工作群里，还差点儿因为相信“免费领鸡蛋”的消息被骗走一万多块钱。从那以后，她就把手机放了起来，只用来接电话。","女儿知道后没有责怪她，春节回家时专门花了一个星期教她。女儿把常用功能写在小本子上，还写了几条安全提醒，每教一个功能就让妈妈自己操作三遍。王阿姨刚开始学得很慢，有点儿灰心，女儿就鼓励她说，当年妈妈教自己写字也很有耐心，现在自己也会耐心地教妈妈。","一个月后，王阿姨不但会和女儿视频，还学会了网上买菜和预约挂号。她还在小区开了“手机课堂”，教其他老人用手机。她认为，时代变化很快，只要有人耐心教，老年人也愿意认真学。"]},{"title":"师傅的笔记本","topic":"Nhà máy · tích lũy kinh nghiệm","text":["小林中专毕业后，进了一家机械厂当学徒，跟着厂里技术最好的老周师傅学习。","老周五十多岁，话不多，可是厂里的机器一出问题，大家第一个想到的就是他。小林发现，老周有一个习惯：不管多忙，他每天下班前都要在一个旧笔记本上写几行字。小林很好奇，可是老周从来不让别人看。","刚开始的几个月，小林觉得很没意思。老周不让他碰机器，只让他打扫车间、整理工具，还要求他把每天看到的问题记下来。小林心里有些不服气：“我是来学技术的，又不是来打扫卫生的。”有一次，他忍不住向老周抱怨。老周只说了一句：“看懂了，才能动手。”","半年以后，厂里一台进口设备突然停了，外国工程师要三天后才能到。如果停产三天，工厂会损失几十万元。厂长急得团团转。老周不慌不忙地拿出他的笔记本，翻到其中一页，上面记着几年前这台设备出现过的类似问题和处理方法。他带着小林，按照笔记一步一步检查，两个小时后，机器重新转了起来。","那天晚上，老周第一次把笔记本递给了小林。小林翻开一看，里面密密麻麻地记着二十多年来每台机器的故障、原因和解决办法，还画着很多零件图。老周说：“技术不是一天学会的，是一天一天记下来的。”","小林这才明白，师傅让他打扫车间、记录问题，是在教他最重要的本领——观察和积累。从那以后，小林也有了自己的笔记本。十年后，他成了厂里最年轻的高级技师。他的笔记本，已经写满了五本。"],"key":["人物：学徒小林、老周师傅","起因：老周每天写笔记，不让别人看；只让小林打扫、记录问题","经过：小林不服气地抱怨，老周说“看懂了，才能动手”","转折：进口设备停机，老周靠笔记两个小时修好","结果：老周把笔记本给小林看——“技术是一天一天记下来的”","结尾：小林也开始写笔记，十年后成为最年轻的高级技师"],"model":["小林中专毕业后到一家机械厂当学徒，跟着技术最好的老周师傅学习。老周话不多，但机器出了问题大家都找他。他有一个习惯，每天下班前都要在一个旧笔记本上写东西，但从来不给别人看。","刚开始，老周不让小林碰机器，只让他打扫车间、整理工具，还要求他每天记录看到的问题。小林很不服气，向师傅抱怨，老周只说看懂了才能动手。","半年后，厂里一台进口设备突然停了，外国工程师三天后才能到，停产会给工厂带来很大的损失。老周拿出笔记本，找到了几年前类似问题的处理方法，带着小林一步一步检查，两个小时就修好了机器。","那天晚上，老周第一次把笔记本给小林看。里面记满了二十多年来各种机器的故障和解决办法。老周告诉他，技术是一天一天记下来的。小林终于明白了师傅的用心。从那以后，他也开始写笔记。十年后，他成了厂里最年轻的高级技师。"]}],"plan":[{"title":"成分残缺 · Câu thiếu thành phần","stage":"Giai đoạn 1 · Câu sai 病句","body":["Phần 阅读 第一部分 (câu 51–60) cho 4 câu, chọn 1 câu có lỗi. Lỗi gặp nhiều nhất là câu thiếu thành phần: thiếu chủ ngữ, thiếu vị ngữ hoặc thiếu tân ngữ.","Dấu hiệu thiếu chủ ngữ: câu mở đầu bằng giới từ “通过、经过、在……下、由于、随着” rồi lại dùng “使/让”, khiến không còn ai làm chủ ngữ. Cách kiểm tra: rút gọn câu chỉ còn “ai – làm gì – cái gì”."],"ex":[["✗ 通过这次培训，使我的业务水平有了提高。","Bỏ “通过” hoặc bỏ “使”."],["✓ 这次培训使我的业务水平有了提高。",""],["✗ 在大家的帮助下，取得了很大的进步。","Thiếu ai tiến bộ → thêm “我”."],["✗ 经过讨论，大家终于统一了。","Thiếu tân ngữ → 统一了意见."]],"it":{"bing":[0,10,9],"l1":[0],"cy":[0,1]}},{"title":"否定不当 · Phủ định thừa","stage":"Giai đoạn 1 · Câu sai 病句","body":["Một số từ đã mang nghĩa phủ định sẵn: 避免、防止、禁止、阻止、拒绝、否认、怀疑、以免. Nếu thêm “不/没/再” phía sau, nghĩa câu sẽ thành ngược lại.","Câu có hai, ba lần phủ định thì đọc chậm và đếm số lần phủ định: hai lần phủ định = khẳng định."],"ex":[["✗ 我们要避免不犯同样的错误。","→ 避免犯同样的错误。"],["✗ 防止类似的事故不再发生。","→ 防止类似的事故再次发生。"],["✗ 谁也不能否认这不是一个好办法。","Ba lần phủ định → nghĩa ngược."]],"it":{"bing":[1,7,11],"l1":[1],"cy":[2,3]}},{"title":"成分赘余 · Thừa, lặp nghĩa","stage":"Giai đoạn 1 · Câu sai 病句","body":["Lỗi lặp nghĩa: hai từ cùng nghĩa đứng cùng nhau. Hay gặp: 大约……左右、大概……上下、亲眼目睹、过分夸张、互相……彼此.","Khi thấy số liệu kèm “大约/左右/上下/多”, kiểm tra xem có hai từ ước lượng cùng lúc không."],"ex":[["✗ 大约有三百人左右参加了活动。","Giữ “大约” hoặc “左右”."],["✗ 他的年龄大约在三十岁左右。","→ 他的年龄在三十岁左右。"],["✗ 我亲眼目睹了这件事。","“目睹” đã là “亲眼看见”."]],"it":{"bing":[3,12],"l1":[2],"cy":[4,5]}},{"title":"搭配不当 · Kết hợp từ sai","stage":"Giai đoạn 1 · Câu sai 病句","body":["Động từ – tân ngữ, chủ ngữ – vị ngữ phải đi được với nhau. Các cặp hay bị đổi: 提高水平/改善条件/改进方法/增强体质/扩大规模/开阔眼界/履行义务/发挥作用.","Mẹo: một động từ nhưng nối với hai tân ngữ (穿……和帽子) thì kiểm tra xem động từ có đi được với cả hai tân ngữ không."],"ex":[["✗ 他穿着一件白衬衫和一顶黑帽子。","帽子 dùng 戴."],["✗ 改善人民的生活水平。","→ 提高生活水平 / 改善生活条件."],["✓ 增强体质、开阔眼界、发挥作用","Các cặp kết hợp đúng nên học thuộc."]],"it":{"bing":[5,13],"l1":[3],"cy":[6,7]}},{"title":"语序不当 · Sai trật tự","stage":"Giai đoạn 1 · Câu sai 病句","body":["Trật tự hợp logic: phát hiện → giải quyết; kế thừa → phát huy; nghiên cứu → quyết định; trước nhỏ sau lớn.","Trật tự định ngữ nhiều tầng: 领属 + 数量 + 动词短语 + 形容词 + 名词 (我们公司 那两台 新买的 大型 打印机)."],"ex":[["✗ 发扬和继承优秀的传统","→ 继承和发扬"],["✗ 及时地解决并发现问题","→ 发现并解决问题"],["✓ 我们公司那两台新买的大型打印机","Trật tự định ngữ chuẩn."]],"it":{"bing":[4,14],"l1":[4],"cy":[8,9]}},{"title":"两面对一面 · Hai mặt đối một mặt","stage":"Giai đoạn 1 · Câu sai 病句","body":["Các từ hai mặt: 能否、是否、好坏、成败、高低、有没有、能不能. Nếu vế trước có từ hai mặt thì vế sau cũng phải hai mặt (成功与否 / 是否努力), không thể chỉ có một mặt.","Cách sửa: bỏ từ hai mặt, hoặc thêm từ hai mặt vào vế sau."],"ex":[["✗ 能否保持好心态，是取得好成绩的关键。","Bỏ “能否”."],["✓ 一个人能否成功，关键在于他是否努力。","Hai mặt – hai mặt."],["✗ 是否坚持锻炼，是身体健康的重要条件。","Bỏ “是否”."]],"it":{"bing":[2,15],"l1":[5],"cy":[10,11]}},{"title":"关联词误用 · Dùng sai liên từ","stage":"Giai đoạn 1 · Câu sai 病句","body":["Ba kiểu lỗi: ① sai cặp (只要……才 ✗ → 只要……就 / 只有……才); ② sai vị trí: hai vế cùng chủ ngữ thì liên từ đứng sau chủ ngữ, khác chủ ngữ thì đứng trước chủ ngữ; ③ sai quan hệ (dùng “而且” cho quan hệ chuyển ý).","Nên học thuộc lòng các cặp ở Phụ lục 3."],"ex":[["✗ 只要努力学习，才能取得好成绩。","→ 只有……才……"],["✗ 不但他会说英语，而且会说法语。","→ 他不但……而且……"],["✓ 不但他去了，而且他的家人也去了。","Khác chủ ngữ → “不但” đứng trước."]],"it":{"bing":[6,16],"l1":[6],"cy":[12,13]}},{"title":"逻辑错误 · Sai logic, sai phạm vi","stage":"Giai đoạn 1 · Câu sai 病句","body":["Sai logic với số liệu: “giảm” không dùng “倍” (降低了一倍 ✗ → 降低了一半). Phạm vi lẫn lộn: liệt kê cái lớn và cái nhỏ thuộc nó như ngang hàng (老师 và 教育工作者).","Còn có mâu thuẫn trong câu: 所有……都……除了, 大概……一定."],"ex":[["✗ 产量比去年降低了一倍。","→ 降低了一半 / 百分之五十."],["✗ 参加的有老师、学生和教育工作者。","老师 nằm trong 教育工作者."],["✓ 产量比去年增加了一倍。","“增加” thì dùng 倍 được."]],"it":{"bing":[8,17],"l1":[7],"cy":[14,15]}},{"title":"句式杂糅 · Trộn hai cấu trúc","stage":"Giai đoạn 1 · Câu sai 病句","body":["Người viết trộn hai cách nói đều đúng thành một câu sai. Hay gặp: 原因是……造成的; 关键在于……是关键; 以……为目的……的目的.","Cách sửa: tách thành hai câu, mỗi câu giữ một cấu trúc rồi chọn một."],"ex":[["✗ 失败的原因是由于准备不充分造成的。","→ 失败的原因是准备不充分 / 失败是由于准备不充分造成的."],["✗ 他的成功关键在于努力是关键。","Bỏ “是关键”."]],"it":{"bing":[18],"l1":[8],"cy":[16,17]}},{"title":"Ôn tập câu sai + chỉ thay không rõ","stage":"Giai đoạn 1 · Câu sai 病句","body":["Lỗi cuối: đại từ (他/她/这/那) không rõ chỉ ai, cái gì. Câu có hai người cùng giới mà dùng “他” là đáng nghi.","Ôn lại cả 9 kiểu lỗi: khi làm bài, lần lượt kiểm tra ① thành phần ② phủ định ③ lặp ④ kết hợp ⑤ trật tự ⑥ hai mặt ⑦ liên từ ⑧ logic ⑨ trộn cấu trúc ⑩ chỉ thay."],"ex":[["✗ 小王和小李去看老师，他带了一束花。","“他” là ai?"],["✓ 小王和小李去看老师，小王带了一束花。",""]],"it":{"bing":[19,13,15,16],"l1":[9],"cy":[18,19]}},{"title":"选词填空 · Cách làm bài điền từ","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Phần 阅读 第二部分 (câu 61–70): một đoạn văn có 3–5 chỗ trống, mỗi đáp án là một nhóm từ. Chỉ cần chắc chắn được 1 chỗ trống là đã loại được nhiều đáp án.","Thứ tự nên làm: ① chỗ trống có kết hợp cố định (研究表明、不可缺少) ② chỗ có liên từ (否则、而是) ③ chỗ còn lại."],"ex":[["研究表明 / 研究显示","Kết hợp cố định."],["……，否则……","“nếu không thì” — vế sau là hậu quả."]],"it":{"fill":[0],"l1":[10],"cy":[20,21]}},{"title":"近义词辨析 · Phân biệt từ gần nghĩa (1)","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Nhóm 缺少/缺乏/短缺/欠缺: 缺少 (thiếu số lượng, 不可缺少); 缺乏 (thiếu thứ trừu tượng: 经验、信心); 短缺 (thiếu hàng hóa, nguồn cung); 欠缺 (còn thiếu sót, ít dùng).","Nhóm 温馨/温柔/温和/暖和: 温馨 (không khí ấm cúng); 温柔 (tính cách dịu dàng); 温和 (thái độ, khí hậu ôn hòa); 暖和 (nhiệt độ ấm)."],"ex":[["不可缺少的一部分","缺少"],["缺乏经验","缺乏"],["家里很温馨","温馨"]],"it":{"fill":[1],"l1":[11],"cy":[22,23]}},{"title":"Liên từ trong đoạn văn","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Liên từ quyết định quan hệ giữa hai vế: 不是……而是 (phủ định A, khẳng định B); 而 (đối lập); 否则 (nếu không thì); 何况 (huống chi); 甚至 (thậm chí).","Đọc cả câu trước và sau chỗ trống để xác định quan hệ: đối lập, tăng tiến hay giả thiết."],"ex":[["并不是因为能力不够，而是因为沟通不到位。","不是……而是……"],["有些人容易放弃，而有些人却能坚持。","而……却……"]],"it":{"fill":[2,4],"l1":[12],"cy":[24,25]}},{"title":"近义词辨析 · Phân biệt từ gần nghĩa (2)","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["普及 (sự phổ cập, làm danh từ được: ……的普及) / 普遍 (phổ biến, tính từ) / 广泛 (rộng rãi). 集中 (tập trung sức lực) / 收集 (thu thập tài liệu) / 聚集 (người tụ tập).","及时 (kịp thời) / 按时 (đúng hạn) / 准时 (đúng giờ). 保持 (giữ trạng thái) / 维持 (duy trì để không mất) / 坚持 (kiên trì làm)."],"ex":[["网络购物的普及","普及"],["把精力集中在……","集中"],["及时调整","及时"]],"it":{"fill":[3,6],"l1":[13],"cy":[26,27]}},{"title":"Thành ngữ và động từ trong bài điền từ","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Bài điền từ HSK6 thường có 1 chỗ cần thành ngữ 4 chữ. Hãy xem thành ngữ đó miêu tả người, sự việc hay tâm trạng: 络绎不绝 (người đến nườm nượp), 层出不穷 (thứ mới xuất hiện liên tục), 争先恐后 (tranh nhau làm), 兴高采烈 (vui mừng).","Các động từ hay bị nhầm: 代替/替换/交换, 创造/制造/制作, 适应/适合/符合."],"ex":[["客人络绎不绝","người đến không ngớt"],["新词层出不穷","cái mới liên tục xuất hiện"],["适应变化 / 适合我 / 符合要求","ba cách kết hợp khác nhau"]],"it":{"fill":[5,7],"l1":[14],"cy":[28,29]}},{"title":"选句填空 · Cách làm bài điền câu","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Phần 阅读 第三部分 (câu 71–80): đoạn văn có 5 chỗ trống, chọn câu A–E. Dấu hiệu: ① dấu câu xung quanh chỗ trống (đầu câu hay giữa câu) ② liên từ (而是、却、也) phải khớp với câu trước ③ chủ ngữ và đại từ phải khớp với đoạn.","Làm chỗ dễ trước, câu nào đã dùng thì gạch đi, chỗ cuối cùng tự còn lại."],"ex":[["……并不完全是因为懒，（而是和……有关）","“不完全是……而是” là dấu hiệu."],["……，（却总是一拖再拖）","“明明……却……”."]],"it":{"sen":[0],"l1":[15],"cy":[30,31]}},{"title":"Điền câu: mạch văn và đoạn văn","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Câu đầu đoạn thường nêu chủ đề, câu cuối thường kết luận hoặc nêu vấn đề (“如何……，是……的问题”). Câu bắt đầu bằng “也/还/而且” phải đứng sau một ý cùng chiều.","Đọc nhanh cả bài để nắm bố cục trước khi điền."],"ex":[["高铁不仅缩短了距离，（也改变了生活方式）","不仅……也……"],["（如何……），是未来需要思考的问题","Câu cuối đoạn: nêu vấn đề."]],"it":{"sen":[1,2],"l1":[16],"cy":[32,33]}},{"title":"Ôn tập đọc phần 2 + 3","stage":"Giai đoạn 2 · Điền từ, điền câu","body":["Làm một bài điền từ và một bài điền câu có tính giờ: mỗi bài không quá 4 phút.","Ghi lại các cặp từ gần nghĩa mà bạn đã chọn sai vào sổ tay."],"ex":[["会前要明确目的，（并提前把材料发给大家）","“并” nối hai việc cùng làm."]],"it":{"fill":[8],"sen":[3],"l1":[17],"cy":[34,35]}},{"title":"阅读 第四部分 · Đọc bài dài","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Phần 81–100: 5 bài, mỗi bài 4 câu hỏi. Đọc câu hỏi trước, gạch từ khóa, rồi đọc bài để tìm thông tin. Câu hỏi thường đi theo thứ tự các đoạn.","Câu hỏi “根据第X段” thì chỉ cần đọc kỹ đoạn đó."],"ex":[["根据第一段，“舍”指的是……","Đọc lại câu định nghĩa trong đoạn 1."]],"it":{"long":[0],"l3":[0],"cy":[36,37]}},{"title":"Câu hỏi ý chính và thái độ tác giả","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Câu hỏi “主要讲/作者认为/最适合做标题” → đọc kỹ đoạn đầu và đoạn cuối. Từ báo hiệu kết luận: 因此、总之、关键在于、专家认为.","Nghe dài: nghe câu mở đầu để biết là thông báo, phỏng vấn hay câu chuyện; con số và thời gian nên ghi nhanh ra giấy."],"ex":[["因此，越来越多的公司选择了“混合办公”","Câu then chốt của đoạn kết."]],"it":{"long":[1],"l3":[1],"cy":[38,39]}},{"title":"Câu hỏi nghĩa của từ, của câu","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Câu hỏi “画线词语的意思是” hoặc “这句话是什么意思” → không dịch từng chữ, đọc câu trước và câu sau để đoán theo ngữ cảnh.","Đáp án đúng thường được diễn đạt bằng từ khác với bài (đồng nghĩa), đáp án sai thường chép đúng từ trong bài nhưng sai ý."],"ex":[["……负责把短期记忆转化为长期记忆的区域并不活跃","→ đáp án: “负责长期记忆的区域不活跃”"]],"it":{"long":[2],"l3":[2],"cy":[40,41]}},{"title":"Đọc bài nghị luận xã hội","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Bài nghị luận thường có cấu trúc: hiện tượng → ý kiến ủng hộ → ý kiến phản đối → quan điểm chuyên gia. Câu hỏi hay hỏi riêng từng nhóm ý kiến.","Từ báo hiệu: 支持的人认为、反对的人则担心、专家认为."],"ex":[["“慢就业”本身不是问题，关键在于……","Quan điểm cuối cùng."]],"it":{"long":[3],"l3":[3],"cy":[42,43]}},{"title":"Đọc bài khoa học phổ thông","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Bài khoa học: chú ý quan hệ nguyên nhân – kết quả và các so sánh (就像……一样). Không cần hiểu hết thuật ngữ, chỉ cần biết chúng làm gì.","Câu hỏi tiêu đề → chọn đáp án bao quát cả bài, không chọn đáp án chỉ đúng một đoạn."],"ex":[["就像父母照顾孩子一样","So sánh để giải thích."]],"it":{"long":[4],"l3":[4],"cy":[44,45]}},{"title":"Ôn tập đọc dài + nghe","stage":"Giai đoạn 3 · Đọc dài, nghe dài","body":["Làm bài đọc dài có tính giờ: 8 phút cho 1 bài, 4 câu hỏi.","Ôn lại các bài nghe đã học: nghe lại, không nhìn lời, rồi tự kể lại nội dung bằng tiếng Trung."],"ex":[["与其选人少的队，不如看看购物车里的东西","与其……不如…… — đáp án nằm ở vế “不如”."]],"it":{"long":[5],"l1":[3,6],"cy":[46,47]}},{"title":"缩写 · Giới thiệu và cách đọc","stage":"Giai đoạn 4 · Viết 缩写","body":["Câu 101: đọc bài khoảng 1000 chữ trong 10 phút (không được ghi chép), sau đó viết lại khoảng 400 chữ trong 35 phút, tự đặt tiêu đề.","Khi đọc, nắm 6 yếu tố: 时间、地点、人物、起因、经过、结果. Nhớ tên người và con số. Đọc lần 1 để nắm cốt truyện, đọc lần 2 để nhớ chi tiết quan trọng."],"ex":[["人物 → 起因 → 经过 → 转折 → 结果 → 道理","Khung 6 bước."]],"it":{"sx":0,"cy":[48,49]}},{"title":"缩写 · Chuyển lời thoại thành lời kể","stage":"Giai đoạn 4 · Viết 缩写","body":["Không chép lời thoại trong ngoặc kép. Chuyển thành lời kể gián tiếp: 他说……、他告诉……、他问……、他解释说…….","Bỏ bớt chi tiết miêu tả (màu sắc, động tác nhỏ), giữ lại các hành động chính của câu chuyện."],"ex":[["经理说：“刚才这一个小时就是最后一轮面试。”","→ 经理解释说，刚才的一个小时就是最后一轮面试。"]],"it":{"sx":1,"cy":[50,51]}},{"title":"缩写 · Viết đoạn mở đầu và kết thúc","stage":"Giai đoạn 4 · Viết 缩写","body":["Mở đầu: giới thiệu nhân vật và bối cảnh trong 1–2 câu. Kết thúc: kết quả + bài học (这个故事告诉我们……) nếu bài gốc có nêu bài học.","Tiêu đề: lấy tên câu chuyện, tên nhân vật hoặc đồ vật chính."],"ex":[["这个故事告诉我们，……","Câu kết thường dùng."]],"it":{"sx":2,"cy":[52,53]}},{"title":"缩写 · Thay từ khó bằng từ dễ","stage":"Giai đoạn 4 · Viết 缩写","body":["Không nhớ được từ khó thì thay bằng từ đơn giản mà chắc chắn viết đúng: 委屈 → 难过; 弥补 → 改正; 团团转 → 很着急.","Mỗi đoạn nên khoảng 80–120 chữ, viết đủ 4 đoạn là được khoảng 400 chữ."],"ex":[["厂长急得团团转。","→ 厂长非常着急。"]],"it":{"sx":3,"cy":[54,55]}},{"title":"缩写 · Luyện đủ giờ","stage":"Giai đoạn 4 · Viết 缩写","body":["Làm trọn 45 phút: 10 phút đọc, 35 phút viết. Sau khi viết, tự kiểm tra: đủ 6 yếu tố chưa? có chép nguyên lời thoại không? đủ khoảng 400 chữ chưa?",""],"ex":[["Đối chiếu với “Các ý chính cần có” sau khi nộp bài.",""]],"it":{"sx":4,"cy":[56,57]}},{"title":"Tổng kết 30 ngày","stage":"Giai đoạn 4 · Viết 缩写","body":["Làm bài 缩写 cuối cùng, sau đó ôn lại 60 thành ngữ bằng thẻ.","Trước khi thi: mỗi ngày làm 2 bộ câu sai, 1 bài điền từ, 1 bài đọc dài, 1 bài nghe dài; cách một ngày viết một bài 缩写."],"ex":[["加油！祝你考试顺利！",""]],"it":{"sx":5,"cy":[58,59]}}],"cz":[{"t":"人们常说“早起的鸟儿有虫吃”，很多成功人士都有早起的（1）。研究（2），早上是大脑最清醒的时候，这时候学习或工作，效率会比较高。不过，专家也提醒，早起的前提是要保证充足的睡眠，（3）反而会影响健康。","bl":[{"o":["习惯","风俗","规矩","爱好"],"a":0},{"o":["表明","证明","说明","显示"],"a":0},{"o":["否则","因此","然而","何况"],"a":0}],"e":"习惯 thói quen (风俗 phong tục của cộng đồng); 研究表明 cố định; 否则 “nếu không thì”."},{"t":"茶已经成为中国人日常生活中不可（1）的一部分。朋友来了，（2）上一杯热茶，是表示欢迎和尊重；一家人坐在一起喝茶聊天，既轻松又（3）。","bl":[{"o":["缺乏","缺少","欠缺","短缺"],"a":1},{"o":["煮","泡","炒","烤"],"a":1},{"o":["温柔","温馨","温和","暖和"],"a":1}],"e":"不可缺少 cụm cố định; 泡茶 pha trà; 温馨 ấm cúng (dùng cho không khí gia đình)."},{"t":"在职场中，沟通能力（1）重要。很多工作上的误会，并不是因为能力不够，（2）因为沟通不到位。一个善于沟通的人，能够准确地表达自己的想法，也能耐心地（3）别人的意见，这样团队合作才会更加顺利。","bl":[{"o":["特殊","非常","格外","尤其"],"a":2},{"o":["而且","所以","而是","但是"],"a":2},{"o":["听见","打听","倾听","听说"],"a":2}],"e":"不是……而是…… cặp cố định; 倾听意见 lắng nghe ý kiến; 格外重要 = đặc biệt quan trọng."},{"t":"随着网络购物的（1），快递行业发展得越来越快。然而，大量的快递包装也带来了严重的环境问题。为了（2）浪费，一些快递公司开始使用可以重复利用的包装盒，消费者也可以把包装（3）给快递员回收。","bl":[{"o":["普遍","普通","广泛","普及"],"a":3},{"o":["缩小","降低","减轻","减少"],"a":3},{"o":["给予","送","递","交"],"a":3}],"e":"……的普及 sự phổ cập (danh từ); 减少浪费 giảm lãng phí; 交给 giao cho."},{"t":"有些人遇到困难就容易放弃，（1）有些人却能坚持到底。心理学家认为，这和一个人的“心理弹性”有关。心理弹性强的人，（2）遇到多大的挫折，都能很快调整好自己的心态，把困难看作（3）的机会。","bl":[{"o":["而","但","并","却"],"a":0},{"o":["无论","尽管","即使","不管"],"a":0},{"o":["成长","发展","增长","生长"],"a":0}],"e":"而 nối hai vế đối lập (vế sau đã có 却 nên D thừa); 无论……都…… ; 成长的机会 cơ hội trưởng thành."},{"t":"春节前，很多公司都会给员工发年终奖，这是对大家一年辛苦工作的（1）。不过，年终奖的多少往往（2）公司当年的效益。效益好的公司，奖金可能是好几个月的工资；效益不好的公司，（3）只能发一个红包表示心意。","bl":[{"o":["承认","批准","证明","肯定"],"a":3},{"o":["依赖","在于","关于","取决于"],"a":3},{"o":["何况","况且","反而","甚至"],"a":3}],"e":"对……的肯定 sự ghi nhận; 取决于 phụ thuộc vào (quyết định bởi); 甚至 thậm chí."},{"t":"做事情要有计划。一份好的计划，可以让我们把有限的时间和精力（1）在最重要的事情上。但计划也不是一成不变的，遇到突发情况时，要学会（2）调整。只有这样，才能在变化中（3）主动。","bl":[{"o":["聚集","集中","集合","收集"],"a":1},{"o":["同时","及时","准时","按时"],"a":1},{"o":["坚持","保持","维持","保存"],"a":1}],"e":"集中精力 tập trung sức lực; 及时调整 điều chỉnh kịp thời; 保持主动 giữ thế chủ động."},{"t":"这家老字号饭店已经有一百多年的历史了。几代厨师一直（1）传统做法，每一道菜都要经过十几道工序。虽然价格比普通饭店贵一些，但来吃饭的客人还是（2）。很多老顾客说，在这里吃饭，吃的不仅是味道，更是一种（3）。","bl":[{"o":["坚强","坚定","坚决","坚持"],"a":3},{"o":["兴高采烈","层出不穷","争先恐后","络绎不绝"],"a":3},{"o":["想念","记忆","纪念","回忆"],"a":3}],"e":"坚持做法 kiên trì cách làm; 络绎不绝 khách nườm nượp; 一种回忆 một kỷ niệm (danh từ)."},{"t":"随着人工智能的发展，很多重复性的工作将会被机器（1）。有人因此担心自己会失业。但专家指出，新技术在淘汰一些岗位的同时，也会（2）出新的职业。对普通人来说，最重要的是保持学习的能力，（3）时代的变化。","bl":[{"o":["代替","替换","改变","交换"],"a":0},{"o":["创造","制造","建造","制作"],"a":0},{"o":["适应","合适","符合","适合"],"a":0}],"e":"被机器代替 bị máy thay thế; 创造出新的职业 tạo ra nghề mới; 适应变化 thích nghi (适合 là tính từ/động từ không đi với 变化)."},{"t":"（1）是一种传统的中国艺术，已经有一千多年的历史。剪纸用的工具很简单，一把剪刀、一张红纸就够了。在过去，每到春节，农村的妇女们都会剪出各种图案，（2）在窗户上，表达对新年的美好（3）。如今，剪纸不仅是节日的装饰，还被（4）到了服装设计、广告等领域，（5）了越来越多年轻人的喜爱。","bl":[{"o":["书法","京剧","剪纸","茶艺"],"a":2},{"o":["挂","摆","放","贴"],"a":3},{"o":["祝愿","希望","祝贺","愿望"],"a":0},{"o":["使用","利用","运用","应用"],"a":3},{"o":["收到","受到","接到","得到"],"a":1}],"e":"剪纸 – 剪刀/红纸 gợi ý; 贴在窗户上 dán lên cửa sổ; 美好祝愿 lời chúc tốt đẹp; 被应用到……领域 cố định; 受到喜爱."},{"t":"很多人认为，记忆力好的人天生就聪明。其实，记忆力是可以通过（1）提高的。心理学家发现，人们在学习新知识后的二十分钟内，就会忘掉将近一半的内容。因此，及时（2）非常重要。另外，把要记的内容和自己熟悉的事物（3）起来，也能帮助记忆。比如，记一个电话号码时，可以把它和自己的生日（4）比较。睡眠对记忆也有很大的（5），睡得好的人往往记得更牢。","bl":[{"o":["训练","锻炼","教育","培养"],"a":0},{"o":["学习","练习","预习","复习"],"a":3},{"o":["联合","连接","联络","联系"],"a":3},{"o":["执行","进行","实行","举行"],"a":1},{"o":["印象","结果","影响","效果"],"a":2}],"e":"通过训练提高; 及时复习 ôn kịp thời; 联系起来 liên hệ lại với nhau; 进行比较; 对……有影响."},{"t":"在越南，咖啡不仅是一种饮料，更是一种生活（1）。早上，很多人坐在路边的小凳子上，一边喝咖啡，一边和朋友聊天，（2）开始一天的工作。越南咖啡的味道很浓，常常（3）炼乳一起喝，甜而不腻。近年来，越南咖啡在国外也（4）越来越有名，不少外国游客来越南旅游时，都要（5）一下地道的越南咖啡。","bl":[{"o":["方法","办法","手段","方式"],"a":3},{"o":["所以","而且","于是","然后"],"a":3},{"o":["跟着","和","陪","对"],"a":1},{"o":["成为","当作","作为","变得"],"a":3},{"o":["品味","尝试","吃","品尝"],"a":3}],"e":"生活方式 lối sống; 然后 rồi sau đó (trình tự); 和……一起; 变得有名; 品尝 thưởng thức (đồ ăn uống)."},{"t":"面试时，很多求职者只注意自己的回答，（1）忽视了一个重要的问题：向面试官提问。其实，在面试快结束时，面试官通常会问：“你有什么问题吗？”这时候如果回答“没有”，可能会让对方（2）你对这份工作不够感兴趣。（3），提几个有准备的问题，比如公司的培训机会、团队的工作方式等，不仅能表现出你的（4），还能帮助你更好地（5）这家公司。","bl":[{"o":["因此","却","而且","甚至"],"a":1},{"o":["发觉","感觉","觉得","感到"],"a":2},{"o":["相反","反而","反正","相比"],"a":0},{"o":["实在","诚意","诚实","真实"],"a":1},{"o":["了解","懂得","理解","明白"],"a":0}],"e":"只注意A，却忽视B; 让对方觉得…; 相反 ngược lại (đầu câu); 表现出诚意; 了解公司 tìm hiểu."},{"t":"随着生活水平的提高，越来越多的家庭开始养宠物。宠物不仅能给主人带来快乐，还能（1）孤独感，特别是对独居的老人来说，一只小狗或小猫就像家人一样。不过，养宠物也是一种（2）。主人需要每天喂食、打扫，还要定期带宠物去医院（3）疫苗。有些人一时（4），买了宠物，后来又觉得麻烦，就把它们扔掉了，这种做法是非常不（5）的。","bl":[{"o":["减少","缩小","减轻","降低"],"a":2},{"o":["责任","义务","负担","任务"],"a":0},{"o":["打","做","吃","用"],"a":0},{"o":["激动","生动","冲动","感动"],"a":2},{"o":["担任","负责任","有责任","负责"],"a":1}],"e":"减轻孤独感 giảm bớt cô đơn; 养宠物是一种责任; 打疫苗 tiêm vắc-xin; 一时冲动 bốc đồng nhất thời; 不负责任 vô trách nhiệm."},{"t":"“二十四节气”是中国古人根据太阳的位置（1）出来的，用来指导农业生产。比如，“清明”前后适合种瓜种豆，“谷雨”时节雨水增多，（2）农作物生长。2016年，二十四节气被（3）联合国教科文组织人类非物质文化遗产代表作名录。虽然现在大部分人已经不种地了，但是很多和节气有关的风俗（4）保留了下来，比如立春吃春饼、冬至吃饺子，成为中国人生活中（5）的一部分。","bl":[{"o":["总共","合计","集合","总结"],"a":3},{"o":["便于","有利于","有助","对于"],"a":1},{"o":["加入","参加","进入","列入"],"a":3},{"o":["仍旧是","依然","依靠","依照"],"a":1},{"o":["莫名其妙","不可缺少","无可奈何","不可思议"],"a":1}],"e":"总结出来; 有利于生长 có lợi cho; 被列入名录 được đưa vào danh sách; 依然保留 vẫn còn giữ; 不可缺少的一部分."}],"sen6":[{"t":"很多人都有拖延的习惯，明明知道事情很重要，（1）。心理学研究发现，拖延并不完全是因为懒，（2）。当一项任务看起来太难或者太大的时候，人们会本能地想要逃避。\n那么，怎样才能改掉拖延的习惯呢？专家建议，（3）。比如，要写一份十页的报告，可以先给自己定一个小目标：今天只写一页。（4），压力就会小很多，开始行动也就变得容易了。另外，完成一个小目标后，可以适当地奖励一下自己，（5）。","o":["而是和人们害怕失败的心理有关","可以把大任务分成几个小任务","而且价格也越来越便宜","却总是一拖再拖","当任务变小了以后","这样能让人更有动力继续下去"],"a":[3,0,1,4,5]},{"t":"中国的高铁被称为“中国速度”的代表。（1），中国已经建成了世界上规模最大的高速铁路网。如今，从北京到上海，坐高铁只需要四个多小时，（2）。\n高铁不仅缩短了城市之间的距离，（3）。很多年轻人选择“双城生活”：在一个城市工作，周末坐高铁回另一个城市的家。对于游客来说，（4），说走就走的旅行变得越来越普遍。\n当然，高铁的发展也面临一些问题，比如建设成本高、部分线路乘客少等。（5），是未来需要继续思考的问题。","o":["而以前坐普通火车要十几个小时","高铁让短途旅行更加方便","也改变了人们的生活方式","如何让高铁更好地服务于社会","经过十几年的快速发展","这样做的效果往往更好"],"a":[4,0,2,1,3]},{"t":"很多人认为，失眠只是一个小问题，（1）。其实，长期失眠不仅会让人白天没精神，（2）。专家建议，要想睡个好觉，首先要养成规律的作息，每天在差不多的时间上床睡觉。其次，睡前一个小时最好不要看手机，（3）。另外，适当的运动也有助于睡眠，（4）。如果这些方法都试过了还是睡不着，（5）。","o":["还会增加患多种疾病的风险","只有这样才能节约用水","但运动时间最好安排在睡前三小时以前","不用太在意","因为手机屏幕的光会影响大脑分泌帮助睡眠的物质","就应该及时去医院看医生"],"a":[3,0,4,2,5]},{"t":"开会是职场中常见的工作方式，（1）。有调查显示，员工平均每周要花六个多小时开会，（2）。那么，怎样才能提高会议效率呢？首先，会前要明确会议的目的，（3）。其次，开会时要控制时间，（4）。最后，会议结束前要明确每项任务的负责人和完成时间，（5）。","o":["不要让讨论偏离主题","其中有将近一半的时间被认为是浪费的","并提前把相关材料发给参会人员","比如在海边建房子","这样才能保证会议的决定真正落实","但并不是所有的会议都是有效的"],"a":[5,1,2,0,4]},{"t":"胡志明市的“书街”位于市中心，（1）。街道两边都是书店和小咖啡馆，周末的时候，很多家长带着孩子来这里看书。（2），这里还经常举办读书会、作家见面会等活动。有人担心，在手机时代，纸质书会被电子书取代。（3）。书街的负责人说：“（4）。”如今，书街已经成为这座城市的一张文化名片，（5）。","o":["但书街的热闹说明，人们对纸质书的感情依然很深","离著名的红教堂和中央邮局都很近","我们希望书街不只是卖书的地方，更是大家交流的空间","吸引了大量来自国内外的游客","因此这里的房价特别高","除了买书和看书"],"a":[1,5,0,2,3]},{"t":"很多人在超市买东西时，会被“买一送一”“第二件半价”这样的促销吸引。（1）。可是回家以后才发现，很多东西其实并不需要。心理学家指出，（2），而促销活动正是利用了这种心理。（3），最好提前写好购物清单。（4），不在清单上的东西尽量不买。另外，购物时不要太饿，（5）。","o":["到了超市以后严格按照清单购买","因为饿的时候人们会买更多的零食","超市的东西越来越贵了","人们觉得不买就吃亏了","人们往往更在意“得到了多少”，而不是“花了多少”","要想避免不必要的消费"],"a":[3,4,5,0,1]},{"t":"在中国，很多年轻人开始流行一种新的旅行方式——“特种兵式旅游”。（1），一天之内要去好几个景点，晚上坐夜车去下一个城市。（2），花最少的钱，看最多的风景。但是也有人认为，（3），旅行本来是为了放松，这样反而比上班还累。专家建议，（4），可以根据自己的身体情况和兴趣来安排。（5），旅行最重要的还是心情。","o":["这种旅游的特点是时间短、行程满","年轻人的工资越来越高","不管选择哪一种方式","旅行方式没有好坏之分","这种方式太辛苦了","支持者认为，这样可以"],"a":[0,5,4,3,2]}],"les":[{"title":"之所以…是因为 · 通知","grammar":[{"title":"之所以……，是因为……","base":"（主语）之所以 + 结果，是因为 + 原因　—— nhấn mạnh nguyên nhân, kết quả nói trước","ex":["他之所以能升职，是因为工作一直很认真。","这款产品之所以卖得好，是因为价格合理、质量稳定。"]},{"title":"与其……，不如……","base":"与其 + A，不如 + B　—— so sánh rồi chọn B (B tốt hơn A)","ex":["与其在家等消息，不如主动给客户打个电话。","与其抱怨工作太多，不如想办法提高效率。"]}],"ex":[{"a":"他之所以迟到，是因为路上堵车。","c":["他","之所以","迟到，","是因为","路上","堵车"]},{"a":"我们之所以选择这家供应商，是因为他们的交货很准时。","c":["我们","之所以","选择","这家","供应商，","是因为","他们的","交货","很","准时"]},{"a":"与其花钱买新的，不如把旧的修一修。","c":["与其","花钱","买","新的，","不如","把","旧的","修一修"]},{"a":"与其一个人着急，不如和大家一起商量。","c":["与其","一个人","着急，","不如","和","大家","一起","商量"]},{"a":"这次活动之所以成功，离不开每个人的努力。","c":["这次","活动","之所以","成功，","离不开","每个人的","努力"]},{"a":"与其临时加班，不如提前做好计划。","c":["与其","临时","加班，","不如","提前","做好","计划"]},{"a":"她之所以学中文，是因为对中国文化感兴趣。","c":["她","之所以","学","中文，","是因为","对","中国文化","感兴趣"]},{"a":"与其说他聪明，不如说他勤奋。","c":["与其","说","他","聪明，","不如","说","他","勤奋"]}],"app":{"type":"通知","feat":["开头写标题“通知”，正文说明事情、时间、地点、对象和要求。","语言简洁、正式，不写个人感受。","结尾写发通知的单位和日期。"],"tpl":"通　知\n各位同事：\n为了……，公司决定于……（时间）在……（地点）举行/开展……。现将有关事项通知如下：\n一、……\n二、……\n三、……\n请大家……。如有疑问，请联系……。\n××部\n××年×月×日","ph":[["开头",["为了……，公司决定……","根据……的安排，……","经研究决定，……"]],["要求",["请各部门提前做好安排","请大家准时参加","如有特殊情况，请提前说明","如有疑问，请联系……"]]],"model":"通　知\n各位同事：\n为了提高大家的安全意识，公司决定于本月十五日（星期五）下午两点在一楼会议室举行消防安全培训。现将有关事项通知如下：\n一、培训时间约为一个半小时，培训结束后将在停车场进行灭火器使用练习。\n二、全体员工必须参加，请各部门提前安排好工作。\n三、请大家穿方便活动的衣服和鞋子。\n如有特殊情况不能参加，请提前向人事部说明。联系电话：8888-6666。\n人事部\n2026年12月8日","prac":"公司下周五下午要进行年度体检，请你以行政部的名义写一则通知，说明时间、地点、注意事项（如体检前不能吃早饭）。不少于150字。","ref":"通　知\n各位同事：\n为了关心大家的身体健康，公司决定于下周五（12月19日）上午八点至十一点组织全体员工进行年度体检，地点在市第一人民医院体检中心三楼。现将有关事项通知如下：\n一、体检前一天晚上十点以后请不要吃东西，体检当天不要吃早饭。\n二、请携带本人身份证，八点前在公司门口集合，统一坐班车前往。\n三、体检结束后，医院会提供早餐。\n如因工作原因不能参加，请在本周三前联系行政部小王，电话：8888-1234。\n行政部\n2026年12月10日"},"essay":{"title":"议论文入门：结构“总—分—总”","feat":["第二部分要求就一个话题谈自己的观点，不少于300字。","最稳的结构是：开头亮出观点 → 中间两三个理由（每个理由配一个例子）→ 结尾总结并重申观点。","每段第一句写清楚这一段要说什么。"],"tpl":"【开头】关于……，有人认为……，也有人认为……。我认为，……。\n【理由一】首先，……。比如，……。\n【理由二】其次，……。例如，……。\n【理由三/让步】当然，……。但是，……。\n【结尾】总之，……。因此，我们应该……。","ph":[["表明观点",["我认为……","在我看来，……","我比较赞同……的观点","对于这个问题，我的看法是……"]],["列举理由",["首先……；其次……；最后……","一方面……，另一方面……","更重要的是，……"]],["总结",["总之，……","总而言之，……","由此可见，……","因此，我们应该……"]]],"model":{"topic":"手机让人与人的距离更近了还是更远了？","text":"关于手机对人际关系的影响，有人认为手机让人与人的距离更近了，也有人认为手机让人们越来越疏远。我认为，手机本身只是一种工具，它让远方的人更近了，却可能让身边的人更远了。\n首先，手机确实拉近了远方的距离。比如，我在越南工作，父母在家乡，以前一年只能见一两次，现在每天都可以视频聊天，看到他们的样子，听到他们的声音。\n其次，手机也可能让身边的人变得陌生。例如，很多家庭吃饭的时候，每个人都低头看手机，一顿饭下来，几乎没有交流。朋友聚会时也常常出现这样的情况。\n当然，问题不在于手机，而在于我们怎么使用它。如果我们能在和家人朋友在一起的时候放下手机，多聊聊天，手机就会成为增进感情的好帮手。\n总之，手机是一把“双刃剑”。我们应该合理使用手机，让它既能拉近远方的距离，也不会疏远身边的人。从今天开始，不妨先从吃饭时放下手机做起吧。"},"prac":"有人说“工作是为了生活”，也有人说“生活是为了工作”。你怎么看？不少于300字。","ref":"关于工作和生活的关系，有人认为工作是为了生活，也有人认为生活是为了工作。我认为，工作是为了更好地生活，二者不应该对立起来。\n首先，工作给生活提供了物质基础。我们需要通过工作获得收入，才能租房、吃饭、照顾家人。没有稳定的工作，生活就很难有保障。\n其次，工作也能让生活更有意义。比如，一位老师看到学生进步，一位医生治好了病人，他们会从工作中得到成就感。这种满足感是金钱买不到的。\n但是，如果把全部时间都给了工作，就会失去生活本身。我身边有一些同事，每天加班到深夜，周末也在回复邮件，结果身体越来越差，和家人的关系也变得紧张。这样的工作，反而让生活变得更糟。\n总之，工作和生活应该保持平衡。我们应该认真工作，但也要留出时间休息、陪伴家人、发展爱好，这样才能真正享受生活。毕竟，我们努力工作，最终是为了让自己和家人过得更好。"},"read":{"cz":0,"long":0},"ls":{"l1":[0],"l3":[0]},"cy":[0,1]},{"title":"即使…也 · 招聘启事","grammar":[{"title":"即使/即便……，也……","base":"即使 + 假设的情况，也 + 结果不变　—— cho dù … cũng …","ex":["即使工作再忙，他也会每天给父母打电话。","即便下大雨，比赛也会照常进行。"]},{"title":"哪怕……，也……","base":"哪怕 + 极端的情况，也 + 决心/结果　—— nhấn mạnh hơn 即使, thường mang quyết tâm","ex":["哪怕只有一点儿希望，我们也要试一试。","哪怕再累，她也坚持把报表核对完。"]}],"ex":[{"a":"即使没有人监督，他也会认真工作。","c":["即使","没有","人","监督，","他","也","会","认真","工作"]},{"a":"哪怕只剩下一天，我们也要按时交货。","c":["哪怕","只","剩下","一天，","我们","也","要","按时","交货"]},{"a":"即使价格高一点儿，质量好也值得。","c":["即使","价格","高","一点儿，","质量","好","也","值得"]},{"a":"哪怕遇到再大的困难，也不要轻易放弃。","c":["哪怕","遇到","再大的","困难，","也","不要","轻易","放弃"]},{"a":"即便是周末，工厂也有人值班。","c":["即便","是","周末，","工厂","也","有人","值班"]},{"a":"即使你不同意，也应该听听别人的意见。","c":["即使","你","不","同意，","也","应该","听听","别人的","意见"]},{"a":"哪怕失败十次，她也要再试一次。","c":["哪怕","失败","十次，","她","也","要","再","试","一次"]},{"a":"即使天气不好，飞机也准时起飞了。","c":["即使","天气","不好，","飞机","也","准时","起飞了"]}],"app":{"type":"招聘启事","feat":["标题写清楚“招聘”和职位名称。","正文包括：公司简介、职位、要求、待遇、联系方式。","条目清楚，常用“一、二、三”或分点写。"],"tpl":"招　聘\n××公司是一家……的企业。因业务发展需要，现招聘……（职位）×名。\n一、岗位职责：……\n二、任职要求：……\n三、薪资待遇：……\n有意者请于×月×日前将简历发送至……，或致电……。\n××公司人事部\n××年×月×日","ph":[["公司介绍",["……是一家专业从事……的企业","因业务发展需要，现诚聘……","公司成立于……年"]],["要求待遇",["大专及以上学历","有……经验者优先","工作认真负责，有团队合作精神","提供有竞争力的薪资","缴纳社会保险，提供工作餐"]]],"model":"招　聘\n康达科技（越南）有限公司是一家专业从事精密零件生产的外资企业，位于平阳省工业区。因业务发展需要，现招聘中文翻译两名。\n一、岗位职责：负责公司会议翻译、文件翻译，协助管理人员与员工沟通。\n二、任职要求：大专及以上学历，HSK五级以上；工作认真负责，有团队合作精神；有工厂工作经验者优先。\n三、薪资待遇：月薪面议，缴纳社会保险，提供免费午餐和班车，每年有带薪年假。\n有意者请于12月31日前将中文简历发送至hr@kangda.vn，或致电0274-123456联系阮小姐。\n康达科技人事部\n2026年12月12日","prac":"你所在的公司要招聘一名质检员（QC）。请写一则招聘启事，包括职责、要求、待遇和联系方式。不少于150字。","ref":"招　聘\n明光精密制造有限公司是一家专业生产高尔夫球杆零件的企业。因生产规模扩大，现招聘质检员（QC）三名。\n一、岗位职责：按照标准检查产品的尺寸和外观，填写检验记录，发现问题及时向主管报告。\n二、任职要求：高中及以上学历；视力良好，做事细心；能适应倒班工作；有质检经验者优先，会简单中文者优先。\n三、薪资待遇：基本工资加全勤奖，按规定缴纳社会保险；提供工作餐和宿舍；表现优秀者有晋升机会。\n有意者请带身份证到公司人事部面试，或拨打电话0274-888999联系黎先生。\n明光公司人事部\n2026年12月15日"},"essay":{"title":"开头方法①：直接表明观点","feat":["考试时间有限，开头最好第一段就把观点说清楚。","可以先用一句话介绍话题，再说“我认为……”。","开头不要太长，两三句、60字左右就够了。"],"tpl":"【开头】随着……，……越来越……。对此，人们看法不一。我认为，……。\n【理由一】第一，……。\n【理由二】第二，……。\n【结尾】综上所述，……。","ph":[["引出话题",["随着……的发展，……","近年来，……引起了人们的关注","对于……，人们看法不一"]],["表态",["我认为……","我的看法是……","我更倾向于……"]],["结尾",["综上所述，……","总的来说，……","所以说，……"]]],"model":{"topic":"大学生应不应该在读书期间打工？","text":"随着生活成本的提高，越来越多的大学生在读书期间选择打工。对此，人们看法不一。我认为，大学生可以适当打工，但一定要以学习为主。\n第一，打工能让大学生提前了解社会。在学校里，学生接触的主要是书本知识；而在打工的过程中，他们要和不同的人打交道，学会沟通、学会合作，这些能力在课堂上很难学到。比如，我在大学时在一家咖啡店打工，学会了怎样耐心地对待顾客。\n第二，打工可以减轻家庭的经济负担，也能让学生懂得赚钱不容易，从而更加珍惜父母的付出。\n但是，大学的主要任务毕竟是学习。如果打工占用了太多时间，影响了上课和考试，那就得不偿失了。我有一个同学，因为每天晚上都去餐厅工作，结果好几门课都没有及格。\n综上所述，大学生打工有好处，但要把握好度，合理安排时间，不能让打工影响学业。只有这样，打工才能真正成为大学生活中有益的一部分。"},"prac":"有人认为孩子应该从小学习很多才艺，也有人认为应该让孩子自由玩耍。你怎么看？不少于300字。","ref":"现在，很多父母给孩子报了各种各样的兴趣班，钢琴、画画、英语、跳舞，一个都不少。对此，人们看法不一。我认为，让孩子学才艺可以，但应该尊重孩子的兴趣，并留出足够的玩耍时间。\n第一，学习才艺能开发孩子的潜能。如果孩子真的喜欢音乐或画画，在小时候打好基础，长大以后就会有更多的选择，也会多一份生活的乐趣。\n第二，玩耍对孩子同样重要。孩子在玩耍中学会和小朋友相处，学会解决问题，也能保持好奇心和想象力。如果每天的时间都被兴趣班占满，孩子就会感到疲惫，甚至对学习失去兴趣。\n我邻居家的孩子从四岁开始每周上五个兴趣班，现在一提到上课就哭。父母的本意是好的，结果却适得其反。\n综上所述，学才艺和自由玩耍并不矛盾。父母应该根据孩子的兴趣选择一两项，其余的时间就让孩子快乐地玩耍吧。毕竟，快乐的童年本身就是孩子最宝贵的财富。"},"read":{"cz":1,"sen":0},"ls":{"l1":[1],"l3":[1]},"cy":[2,3]},{"title":"何况 · 招租启事","grammar":[{"title":"……，何况……","base":"A 都/也……，何况 B（呢）　—— A còn vậy, huống chi B","ex":["这道题连老师都觉得难，何况我们呢？","大城市买房都不容易，何况是刚毕业的年轻人。"]},{"title":"况且","base":"……，况且 + 补充理由　—— vả lại, hơn nữa (bổ sung lý do)","ex":["这家酒店离公司很近，况且价格也不贵，就订这家吧。","天已经黑了，况且还下着雨，你明天再走吧。"]}],"ex":[{"a":"这么简单的问题他都不会，何况那么难的呢？","c":["这么","简单的","问题","他","都","不会，","何况","那么","难的","呢"]},{"a":"我现在没时间，况且也没那么多钱。","c":["我","现在","没","时间，","况且","也","没","那么多","钱"]},{"a":"中国人都觉得成语难，何况外国人。","c":["中国人","都","觉得","成语","难，","何况","外国人"]},{"a":"这个方案成本太高，况且客户也不一定同意。","c":["这个","方案","成本","太高，","况且","客户","也","不一定","同意"]},{"a":"平时都堵车，何况是节假日。","c":["平时","都","堵车，","何况","是","节假日"]},{"a":"房子离地铁站很近，况且租金也合理。","c":["房子","离","地铁站","很近，","况且","租金","也","合理"]},{"a":"大人都受不了，何况是孩子。","c":["大人","都","受不了，","何况","是","孩子"]},{"a":"时间还早，况且会议还没开始。","c":["时间","还","早，","况且","会议","还","没","开始"]}],"app":{"type":"招租启事","feat":["标题写“招租”或“合租”。","写清楚房子的位置、面积、设施、租金、对租客的要求。","最后写联系方式和看房时间。"],"tpl":"招　租\n本人在……（位置）有一套……（户型），面积约……平方米，现招合租/出租。\n房屋情况：……\n租金：每月……元，包含/不包含……\n要求：……\n有意者请联系……，可随时/×点后看房。","ph":[["房屋情况",["交通便利，步行五分钟到地铁站","家具家电齐全，拎包入住","采光好，安静整洁","周边有超市、医院、学校"]],["要求",["要求租客爱干净、作息规律","不养宠物，不在室内吸烟","最好是上班族","至少租一年"]]],"model":"招　租\n本人在胡志明市第七郡有一套两室一厅的公寓，位于“阳光花园”小区，面积约七十平方米，现招一名合租室友。\n房屋情况：出租的是一间朝南的卧室，带独立卫生间和阳台，采光好；客厅和厨房共用，冰箱、洗衣机、空调齐全，可拎包入住。小区有游泳池和健身房，楼下就是超市，步行十分钟到公交站。\n租金：每月四百万越南盾，包含网费和物业费，水电费平摊。\n要求：希望你是上班族，作息规律，爱干净，不养宠物，不在室内吸烟。\n有意者请联系阿玲，电话：0901-234-567（微信同号），工作日晚上七点后或周末可以看房。","prac":"你在公司附近有一个房间想出租。请写一则招租信息，说明位置、房间情况、租金和要求。不少于150字。","ref":"招　租\n本人在平阳省土龙木市有一套三室一厅的房子，离BW工业区只有十五分钟车程，现出租其中一个房间。\n房屋情况：房间约十五平方米，有一张双人床、一个大衣柜和一张书桌，安装了空调和热水器。厨房和洗衣机可以共用。附近有市场、便利店和银行，生活非常方便。\n租金：每月三百万越南盾，包含网费，水电费按实际使用计算。押金一个月。\n要求：最好是在工业区上班的女生，爱干净，晚上十一点以后保持安静，不带朋友留宿。\n有意者请拨打0912-345-678联系黄小姐，每天下午六点以后可以看房。"},"essay":{"title":"论证方法①：举例论证","feat":["光说道理不够有说服力，要用具体的例子来支持观点。","例子可以是自己或身边人的经历，也可以是社会上常见的现象。","例子要短，三四句话说清楚：谁、做了什么、结果怎样。"],"tpl":"【开头】……。我认为……。\n【举例一】比如，我的……，……。结果，……。\n【举例二】再比如，……。\n【分析】这些例子说明，……。\n【结尾】因此，……。","ph":[["引出例子",["比如，……","拿……来说，……","以我自己为例，……","我身边就有这样一个例子"]],["分析例子",["这个例子说明……","由此可见，……","可以看出，……"]]],"model":{"topic":"失败是不是一件坏事？","text":"很多人害怕失败，觉得失败就意味着自己能力不够。我认为，失败并不完全是坏事，只要善于总结，失败往往是成功的开始。\n拿我自己来说，第一次参加HSK五级考试时，我只考了一百六十多分，没有通过。当时我非常难过，甚至想放弃。后来，我仔细分析了自己的成绩，发现问题主要在写作部分。于是我每天坚持写一篇短文，请老师帮我修改。半年后，我不但通过了考试，还取得了二百四十分的好成绩。\n再比如，我的一位朋友开过一家小饭馆，因为位置不好，一年后就关门了。但他从中学到了选址和管理的经验，第二次开的店非常成功，现在已经有三家分店了。\n这些例子说明，失败本身并不可怕，可怕的是在失败面前停下脚步。失败能让我们看到自己的不足，找到努力的方向。\n因此，面对失败时，我们应该冷静下来，认真总结经验，然后勇敢地重新开始。每一次失败，都会让我们离成功更近一步。"},"prac":"“读万卷书，不如行万里路。”你同意这种说法吗？不少于300字。","ref":"“读万卷书，不如行万里路”这句话的意思是，读很多书不如亲自去很多地方看一看。我认为，读书和旅行都很重要，二者不能互相代替，最好能结合起来。\n首先，旅行能让我们获得书本上得不到的经验。比如，我在书上读过很多关于长城的介绍，可是直到亲自爬上长城，我才真正感受到它的雄伟，也明白了古人修建它有多么不容易。\n但是，读书同样不可缺少。拿我的一位同事来说，她去过很多国家，可是因为事先不了解当地的历史文化，每次旅行都只是拍照、购物，回来以后什么也说不出来。由此可见，没有知识作基础，走再远的路也收获有限。\n读书让我们有了知识和思考的能力，旅行让我们把知识变成真实的体验。二者结合起来，才能真正开阔眼界。\n因此，我们既要多读书，也要有机会多出去走走，在读书中准备，在旅行中验证。这样，我们的知识才会更加丰富，眼界也会更加开阔。"},"read":{"cz":2,"long":1},"ls":{"l1":[2],"l3":[2]},"cy":[4,5]},{"title":"以…为… · 邀请函","grammar":[{"title":"以……为……","base":"以 A 为 B　—— lấy A làm B (văn viết, trang trọng)","ex":["我们公司以客户满意为目标。","这次比赛以“绿色生活”为主题。"]},{"title":"把……视为/当作……","base":"把 A 视为/当作 B　—— coi A là B","ex":["他把每一次困难都视为成长的机会。","很多年轻人把手机当作生活中最重要的东西。"]}],"ex":[{"a":"本次活动以“环保”为主题。","c":["本次","活动","以","“环保”","为","主题"]},{"a":"我们应该以安全为第一。","c":["我们","应该","以","安全","为","第一"]},{"a":"她一直把老师当作自己的榜样。","c":["她","一直","把","老师","当作","自己的","榜样"]},{"a":"这家公司以质量为生命。","c":["这家","公司","以","质量","为","生命"]},{"a":"不少人把健康视为最大的财富。","c":["不少","人","把","健康","视为","最大的","财富"]},{"a":"会议以讨论明年计划为主。","c":["会议","以","讨论","明年","计划","为主"]},{"a":"他把工作当作一种乐趣。","c":["他","把","工作","当作","一种","乐趣"]},{"a":"这座城市以美丽的海滩而闻名。","c":["这座","城市","以","美丽的","海滩","而","闻名"]}],"app":{"type":"邀请函","feat":["标题写“邀请函”，开头写被邀请人的称呼。","说明活动的目的、时间、地点、内容。","语气礼貌，结尾常用“敬请光临”“期待您的到来”。"],"tpl":"邀请函\n尊敬的……：\n您好！为了……，我公司定于……（时间）在……（地点）举办……。届时将……。\n诚挚地邀请您拨冗出席。\n敬请光临！\n联系人：……　电话：……\n××公司\n××年×月×日","ph":[["开头",["尊敬的……先生/女士：","您好！","感谢您一直以来的支持"]],["邀请",["诚挚地邀请您……","敬请光临","期待您的到来","请于×月×日前回复是否出席"]]],"model":"邀请函\n尊敬的陈经理：\n您好！感谢贵公司一直以来对我们的信任与支持。为了总结一年来的合作成果，加强双方的交流，我公司定于2027年1月10日（星期六）晚上六点在平阳省皇冠酒店三楼宴会厅举办年终客户答谢晚会。届时，我们将介绍公司明年的新产品和发展计划，并安排精彩的文艺表演和抽奖活动。\n我们诚挚地邀请您拨冗出席，共同回顾过去，展望未来。为了方便安排座位，请于12月30日前回复是否出席。\n联系人：阮小姐　电话：0274-123456\n康达科技（越南）有限公司\n2026年12月18日","prac":"你的公司要举办开业五周年庆祝活动，请写一封邀请函，邀请合作伙伴参加。不少于150字。","ref":"邀请函\n尊敬的王总：\n您好！时光飞逝，明光精密制造有限公司已经成立五周年了。五年来，公司的每一步发展都离不开您和贵公司的大力支持。\n为了表达我们的感谢，我公司定于2027年3月8日上午九点在公司一号车间举办成立五周年庆祝活动。活动内容包括：总经理致辞、参观新生产线、合作伙伴交流会，中午还准备了自助午宴。\n我们诚挚地邀请您光临，与我们一起分享这份喜悦。请于2月28日前告知是否出席，以便我们安排接送车辆。\n联系人：黎先生　电话：0274-888999\n明光精密制造有限公司\n2027年2月15日"},"essay":{"title":"论证方法②：对比论证","feat":["把两种做法、两种情况放在一起比较，观点会更清楚。","常用结构：A 怎么样 → B 怎么样 → 哪个更好、为什么。","对比时要公平，先承认另一方的优点再说不足。"],"tpl":"【开头】……，我认为……。\n【A方】选择……的人，……。这样做的好处是……，但是……。\n【B方】相比之下，……，……。\n【比较结论】两相比较，……更……，因为……。\n【结尾】所以，……。","ph":[["对比",["相比之下，……","与……相比，……","……则……","两相比较，……"]],["让步",["诚然，……","不可否认，……","虽然……，但是……"]]],"model":{"topic":"在大城市工作好，还是在家乡工作好？","text":"毕业以后，很多年轻人都面临一个选择：留在大城市，还是回到家乡？我认为，年轻的时候去大城市闯一闯，更有利于个人的成长。\n选择留在家乡的人，生活压力比较小。他们可以住在父母家，不用担心房租，下班后还能陪伴家人。这样的生活稳定、安心，但是发展机会相对少一些，有的专业在小城市甚至找不到对口的工作。\n相比之下，大城市的工作机会多，收入也比较高。在大公司工作，能接触到先进的管理方法，认识各行各业的人。当然，大城市生活成本高，竞争也很激烈，很多人每天要花两三个小时在路上。\n两相比较，我认为年轻人更应该去大城市，因为年轻时最宝贵的是学习和积累经验的机会，而压力和困难本身也是一种锻炼。等积累了足够的经验和能力，再回到家乡发展，也能为家乡带去新的想法。\n所以，年轻人不妨趁年轻多出去看看，把大城市当作锻炼自己的地方。"},"prac":"网上购物和去实体店购物，你更喜欢哪一种？请比较后谈谈你的观点。不少于300字。","ref":"现在，越来越多的人习惯在网上购物，但实体店依然有很多顾客。我认为，两种方式各有优点，但日常生活中我更喜欢网上购物。\n网上购物最大的好处是方便。不管在哪里，只要有手机，随时都能下单，第二天东西就送到家门口了。而且网上商品种类多，价格也比较透明，可以货比三家。对于工作忙的上班族来说，这节省了大量时间。\n相比之下，实体店的优势在于可以亲眼看到、亲手摸到商品。买衣服、鞋子的时候，可以先试一试，不会出现尺码不合适的问题。此外，逛街本身也是一种休闲和社交方式。\n不过，实体店的价格往往比网上贵，而且要花时间来回，周末商场里人又多又挤。两相比较，对于日用品、书籍这类不需要试的东西，网上购物更划算。\n所以，我平时主要在网上购物，只有买衣服或者想和朋友逛街的时候，才去实体店。根据需要选择合适的方式，才是最聪明的消费。"},"read":{"cz":3,"sen":1},"ls":{"l1":[3],"l3":[3]},"cy":[6,7]},{"title":"未必 · 感谢信","grammar":[{"title":"未必","base":"未必 + 动词/形容词　—— chưa chắc, không hẳn (phủ định nhẹ nhàng)","ex":["价格贵的东西未必就好。","他说的未必是真的。"]},{"title":"不至于","base":"不至于 + 某种（坏）结果　—— chưa đến mức …","ex":["这点儿小问题，不至于影响整个项目。","他虽然有点儿生气，但还不至于不理你。"]}],"ex":[{"a":"学历高的人未必能力强。","c":["学历","高的","人","未必","能力","强"]},{"a":"一次失败不至于让他放弃。","c":["一次","失败","不至于","让","他","放弃"]},{"a":"名牌大学毕业未必就能找到好工作。","c":["名牌","大学","毕业","未必","就","能","找到","好工作"]},{"a":"这么小的错误不至于被开除吧。","c":["这么","小的","错误","不至于","被","开除吧"]},{"a":"别人觉得好的未必适合你。","c":["别人","觉得","好的","未必","适合","你"]},{"a":"再忙也不至于连吃饭的时间都没有。","c":["再","忙","也","不至于","连","吃饭的","时间","都","没有"]},{"a":"有经验的人未必不会犯错。","c":["有","经验的","人","未必","不会","犯错"]},{"a":"现在出发应该不至于迟到。","c":["现在","出发","应该","不至于","迟到"]}],"app":{"type":"感谢信","feat":["写给帮助过自己的人或单位，说明感谢的原因。","正文要具体写出对方做了什么、带来了什么帮助。","结尾再次表示感谢，并表达良好的祝愿。"],"tpl":"感谢信\n尊敬的……：\n……（时间），我……（遇到的困难）。在……的时候，……（对方的帮助）。正是因为……，……（结果）。\n在此，我向……表示衷心的感谢！\n祝……！\n……\n××年×月×日","ph":[["叙述帮助",["在我最需要帮助的时候，……","您不仅……，还……","正是因为您的帮助，……"]],["表达感谢",["在此，向您表示衷心的感谢","您的帮助我将永远记在心里","真诚地感谢您"]],["祝愿",["祝您工作顺利、身体健康","祝贵公司生意兴隆"]]],"model":"感谢信\n尊敬的市第一医院急诊科全体医护人员：\n上个月十五日晚上，我父亲突然心脏不舒服，被送到你们医院急诊科。当时已经是深夜，可是值班的李医生和护士们马上进行了检查和抢救，一直忙到天亮。父亲住院的一个星期里，护士们每天耐心地照顾他，还常常安慰我们家属，让我们不要太担心。\n正是因为你们及时的治疗和细心的照顾，父亲现在已经康复出院了。我们全家都非常感动。\n在此，我代表全家向你们表示衷心的感谢！祝你们工作顺利，身体健康！\n患者家属：阮文明\n2026年12月20日","prac":"你刚到新公司时，一位同事帮了你很多。请写一封感谢信给他/她。不少于150字。","ref":"感谢信\n亲爱的芳姐：\n转眼间，我来到采购部已经三个月了。还记得刚来的时候，我对公司的工作流程一点儿也不熟悉，连供应商的报价单都看不懂，心里非常着急。\n是您主动帮助了我。您不仅耐心地教我怎样核对合同和发票，还把自己整理多年的供应商资料分享给我。有一次我在订单上写错了数量，也是您及时发现，帮我避免了公司的损失。\n正是因为您的帮助，我才能这么快适应新的工作。在此，我向您表示衷心的感谢！以后我也会像您一样，热心地帮助新来的同事。\n祝您工作顺利，天天开心！\n小林\n2026年12月22日"},"essay":{"title":"论证方法③：因果分析","feat":["分析一个现象“为什么会出现”“会带来什么结果”。","原因可以分几个方面：个人、家庭、社会、技术等。","最后根据原因提出解决办法。"],"tpl":"【现象】近年来，……的现象越来越普遍。\n【原因】这种现象的出现，主要有以下几个原因：一是……；二是……；三是……。\n【影响】这种现象……，会导致……。\n【办法】要解决这个问题，……。\n【结尾】……。","ph":[["原因",["主要原因有以下几个","一是……，二是……","……导致了……","造成这种现象的原因是……"]],["结果",["这样下去，……","由此带来的问题是……","会对……产生不良影响"]],["办法",["要解决这个问题，……","政府、学校和家庭应该共同努力"]]],"model":{"topic":"为什么现在很多年轻人不愿意结婚？","text":"近年来，越来越多的年轻人推迟结婚，甚至不想结婚。这种现象的出现，主要有以下几个原因。\n一是经济压力大。在大城市，房价高，养孩子的费用也越来越高。很多年轻人觉得自己的收入只够养活自己，不敢轻易组建家庭。\n二是观念发生了变化。过去，人们认为到了一定年龄就应该结婚；现在，年轻人更重视个人的自由和感受，认为一个人生活也可以很幸福，没有必要为了结婚而结婚。\n三是工作太忙，社交圈子小。很多人每天加班，周末只想在家休息，几乎没有机会认识新朋友，自然也很难找到合适的另一半。\n我认为，结婚与否是个人的选择，应该得到尊重。但是，如果很多年轻人是因为经济压力而不敢结婚，那么社会就应该想办法帮助他们，比如提供更多的公共住房、减轻育儿负担。只有这样，年轻人才能真正自由地做出选择。无论选择结婚还是单身，都应该是出于自己的意愿，而不是被压力所迫。"},"prac":"现在很多人每天花好几个小时看短视频。请分析这种现象的原因和影响，并谈谈你的看法。不少于300字。","ref":"近年来，短视频越来越受欢迎，很多人一有空就打开手机刷视频，一刷就是好几个小时。这种现象的出现，主要有以下几个原因。\n一是短视频时间短、内容有趣，不需要花太多精力就能获得快乐，很适合在等车、休息时观看。二是软件会根据用户的喜好不断推荐相似的内容，让人越看越停不下来。三是现代人工作压力大，很多人把刷视频当作放松的方式。\n然而，长时间看短视频也带来了不少问题。首先，它占用了大量时间，影响了学习和睡眠。其次，人们习惯了几十秒的内容，就很难静下心来读一本书、做一件需要耐心的事情。此外，长时间盯着屏幕，对眼睛和颈椎也有伤害。\n我认为，短视频本身没有错，有的视频还能让我们学到知识。关键在于要控制时间。我们可以给自己定一个规定，比如每天看不超过半个小时，睡前一个小时不看手机。只有学会管理自己，才能让短视频成为生活的调味品，而不是生活的全部。"},"read":{"cz":4,"long":2},"ls":{"l1":[4],"l3":[4]},"cy":[8,9]},{"title":"一旦…就 · 道歉信","grammar":[{"title":"一旦……，就……","base":"一旦 + 条件/情况发生，就 + 结果　—— một khi … thì …","ex":["一旦签了合同，就必须按时交货。","这种机器一旦出了问题，整条生产线就会停下来。"]},{"title":"万一……","base":"万一 + 不希望发生的情况，（就）……　—— lỡ như, nhỡ","ex":["多带一把伞吧，万一下雨呢？","万一客户不同意，我们还有第二个方案。"]}],"ex":[{"a":"一旦养成了坏习惯，就很难改掉。","c":["一旦","养成了","坏习惯，","就","很难","改掉"]},{"a":"万一飞机晚点，我们就改坐高铁。","c":["万一","飞机","晚点，","我们","就","改","坐","高铁"]},{"a":"一旦决定了，就不要后悔。","c":["一旦","决定了，","就","不要","后悔"]},{"a":"你最好把文件备份一下，万一电脑坏了呢？","c":["你","最好","把","文件","备份","一下，","万一","电脑","坏了","呢"]},{"a":"密码一旦泄露，后果会很严重。","c":["密码","一旦","泄露，","后果","会","很","严重"]},{"a":"万一找不到路，就给我打电话。","c":["万一","找不到","路，","就","给","我","打电话"]},{"a":"一旦发现问题，要马上报告。","c":["一旦","发现","问题，","要","马上","报告"]},{"a":"出门前检查一下，万一忘了带护照怎么办？","c":["出门","前","检查","一下，","万一","忘了","带","护照","怎么办"]}],"app":{"type":"道歉信","feat":["先说明事情经过，坦率承认错误，不找借口。","说明原因（简短），重点写补救措施。","表示以后会改进，请求对方原谅。"],"tpl":"致歉信\n尊敬的……：\n您好！关于……一事，我们深感抱歉。\n……（事情经过和原因）\n为了弥补给您造成的损失，我们将……\n今后，我们一定……，避免类似的问题再次发生。\n再次向您表示诚挚的歉意，恳请您谅解。\n……\n××年×月×日","ph":[["道歉",["对此我们深感抱歉","给您带来了不便，我们非常抱歉","恳请您的谅解"]],["补救",["我们将免费为您……","我们已经采取了以下措施","作为补偿，我们……"]],["承诺",["今后我们一定加强管理","避免类似的问题再次发生"]]],"model":"致歉信\n尊敬的李经理：\n您好！关于贵公司订购的第一批零件延迟交货一事，我们深感抱歉。\n本批货物原定于12月10日交货，但是由于我们的一台关键设备突然出现故障，生产中断了三天，导致交货时间推迟到了12月14日。这给贵公司的生产计划带来了不便，责任完全在我方。\n为了弥补给您造成的影响，我们决定：一、本批货物的运费由我方承担；二、下一批订单我们将提前两天安排生产，并每天向您报告进度。\n今后，我们一定加强设备的日常维护，避免类似的问题再次发生。再次向您表示诚挚的歉意，恳请您谅解。\n明光精密制造有限公司\n2026年12月15日","prac":"你答应参加朋友的婚礼，但因为临时出差没能去。请写一封道歉信。不少于150字。","ref":"亲爱的小美：\n首先恭喜你和阿强新婚快乐！同时，我也要向你说一声真诚的“对不起”。\n上周六是你们的婚礼，我早在一个月前就答应你一定会去，还准备好了礼物。没想到婚礼前两天，公司的一个重要客户的产品出现了质量问题，经理让我马上去河内处理，我实在推不掉。当时我想给你打电话解释，又怕影响你准备婚礼的心情，就只发了一条短信，这一点我也做得不好。\n下周末我回到胡志明市以后，想请你们两个人吃饭，当面把礼物送给你们，也好好地向你们道歉。希望你能原谅我。\n祝你们永远幸福！\n你的好朋友：阿兰"},"essay":{"title":"论证方法④：让步论证","feat":["先承认对方观点有道理的地方（让步），再转折说明自己的观点。","这样写显得客观、全面，更有说服力。","常用词：诚然、固然、虽然……但是、不可否认……然而。"],"tpl":"【开头】有人认为……。我认为……。\n【让步】诚然，……确实……。\n【转折】但是，……。比如……。\n【补充】此外，……。\n【结尾】因此，……。","ph":[["让步",["诚然，……","不可否认，……","……固然重要，但……","虽然……，但是……"]],["转折",["然而，……","但问题在于，……","可是我们不能忽视……"]]],"model":{"topic":"有人认为“钱越多越幸福”，你同意吗？","text":"有人认为，钱越多，生活就越幸福。我认为，钱是幸福的基础，但钱多并不等于幸福。\n诚然，金钱对生活非常重要。有了钱，我们可以住更舒适的房子，吃更健康的食物，生病时能看更好的医生，也能给家人更好的生活条件。对于还在为基本生活奔波的人来说，多一些收入确实会让他们更快乐。\n但是，当收入达到一定水平以后，钱带来的快乐就会越来越少。我认识一位老板，他的公司越做越大，钱越赚越多，可是他每天忙得连陪孩子吃饭的时间都没有，身体也出了问题。他常常说，最怀念的是刚创业时和家人一起吃泡面的日子。\n此外，幸福还来自健康的身体、和谐的家庭、真诚的朋友和有意义的工作，这些都是钱买不到的。\n因此，我们应该努力赚钱，但不能把钱当作人生唯一的目标。懂得珍惜已经拥有的东西，才是真正的幸福。健康、亲情和友情，往往比银行里的数字更值得我们珍惜。"},"prac":"有人认为“人工智能会让很多人失业”。你怎么看？不少于300字。","ref":"随着人工智能的快速发展，不少人担心自己的工作会被机器取代。我认为，人工智能会改变就业结构，但不会让大多数人失去工作。\n不可否认，人工智能确实会取代一部分工作。比如，工厂里的很多重复性操作已经由机器人来完成；有些客服电话也已经由智能系统接听。从事这类工作的人，如果不学习新技能，就可能面临失业的风险。\n然而，从历史上看，每一次技术进步在淘汰一些岗位的同时，都会创造出更多新的岗位。汽车出现以后，马车夫少了，可是司机、修车工、加油站员工多了。今天，人工智能也带来了数据分析师、算法工程师、机器维护员等新职业。\n此外，很多工作需要创造力、同理心和复杂的沟通能力，比如教师、医生、心理咨询师，这些是机器很难代替的。\n因此，我们不必过分担心，而应该保持学习的习惯，不断提高自己的能力。只要跟得上时代的变化，人工智能就会成为我们的帮手，而不是对手。"},"read":{"cz":5,"sen":2},"ls":{"l1":[5],"l3":[0]},"cy":[10,11]},{"title":"宁可…也不 · 请假邮件","grammar":[{"title":"宁可……，也不……","base":"宁可 A，也不 B　—— thà A còn hơn B (chọn A dù A có thiệt)","ex":["他宁可多花点儿钱，也不买质量差的东西。","我宁可早起一个小时，也不想在路上堵车。"]},{"title":"宁愿……，也要……","base":"宁愿 A，也要 B　—— thà chịu A cũng phải làm B","ex":["她宁愿少休息几天，也要把项目做完。","父母宁愿自己辛苦，也要让孩子受到好的教育。"]}],"ex":[{"a":"我宁可走路，也不坐他的车。","c":["我","宁可","走路，","也不","坐","他的","车"]},{"a":"他宁愿加班，也要按时完成任务。","c":["他","宁愿","加班，","也要","按时","完成","任务"]},{"a":"她宁可一个人生活，也不随便结婚。","c":["她","宁可","一个人","生活，","也不","随便","结婚"]},{"a":"我们宁可少赚一点儿，也要保证质量。","c":["我们","宁可","少","赚","一点儿，","也","要","保证","质量"]},{"a":"他宁愿自己吃亏，也不让朋友为难。","c":["他","宁愿","自己","吃亏，","也不","让","朋友","为难"]},{"a":"宁可准备得多一点儿，也不能临时着急。","c":["宁可","准备","得","多","一点儿，","也不能","临时","着急"]},{"a":"我宁愿在家看书，也不想去逛街。","c":["我","宁愿","在家","看书，","也不想","去","逛街"]},{"a":"老板宁可赔钱，也不失去信誉。","c":["老板","宁可","赔钱，","也不","失去","信誉"]}],"app":{"type":"请假邮件","feat":["主题要写清楚：请假+姓名+日期。","正文说明请假原因、时间、工作安排（谁代替、怎么联系）。","语气礼貌，结尾感谢领导批准。"],"tpl":"主题：请假申请——……（姓名），×月×日至×月×日\n……经理：\n您好！因为……，我想申请……假，时间为×月×日至×月×日，共×天。\n请假期间，我的工作已经安排如下：……。如有急事，可以通过……联系我。\n恳请批准，谢谢！\n……（部门、姓名）\n××年×月×日","ph":[["原因",["因家中有急事","因身体不适，需要去医院检查","因需要办理……手续"]],["工作交接",["我已和……交接好工作","……由……负责","手机保持畅通"]],["结尾",["恳请批准","给您添麻烦了","谢谢您的理解"]]],"model":"主题：请假申请——阮氏兰，12月22日至12月24日\n黄经理：\n您好！我母亲下周一要在胡志明市做一个小手术，家里没有其他人照顾，所以我想申请三天事假，时间为12月22日（星期一）至12月24日（星期三）。\n请假期间，我的工作已经安排如下：本月的工资表已经做好，放在共享文件夹里；22日要交给会计的报销单，我已经交给了小王，由她代为提交；供应商的付款申请也已经提前发出。如有急事，可以打我的手机0909-876-543，我会保持畅通。\n给您和同事们添麻烦了，恳请批准，谢谢！\n人事部　阮氏兰\n2026年12月18日","prac":"你下周要参加HSK考试，需要请一天假。请给经理写一封请假邮件。不少于150字。","ref":"主题：请假申请——陈明，12月27日\n刘经理：\n您好！我报名参加了本月的HSK六级考试，考试时间是12月27日（星期六）上午九点，考点在胡志明市师范大学。因为考场离公司比较远，当天无法上班，所以我想申请一天事假。\n请假期间，我的工作已经做好安排：周六的发货单我会在周五下班前全部打印好，交给仓库的阿明；客户如果有问题，可以先联系同事小玲，她已经了解了订单的情况。考试结束后，我会马上查看邮件和消息。\n学好中文对我们和中国客户的沟通很有帮助，希望您能批准。给您添麻烦了，谢谢！\n销售部　陈明\n2026年12月20日"},"essay":{"title":"开头方法②：引用名言或俗语","feat":["用一句大家熟悉的名言、俗语开头，能很快引出话题。","引用以后要马上解释它的意思，并说明自己的观点。","不确定原话时不要乱引，用自己的话说清楚即可。"],"tpl":"【开头】俗话说：“……”这句话的意思是……。我认为……。\n【理由一】……\n【理由二】……\n【结尾】正如那句话所说，……。","ph":[["引用",["俗话说：“……”","古人说过：“……”","有一句名言：“……”"]],["解释",["这句话的意思是……","这句话告诉我们……","这句话说明了……"]],["呼应",["正如……所说，……","这正是……的道理"]]],"model":{"topic":"你怎么理解“活到老，学到老”？","text":"俗话说：“活到老，学到老。”这句话的意思是，学习是一辈子的事情，不应该在离开学校以后就停止。我非常赞同这个观点，尤其是在今天这个变化很快的时代。\n首先，社会发展越来越快，新的知识和技术不断出现。十年前，很少有人想到用手机付款、在网上开会；今天，如果不会这些，生活和工作都会很
